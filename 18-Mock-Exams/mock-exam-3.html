deDeploy. It needs AutoPublishAlias, plus a DeploymentPreference with the canary type, the rollback alarm, and a PreTraffic hook that runs validation before any traffic shifts. Linear10PercentEvery5Minutes is a different traffic shape, and a PostTraffic hook runs too late. The other options don't provide canary rollback.", "d_id": 3, "d_name": "Domain 3: Deployment (24%)"}, {"num": 51, "q": "A networking stack exports a VPC ID with an Outputs Export name, and five application stacks import it with Fn::ImportValue. A developer tries to update the networking stack to change the export name and receives an error that the export cannot be updated because it is in use. The developer must rename the export without deleting any application stacks. What should the developer do?", "o": ["Run aws cloudformation update-stack with the --force option so that the networking stack overrides the imports that the five dependent application stacks are currently using.", "Add the new export name alongside the old one, update each application stack to import the new name, and then remove the old export from the networking stack.", "Convert the networking stack into a nested stack of each application stack so that the export can be renamed in a single stack deployment.", "Enable termination protection on the application stacks, which allows the networking stack to rename exports that those stacks import safely."], "a": [1], "multi": false, "e": "CloudFormation won't change or delete an export that another stack imports. Migrate step by step: add the new export, move each importing stack over to it, then remove the old one. update-stack has no --force option, and termination protection is unrelated.", "d_id": 3, "d_name": "Domain 3: Deployment (24%)"}, {"num": 52, "q": "A developer needs the 10 slowest requests from the last hour in an AWS Lambda function's log group. The function writes structured JSON logs that include a durationMs field and a requestId field for every request. Which CloudWatch Logs Insights query returns this result?", "o": ["filter durationMs > 10 | fields requestId | sort requestId asc | limit 10", "fields requestId, durationMs | sort durationMs desc | limit 10", "fields requestId, durationMs | stats max(durationMs) by requestId | limit 10", "fields requestId | parse @message \"durationMs\" as duration | sort duration asc | limit 10"], "a": [1], "multi": false, "e": "Logs Insights automatically discovers JSON fields. Sorting by durationMs in descending order and limiting to 10 gives the slowest requests. The stats query without a sort returns an arbitrary 10 rows, and the others sort the wrong field or in the wrong direction.", "d_id": 4, "d_name": "Domain 4: Troubleshooting & Optimization (18%)"}, {"num": 53, "q": "Consumers running on Amazon EC2 poll an Amazon SQS queue in a tight loop. CloudWatch shows millions of ReceiveMessage calls per day, and most of them return no messages, which drives up cost. Messages must still be processed within a few seconds of arriving. Which change will reduce cost the most while meeting the latency requirement?", "o": ["Set the queue's DelaySeconds to 60 so that messages become available in larger groups and each poll returns more of them.", "Add a 60-second sleep between polls in each consumer so that the number of empty responses drops by roughly 60 times.", "Set ReceiveMessageWaitTimeSeconds to 20 on the queue or on each ReceiveMessage call so that the consumers use long polling.", "Increase the visibility timeout to 12 hours so that each message is received once and the number of ReceiveMessage calls drops."], "a": [2], "multi": false, "e": "Long polling waits up to 20 seconds for a message and returns as soon as one arrives, which removes most empty responses without adding delay. A delay queue or a sleep adds up to 60 seconds of latency. The visibility timeout doesn't change how often consumers poll.", "d_id": 4, "d_name": "Domain 4: Troubleshooting & Optimization (18%)"}, {"num": 54, "q": "An AWS Lambda function processes records from an Amazon Kinesis data stream that has 4 shards. One malformed record causes the function to throw an error every time it is processed. Processing for that shard has stopped for several hours while the other shards continue, and the IteratorAge metric keeps growing. The team wants the shard to keep flowing and wants a record of the failed data for later investigation. Which solution will meet these requirements with the LEAST operational effort?", "o": ["Add a second Lambda function that reads the same shard through enhanced fan-out and deletes the malformed record from the stream as soon as it detects the processing error.", "Configure a dead-letter queue in the function's asynchronous invocation settings so that failed Kinesis records are sent to an Amazon SQS queue after two automatic retries.", "Configure the event source mapping with BisectBatchOnFunctionError enabled, a MaximumRetryAttempts value, and an on-failure destination that sends details of the failed batch to an Amazon SQS queue.", "Increase the ParallelizationFactor of the event source mapping to 10 so that the other records in the shard are processed by additional concurrent executions while the malformed record keeps retrying in the background."], "a": [2], "multi": false, "e": "With stream sources, Lambda retries a failing batch until the record expires, which blocks the shard. Bisecting the batch, limiting retries and adding an on-failure destination (which receives the shard ID and sequence numbers of the failed records) unblocks the shard. The async DLQ setting doesn't apply to event source mappings. A higher ParallelizationFactor still retries the failing partition key forever. You can't delete individual records from a Kinesis stream.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 55, "q": "A containerized backend that is not behind Amazon API Gateway receives Amazon Cognito user pool access tokens from a single-page application in the Authorization header. A security review requires the backend to reject forged, expired, and wrong-app tokens without calling Cognito on every request. Which approach will meet these requirements?", "o": ["Decrypt each token with the user pool's KMS key by calling kms:Decrypt, and accept the request whenever that decryption call completes successfully.", "Base64-decode the token payload and accept the request when the email claim in the payload matches a registered user in the application's own database.", "Call the Cognito GetUser API with the access token for every request, and accept the request whenever that call returns the user's attributes successfully.", "Verify each token's signature with the public keys from the user pool's JWKS endpoint, cache those keys, and check the exp, iss, client_id and token_use claims."], "a": [3], "multi": false, "e": "Cognito tokens are signed JWTs. Checking the signature against the cached JWKS public keys and then checking the expiry, issuer, client and token-use claims validates them locally. Decoding without checking the signature accepts forged tokens. GetUser works but calls Cognito on every request. The tokens are signed, not KMS-encrypted.", "d_id": 2, "d_name": "Domain 2: Security (26%)"}, {"num": 56, "q": "An AWS CodeDeploy in-place deployment to Amazon EC2 instances fails at the ApplicationStart lifecycle event on every instance. The application's own logs on the instances are empty because the application never starts. The developer needs the specific error output from the start script to find the root cause. Where should the developer look first?", "o": ["In the VPC Flow Logs for the instances' subnets, which show whether the application began listening on its port during the ApplicationStart event.", "In the Elastic Load Balancing access logs for the target group, which record the error returned by the start script when the first health check fails.", "In the deployment's lifecycle event details in the CodeDeploy console and in the CodeDeploy agent logs on an instance, which capture the output of the hook script.", "In the CloudTrail event history for the deployment group, which records the stdout and stderr of every lifecycle hook script that CodeDeploy runs on each instance."], "a": [2], "multi": false, "e": "CodeDeploy captures each hook script's output in the lifecycle event details and in the agent's deployment logs on the instance. CloudTrail records API calls, not script output, and flow logs and ELB logs can't show why a script failed.", "d_id": 4, "d_name": "Domain 4: Troubleshooting & Optimization (18%)"}, {"num": 57, "q": "A pipeline in AWS CodePipeline deploys to a staging environment and then to production. The release manager must review the staging test report and explicitly approve each release before the production deployment starts, and must be notified automatically when a release is waiting. Which solution will meet these requirements with the LEAST effort?", "o": ["Add a manual approval action between the staging and production stages, configure it with an Amazon SNS topic that the release manager subscribes to, and set the test report link as its review URL.", "Split the pipeline into two pipelines, and have the release manager start the production pipeline manually after reading an email that a Lambda function sends through Amazon SES when the staging deployment finishes.", "Configure the production CodeDeploy deployment group to require a manual approval for every instance before CodeDeploy installs the new revision on that instance.", "Add an AWS CodeBuild action that runs a sleep command for 24 hours between the stages so that the release manager has enough time to review the staging environment."], "a": [0], "multi": false, "e": "The manual approval action is built for this: it pauses the pipeline, notifies through SNS and links reviewers to the test report. The other options need custom work, waste build time, or rely on a CodeDeploy per-instance approval feature that doesn't exist.", "d_id": 3, "d_name": "Domain 3: Deployment (24%)"}, {"num": 58, "q": "A developer's CI job calls ec2:RunInstances and fails with an UnauthorizedOperation error that contains an encoded authorization failure message. The developer needs to see which policy and condition caused the denial without guessing. What should the developer do?", "o": ["Call aws sts decode-authorization-message with the encoded message, using credentials that are allowed to perform the sts:DecodeAuthorizationMessage action.", "Search AWS CloudTrail Lake for the encoded message, which automatically returns the full evaluated policy for any request that failed authorization.", "Turn on IAM Access Analyzer policy validation for the CI role, which replaces encoded authorization messages with plaintext errors in later responses.", "Base64-decode the message locally with a standard command-line tool, because the encoded message is simply the Base64 text of the evaluated policy document and its condition keys."], "a": [0], "multi": false, "e": "Encoded authorization messages can only be decoded with STS DecodeAuthorizationMessage, and the caller needs permission for that action. The message is encrypted, not Base64 text, and the other features don't decode it.", "d_id": 2, "d_name": "Domain 2: Security (26%)"}, {"num": 59, "q": "A customer-facing API runs on Amazon API Gateway and AWS Lambda. The functions use Java and load a large dependency-injection framework at startup, so P99 latency spikes to 6 seconds every morning when traffic ramps up from almost zero. Traffic follows a predictable daily schedule. The company must guarantee that up to 200 concurrent requests are served by already-initialized execution environments, at the lowest cost that meets this requirement. Which solution will meet these requirements?", "o": ["Increase the function's memory from 1,024 MB to 10,240 MB so that initialization completes faster, and leave provisioned concurrency disabled to avoid extra charges.", "Configure provisioned concurrency of 200 on the production alias, and use Application Auto Scaling scheduled actions to raise it before the morning ramp and lower it at night.", "Create an Amazon EventBridge rule that invokes the function every minute with a test event so that at least 200 execution environments always stay warm.", "Configure reserved concurrency of 200 on the function so that Lambda keeps 200 execution environments initialized and ready before the morning traffic arrives each day, at no extra charge."], "a": [1], "multi": false, "e": "Only provisioned concurrency keeps initialized environments ready, and scheduling it around the predictable ramp keeps the cost down. Reserved concurrency only guarantees and caps capacity; it doesn't pre-initialize anything. More memory speeds up initialization but doesn't eliminate it. A ping every minute keeps about one environment warm, not 200.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 60, "q": "A developer created a CloudWatch Logs metric filter today that counts log events containing ERROR in an application's log group, and created an alarm on the resulting metric. The developer expected the metric graph to show last week's error spike, but the metric has data only from the time the filter was created. The developer still needs to investigate last week's errors. What should the developer do?", "o": ["Increase the metric's resolution to 1 second so that CloudWatch reads historical log events at a higher frequency and fills in last week's data.", "Query last week's log events directly with CloudWatch Logs Insights, because metric filters only evaluate log events that arrive after the filter is created.", "Delete and re-create the metric filter with its backfill option turned on so that CloudWatch reprocesses the log group's existing events into the metric.", "Change the metric filter's default value to 0, which causes CloudWatch to recalculate the metric from all of the existing log events in the log group."], "a": [1], "multi": false, "e": "Metric filters work only on data that arrives after they're created and never backfill. Logs Insights can query the stored history directly. There's no backfill option, and the default value and resolution settings don't reprocess old logs.", "d_id": 4, "d_name": "Domain 4: Troubleshooting & Optimization (18%)"}, {"num": 61, "q": "A company processes customer payments with an AWS Lambda function that is triggered by an Amazon SQS standard queue. Each message contains an order ID and an amount, and the function calls a third-party payment API. During a recent traffic spike, several customers were charged twice for the same order, although the application logs show no function errors or timeouts. The company must prevent duplicate charges without reducing throughput. Which solution will meet these requirements?", "o": ["Convert the queue to an SQS FIFO queue with content-based deduplication enabled, and so that SQS discards repeated messages, and keep the Lambda function's batch size and concurrency settings unchanged.", "Record each order ID in an Amazon DynamoDB table with a conditional write before calling the payment API, and skip the charge when the conditional write fails because the ID already exists.", "Configure a dead-letter queue with a maxReceiveCount of 1 so that any message that is received more than once is moved out of the source queue automatically.", "Increase the queue's visibility timeout to six times the function timeout so that messages are not delivered to a second consumer while they are still being processed."], "a": [1], "multi": false, "e": "Standard queues deliver at least once, so duplicates can arrive even when nothing fails. Making the side effect idempotent (a conditional write on the order ID before charging) is the only option that guarantees one charge per order. FIFO lowers throughput and deduplicates only identical messages within 5 minutes. The visibility timeout doesn't prevent at-least-once duplicates. A maxReceiveCount of 1 sends messages to the DLQ after any failure but doesn't stop duplicate processing.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 62, "q": "A compliance team requires that all requests to an Amazon S3 bucket use TLS and that every new object be encrypted with a specific customer managed KMS key, even when an application does not send any encryption headers. Which combination of actions will meet these requirements with the LEAST ongoing effort? (Select TWO.)", "o": ["Set the bucket's default encryption to SSE-KMS with the customer managed key so that uploads without encryption headers are encrypted with that key.", "Enable S3 Object Lock in compliance mode so that the bucket rejects any object that is uploaded without being encrypted by a KMS key.", "Enable S3 Transfer Acceleration on the bucket, because accelerated endpoints accept client connections only over TLS 1.2 or later.", "Add a bucket policy statement that denies all s3:* actions on the bucket and its objects when the aws:SecureTransport condition key is false.", "Add a Lambda function triggered by s3:ObjectCreated events that re-uploads each new object with SSE-KMS encryption using the customer managed key."], "a": [0, 3], "multi": true, "e": "Denying requests where aws:SecureTransport is false enforces TLS. Default encryption with SSE-KMS applies the customer managed key whenever a client omits encryption headers. Re-uploading objects after the fact is custom and slow. Object Lock controls retention, not encryption. Transfer Acceleration doesn't block plain-HTTP requests to the bucket.", "d_id": 2, "d_name": "Domain 2: Security (26%)"}, {"num": 63, "q": "An account runs many AWS Lambda functions. During a marketing event, a critical order-processing function that API Gateway invokes synchronously starts returning TooManyRequestsException errors because a batch-analytics function has consumed most of the account's concurrency. The company must guarantee capacity for the order function and stop the analytics function from starving other functions, without changing the analytics code. Which combination of actions will meet these requirements? (Select TWO.)", "o": ["Configure provisioned concurrency on the batch-analytics function so that its invocations no longer count toward the account quota.", "Set the order function's asynchronous maximum retry attempts to 2 so that throttled API Gateway requests are retried automatically.", "Configure reserved concurrency on the order-processing function that is equal to its expected peak concurrency.", "Configure reserved concurrency on the batch-analytics function to cap the number of execution environments it can use.", "Increase the timeout of the order-processing function to 15 minutes so that throttled requests wait for capacity to free up."], "a": [2, 3], "multi": true, "e": "Reserved concurrency sets aside capacity for the order function and caps the analytics function so it can't starve everything else. Provisioned concurrency still counts toward the account quota. Timeouts don't queue throttled requests, and async retry settings don't apply to synchronous API Gateway invocations.", "d_id": 4, "d_name": "Domain 4: Troubleshooting & Optimization (18%)"}, {"num": 64, "q": "A company is automating employee onboarding. After an HR system creates an account, a manager must approve the equipment request in an internal web app, which can take up to 5 days. The workflow must then call three AWS services in sequence, retry failed calls, and give the HR team a visual history of every execution. Which solution will meet these requirements with the LEAST custom code?", "o": ["Use an Amazon SQS queue for approval requests, have a Lambda function poll the queue every hour for approved requests, and call the three services from that function.", "Use Amazon EventBridge rules that react to each step's completion event and invoke the next Lambda function, and store each approval status in an Amazon DynamoDB table.", "Use a Step Functions Standard workflow with a .waitForTaskToken task that the web app completes by calling SendTaskSuccess after approval, and add Retry fields to each service task.", "Use an AWS Step Functions Express workflow with a Wait state set to 5 days, followed by three Task states that call the services, and add Catch fields and CloudWatch Logs logging to handle and record any failed calls."], "a": [2], "multi": false, "e": "Standard workflows can run for up to a year. The task token pauses the workflow until the web app reports the approval, Retry handles transient failures, and the console keeps each execution's visual history. Express workflows are limited to 5 minutes. EventBridge choreography and hourly polling both need more code and give no single visual history.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 65, "q": "A company runs a production web application on AWS Elastic Beanstalk with 10 instances. For every release, the environment must keep serving traffic at full capacity during the deployment, and a failed deployment must roll back quickly without redeploying the previous version to the existing instances. Which deployment policy meets these requirements?", "o": ["Immutable, because it deploys the new version to a fresh set of instances in a temporary Auto Scaling group and terminates them if the deployment fails.", "All at once, because it deploys to every instance at the same time, which is the fastest way to replace a failed version with the previous one.", "Rolling, because it updates one batch at a time and keeps the remaining batches in service until each updated batch passes its health checks.", "Rolling with additional batch, because it launches an extra batch of instances first so that full capacity is maintained throughout the deployment."], "a": [0], "multi": false, "e": "Immutable deployments keep the original instances in service, so rollback just terminates the new instances. Rolling with additional batch keeps full capacity but rolls back by redeploying to the updated instances. Rolling reduces capacity, and all-at-once causes downtime.", "d_id": 3, "d_name": "Domain 3: Deployment (24%)"}];
// Re-shuffle option order on every attempt so a retake can't be answered from memory of positions.
(function(){
  questions.forEach(function(q){
    var order = q.o.map(function(_, i){ return i; });
    for(var i = order.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t; }
    var opts = q.o;
    q.o = order.map(function(i){ return opts[i]; });
    q.a = q.a.map(function(oldIdx){ return order.indexOf(oldIdx); });
  });
})();

let currentIndex = 0;
let userAnswers = {}; // qIndex -> [selected indices]
let flagged = new Set();
let timeLeft = 130 * 60; // 130 minutes in seconds
let timerInterval = null;
let examSubmitted = false;

function init() {
  renderNavGrid();
  loadQuestion(0);
  startTimer();

  document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) loadQuestion(currentIndex - 1); };
  document.getElementById('nextBtn').onclick = () => { if (currentIndex < questions.length - 1) loadQuestion(currentIndex + 1); };
  document.getElementById('flagBtn').onclick = toggleFlag;
  document.getElementById('finishExamBtn').onclick = confirmSubmit;
}

function startTimer() {
  const display = document.getElementById('timerDisplay');
  timerInterval = setInterval(() => {
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam();
      return;
    }
    timeLeft--;
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    display.textContent = `⏳ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

    if (timeLeft <= 900) display.className = 'timer-box timer-warning';
    if (timeLeft <= 300) display.className = 'timer-box timer-danger';
  }, 1000);
}

function renderNavGrid() {
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = idx + 1;
    btn.onclick = () => loadQuestion(idx);
    grid.appendChild(btn);
  });
}

function updateNavGrid() {
  const btns = document.querySelectorAll('.nav-btn');
  btns.forEach((btn, idx) => {
    btn.className = 'nav-btn';
    if (idx === currentIndex) btn.classList.add('active');
    if (userAnswers[idx] && userAnswers[idx].length > 0) btn.classList.add('answered');
    if (flagged.has(idx)) btn.classList.add('flagged');
  });
}

function loadQuestion(idx) {
  currentIndex = idx;
  const q = questions[idx];

  document.getElementById('qNumber').textContent = `Question ${idx + 1} of ${questions.length}`;
  document.getElementById('domainBadge').textContent = q.d_name;
  document.getElementById('qStem').textContent = q.q;

  const flagBtn = document.getElementById('flagBtn');
  flagBtn.className = flagged.has(idx) ? 'btn btn-flag active' : 'btn btn-flag';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  const selected = userAnswers[idx] || [];

  q.o.forEach((opt, optIdx) => {
    const item = document.createElement('div');
    item.className = 'option-item' + (selected.includes(optIdx) ? ' selected' : '');
    const letter = String.fromCharCode(65 + optIdx);
    item.innerHTML = `<span class="opt-label">${letter})</span><span class="opt-text">${opt}</span>`;
    item.onclick = () => selectOption(idx, optIdx, q.multi);
    container.appendChild(item);
  });

  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').textContent = (idx === questions.length - 1) ? 'Review & Submit' : 'Next';
  updateNavGrid();
}

function selectOption(qIdx, optIdx, isMulti) {
  if (examSubmitted) return;
  if (!userAnswers[qIdx]) userAnswers[qIdx] = [];

  if (isMulti) {
    const pos = userAnswers[qIdx].indexOf(optIdx);
    if (pos > -1) userAnswers[qIdx].splice(pos, 1);
    else userAnswers[qIdx].push(optIdx);
  } else {
    userAnswers[qIdx] = [optIdx];
  }
  loadQuestion(qIdx);
}

function toggleFlag() {
  if (flagged.has(currentIndex)) flagged.delete(currentIndex);
  else flagged.add(currentIndex);
  loadQuestion(currentIndex);
}

function confirmSubmit() {
  const answeredCount = Object.keys(userAnswers).filter(k => userAnswers[k].length > 0).length;
  const unanswered = questions.length - answeredCount;
  const msg = unanswered > 0 
    ? `You have ${unanswered} unanswered questions. Are you sure you want to submit?`
    : 'Are you ready to submit your exam and view your score?';
  if (confirm(msg)) submitExam();
}

function submitExam() {
  examSubmitted = true;
  clearInterval(timerInterval);

  document.getElementById('examContainer').style.display = 'none';
  document.getElementById('resultsContainer').style.display = 'block';

  let totalCorrect = 0;
  const domainStats = {
    1: { name: 'Domain 1: Development with AWS Services (32%)', total: 0, correct: 0 },
    2: { name: 'Domain 2: Security (26%)', total: 0, correct: 0 },
    3: { name: 'Domain 3: Deployment (24%)', total: 0, correct: 0 },
    4: { name: 'Domain 4: Troubleshooting & Optimization (18%)', total: 0, correct: 0 }
  };

  questions.forEach((q, idx) => {
    domainStats[q.d_id].total++;
    const userSel = (userAnswers[idx] || []).sort();
    const correctAns = (q.a || []).sort();

    const isCorrect = userSel.length === correctAns.length && userSel.every((val, i) => val === correctAns[i]);
    if (isCorrect) {
      totalCorrect++;
      domainStats[q.d_id].correct++;
    }
  });

  // Scaled Score: 100 to 1000 scale
  const rawPct = (totalCorrect / questions.length);
  const scaledScore = Math.round(100 + rawPct * 900);
  const passed = scaledScore >= 720;

  document.getElementById('scoreNumber').textContent = scaledScore;
  document.getElementById('scoreSummary').textContent = `${totalCorrect} / ${questions.length} correct (${Math.round(rawPct * 100)}%)`;

  const badge = document.getElementById('passBadge');
  badge.textContent = passed ? 'PASSED' : 'FAILED';
  badge.className = passed ? 'pass-badge pass' : 'pass-badge fail';

  // Domain breakdown table
  const tbody = document.getElementById('domainBreakdownBody');
  tbody.innerHTML = '';
  Object.keys(domainStats).forEach(dId => {
    const d = domainStats[dId];
    const pct = d.total > 0 ? Math.round((d.correct / d.total) * 100) : 0;
    const row = document.createElement('tr');
    row.innerHTML = `
      <td style="font-weight:600;">${d.name}</td>
      <td>${dId == 1 ? '32%' : dId == 2 ? '26%' : dId == 3 ? '24%' : '18%'}</td>
      <td>${d.correct} / ${d.total}</td>
      <td style="font-weight:700; color:${pct >= 72 ? 'var(--correct)' : 'var(--incorrect)'};">${pct}%</td>
    `;
    tbody.appendChild(row);
  });

  // Review List
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  questions.forEach((q, idx) => {
    const userSel = (userAnswers[idx] || []).sort();
    const correctAns = (q.a || []).sort();
    const isCorrect = userSel.length === correctAns.length && userSel.every((val, i) => val === correctAns[i]);

    const card = document.createElement('div');
    card.className = 'review-item';
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
        <span style="font-weight:700; color:${isCorrect ? 'var(--correct)' : 'var(--incorrect)'};">
          ${isCorrect ? '✓ Correct' : '✗ Incorrect'} — Question ${idx + 1}
        </span>
        <span class="domain-badge">${q.d_name}</span>
      </div>
      <div style="font-size:0.95rem; margin-bottom:0.75rem; color:#f1f5f9;">${q.q}</div>
      <div style="font-size:0.875rem; color:var(--text-secondary);">
        <strong>Your Answer:</strong> ${userSel.map(i => String.fromCharCode(65 + i)).join(', ') || 'None'}<br>
        <strong>Correct Answer:</strong> ${correctAns.map(i => String.fromCharCode(65 + i)).join(', ')}
      </div>
      <div class="explanation-box">
        <strong>Explanation:</strong> ${q.e}
      </div>
    `;
    reviewList.appendChild(card);
  });
}

window.onload = init;
</script>

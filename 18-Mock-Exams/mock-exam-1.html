<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVA-C02 Timed Mock Exam 1 — AWS Certified Developer Associate (DVA-C02)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2234;
  --bg-card-hover: #222d42;
  --border-color: #2a364f;
  --border-focus: #ff9900;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-aws: #ff9900;
  --accent-aws-hover: #ec7211;
  --accent-blue: #38bdf8;
  --correct: #10b981;
  --correct-bg: rgba(16, 185, 129, 0.12);
  --incorrect: #ef4444;
  --incorrect-bg: rgba(239, 68, 68, 0.12);
  --flagged: #f59e0b;
  --flagged-bg: rgba(245, 158, 11, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0.875rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 1rem; }
.eyebrow { font-size: 0.75rem; font-weight: 700; color: var(--accent-aws); text-transform: uppercase; letter-spacing: 0.08em; }
h1 { font-size: 1.125rem; font-weight: 700; color: var(--text-primary); }
.timer-box {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.125rem;
  font-weight: 700;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 0.35rem 0.85rem;
  border-radius: 6px;
  color: var(--accent-blue);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.timer-warning { color: var(--flagged); border-color: var(--flagged); animation: pulse 1.5s infinite; }
.timer-danger { color: var(--incorrect); border-color: var(--incorrect); animation: pulse 0.8s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.main-container {
  display: grid;
  grid-template-columns: 1fr 320px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 1.5rem;
  gap: 1.5rem;
  flex: 1;
  width: 100%;
}
@media (max-width: 900px) {
  .main-container { grid-template-columns: 1fr; }
}

.q-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.75rem;
}
.domain-badge {
  font-size: 0.75rem;
  font-weight: 600;
  background: rgba(56, 189, 248, 0.12);
  color: var(--accent-blue);
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
}
.q-stem { font-size: 1.05rem; font-weight: 500; color: #f8fafc; line-height: 1.6; }
.options-list { display: flex; flex-direction: column; gap: 0.75rem; }
.option-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 0.875rem 1rem;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
}
.option-item:hover { background: var(--bg-card-hover); border-color: #475569; }
.option-item.selected {
  background: rgba(255, 153, 0, 0.12);
  border-color: var(--accent-aws);
}
.opt-label {
  font-weight: 700;
  color: var(--text-secondary);
  min-width: 1.5rem;
}
.opt-text { color: var(--text-primary); font-size: 0.95rem; }

.sidebar {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 1.25rem;
  height: fit-content;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.grid-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.4rem;
  max-height: 380px;
  overflow-y: auto;
}
.nav-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.5rem 0;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.1s ease;
}
.nav-btn:hover { border-color: var(--accent-aws); color: var(--text-primary); }
.nav-btn.active { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.15); color: #fff; }
.nav-btn.answered { background: #22384f; border-color: #38bdf8; color: #fff; }
.nav-btn.flagged { border-color: var(--flagged); background: var(--flagged-bg); color: var(--flagged); }

.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 1rem;
  border-top: 1px solid var(--border-color);
}
.btn {
  padding: 0.6rem 1.25rem;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  border: none;
  transition: all 0.15s ease;
}
.btn-primary { background: var(--accent-aws); color: #000; }
.btn-primary:hover { background: var(--accent-aws-hover); }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-secondary:hover { background: var(--bg-card-hover); }
.btn-flag { background: transparent; color: var(--flagged); border: 1px solid var(--flagged); }
.btn-flag.active { background: var(--flagged); color: #000; }
.btn-finish { background: var(--correct); color: #000; width: 100%; }
.btn-finish:hover { background: #059669; }

/* Results Screen */
.results-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 2.5rem;
  max-width: 860px;
  margin: 2rem auto;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}
.score-banner {
  text-align: center;
  padding: 2rem;
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid var(--border-color);
}
.scaled-score { font-size: 3rem; font-weight: 800; color: var(--accent-aws); }
.pass-badge {
  display: inline-block;
  padding: 0.35rem 1.25rem;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9rem;
  text-transform: uppercase;
  margin-top: 0.75rem;
}
.pass-badge.pass { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct); }
.pass-badge.fail { background: var(--incorrect-bg); color: var(--incorrect); border: 1px solid var(--incorrect); }

.breakdown-table {
  width: 100%;
  border-collapse: collapse;
}
.breakdown-table th, .breakdown-table td {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border-color);
  text-align: left;
}
.breakdown-table th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
.review-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.explanation-box {
  margin-top: 1rem;
  padding: 1rem;
  background: rgba(15, 23, 42, 0.6);
  border-left: 3px solid var(--accent-blue);
  border-radius: 4px;
  font-size: 0.9rem;
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="../index.html" style="color:var(--text-muted);text-decoration:none;font-size:0.8rem;font-weight:600;border:1px solid var(--border-color);border-radius:6px;padding:6px 10px;margin-right:4px;">&#8962; Hub</a>
    <div>
      <div class="eyebrow">AWS Certified Developer Associate • Full Mock Exam 1</div>
      <h1>DVA-C02 Timed Mock Exam 1</h1>
    </div>
  </div>

</header>

<div id="examContainer" class="main-container">
  <main class="q-card">
    <div class="q-header">
      <span id="qNumber" style="font-weight:700; color:var(--text-secondary);">Question 1 of 65</span>
      <span id="domainBadge" class="domain-badge">Domain 1</span>
    </div>
    <div id="qStem" class="q-stem"></div>
    <div id="optionsContainer" class="options-list"></div>

    <button id="finishExamBtn" class="btn btn-finish">Submit Exam</button>
  </aside>
</div>

<div id="resultsContainer" style="display:none; padding: 1.5rem;">
  <div class="results-card">
    <div class="score-banner">
      <div style="color:var(--text-muted); text-transform:uppercase; font-size:0.85rem; font-weight:700;">Scaled Score (Passing: 720)</div>
      <div id="scoreNumber" class="scaled-score">0</div>
      <div id="scoreSummary" style="color:var(--text-secondary); margin-top:0.25rem;">0 / 65 correct (0%)</div>
      <div id="passBadge" class="pass-badge">Pass</div>

    <div>
      <h3 style="margin-bottom:1rem; font-size:1.1rem;">Domain Performance Breakdown</h3>
      <table class="breakdown-table">
        <thead>
          <tr>
            <th>Domain</th>
            <th>Weight</th>
            <th>Score</th>
            <th>Percentage</th>
          </tr>
        </thead>
        <tbody id="domainBreakdownBody"></tbody>
      </table>
    </div>

    <div>
      <h3 style="margin-bottom:1rem; font-size:1.1rem;">Question Review</h3>
      <div id="reviewList"></div>
    </div>
  </div>
</div>

<script>
const questions = [{"num": 1, "q": "A developer is building a serverless e-commerce application. When an order is placed, an AWS Lambda function must read user profile information from an Amazon DynamoDB table. The application requires consistent, single-digit millisecond latency for reads, and the developer wants to minimize read cost. Which read consistency model should be used by default?", "o": ["Strongly Consistent Reads", "Eventually Consistent Reads", "Transactional Reads", "Global Secondary Index Reads"], "a": [1], "multi": false, "e": "Eventually consistent reads (default) deliver single-digit ms latency and consume half the Read Capacity Units (0.5 RCU per 4 KB) compared to strongly consistent reads.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 2, "q": "An application writes large payload objects (between 10 MB and 50 MB) to an Amazon S3 bucket. The developer wants to optimize upload throughput and resilience to network interruptions. Which Amazon S3 feature should the developer implement?", "o": ["Multipart Upload API", "S3 Transfer Acceleration alone without multipart", "S3 Select", "Single-part `PutObject` with increased socket timeout"], "a": [0], "multi": false, "e": "Multipart Upload API optimizes throughput and resilience for objects > 100 MB (and supports objects from 5 MB to 5 TB) by uploading parts in parallel.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 3, "q": "A developer is designing an order processing pipeline using AWS Lambda and Amazon SQS. The Lambda function polls messages from an SQS queue. If the Lambda function encounters an unhandled runtime error while processing a message, what happens to the message in SQS?", "o": ["The message is immediately deleted from the queue", "The message remains in the queue and becomes visible to other consumer instances once the Visibility Timeout expires", "The message is moved to Amazon S3 Glacier", "SQS automatically pauses all queue operations for 1 hour"], "a": [1], "multi": false, "e": "Upon unhandled Lambda failure, the message returns to SQS and becomes visible again to other workers after the Visibility Timeout expires.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 4, "q": "A developer is configuring an Amazon API Gateway REST API with AWS Lambda integration. The frontend web client needs to access the API from a different domain name (`https://www.myfrontend.com`). When making requests, the browser blocks responses with a CORS error. What must the developer configure on API Gateway?", "o": ["Enable CORS on the API Gateway resource and ensure the Lambda proxy response returns an `Access-Control-Allow-Origin: \"https://www.myfrontend.com\"` header (or `\"*\"`)", "Disable HTTPS on API Gateway", "Create a Route 53 CNAME record for the Lambda function", "Switch API Gateway to Private endpoint mode"], "a": [0], "multi": false, "e": "Enabling CORS on API Gateway and returning `Access-Control-Allow-Origin` headers from Lambda proxy integrations resolves browser CORS blocks.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 5, "q": "A developer is writing an application that queries an Amazon DynamoDB table named `Orders`. The query needs to filter results by `OrderStatus = 'PENDING'` and `OrderDate >= '2026-01-01'`. The table's partition key is `CustomerId` and the sort key is `OrderDate`. Which DynamoDB API operation and parameter should the developer use for the lowest latency and cost?", "o": ["`Query` operation specifying `KeyConditionExpression` on `CustomerId` and `OrderDate`, with a `FilterExpression` for `OrderStatus`", "`Scan` operation with `FilterExpression` across the entire table", "`BatchGetItem` specifying all possible order IDs", "`TransactGetItems` without key conditions"], "a": [0], "multi": false, "e": "`Query` specifying `KeyConditionExpression` on partition/sort keys is the most efficient and cost-effective method; `FilterExpression` filters results post-query.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 6, "q": "An application processes real-time financial market data streams. Multiple independent consumer applications need to process the same streaming records concurrently with custom offsets and replay capability up to 7 days. Which AWS service should be used for data ingestion?", "o": ["Amazon Kinesis Data Streams", "Amazon SQS Standard Queue", "Amazon SNS Topic", "AWS Step Functions"], "a": [0], "multi": false, "e": "Amazon Kinesis Data Streams supports multiple concurrent consumers with independent read pointers and 24h to 365d data replay capabilities.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 7, "q": "A developer is building an application that sends transactional emails to customers when account events occur. The developer wants to publish email messages asynchronously to a topic that fans out to both an email delivery service and an audit queue. Which AWS messaging service should be used?", "o": ["Amazon SNS (Simple Notification Service)", "Amazon SQS FIFO Queue", "Amazon Kinesis Video Streams", "AWS AppConfig"], "a": [0], "multi": false, "e": "Amazon SNS is a pub/sub fan-out messaging service that delivers messages asynchronously to multiple subscribers (SQS, email, HTTP, Lambda).", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 8, "q": "A developer wants to implement a stateful serverless workflow that coordinates multiple AWS Lambda functions, executes parallel tasks, and waits for a human manager approval step via email (up to 7 days). Which AWS service should be selected?", "o": ["AWS Step Functions (Standard Workflow)", "AWS Step Functions (Express Workflow)", "Amazon SQS Delay Queue", "Amazon EventBridge Pipes"], "a": [0], "multi": false, "e": "AWS Step Functions Standard Workflows support long-running state machine workflows (up to 1 year) and human approval callback tasks.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 9, "q": "An application running on AWS Lambda needs to write temporary image files during processing. The images can be up to 3 GB in size. Lambda's default `/tmp` directory has 512 MB of storage. How can the developer accommodate these files?", "o": ["Increase the Lambda Ephemeral Storage (`/tmp`) setting up to 10,240 MB (10 GB)", "Attach an Amazon EBS volume to the Lambda function", "Mount an Amazon S3 Glacier vault", "Increase Lambda function timeout to 15 minutes"], "a": [0], "multi": false, "e": "Lambda Ephemeral Storage (`/tmp`) is configurable between 512 MB and 10,240 MB (10 GB) for large temporary files.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 10, "q": "A developer needs to retrieve 50 specific items from an Amazon DynamoDB table by their primary keys in a single network round-trip. Which DynamoDB API operation should be used?", "o": ["`BatchGetItem`", "`Query`", "`Scan`", "`TransactWriteItems`"], "a": [0], "multi": false, "e": "`BatchGetItem` retrieves up to 100 items (or 16 MB) across one or more DynamoDB tables in a single network round-trip.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 11, "q": "A developer is building a web application that requires sub-millisecond read access to relational SQL query results from an Amazon Aurora PostgreSQL database. The query results change infrequently. Which caching service should be placed between the application and database?", "o": ["Amazon ElastiCache for Redis", "Amazon CloudFront", "Amazon DynamoDB Accelerator (DAX)", "Amazon S3 Standard-IA"], "a": [0], "multi": false, "e": "Amazon ElastiCache for Redis provides sub-millisecond in-memory caching for relational database queries.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 12, "q": "An application uses Amazon DynamoDB. The developer needs to ensure that when a customer's account balance is updated, an audit log entry is simultaneously written to an audit table. Both operations must either succeed together or fail together with ACID guarantees. Which DynamoDB API operation should be used?", "o": ["`TransactWriteItems`", "`BatchWriteItem`", "`PutItem` with a conditional expression", "`UpdateItem` with optimistic locking"], "a": [0], "multi": false, "e": "`TransactWriteItems` executes all-or-nothing atomic transactions across multiple DynamoDB items with full ACID guarantees.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 13, "q": "A developer is writing an AWS Lambda function that processes incoming events from an Amazon Kinesis data stream. If the Lambda function encounters a poison pill record that causes a failure, what configuration prevents the entire shard from being blocked indefinitely?", "o": ["Enable `BisectBatchOnFunctionError: true`, configure `MaximumRetryAttempts`, and set an On-Failure Destination to an SQS Dead-Letter Queue", "Increase Lambda memory to 10 GB", "Delete the Kinesis data stream", "Disable Kinesis sharding"], "a": [0], "multi": false, "e": "`BisectBatchOnFunctionError` isolates poison pill records by splitting failed batches recursively and sending failed records to a Dead-Letter Queue.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 14, "q": "A developer is designing a serverless API using Amazon API Gateway and AWS Lambda. The API must handle sudden spikes of 10,000 requests per second. The developer wants to avoid cold-start latency for time-critical endpoints. What Lambda feature should be configured?", "o": ["Provisioned Concurrency", "Reserved Concurrency", "Increasing Lambda function timeout to 15 minutes", "Deploying Lambda inside an Amazon VPC"], "a": [0], "multi": false, "e": "Provisioned Concurrency keeps Lambda execution environments initialized and ready, eliminating cold-start latency during traffic spikes.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 15, "q": "An application uses Amazon SQS to process background jobs. The developer notices that when a worker EC2 instance takes 40 seconds to process a message, another worker receives and begins processing the same message after 30 seconds. What is the cause of this duplicate processing?", "o": ["The SQS queue Visibility Timeout is set to 30 seconds, which is shorter than the application processing time of 40 seconds", "The SQS Message Retention Period expired", "SQS Standard queues only deliver messages once every 5 minutes", "The worker instances lack IAM permissions"], "a": [0], "multi": false, "e": "If processing time exceeds the Visibility Timeout, SQS makes the message visible to other consumers, causing duplicate concurrent processing.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 16, "q": "A developer wants to query an Amazon S3 bucket containing 100 GB of CSV files to extract only the rows where `country = 'US'` without downloading the entire dataset to local compute instances. Which S3 feature should be used?", "o": ["Amazon S3 Select", "Amazon S3 Glacier Select", "Amazon S3 Transfer Acceleration", "Amazon S3 Multipart Download"], "a": [0], "multi": false, "e": "Amazon S3 Select runs SQL expressions directly on S3 data to retrieve only the required subset of data, reducing network transfer and latency.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 17, "q": "An application uses Amazon DynamoDB. The developer needs to calculate the total sum of all orders placed in the last 24 hours across the entire table. Which operation retrieves all matching items across all partitions?", "o": ["`Scan` operation (or Parallel Scan) with a `FilterExpression` on `OrderDate`", "`GetItem` operation", "`Query` operation on the table without a partition key", "`BatchGetItem`"], "a": [0], "multi": false, "e": "A ue for each user", "Set the `MessageDeduplicationId` to the `UserId`", "Enable SQS Long Polling"], "a": [0], "multi": false, "e": "Setting `MessageGroupId` to the unique `UserId` ensures strict in-order processing per user while allowing concurrent processing across different users.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 21, "q": "A developer is designing a serverless microservice that connects to an Amazon Aurora MySQL database. Under heavy traffic, hundreds of concurrent Lambda executions exhaust the database's available connection pool. Which service resolves this connection management issue?", "o": ["Amazon RDS Proxy", "DynamoDB Accelerator (DAX)", "Amazon ElastiCache for Memcached", "AWS Systems Manager Parameter Store --- ### Domain 2: Security (Questions 22–38)"], "a": [0], "multi": false, "e": "Amazon RDS Proxy pools and multiplexes database connections, preventing serverless Lambda functions from exhausting MySQL connection limits.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 22, "q": "A mobile application needs to authenticate users and obtain temporary AWS credentials to upload profile images directly to an Amazon S3 bucket. Which combination of Amazon Cognito services implements this secure flow?", "o": ["Amazon Cognito User Pools (for authentication and JWT issuance) + Amazon Cognito Identity Pools (for exchanging JWTs for temporary AWS IAM credentials)", "Amazon Cognito User Pools only", "Amazon Cognito Identity Pools only with hardcoded IAM keys", "AWS Secrets Manager only"], "a": [0], "multi": false, "e": "Cognito User Pools handle user authentication and JWT issuance; Identity Pools exchange JWTs for temporary AWS IAM credentials.", "d_id": 2, "d_name": "Domain 2: Security (26%)"}, {"num": 23, "q": "A developer needs to encrypt sensitive database passwords stored in an AWS Lambda function's environment variables so that unauthorized IAM users cannot view them in plaintext let currentIndex = 0;
let userAnswers = {}; // qIndex -> [selected indices]
let flagged = new Set();
let timeLeft = 130 * 60; // 130 minutes in seconds
let timerInterval = null;
let examSubmitted = false;

function init() {
  renderNavGrid();
  loadQuestion(0);
  startTimer();

  document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) loadQuestion(currentIndex - 1); };
  document.getElementById('nextBtn').onclick = () => { if (currentIndex < questions.length - 1) loadQuestion(currentIndex + 1); };
  document.getElementById('flagBtn').onclick = toggleFlag;
  document.getElementById('finishExamBtn').onclick = confirmSubmit;
}

function startTimer() {
  const display = document.getElementById('timerDisplay');
  timerInterval = setInterval(() => {
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam();
      return;
    }
    timeLeft--;
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    display.textContent = `⏳ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

    if (timeLeft <= 900) display.className = 'timer-box timer-warning';
    if (timeLeft <= 300) display.className = 'timer-box timer-danger';
  }, 1000);
}

function renderNavGrid() {
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = idx + 1;
    btn.onclick = () => loadQuestion(idx);
    grid.appendChild(btn);
  });
}

function updateNavGrid() {
  const btns = document.querySelectorAll('.nav-btn');
  btns.forEach((btn, idx) => {
    btn.className = 'nav-btn';
    if (idx === currentIndex) btn.classList.add('active');
    if (userAnswers[idx] && userAnswers[idx].length > 0) btn.classList.add('answered');
    if (flagged.has(idx)) btn.classList.add('flagged');
  });
}

function loadQuestion(idx) {
  currentIndex = idx;
  const q = questions[idx];

  document.getElementById('qNumber').textContent = `Question ${idx + 1} of ${questions.length}`;
  document.getElementById('domainBadge').textContent = q.d_name;
  document.getElementById('qStem').textContent = q.q;

  const flagBtn = document.getElementById('flagBtn');
  flagBtn.className = flagged.has(idx) ? 'btn btn-flag active' : 'btn btn-flag';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  const selected = userAnswers[idx] || [];

  q.o.forEach((opt, optIdx) => {
    const item = document.createElement('div');
    item.className = 'option-item' + (selected.includes(optIdx) ? ' selected' : '');
    const letter = String.fromCharCode(65 + optIdx);
    item.innerHTML = `<span class="opt-label">${letter})</span><span class="opt-text">${opt}</span>`;
    item.onclick = () => selectOption(idx, optIdx, q.multi);
    container.appendChild(item);
  });

  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').textContent = (idx === questions.length - 1) ? 'Review & Submit' : 'Next';
  updateNavGrid();
}

function selectOption(qIdx, optIdx, isMulti) {
  if (examSubmitted) return;
  if (!userAnswers[qIdx]) userAnswers[qIdx] = [];

  if (isMulti) {
    const pos = userAnswers[qIdx].indexOf(optIdx);
    if (pos > -1) userAnswers[qIdx].splice(pos, 1);
    else userAnswers[qIdx].push(optIdx);
  } else {
    userAnswers[qIdx] = [optIdx];
  }
  loadQuestion(qIdx);
}

function toggleFlag() {
  if (flagged.has(currentIndex)) flagged.delete(currentIndex);
  else flagged.add(currentIndex);
  loadQuestion(currentIndex);
}

function confirmSubmit() {
  const answeredCount = Object.keys(userAnswers).filter(k => userAnswers[k].length > 0).length;
  const unanswered = questions.length - answeredCount;
  const msg = unanswered > 0 
    ? `You have ${unanswered} unanswered questions. Are you sure you want to submit?`
    : 'Are you ready to submit your exam and view your score?';
  if (confirm(msg)) submitExam();
}

function submitExam() {
  examSubmitted = true;
  clearInterval(timerInterval);

  document.getElementById('examContainer').style.display = 'none';
  document.getElementById('resultsContainer').style.display = 'block';

  let totalCorrect = 0;
  const domainStats = {
    1: { name: 'Domain 1: Development with AWS Services (32%)', total: 0, correct: 0 },
    2: { name: 'Domain 2: Security (26%)', total: 0, correct: 0 },
    3: { name: 'Domain 3: Deployment (24%)', total: 0, correct: 0 },
    4: { name: 'Domain 4: Troubleshooting & Optimization (18%)', total: 0, correct: 0 }
  };

  questions.forEach((q, idx) => {
    domainStats[q.d_id].total++;
    const userSel = (userAnswers[idx] || []).sort();
    const correctAns = (q.a || []).sort();

    const isCorrect = userSel.length === correctAns.length && userSel.every((val, i) => val === correctAns[i]);
    if (isCorrect) {
      totalCorrect++;
      domainStats[q.d_id].correct++;
    }
  });

  // Scaled Score: 100 to 1000 scale
  const rawPct = (totalCorrect / questions.length);
  const scaledScore = Math.round(100 + rawPct * 900);
  const passed = scaledScore >= 720;

  document.getElementById('scoreNumber').textContent = scaledScore;
  document.getElementById('scoreSummary').textContent = `${totalCorrect} / ${questions.length} correct (${Math.round(rawPct * 100)}%)`;

  const badge = document.getElementById('passBadge');
  badge.textContent = passed ? 'PASSED' : 'FAILED';
  badge.className = passed ? 'pass-badge pass' : 'pass-badge fail';

  // Domain breakdown table
  const tbody = document.getElementById('domainBreakdownBody');
  tbody.innerHTML = '';
  Object.keys(domainStats).forEach(dId => {
    const d = domainStats[dId];
    const pct = d.total > 0 ? Math.round((d.correct / d.total) * 100) : 0;
    const row = document.createElement('tr');
    row.innerHTML = `
      <td style="font-weight:600;">${d.name}</td>
      <td>${dId == 1 ? '32%' : dId == 2 ? '26%' : dId == 3 ? '24%' : '18%'}</td>
      <td>${d.correct} / ${d.total}</td>
      <td style="font-weight:700; color:${pct >= 72 ? 'var(--correct)' : 'var(--incorrect)'};">${pct}%</td>
    `;
    tbody.appendChild(row);
  });

  // Review List
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  questions.forEach((q, idx) => {
    const userSel = (userAnswers[idx] || []).sort();
    const correctAns = (q.a || []).sort();
    const isCorrect = userSel.length === correctAns.length && userSel.every((val, i) => val === correctAns[i]);

    const card = document.createElement('div');
    card.className = 'review-item';
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
        <span style="font-weight:700; color:${isCorrect ? 'var(--correct)' : 'var(--incorrect)'};">
          ${isCorrect ? '✓ Correct' : '✗ Incorrect'} — Question ${idx + 1}
        </span>
        <span class="domain-badge">${q.d_name}</span>
      </div>
      <div style="font-size:0.95rem; margin-bottom:0.75rem; color:#f1f5f9;">${q.q}</div>
      <div style="font-size:0.875rem; color:var(--text-secondary);">
        <strong>Your Answer:</strong> ${userSel.map(i => String.fromCharCode(65 + i)).join(', ') || 'None'}<br>
        <strong>Correct Answer:</strong> ${correctAns.map(i => String.fromCharCode(65 + i)).join(', ')}
      </div>
      <div class="explanation-box">
        <strong>Explanation:</strong> ${q.e}
      </div>
    `;
    reviewList.appendChild(card);
  });
}

window.onload = init;
</script>
</body>
</html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVA-C02 Timed Mock Exam 2 — AWS Certified Developer Associate (DVA-C02)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2234;
  --bg-card-hover: #222d42;
  --border-color: #2a364f;
  --border-focus: #ff9900;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-aws: #ff9900;
  --accent-aws-hover: #ec7211;
  --accent-blue: #38bdf8;
  --correct: #10b981;
  --correct-bg: rgba(16, 185, 129, 0.12);
  --incorrect: #ef4444;
  --incorrect-bg: rgba(239, 68, 68, 0.12);
  --flagged: #f59e0b;
  --flagged-bg: rgba(245, 158, 11, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0.875rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 1rem; }
.eyebrow { font-size: 0.75rem; font-weight: 700; color: var(--accent-aws); text-transform: uppercase; letter-spacing: 0.08em; }
h1 { font-size: 1.125rem; font-weight: 700; color: var(--text-primary); }
.timer-box {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.125rem;
  font-weight: 700;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 0.35rem 0.85rem;
  border-radius: 6px;
  color: var(--accent-blue);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.timer-warning { color: var(--flagged); border-color: var(--flagged); animation: pulse 1.5s infinite; }
.timer-danger { color: var(--incorrect); border-color: var(--incorrect); animation: pulse 0.8s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.main-container {
  display: grid;
  grid-template-columns: 1fr 320px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 1.5rem;
  gap: 1.5rem;
  flex: 1;
  width: 100%;
}
@media (max-width: 900px) {
  .main-container { grid-template-columns: 1fr; }
}

.q-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.75rem;
}
.domain-badge {
  font-size: 0.75rem;
  font-weight: 600;
  background: rgba(56, 189, 248, 0.12);
  color: var(--accent-blue);
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
}
.q-stem { font-size: 1.05rem; font-weight: 500; color: #f8fafc; line-height: 1.6; }
.options-list { display: flex; flex-direction: column; gap: 0.75rem; }
.option-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 0.875rem 1rem;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
}
.option-item:hover { background: var(--bg-card-hover); border-color: #475569; }
.option-item.selected {
  background: rgba(255, 153, 0, 0.12);
  border-color: var(--accent-aws);
}
.opt-label {
  font-weight: 700;
  color: var(--text-secondary);
  min-width: 1.5rem;
}
.opt-text { color: var(--text-primary); font-size: 0.95rem; }

.sidebar {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 1.25rem;
  height: fit-content;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.grid-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.4rem;
  max-height: 380px;
  overflow-y: auto;
}
.nav-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.5rem 0;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.1s ease;
}
.nav-btn:hover { border-color: var(--accent-aws); color: var(--text-primary); }
.nav-btn.active { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.15); color: #fff; }
.nav-btn.answered { background: #22384f; border-color: #38bdf8; color: #fff; }
.nav-btn.flagged { border-color: var(--flagged); background: var(--flagged-bg); color: var(--flagged); }

.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 1rem;
  border-top: 1px solid var(--border-color);
}
.btn {
  padding: 0.6rem 1.25rem;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  border: none;
  transition: all 0.15s ease;
}
.btn-primary { background: var(--accent-aws); color: #000; }
.btn-primary:hover { background: var(--accent-aws-hover); }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-secondary:hover { background: var(--bg-card-hover); }
.btn-flag { background: transparent; color: var(--flagged); border: 1px solid var(--flagged); }
.btn-flag.active { background: var(--flagged); color: #000; }
.btn-finish { background: var(--correct); color: #000; width: 100%; }
.btn-finish:hover { background: #059669; }

/* Results Screen */
.results-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 2.5rem;
  max-width: 860px;
  margin: 2rem auto;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}
.score-banner {
  text-align: center;
  padding: 2rem;
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid var(--border-color);
}
.scaled-score { font-size: 3rem; font-weight: 800; color: var(--accent-aws); }
.pass-badge {
  display: inline-block;
  padding: 0.35rem 1.25rem;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9rem;
  text-transform: uppercase;
  margin-top: 0.75rem;
}
.pass-badge.pass { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct); }
.pass-badge.fail { background: var(--incorrect-bg); color: var(--incorrect); border: 1px solid var(--incorrect); }

.breakdown-table {
  width: 100%;
  border-collapse: collapse;
}
.breakdown-table th, .breakdown-table td {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border-color);
  text-align: left;
}
.breakdown-table th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
.review-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.explanation-box {
  margin-top: 1rem;
  padding: 1rem;
  background: rgba(15, 23, 42, 0.6);
  border-left: 3px solid var(--accent-blue);
  border-radius: 4px;
  font-size: 0.9rem;
}
</style>
</head>

<script>
const questions = [{"num": 1, "q": "A developer is designing a serverless payment processing backend. When an order arrives, an AWS Lambda function must deduct money from a customer balance and update an inventory count across two separate DynamoDB tables. Both updates must either succeed simultaneously or fail completely without leaving inconsistent data. Which DynamoDB feature should the developer use?", "o": ["DynamoDB Transactions (`TransactWriteItems`)", "DynamoDB Batch Operations (`BatchWriteItem`)", "DynamoDB Global Secondary Indexes", "DynamoDB Streams"], "a": [0], "multi": false, "e": "`TransactWriteItems` executes atomic all-or-nothing writes across multiple DynamoDB tables with ACID compliance.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 2, "q": "An application uploads high-resolution 500 MB video files to Amazon S3. What is the recommended method to upload these files reliably, allowing paused or failed parts to be resumed without restarting the entire upload?", "o": ["S3 Multipart Upload API", "Single-part `s3:PutObject`", "S3 Select", "S3 Batch Operations"], "a": [0], "multi": false, "e": "Multipart Upload API optimizes upload throughput and fault tolerance for objects > 100 MB by uploading independent parts in parallel.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 3, "q": "An application needs to decouple order ingestion from asynchronous background processing. Orders arrive in unpredictable bursts of up to 10,000 per minute. The system must buffer requests and ensure that no orders are dropped if backend worker instances scale slowly. Which AWS service is designed for this point-to-point queuing?", "o": ["Amazon SQS (Simple Queue Service)", "Amazon SNS Topic", "Amazon AppStream 2.0", "AWS AppConfig"], "a": [0], "multi": false, "e": "Amazon SQS decouples application components, buffering high-volume traffic bursts and ensuring zero message loss.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 4, "q": "A developer is configuring an Amazon API Gateway REST API. The developer wants to reduce latency for API callers and decrease the number of requests sent to the backend AWS Lambda function for GET requests that return identical results for 10 minutes. What feature should be enabled?", "o": ["API Gateway Caching (on the stage)", "API Gateway Usage Plans", "API Gateway Mutual TLS", "API Gateway Canary Release"], "a": [0], "multi": false, "e": "API Gateway Stage Caching stores responses in memory, reducing backend Lambda executions and lowering latency for repeat GET requests.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 5, "q": "An application uses Amazon DynamoDB. The table stores customer support tickets. The partition key is `CustomerId` and the sort key is `TicketId`. The developer wants to query all tickets opened by a specific customer in descending order of `TicketId`. Which parameter in the `Query` API call reverses the sort order?", "o": ["`ScanIndexForward: false`", "`SortOrder: \"DESC\"`", "`ReverseIndex: true`", "`KeyConditionExpression: \"DESC\"`"], "a": [0], "multi": false, "e": "Setting `ScanIndexForward: false` reverses the query result order to sort descending based on the sort key.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 6, "q": "An application processes IoT sensor telemetry. Multiple downstream applications (an anomaly detector, an hourly aggregator, and an S3 archiver) all need to consume the exact same stream of sensor data independently with replay capability. Which AWS streaming service supports multiple concurrent consumers reading with distinct shard iterators?", "o": ["Amazon Kinesis Data Streams", "Amazon SQS Standard Queue", "Amazon SNS Standard Topic", "AWS Step Functions"], "a": [0], "multi": false, "e": "Amazon Kinesis Data Streams supports multiple independent consumers with separate shard iterators and up to 365 days of data replay.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 7, "q": "A developer is building a notification system. When a new product is announced, a single event must be delivered simultaneously to an email delivery service, a mobile push notification service, and an audit SQS queue. Which AWS messaging pattern implements this fan-out architecture?", "o": ["Amazon SNS topic with subscriptions to Amazon SQS queues, HTTP endpoints, and email addresses", "Amazon SQS FIFO queue with 3 consumer groups", "AWS Step Functions Express Workflow", "Amazon Kinesis Video Streams"], "a": [0], "multi": false, "e": "Amazon SNS is a pub/sub fan-out service that delivers messages simultaneously to multiple subscribed endpoints (SQS, email, HTTP).", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 8, "q": "An order processing workflow requires executing four steps in order: (1) validate payment, (2) check inventory, (3) ship package, and (4) send confirmation email. If step 2 fails due to out-of-stock items, the system must trigger a refund task. Which AWS service orchestrates this multi-step state machine?", "o": ["AWS Step Functions", "Amazon SQS", "Amazon SNS", "AWS CodeBuild"], "a": [0], "multi": false, "e": "AWS Step Functions Standard Workflows coordinate multi-step state machines with branching logic, retries, and compensation states.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 9, "q": "An AWS Lambda function executes a CPU-intensive data compression algorithm on incoming JSON files. The developer notices the function execution duration is 12 seconds with 512 MB of memory configured. How can the developer reduce the function's execution time?", "o": ["Increase the Lambda function memory allocation (which proportionally increases allocated vCPU power)", "Increase the Lambda timeout to 15 minutes", "Convert the function to an S3 bucket", "Deploy the function in a private VPC subnet"], "a": [0], "multi": false, "e": "Increasing Lambda memory proportionally scales allocated vCPU power, accelerating CPU-bound compression algorithms.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 10, "q": "A developer needs to update a single attribute `Status = 'SHIPPED'` on an existing item in an Amazon DynamoDB table without re-writing or overwriting the other attributes of the item. Which DynamoDB API operation should be used?", "o": ["`UpdateItem`", "`PutItem`", "`BatchWriteItem`", "`TransactGetItems`"], "a": [0], "multi": false, "e": "`UpdateItem` modifies specific attributes of an existing item in-place without overwriting unaffected attributes.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 11, "q": "A gaming company requires microsecond read latency for global player leaderboards that receive millions of read queries per second against an Amazon DynamoDB table. Which in-memory caching service integrates seamlessly with DynamoDB without changing application query logic?", "o": ["Amazon DynamoDB Accelerator (DAX)", "Amazon ElastiCache for Memcached", "Amazon CloudFront", "Amazon S3 Standard"], "a": [0], "multi": false, "e": "Amazon DynamoDB Accelerator (DAX) provides seamless in-memory microsecond read caching without application code changes.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 12, "q": "A developer is designing a serverless REST API that accepts customer registrations. If the database write fails, the application must retry with exponential backoff. Which client-side retry practice prevents retry storms from overwhelming a recovering database?", "o": ["Adding randomized full jitter to the exponential backoff calculation", "Retrying immediately with 0 delay in a while loop", "Retrying at fixed 100-millisecond intervals", "Restarting the client application process"], "a": [0], "multi": false, "e": "Exponential backoff with randomized jitter spreads out retry intervals, preventing thundering herds on struggling downstream services.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 13, "q": "An application processes financial transactions from an Amazon Kinesis data stream using AWS Lambda. The team wants to ensure that if an unhandled runtime exception occurs on a batch of records, the failed records are sent to an SQS queue after 3 retries without discarding the rest of the stream. What feature should be configured on the Lambda Event Source Mapping?", "o": ["On-Failure Destination (targeting an SQS queue) with `MaximumRetryAttempts: 3` and `BisectBatchOnFunctionError: true`", "Deleting the Kinesis shard", "Increasing Lambda timeout to 15 minutes", "Disabling Kinesis sharding"], "a": [0], "multi": false, "e": "`BisectBatchOnFunctionError` isolates failed records by recursively splitting batches and sending failed records to an SQS DLQ.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 14, "q": "A developer is designing an asynchronous workflow where an S3 upload triggers an AWS Lambda function. If the Lambda function fails all retry attempts (2 retries for asynchronous invocation), the event payload must be saved for developer inspection. Which Lambda configuration captures these failed async events?", "o": ["Lambda Asynchronous Invocation Dead-Letter Queue (DLQ) or On-Failure Destination (targeting SQS or SNS)", "Lambda Provisioned Concurrency", "S3 Cross-Region Replication", "CloudWatch Logs Insights"], "a": [0], "multi": false, "e": "Asynchronous Lambda dead-letter queues (DLQs) or On-Failure Destinations capture failed event payloads for analysis after all retries fail.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 15, "q": "An application uses Amazon SQS. The developer notices that when a consumer begins processing a message, other consumers do not receive that message for 60 seconds. What SQS setting controls this behavior?", "o": ["Visibility Timeout", "Delivery Delay", "Message Retention Period", "Receive Message Wait Time"], "a": [0], "multi": false, "e": "Visibility Timeout hides messages during processing; if processing exceeds this duration, the message becomes visible to other consumers.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 16, "q": "A developer wants to download only the first 500 bytes of a 2 GB file stored in Amazon S3 to inspect the file header without downloading the entire object. What HTTP request header should be passed to S3 `GetObject`?", "o": ["`Range: bytes=0-499`", "`Content-Length: 500`", "`x-amz-limit: 500`", "`PartNumber: 1`"], "a": [0], "multi": false, "e": "Amazon S3 Select runs SQL expressions directly on S3 data to retrieve only the required subset of data, reducing network transfer and latency.", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 17, "q": "An application uses Amazon DynamoDB. The developer needs to retrieve all items from the `Products` table where `Category = 'Electronics'`. `Category` is NOT the table's partition key. What DynamoDB feature enables efficient querying on `Category` without performing a full table scan?", "o": ["Global Secondary Index (GSI) with `Category` as the partition key", "Local Secondary Index (LSI) with a different partition key", "DynamoDB Streams", "DynamoDB Transactions"], "a": [0], "multi": false, "e": "A Global Secondary Index (GSI) allows querying DynamoDB tables on non-key attributes (like `Category`).", "d_id": 1, "d_name": "Domain 1: Development with AWS Services (32%)"}, {"num": 18, "q": "A developer wants to build a serverless REST API using Amazon API Gateway that passes incoming HTTP requests directly to an Amazon DynamoDB table without writing any intermediate AWS Lambda function code. Which API Gateway integration type enables this direct connection?", "o": ["AWS Service Integration (HTTP/REST let timerInterval = null;
let examSubmitted = false;

function init() {
  renderNavGrid();
  loadQuestion(0);
  startTimer();

  document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) loadQuestion(currentIndex - 1); };
  document.getElementById('nextBtn').onclick = () => { if (currentIndex < questions.length - 1) loadQuestion(currentIndex + 1); };
  document.getElementById('flagBtn').onclick = toggleFlag;
  document.getElementById('finishExamBtn').onclick = confirmSubmit;
}

function startTimer() {
  const display = document.getElementById('timerDisplay');
  timerInterval = setInterval(() => {
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam();
      return;
    }
    timeLeft--;
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    display.textContent = `⏳ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

    if (timeLeft <= 900) display.className = 'timer-box timer-warning';
    if (timeLeft <= 300) display.className = 'timer-box timer-danger';
  }, 1000);
}

function renderNavGrid() {
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = idx + 1;
    btn.onclick = () => loadQuestion(idx);
    grid.appendChild(btn);
  });
}

function updateNavGrid() {
  const btns = document.querySelectorAll('.nav-btn');
  btns.forEach((btn, idx) => {
    btn.className = 'nav-btn';
    if (idx === currentIndex) btn.classList.add('active');
    if (userAnswers[idx] && userAnswers[idx].length > 0) btn.classList.add('answered');
    if (flagged.has(idx)) btn.classList.add('flagged');
  });
}

function loadQuestion(idx) {
  currentIndex = idx;
  const q = questions[idx];

  document.getElementById('qNumber').textContent = `Question ${idx + 1} of ${questions.length}`;
  document.getElementById('domainBadge').textContent = q.d_name;
  document.getElementById('qStem').textContent = q.q;

  const flagBtn = document.getElementById('flagBtn');
  flagBtn.className = flagged.has(idx) ? 'btn btn-flag active' : 'btn btn-flag';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  const selected = userAnswers[idx] || [];

  q.o.forEach((opt, optIdx) => {
    const item = document.createElement('div');
    item.className = 'option-item' + (selected.includes(optIdx) ? ' selected' : '');
    const letter = String.fromCharCode(65 + optIdx);
    item.innerHTML = `<span class="opt-label">${letter})</span><span class="opt-text">${opt}</span>`;
    item.onclick = () => selectOption(idx, optIdx, q.multi);
    container.appendChild(item);
  });

  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').textContent = (idx === questions.length - 1) ? 'Review & Submit' : 'Next';
  updateNavGrid();
}

function selectOption(qIdx, optIdx, isMulti) {
  if (examSubmitted) return;
  if (!userAnswers[qIdx]) userAnswers[qIdx] = [];

  if (isMulti) {
    const pos = userAnswers[qIdx].indexOf(optIdx);
    if (pos > -1) userAnswers[qIdx].splice(pos, 1);
    else userAnswers[qIdx].push(optIdx);
  } else {
    userAnswers[qIdx] = [optIdx];
  }
  loadQuestion(qIdx);
}

function toggleFlag() {
  if (flagged.has(currentIndex)) flagged.delete(currentIndex);
  else flagged.add(currentIndex);
  loadQuestion(currentIndex);
}

function confirmSubmit() {
  const answeredCount = Object.keys(userAnswers).filter(k => userAnswers[k].length > 0).length;
  const unanswered = questions.length - answeredCount;
  const msg = unanswered > 0 
    ? `You have ${unanswered} unanswered questions. Are you sure you want to submit?`
    : 'Are you ready to submit your exam and view your score?';
  if (confirm(msg)) submitExam();
}

function submitExam() {
  examSubmitted = true;
  clearInterval(timerInterval);

  document.getElementById('examContainer').style.display = 'none';
  document.getElementById('resultsContainer').style.display = 'block';

  let totalCorrect = 0;
  const domainStats = {
    1: { name: 'Domain 1: Development with AWS Services (32%)', total: 0, correct: 0 },
    2: { name: 'Domain 2: Security (26%)', total: 0, correct: 0 },
    3: { name: 'Domain 3: Deployment (24%)', total: 0, correct: 0 },
    4: { name: 'Domain 4: Troubleshooting & Optimization (18%)', total: 0, correct: 0 }
  };

  questions.forEach((q, idx) => {
    domainStats[q.d_id].total++;
    const userSel = (userAnswers[idx] || []).sort();
    const correctAns = (q.a || []).sort();

    const isCorrect = userSel.length === correctAns.length && userSel.every((val, i) => val === correctAns[i]);
    if (isCorrect) {
      totalCorrect++;
      domainStats[q.d_id].correct++;
    }
  });

  // Scaled Score: 100 to 1000 scale
  const rawPct = (totalCorrect / questions.length);
  const scaledScore = Math.round(100 + rawPct * 900);
  const passed = scaledScore >= 720;

  document.getElementById('scoreNumber').textContent = scaledScore;
  document.getElementById('scoreSummary').textContent = `${totalCorrect} / ${questions.length} correct (${Math.round(rawPct * 100)}%)`;

  const badge = document.getElementById('passBadge');
  badge.textContent = passed ? 'PASSED' : 'FAILED';
  badge.className = passed ? 'pass-badge pass' : 'pass-badge fail';

  // Domain breakdown table
  const tbody = document.getElementById('domainBreakdownBody');
  tbody.innerHTML = '';
  Object.keys(domainStats).forEach(dId => {
    const d = domainStats[dId];
    const pct = d.total > 0 ? Math.round((d.correct / d.total) * 100) : 0;
    const row = document.createElement('tr');
    row.innerHTML = `
      <td style="font-weight:600;">${d.name}</td>
      <td>${dId == 1 ? '32%' : dId == 2 ? '26%' : dId == 3 ? '24%' : '18%'}</td>
      <td>${d.correct} / ${d.total}</td>
      <td style="font-weight:700; color:${pct >= 72 ? 'var(--correct)' : 'var(--incorrect)'};">${pct}%</td>
    `;
    tbody.appendChild(row);
  });

  // Review List
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  questions.forEach((q, idx) => {
    const userSel = (userAnswers[idx] || []).sort();
    const correctAns = (q.a || []).sort();
    const isCorrect = userSel.length === correctAns.length && userSel.every((val, i) => val === correctAns[i]);

    const card = document.createElement('div');
    card.className = 'review-item';
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
        <span style="font-weight:700; color:${isCorrect ? 'var(--correct)' : 'var(--incorrect)'};">
          ${isCorrect ? '✓ Correct' : '✗ Incorrect'} — Question ${idx + 1}
        </span>
        <span class="domain-badge">${q.d_name}</span>
      </div>
      <div style="font-size:0.95rem; margin-bottom:0.75rem; color:#f1f5f9;">${q.q}</div>
      <div style="font-size:0.875rem; color:var(--text-secondary);">
        <strong>Your Answer:</strong> ${userSel.map(i => String.fromCharCode(65 + i)).join(', ') || 'None'}<br>
        <strong>Correct Answer:</strong> ${correctAns.map(i => String.fromCharCode(65 + i)).join(', ')}
      </div>
      <div class="explanation-box">
        <strong>Explanation:</strong> ${q.e}
      </div>
    `;
    reviewList.appendChild(card);
  });
}

window.onload = init;
</script>
</body>
</html>

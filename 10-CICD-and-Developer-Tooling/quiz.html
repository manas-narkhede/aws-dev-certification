{q:"A developer's CodeBuild service role lacks the codeartifact:GetAuthorizationToken permission needed to authenticate against a CodeArtifact repository during the build's install phase. What is the most likely observed result?",o:["The build succeeds normally, since CodeArtifact does not require any authentication","The authentication step fails, causing the dependency-resolution commands relying on it (such as npm ci) to fail as well","CodeArtifact automatically grants temporary anonymous access in this situation","The build silently substitutes a different, unrelated repository"],a:[1],e:"Without the required permission, the authentication step fails, causing dependent commands like npm ci to fail as well."},
{q:"Which of the following best describes what happens the first time a specific package version is requested from a CodeArtifact repository configured with an upstream connection to a public registry, if that version has not been requested before?",o:["The request always fails permanently, since CodeArtifact never fetches anything from a public upstream","CodeArtifact fetches the package version from the configured upstream registry and caches it in the repository for that and future requests","The package must first be manually uploaded by an administrator before any request can succeed","CodeArtifact deletes the upstream configuration automatically after the first request"],a:[1],e:"CodeArtifact fetches the not-yet-cached version from the upstream registry and caches it for that and future requests."},
{q:"A company operates repositories for npm, pip, and Maven packages, all within a single CodeArtifact domain, and wants consistent security and access policy management applied across all three without configuring each repository's security independently from scratch. Which CodeArtifact concept enables this kind of shared configuration?",o:["The domain-level security configuration and policy sharing that CodeArtifact provides across repositories within the same domain","A separate CodeStar project must be created for each repository individually","CodeArtifact does not support any shared configuration; every repository must be configured in complete isolation","AppConfig deployment strategies applied to each repository"],a:[0],e:"Domain-level security configuration sharing lets consistent policy apply across multiple repositories within the same domain."},
{q:"Which two of the following statements about AWS CodeArtifact authentication are accurate? (Select TWO)",o:["Clients authenticate using a short-lived authorization token obtained via the CodeArtifact API (e.g., get-authorization-token)","Access to CodeArtifact repositories and domains is governed by IAM, consistent with the rest of AWS","CodeArtifact requires a permanent, non-expiring API key generated outside of IAM","CodeArtifact authentication tokens never expire and require no refresh","CodeArtifact is exempt from IAM policy evaluation entirely"],a:[0,1],multi:true,e:"Authentication uses a short-lived token from the CodeArtifact API, and access is governed by IAM like other AWS services."},
{q:"Which of the following most accurately describes the historical role of AWS CodeStar?",o:["A distinct deployment engine that fully replaces CodeBuild and CodeDeploy","A unified project-management dashboard and template that provisioned and wrapped CodeCommit, CodeBuild, CodeDeploy, and CodePipeline together from a project template","A container orchestration service comparable to ECS","A managed relational database service"],a:[1],e:"CodeStar was a unified project-management dashboard/template wrapping CodeCommit, CodeBuild, CodeDeploy, and CodePipeline together."},
{q:"A company evaluating whether to use AWS CodeStar for a brand-new project in current AWS guidance should be aware of which of the following?",o:["CodeStar is AWS's actively promoted, primary recommendation for all new CI/CD projects going forward","CodeStar is largely superseded in newer AWS guidance, which instead favors composing CodeCommit, CodeBuild, CodeDeploy, and CodePipeline directly (or using tools like the CDK/SAM/Amplify for scaffolding)","CodeStar has been fully removed from the AWS platform and no longer exists in any form","CodeStar replaced IAM as the primary access-control mechanism for CI/CD services"],a:[1],e:"Newer AWS guidance favors composing the underlying services directly (or using CDK/SAM/Amplify), with CodeStar largely superseded."},
{q:"If a DVA-C02 exam question presents AWS CodeStar as an answer option alongside directly-composed CodeCommit/CodeBuild/CodeDeploy/CodePipeline resources, how should a candidate generally interpret CodeStar's role?",o:["As a fundamentally different deployment technology with entirely separate underlying mechanics","As essentially the same underlying Code* services, just provisioned together and presented through a project-scaffolding dashboard, rather than a distinct deployment engine","As a service unrelated to any of the other AWS developer tools","As a replacement for IAM policies entirely"],a:[1],e:"CodeStar represents the same underlying services provisioned together via a scaffolding dashboard, not a distinct deployment engine."},
{q:"Which two of the following capabilities were part of AWS CodeStar's original unified project experience? (Select TWO)",o:["Provisioning a CodeCommit repository, CodeBuild project, CodeDeploy deployment, and CodePipeline pipeline together from a project template","A basic project dashboard providing visibility into the provisioned resources","Full replacement of Amazon RDS for all relational database needs","Native container orchestration equivalent to Amazon EKS","Acting as a DNS resolution service equivalent to Route 53"],a:[0,1],multi:true,e:"CodeStar provisioned the four core Code* resources together from a template and offered a basic project dashboard."},
{q:"A team already has a fully custom-built pipeline composed of separately configured CodeCommit, CodeBuild, CodeDeploy, and CodePipeline resources, each tuned to specific project needs. Would introducing AWS CodeStar into this existing, already-composed setup provide meaningful additional deployment capability beyond what already exists?",o:["Yes, CodeStar would add entirely new deployment mechanics not otherwise available","Not meaningfully — CodeStar's primary value is as a scaffolding/dashboard wrapper around the same underlying services already in use, not as a source of new deployment capability","Yes, because CodeStar is required for any pipeline to function at all","No, because CodeStar cannot coexist with any manually configured Code* resource"],a:[1],e:"CodeStar's value is primarily as a scaffolding/dashboard wrapper, not a source of new deployment capability beyond the underlying services."},
{q:"A company wants to roll out a new feature flag value to its already-running application fleet gradually, with the ability to automatically halt and revert if error rates spike, but explicitly without triggering a new code deployment or restarting any running processes. Which AWS service is purpose-built for this requirement?",o:["AWS CodeDeploy, using a blue/green deployment","AWS AppConfig, using a deployment strategy with a bake time and an alarm-based automatic rollback","AWS CodePipeline, using a manual approval action","AWS CodeArtifact, using an upstream repository"],a:[1],e:"AppConfig's deployment strategies with bake time and alarm-based rollback are purpose-built for gradual configuration rollout without a code deployment."},
{q:"In AWS AppConfig, what is the primary purpose of a validator attached to a configuration profile?",o:["To automatically deploy the configuration to 100% of the fleet immediately, bypassing any staged rollout","To check a new configuration value's correctness (for example, via a JSON Schema or a Lambda function) before it is allowed to deploy, catching malformed configuration before it reaches production","To encrypt the configuration value using a hardcoded key","To permanently delete any configuration profile that fails a health check"],a:[1],e:"A validator checks a new configuration value's correctness before deployment, catching malformed configuration early."},
{q:"A Lambda function needs to check a feature flag stored in AppConfig on every single invocation, and the team is concerned that calling the AppConfig API directly on each invocation would add unacceptable latency and cost. Which AWS-provided mechanism addresses this concern?",o:["The AppConfig Lambda extension, a Lambda layer that caches configuration locally and serves it over localhost with minimal added latency","Increasing the Lambda function's memory allocation, which has no relation to this concern","Switching the feature flag storage to a CodeCommit repository read on every invocation","Disabling the feature flag check entirely to avoid the API call"],a:[0],e:"The AppConfig Lambda extension caches configuration locally and serves it over localhost with minimal added latency."},
{q:"Which of the following deployment strategies, in the context of AWS AppConfig configuration rollouts, most closely mirrors the \"small percentage, then a jump to full rollout\" traffic-shifting shape used for code deployments?",o:["AppConfig.AllAtOnce","A canary-equivalent AppConfig deployment strategy with a defined initial percentage and bake time before completing the rollout","A deployment strategy is not a concept that exists in AppConfig","Only a fully manual, non-automatable process is available in AppConfig"],a:[1],e:"A canary-equivalent AppConfig strategy (initial percentage plus bake time before completion) mirrors the code-deployment canary shape."},
{q:"A company deploys a new AppConfig configuration using the predefined strategy AppConfig.Linear50PercentEvery30Seconds. What does this deployment strategy name indicate about the rollout's pace?",o:["The configuration reaches 100% of the fleet instantly with no incremental steps","The configuration is applied to 50% of the fleet, then the remaining 50% every 30 seconds thereafter, in a linear, evenly-paced progression","The configuration is deployed only once every 50 days","The configuration is never actually deployed, only previewed"],a:[1],e:"Linear50PercentEvery30Seconds applies configuration to 50% of the fleet, then the remainder in evenly-paced 30-second increments."},
{q:"Which of the following most accurately distinguishes AWS AppConfig from AWS Systems Manager Parameter Store, for the specific use case of safely rolling out a configuration change to a live application fleet?",o:["They are functionally identical with no meaningful differences for this use case","AppConfig provides native staged/gradual rollout with bake time and CloudWatch alarm-based automatic rollback for configuration changes, a safety model Parameter Store does not natively provide","Parameter Store natively provides staged rollout and alarm-based rollback, while AppConfig does not","Neither service can be used for configuration management of any kind"],a:[1],e:"AppConfig natively provides staged rollout and alarm-based automatic rollback for configuration changes; Parameter Store does not."},
{q:"An AppConfig deployment is underway using a linear strategy, and a CloudWatch alarm tied to the deployment's environment enters ALARM state partway through the rollout. Assuming automatic rollback is configured, what is the expected behavior?",o:["AppConfig ignores the alarm and completes the rollout to 100% of the fleet","AppConfig halts the deployment and automatically reverts fetching clients to the prior known-good configuration value","AppConfig requires a human to manually intervene before any rollback can occur, even with automatic rollback configured","The alarm has no defined relationship to AppConfig deployments under any configuration"],a:[1],e:"With automatic rollback configured, an alarm trip halts the deployment and reverts clients to the prior known-good configuration."},
{q:"Which of the following is the correct relationship between an AppConfig \"application,\" \"environment,\" and \"configuration profile\"?",o:["An application is a logical namespace that can contain multiple environments (such as beta and prod) and multiple configuration profiles (pointers to specific configuration data, such as a feature-flag document)","An environment is always a physical AWS Region, with no other meaning","A configuration profile is only usable by a single environment ever, across all AppConfig accounts globally","Applications, environments, and configuration profiles are interchangeable terms for the same object"],a:[0],e:"An application is a namespace containing multiple environments and multiple configuration profiles pointing to specific configuration data."},
{q:"A retail company wants to reject any configuration update that sets a numeric \"maxCartItems\" value below zero, before that update is ever allowed to reach production. Which AppConfig feature is designed to enforce this kind of business-rule validation prior to deployment?",o:["An AppConfig deployment strategy","An AppConfig validator, implemented as a JSON Schema constraint or a custom Lambda function","A CodeDeploy ValidateService hook","A CodeBuild pre_build phase"],a:[1],e:"A validator (JSON Schema or Lambda function) enforces business-rule constraints like a minimum value before deployment is allowed."},
{q:"Which two of the following are accurate characteristics of AWS AppConfig? (Select TWO)",o:["Configuration changes deployed through AppConfig do not require redeploying application code or restarting the running process","AppConfig deployments can use a bake time after reaching full rollout, during which monitored alarms can still trigger an automatic rollback","AppConfig can only be used with Amazon EC2 instances and has no Lambda-specific integration","AppConfig configuration profiles cannot have any validation applied to them","AppConfig requires every configuration change to go through a full CodePipeline execution"],a:[0,1],multi:true,e:"Configuration changes don't require redeploying code or restarting processes, and a bake time after rollout still allows alarm-triggered rollback."},
{q:"A development team is deciding whether a particular change belongs in a CodeDeploy-orchestrated release or an AppConfig-orchestrated configuration rollout. The change in question flips an already-deployed, dormant 'if' branch in the running application code from disabled to enabled. Which service is the better fit for making this specific change?",o:["AWS CodeDeploy, since any behavioral change must always go through a full code deployment","AWS AppConfig, since the code implementing the new behavior is already deployed and only the runtime flag controlling it needs to change","AWS CodeArtifact, since this is fundamentally a dependency-management concern","AWS CodeStar, since it is required for any behavioral change"],a:[1],e:"Since the code is already deployed and dormant, only the runtime flag needs to change — AppConfig's exact use case."},
{q:"Which of the following best describes the purpose of AppConfig's \"bake time\" concept within a deployment strategy?",o:["It defines how long the build phase of a CodeBuild project is allowed to run","It defines an observation window, after a rollout step (or after reaching full deployment), during which the deployment is still monitored and can still be automatically rolled back if a tied alarm trips","It is the amount of time before a configuration profile is permanently deleted","It refers to the time CodeArtifact takes to cache a new package version"],a:[1],e:"Bake time is the post-step observation window during which a tied alarm can still trigger an automatic rollback."},
{q:"A company is deciding between a plain Parameter Store SecureString parameter and an AppConfig configuration profile for storing a value that controls a gradual, monitored feature rollout across a fleet of application instances, with automatic rollback if error rates spike during the rollout. Which choice correctly matches the stated requirement?",o:["Parameter Store, because SecureString values are inherently safer for any use case","AppConfig, because it natively supports staged/gradual deployment strategies and alarm-based automatic rollback for exactly this kind of monitored rollout, which Parameter Store does not natively provide","Either choice is functionally identical for this specific requirement","Neither service supports any form of configuration rollout"],a:[1],e:"AppConfig natively supports the staged, alarm-monitored rollout described; Parameter Store has no equivalent native capability."},
{q:"Which two of the following are valid formats or sources AppConfig configuration profile data can take? (Select TWO)",o:["A free-form configuration document, such as JSON or YAML, authored and stored as the configuration data","A feature-flag-specific configuration profile representing on/off (or more complex) flag data","A live, unmodifiable snapshot of the entire AWS account's billing history","A direct binary copy of an EC2 AMI","A CodeCommit approval rule template"],a:[0,1],multi:true,e:"Free-form JSON/YAML configuration documents and feature-flag-specific profiles are both valid AppConfig configuration profile data types."},
{q:"A company's Lambda function begins consistently returning malformed responses shortly after an AppConfig configuration deployment reaches 100% of the fleet, but the associated CloudWatch alarm was scoped only to a metric that doesn't reflect this particular failure mode, so it never entered ALARM state. What does this scenario illustrate about AppConfig's automatic rollback safety net?",o:["AppConfig will always detect and roll back any bad configuration regardless of alarm scope","The automatic rollback safety net is only as effective as the CloudWatch alarms actually configured and tied to the deployment — a failure mode not covered by any tied alarm will not trigger an automatic rollback","AppConfig deployments cannot fail in any way once they reach 100%","This scenario is impossible because AppConfig does not use CloudWatch alarms"],a:[1],e:"Automatic rollback only responds to alarms actually tied to the deployment; an uncovered failure mode won't trigger a rollback."},
{q:"A company's release process is: a developer pushes to CodeCommit, which triggers CodePipeline; CodePipeline runs a CodeBuild project that lints, tests, and packages the application using a buildspec.yml that references a database password from Secrets Manager; the built artifact is deployed to a staging deployment group via CodeDeploy; a manual approval action (notifying approvers via SNS) gates the next stage; and finally the artifact is deployed to production via CodeDeploy using a blue/green strategy with alarm-based automatic rollback. Which AWS service is responsible for orchestrating the overall sequence of these stages?",o:["AWS CodeBuild","AWS CodePipeline","AWS CodeArtifact","AWS AppConfig"],a:[1],e:"CodePipeline is the orchestrator sequencing the source, build, staging deploy, approval, and production deploy stages described."},
{q:"In the pipeline described in the previous scenario, which service is directly responsible for pulling the database password referenced in the buildspec.yml at build time, and which service is directly responsible for executing the blue/green traffic shift with alarm-based rollback in production?",o:["CodeArtifact pulls the secret; CodePipeline executes the traffic shift","CodeBuild resolves the Secrets Manager reference at build time; CodeDeploy executes the blue/green deployment and its alarm-based rollback","CodeCommit resolves the secret; CodeArtifact executes the traffic shift","AppConfig resolves the secret; CodeStar executes the traffic shift"],a:[1],e:"CodeBuild resolves the Secrets Manager reference at build time; CodeDeploy executes the blue/green shift and its alarm-based rollback."},
{q:"A company wants to add a step to its existing pipeline so that, before every build, dependencies are resolved from a centrally governed, IAM-authenticated package repository that also caches packages from the public npm registry to protect against upstream outages. Which AWS service should be integrated into the CodeBuild install phase to satisfy this?",o:["AWS CodeArtifact, authenticated via aws codeartifact login within the buildspec's install phase","AWS CodeStar, with no further buildspec changes","AWS AppConfig, referenced as a buildspec artifacts setting","Amazon Route 53, configured as a private hosted zone"],a:[0],e:"CodeArtifact, authenticated via aws codeartifact login in the install phase, provides governed, cached dependency resolution."},
{q:"A company running a Lambda-based checkout service wants two independent safety mechanisms active during any change: one that gradually shifts traffic to a new Lambda function version with an automatic rollback if error-rate alarms trip, and a separate one that allows a feature flag inside that same code to be toggled and gradually rolled out to a percentage of users with its own independent alarm-based rollback, without needing a new Lambda deployment for the flag change. Which two AWS services respectively provide these two mechanisms? (Select TWO)",o:["AWS CodeDeploy, for the gradual Lambda version traffic shift with rollback","AWS AppConfig, for the gradual feature-flag rollout with rollback, independent of a code deployment","AWS CodeArtifact, for the gradual Lambda version traffic shift with rollback","AWS CodeCommit, for the gradual feature-flag rollout with rollback","AWS CodeStar, for both mechanisms simultaneously"],a:[0,1],multi:true,e:"CodeDeploy handles the gradual Lambda version traffic shift with rollback; AppConfig handles the independent feature-flag rollout with rollback."},
{q:"A security review of a company's CI/CD setup finds: a CodeBuild project with a production database password stored as a plaintext environment variable in the console, a CodePipeline production Deploy stage with no manual approval action before it, a CodeDeploy deployment group with no CloudWatch alarm or automatic rollback configured, and engineers using long-lived IAM user access keys copy-pasted into local '.npmrc' files to reach a private package feed. Which combination of changes most directly addresses all four findings?",o:["Reference the password from Secrets Manager in the buildspec instead of a plaintext variable, add a manual approval action before the production Deploy stage, configure a CloudWatch alarm with automatic rollback on the deployment group, and move the private package feed to CodeArtifact authenticated via short-lived tokens instead of long-lived keys","Delete the CodePipeline pipeline entirely and perform all deployments manually going forward","Only fix the plaintext password; the other three findings are acceptable operational tradeoffs","Rotate the IAM access keys more frequently, but leave the other three findings unaddressed"],a:[0],e:"Referencing the secret properly, adding an approval gate, configuring alarm-based rollback, and moving to CodeArtifact with short-lived tokens address all four findings."},
{q:"A company wants to design a release process for a Lambda-based service where: code changes go through full build/test/deploy automation with a canary traffic shift and alarm-based rollback, while separate, lower-risk configuration tweaks (such as adjusting a rate limit or toggling a flag) can be rolled out by a different team, on a different cadence, without waiting for or triggering the full CI/CD pipeline. Which architecture correctly separates these two concerns?",o:["Route both code changes and configuration tweaks through the same CodePipeline pipeline and CodeDeploy deployment, since AWS provides no way to separate them","Use CodePipeline/CodeBuild/CodeDeploy with a Lambda canary configuration for code changes, and use AppConfig (with its own deployment strategy and alarm) for the independent configuration/flag changes, decoupling the two release cadences entirely","Use CodeArtifact for both code changes and configuration tweaks","Use CodeStar exclusively, since it removes the need for any other service"],a:[1],e:"CodePipeline/CodeBuild/CodeDeploy with Lambda canary handles code changes, while AppConfig independently handles configuration/flag changes on its own cadence."},
{q:"Reflecting on this module as a whole, which single statement best captures the unifying theme across CodeCommit, CodeBuild, CodeDeploy, CodePipeline, CodeArtifact, and AppConfig as tested on the DVA-C02 exam?",o:["Each service is tested in total isolation, with no scenario ever requiring understanding of how they work together","These services form a composable toolchain — source control, build, deploy, orchestration, dependency management, and configuration rollout — where the exam consistently tests recognizing which specific service (and which specific mechanism within it, such as a buildspec phase, an appspec hook, or a deployment strategy) correctly matches a given requirement, especially around safe, gradual, and reversible delivery of both code and configuration","Only CodePipeline matters for the exam; the other services are never independently tested","None of these services are relevant to the DVA-C02 exam, which focuses exclusively on application code"],a:[1],e:"The exam consistently tests matching a scenario's requirement to the specific service and mechanism enabling safe, gradual, reversible delivery of code and configuration."}

let idx = 0, score = 0, answered = new Array(QUESTIONS.length).fill(false), correctFlags = new Array(QUESTIONS.length).fill(false), missed = [];
const STORAGE_KEY = "aws-dva-quiz-10";

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({idx, score, answered, correctFlags}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.answered) && d.answered.length === QUESTIONS.length){
      idx = d.idx; score = d.score; answered = d.answered; correctFlags = d.correctFlags;
      return true;
    }
  }catch(e){}
  return false;
}

const quizArea = document.getElementById("quizArea");
const posNum = document.getElementById("posNum");
const scoreNum = document.getElementById("scoreNum");
const progressFill = document.getElementById("progressFill");

function updateTop(){
  posNum.textContent = (idx+1) + " / " + QUESTIONS.length;
  scoreNum.textContent = score;
  const answeredCount = answered.filter(Boolean).length;
  progressFill.style.width = (answeredCount / QUESTIONS.length * 100) + "%";
}

function renderQuestion(){
  const item = QUESTIONS[idx];
  const isMulti = !!item.multi;
  const done = answered[idx];
  let html = "";
  html += '<div class="card">';
  html += '<div class="qnum">Question ' + (idx+1) + '</div>';
  if(isMulti) html += '<div class="multi-hint">Select all that apply</div><br>';
  html += '<div class="qtext">' + escapeHtml(item.q) + '</div>';
  item.o.forEach((optText, i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = "opt";
    if(done){
      if(item.a.includes(i)) cls += " correct";
      else if(item.picked && item.picked.includes(i)) cls += " incorrect";
    } else if(item.picked && item.picked.includes(i)){
      cls += " selected";
    }
    html += '<button class="' + cls + '" data-i="' + i + '" ' + (done?'disabled':'') + '>' +
      '<span class="mark">' + letter + '</span><span>' + escapeHtml(optText) + '</span></button>';
  });
  if(done){
    html += '<div class="explain"><b>' + (correctFlags[idx] ? "Correct. " : "Not quite. ") + '</b>' + escapeHtml(item.e) + '</div>';
  }
  html += '<div class="actions">';
  if(isMulti && !done){
    html += '<button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>';
  }
  if(done){
    if(idx < QUESTIONS.length - 1){
      html += '<button class="btn btn-primary" id="nextBtn">Next question</button>';
    } else {
      html += '<button class="btn btn-primary" id="finishBtn">See results</button>';
    }
  }
  html += '<button class="btn btn-ghost" id="resetBtn">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  updateTop();
  wireOptions(item, isMulti, done);
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function wireOptions(item, isMulti, done){
  const opts = quizArea.querySelectorAll(".opt");
  opts.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(done) return;
      const i = parseInt(btn.dataset.i, 10);
      if(isMulti){
        item.picked = item.picked || [];
        const pos = item.picked.indexOf(i);
        if(pos >= 0) item.picked.splice(pos,1); else item.picked.push(i);
        renderQuestion();
        const submitBtn = document.getElementById("submitBtn");
        if(submitBtn) submitBtn.disabled = !(item.picked && item.picked.length > 0);
      } else {
        item.picked = [i];
        commitAnswer(item);
      }
    });
  });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn){
    submitBtn.disabled = !(item.picked && item.picked.length > 0);
    submitBtn.addEventListener("click", ()=> commitAnswer(item));
  }
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ idx++; save(); renderQuestion(); });
  const finishBtn = document.getElementById("finishBtn");
  if(finishBtn) finishBtn.addEventListener("click", renderSummary);
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", resetAll);
}

function commitAnswer(item){
  if(answered[idx]) return;
  answered[idx] = true;
  const correct = item.picked.length === item.a.length && item.picked.every(p => item.a.includes(p));
  correctFlags[idx] = correct;
  if(correct) score++; else missed.push(idx);
  save();
  renderQuestion();
}

function renderSummary(){
  const pct = Math.round(score / QUESTIONS.length * 100);
  const passed = pct >= 72;
  let html = '<div class="card summary">';
  html += '<div class="eyebrow">Results</div>';
  html += '<div class="score-big">' + score + ' / ' + QUESTIONS.length + '</div>';
  html += '<div class="score-pct ' + (passed?'pass':'fail') + '">' + pct + '% — ' + (passed ? "Solid, above the ~72% pass bar" : "Below the ~72% pass bar — revisit the notes") + '</div>';
  const missedList = answered.map((_,i)=>i).filter(i => !correctFlags[i]);
  if(missedList.length){
    html += '<div class="miss-list"><h3>Review these questions</h3>';
    missedList.forEach(i=>{
      html += '<div class="miss-item"><b>Q' + (i+1) + '.</b> ' + escapeHtml(QUESTIONS[i].q) + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="actions" style="justify-content:center; margin-top:22px;">';
  html += '<button class="btn btn-primary" id="restartBtn">Restart quiz</button>';
  html += '<button class="btn btn-ghost" id="resetBtn2">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  document.getElementById("restartBtn").addEventListener("click", resetAll);
  document.getElementById("resetBtn2").addEventListener("click", resetAll);
}

function resetAll(){
  idx = 0; score = 0; missed = [];
  answered = new Array(QUESTIONS.length).fill(false);
  correctFlags = new Array(QUESTIONS.length).fill(false);
  QUESTIONS.forEach(q => { delete q.picked; });
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderQuestion();
}

document.addEventListener("keydown", (e)=>{
  const map = {"1":0,"2":1,"3":2,"4":3,"5":4,"a":0,"b":1,"c":2,"d":3,"e":4,"A":0,"B":1,"C":2,"D":3,"E":4};
  if(e.key in map){
    const opts = quizArea.querySelectorAll(".opt:not(:disabled)");
    const i = map[e.key];
    if(opts[i]) opts[i].click();
  } else if(e.key === "Enter"){
    const nb = document.getElementById("nextBtn") || document.getElementById("finishBtn") || document.getElementById("submitBtn");
    if(nb && !nb.disabled) nb.click();
  }
});

if(load()){
  if(answered.every(Boolean)) renderSummary(); else renderQuestion();
} else {
  renderQuestion();
}
</script>

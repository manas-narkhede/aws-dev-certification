<title>CI/CD & Developer Tooling Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eceeec; --ink:#141a1f; --muted:#5c6670;
  --border:#dde1de; --accent:#0d7377; --accent-ink:#ffffff; --accent-soft:#e3f1f0;
  --success:#1f8a44; --success-bg:#e5f6ea; --success-border:#a9dfb8;
  --danger:#c8402f; --danger-bg:#fbe9e6; --danger-border:#f0b8ac;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151a; --surface:#171e25; --surface-2:#1d252c; --ink:#edf1f3; --muted:#93a3ac;
    --border:#2b343c; --accent:#37c9c2; --accent-ink:#08211f; --accent-soft:#173430;
    --success:#5fd489; --success-bg:#123321; --success-border:#256b45;
    --danger:#f38672; --danger-bg:#3a1c17; --danger-border:#7a3226;
  }
}
:root[data-theme="dark"]{
  --bg:#10151a; --surface:#171e25; --surface-2:#1d252c; --ink:#edf1f3; --muted:#93a3ac;
  --border:#2b343c; --accent:#37c9c2; --accent-ink:#08211f; --accent-soft:#173430;
  --success:#5fd489; --success-bg:#123321; --success-border:#256b45;
  --danger:#f38672; --danger-bg:#3a1c17; --danger-border:#7a3226;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:"Public Sans",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 80px;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600;}
h1{font-size:22px; font-weight:800; margin:4px 0 18px; text-wrap:balance; letter-spacing:-.01em;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap;}
.stat{display:flex; flex-direction:column; align-items:flex-end;}
.stat .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:18px; font-weight:600;}
.stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
.progress-track{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin:14px 0 28px; border:1px solid var(--border);}
.progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .35s ease;}
@media (prefers-reduced-motion: reduce){ .progress-fill{transition:none;} }

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.qnum{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:10px;}
.qtext{font-size:16.5px; font-weight:600; line-height:1.55; margin-bottom:20px; text-wrap:balance;}
.multi-hint{display:inline-block; font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 10px; margin-bottom:14px;}

.opt{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:13px 14px; margin-bottom:10px; cursor:pointer; font:inherit; color:var(--ink); font-size:14.5px; line-height:1.5; transition:border-color .15s, background .15s;}
.opt:hover{border-color:var(--accent);}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.opt .mark{flex:0 0 22px; height:22px; border-radius:6px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; color:var(--muted); margin-top:1px;}
.opt.selected{border-color:var(--accent); background:var(--accent-soft);}
.opt.selected .mark{border-color:var(--accent); color:var(--accent);}
.opt.correct{border-color:var(--success-border); background:var(--success-bg);}
.opt.correct .mark{border-color:var(--success); color:var(--success); background:var(--success-bg);}
.opt.incorrect{border-color:var(--danger-border); background:var(--danger-bg);}
.opt.incorrect .mark{border-color:var(--danger); color:var(--danger); background:var(--danger-bg);}
.opt:disabled{cursor:default;}
.opt:disabled:hover{border-color:var(--border);}
.opt.correct:hover, .opt.incorrect:hover{border-color:inherit;}

.actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
button.btn{font:inherit; font-weight:700; font-size:14px; border-radius:9px; padding:11px 18px; cursor:pointer; border:1.5px solid transparent;}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--accent);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.explain{margin-top:16px; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.55; border:1px solid var(--border); background:var(--surface-2);}
.explain b{color:var(--accent);}

.summary{text-align:center; padding:10px 0 20px;}
.score-big{font-family:"IBM Plex Mono",monospace; font-size:52px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.score-pct{color:var(--muted); font-size:15px; margin-top:2px;}
.pass{color:var(--success);} .fail{color:var(--danger);}
.miss-list{text-align:left; margin-top:22px; border-top:1px solid var(--border); padding-top:18px;}
.miss-list h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;}
.miss-item{font-size:14px; padding:8px 0; border-bottom:1px dashed var(--border);}
.miss-item b{font-family:"IBM Plex Mono",monospace;}

.footer-note{text-align:center; color:var(--muted); font-size:12px; margin-top:22px;}
</style>

<script>
const QUESTIONS = [
{q:"A startup wants to host private Git repositories for its application source code without operating its own Git server, and wants repository access controlled through the same identity system already used for every other AWS resource in the account. Which AWS service and access model satisfies this?",o:["GitHub Enterprise Server running on a self-managed EC2 instance","AWS CodeCommit, with access controlled entirely through IAM policies","Amazon S3 versioning used as a substitute for Git","AWS CodeArtifact configured as a source repository"],a:[1],e:"CodeCommit provides managed private Git hosting with access governed entirely by IAM policies."},
{q:"A developer needs to push and pull from a CodeCommit repository using a standard Git HTTPS client, but does not want to use their IAM console password or long-term access keys for this purpose. Which credential type should they generate?",o:["A CloudFront signed URL","IAM-generated HTTPS Git credentials, a username/password pair scoped specifically to Git operations","A root user access key","A CodeArtifact authorization token"],a:[1],e:"IAM-generated HTTPS Git credentials are a dedicated username/password pair for Git operations, distinct from console or API credentials."},
{q:"A CI/CD pipeline runner already operates under an IAM role and needs to clone a CodeCommit repository without provisioning or storing any separate Git credentials (HTTPS or SSH) for the operation. Which approach lets the runner authenticate using its existing IAM role directly?",o:["git-remote-codecommit, which uses the caller's existing IAM credentials directly for Git operations","Generating a new IAM user with console access for the pipeline","Embedding the root user's access keys in the buildspec","Disabling authentication on the repository entirely"],a:[0],e:"git-remote-codecommit lets a caller authenticate with their existing IAM credentials/role directly, no separate Git credential needed."},
{q:"A team wants every push to the 'main' branch of their CodeCommit repository to automatically start a CodePipeline execution, with minimal latency between the commit and the pipeline starting, and without the pipeline having to continuously poll the repository. Which mechanism achieves this in the modern, recommended configuration?",o:["A scheduled CloudWatch cron job that checks the repository every hour","An Amazon EventBridge rule that reacts to the repository's push event and starts the pipeline","A manual click of \"Release change\" in the console after every commit","An AWS Config rule evaluating repository compliance"],a:[1],e:"An EventBridge rule reacting to the repository's push event starts the pipeline automatically without polling."},
{q:"A team wants to require at least two engineers to approve a pull request in CodeCommit before it can be merged into a protected branch. Which CodeCommit feature enforces this?",o:["A resource-based bucket policy","An approval rule template attached to the repository","A CodeBuild buildspec validation phase","An AppConfig validator"],a:[1],e:"Approval rule templates enforce a minimum number of approvers on pull requests before merge."},
{q:"Which of the following authentication methods is natively supported for connecting a standard Git client to an AWS CodeCommit repository?",o:["SSH keys uploaded to an IAM user, or IAM-generated HTTPS Git credentials","A shared repository-wide password distributed by email","OAuth tokens issued by a third-party identity provider with no IAM involvement","Anonymous, unauthenticated HTTPS access enabled by default"],a:[0],e:"SSH keys uploaded to an IAM user and IAM-generated HTTPS Git credentials are CodeCommit's supported authentication methods."},
{q:"A company migrating from a self-hosted GitLab server wants a private, managed Git hosting option with the least possible ongoing operational overhead, while keeping repository permissions fully auditable through their existing IAM policies and CloudTrail logs. Which choice best satisfies both requirements?",o:["A larger self-hosted GitLab instance on a Reserved Instance","AWS CodeCommit","A public GitHub repository with branch protection rules","An S3 bucket storing zipped source snapshots"],a:[1],e:"CodeCommit offers managed, low-overhead private Git hosting fully governed by IAM and logged via CloudTrail."},
{q:"A security engineer reviewing CodeCommit access wants to confirm that a departed employee's ability to push and pull code was fully revoked. Where should this be verified, given that CodeCommit has no separate user directory of its own?",o:["In CodeCommit's own standalone user management console","In IAM — by reviewing and removing the departed employee's IAM user, its HTTPS Git credentials, and any uploaded SSH public keys","In the CodeBuild service role","In the CodeArtifact domain policy"],a:[1],e:"Since CodeCommit has no separate user directory, access is fully controlled and revoked through IAM."},
{q:"A team wants to notify a Slack channel via an SNS topic whenever a new branch is created in their CodeCommit repository, independent of any CodePipeline execution. Which CodeCommit capability supports sending this kind of event notification?",o:["CodeCommit triggers, which can invoke SNS notifications or Lambda functions on repository events such as branch creation","A CodeBuild post_build phase","A CodeDeploy ValidateService hook","An AppConfig deployment strategy"],a:[0],e:"CodeCommit triggers can invoke SNS notifications or Lambda functions on events like branch creation."},
{q:"Which two of the following statements about AWS CodeCommit are accurate? (Select TWO)",o:["Repository access is granted through IAM identity-based policies referencing CodeCommit actions such as codecommit:GitPull and codecommit:GitPush","CodeCommit maintains its own independent user and password system separate from IAM","A CodePipeline source stage can be configured to trigger automatically when a commit lands on a specified branch","CodeCommit repositories cannot support multiple branches simultaneously","SSH access to CodeCommit requires disabling IAM entirely for the account"],a:[0,2],multi:true,e:"Access is governed by IAM actions like codecommit:GitPull/GitPush, and a source stage can trigger automatically on a branch commit."},
{q:"A company wants to migrate its existing GitHub-hosted source code into a CodePipeline-based release process without first moving the repository itself into CodeCommit. Which statement about CodePipeline source options is accurate?",o:["CodePipeline can only source from CodeCommit; GitHub is never supported as a source provider","CodePipeline can source directly from a GitHub repository via a CodeStar Connection, without requiring the code to first live in CodeCommit","GitHub repositories must be manually zipped and uploaded to S3 before CodePipeline can use them","CodePipeline requires converting the GitHub repository's history into CodeArtifact packages first"],a:[1],e:"CodePipeline supports GitHub as a source provider via a CodeStar Connection, no CodeCommit migration required."},
{q:"Which two of the following are legitimate ways a CodeCommit repository event can be surfaced to other systems? (Select TWO)",o:["An SNS notification triggered by a repository event such as a push","An EventBridge rule matching a CodeCommit repository state-change event, used to start a CodePipeline execution","A DynamoDB Stream attached directly to the repository","A Route 53 health check monitoring repository push activity","An ACM certificate renewal event tied to the repository"],a:[0,1],multi:true,e:"SNS notifications via triggers and EventBridge rules matching repository events are both legitimate ways to surface events."},
{q:"A developer accidentally committed a plaintext database password to a CodeCommit repository's main branch several commits ago, and it has since been merged into multiple downstream branches. What is the most correct characterization of how to remediate this from a security standpoint?",o:["Simply deleting the file in a new commit fully removes the exposed credential from all history and no further action is needed","The credential must be treated as compromised and rotated immediately (e.g., in Secrets Manager), in addition to any history-cleanup effort, since prior commits may already be cloned or cached elsewhere","CodeCommit automatically scrubs credentials from history the moment a new commit is pushed","Because CodeCommit is private, an exposed credential in the repository poses no real risk","Rotating the credential is unnecessary since git history rewriting alone always fully solves the issue"],a:[1],e:"An exposed credential must be treated as compromised and rotated immediately, regardless of any history cleanup."},
{q:"A team wants pipeline executions triggered only when changes are pushed to release branches matching a specific naming pattern (e.g., 'release/*'), rather than on every branch. Which capability supports this kind of selective, pattern-based source triggering for a CodePipeline sourced from CodeCommit?",o:["CodePipeline source triggers can be scoped to specific branches or, in newer trigger configurations, branch name filters, rather than firing on every branch equally","CodeCommit repositories can only ever have one branch, making this moot","This requires a fully separate repository per branch","Branch-based trigger filtering is not possible under any circumstance in CodePipeline"],a:[0],e:"CodePipeline source triggers can be scoped to specific branches or branch name filters, not just \"every branch.\""},
{q:"A team's buildspec.yml needs to install required npm packages, run unit tests before compiling, transpile the TypeScript source, and then upload a test report to S3, in that specific order. Which four buildspec phases, used in the standard order, map to these four steps?",o:["build, install, post_build, pre_build","install, pre_build, build, post_build","pre_build, install, post_build, build","post_build, build, pre_build, install"],a:[1],e:"The standard order is install, pre_build, build, post_build, matching the described install/test/build/upload sequence."},
{q:"A CodeBuild project's build phase fails partway through due to a compilation error, but the team still wants a notification command in post_build to run so the team is alerted regardless of the failure. What is the actual behavior of the post_build phase in this situation?",o:["post_build commands are skipped entirely whenever the build phase fails","post_build commands still run even after a build-phase failure, though the overall build is still reported as failed","The entire CodeBuild project is permanently disabled after any build-phase failure","post_build only runs if every previous phase, including build, succeeded with zero warnings"],a:[1],e:"post_build commands still execute after a build-phase failure, though the overall build remains marked failed."},
{q:"A team wants to pin a specific Node.js runtime version for a CodeBuild project using one of AWS's managed build images, without creating and maintaining a custom Docker image. Where in the buildspec is this configured?",o:["In the artifacts section, under discard-paths","In the install phase, using the runtime-versions setting","In the cache section, under paths","In the env section, under exported-variables"],a:[1],e:"runtime-versions is configured within the install phase to pin a managed image's runtime version."},
{q:"A CodeBuild project needs to build and push a Docker image to Amazon ECR as part of its build phase, which requires running the Docker daemon inside the build container itself. Which CodeBuild project setting must be enabled for this to succeed?",o:["Privileged mode","VPC connectivity","Local caching","A larger compute type only, with no other change needed"],a:[0],e:"Privileged mode must be enabled for a CodeBuild project to run Docker itself inside the build container."},
{q:"A buildspec needs to inject a database password into the build environment without ever exposing the plaintext value in the CodeBuild console's environment variable list or in build logs as a stored setting. Which buildspec mechanism is designed for this?",o:["Defining the password as a plaintext value under env: variables","Referencing the secret under env: secrets-manager, pulling the value directly from AWS Secrets Manager at build time","Hardcoding the password directly into the build commands","Storing the password in the artifacts section"],a:[1],e:"Referencing the value under env: secrets-manager pulls it directly from Secrets Manager at build time, avoiding console/plaintext exposure."},
{q:"A CodeBuild project's service role needs the minimum permissions necessary to pull a specific parameter referenced under a buildspec's parameter-store section. Which IAM action should be granted, scoped to that specific parameter path?",o:["ssm:GetParameters","secretsmanager:GetSecretValue","codecommit:GitPull","codedeploy:CreateDeployment"],a:[0],e:"ssm:GetParameters is the action needed to retrieve values referenced under a buildspec's parameter-store section."},
{q:"A team notices their CodeBuild project's build duration is dominated by re-downloading the same npm dependencies on every single build, even though the dependency versions rarely change between commits. Which CodeBuild feature most directly addresses this?",o:["Increasing the compute type to the largest available size","Enabling caching (e.g., S3 or local caching) for the node_modules directory between builds","Switching the source provider from CodeCommit to S3","Disabling the install phase entirely"],a:[1],e:"Enabling caching for the dependency directory avoids re-downloading unchanged dependencies on every build."},
{q:"Which two of the following are valid CodeBuild caching approaches for speeding up dependency resolution across builds? (Select TWO)",o:["Amazon S3 caching, where CodeBuild uploads and downloads cache contents to/from a specified S3 location between builds","Local caching, where cache contents persist on the build host itself when the same host happens to be reused","Caching directly inside the CodeCommit repository as committed binary files","A CodeDeploy deployment group cache","An API Gateway response cache applied to the build project"],a:[0,1],multi:true,e:"S3 caching and local (host-persisted) caching are both valid CodeBuild caching approaches."},
{q:"A CodeBuild project needs tooling and dependencies that none of AWS's managed build images provide out of the box. Which CodeBuild capability allows the build to run inside an environment tailored exactly to the team's needs?",o:["A custom Docker image, hosted in Amazon ECR or another supported registry, used as the build environment","A larger managed compute type, which automatically includes any tooling","A CodeArtifact upstream repository","An AppConfig configuration profile"],a:[0],e:"A custom Docker image, hosted in a registry like ECR, lets the build run with exactly the tooling required."},
{q:"In a buildspec.yml, which section determines exactly which files CodeBuild packages into the output artifact, and from which base directory?",o:["The phases section","The artifacts section, using files and base-directory","The env section","The cache section"],a:[1],e:"The artifacts section, via files and base-directory, determines what gets packaged into the output artifact."},
{q:"A developer reviews a CodeBuild project's build logs and notices that a teammate had, for convenience during debugging, temporarily set a real production API key as a plaintext environment variable directly in the CodeBuild console. What is the primary security concern with this practice?",o:["There is no concern, since CodeBuild environment variables are automatically encrypted and inaccessible to anyone","Plaintext environment variables configured this way may be visible to anyone with read access to the CodeBuild project configuration or build logs, unlike a secret referenced from Secrets Manager","CodeBuild automatically rejects any environment variable resembling an API key","This only matters if the project uses a custom Docker image"],a:[1],e:"Plaintext console environment variables are visible to anyone with read access to the project, unlike a Secrets Manager reference."},
{q:"A CodeBuild project must run automated tests requiring both Python 3.11 and a specific version of a proprietary internal testing tool that is not available in any AWS-managed image nor easily installable via a script. What is the most direct way to satisfy this requirement?",o:["Split the build into two entirely separate AWS accounts","Build and use a custom Docker image containing the required tool and runtime, and reference it as the CodeBuild project's build environment","Use only the install phase's runtime-versions setting, since it can install any arbitrary third-party tool","Switch to CodeDeploy instead of CodeBuild for this build step"],a:[1],e:"A custom Docker image can bundle a specific runtime plus a proprietary tool unavailable in managed images or via simple install scripts."},
{q:"Which of the following buildspec sections is used to reference values stored in Systems Manager Parameter Store so that they are available as environment variables during the build, without hardcoding them in the file?",o:["artifacts","cache","env, under the parameter-store subsection","phases, under install"],a:[2],e:"The env section's parameter-store subsection maps buildspec variables to Parameter Store values."},
{q:"A company wants its CodeBuild service role scoped as narrowly as possible while still allowing a specific project to pull one named secret from Secrets Manager referenced in its buildspec. Which principle does this reflect, and what should the policy's Resource element be scoped to?",o:["Least privilege — the policy should grant secretsmanager:GetSecretValue scoped to that specific secret's ARN, not a wildcard across all secrets","Maximum privilege — the role should be granted full SecretsManagerFullAccess for simplicity","The service role does not need any Secrets Manager permissions if the secret is referenced by name","The secret should instead be embedded directly in the buildspec.yml file committed to source control"],a:[0],e:"Least privilege means scoping secretsmanager:GetSecretValue to the specific secret ARN needed, not a wildcard."},
{q:"A CodeBuild project's pre_build phase is used to run linting and unit tests, and the team wants the overall build to stop and be marked failed if any test fails, before the build phase even begins compiling. What causes a CodeBuild phase to be treated as failed?",o:["Only the final phase's exit code is ever evaluated","Any phase whose commands return a non-zero exit code causes that phase (and by default the overall build) to be marked as failed","CodeBuild ignores exit codes entirely and always reports success","A failure can only occur in the build phase, never in pre_build"],a:[1],e:"Any phase's commands returning a non-zero exit code marks that phase, and by default the build, as failed."},
{q:"Which two of the following are true regarding CodeBuild build environments? (Select TWO)",o:["AWS provides managed Docker images pre-configured with common runtimes such as Node.js, Python, and Java","A CodeBuild project can instead use a custom Docker image stored in a container registry such as Amazon ECR","CodeBuild requires every build to run on a dedicated, customer-managed EC2 instance provisioned and patched by the customer","CodeBuild build environments cannot specify a compute type or vCPU/memory class","Managed build images cannot be used for any compiled language, only interpreted ones"],a:[0,1],multi:true,e:"AWS provides managed images with common runtimes, and projects can alternatively use a custom image from a registry like ECR."},
{q:"A CodeBuild project's artifacts section specifies 'base-directory: 'dist'' and 'discard-paths: no'. What does this configuration produce in the resulting build artifact?",o:["The artifact will contain the full repository, ignoring the dist directory entirely","The artifact will contain the contents of the dist directory, preserving their internal folder structure rather than flattening it","The artifact will be empty, since discard-paths is set to no","The artifact will contain only a single randomly chosen file from dist"],a:[1],e:"With discard-paths set to no, the artifact preserves the internal folder structure of the dist directory's contents."},
{q:"A team wants to give CodeBuild network access to a private RDS database inside a VPC during the build phase, for running integration tests against it. Which CodeBuild capability is needed to allow this?",o:["Configuring the CodeBuild project with VPC connectivity — specifying the VPC, subnets, and security groups it should launch into","Enabling privileged mode","Increasing the artifacts retention period","Switching the source provider to CodeArtifact"],a:[0],e:"VPC connectivity configuration lets the CodeBuild project reach private VPC resources like an RDS database during the build."},
{q:"Which of the following is the correct general purpose of the install phase in a buildspec.yml, distinct from pre_build?",o:["install is used to install runtime versions and any global tools needed before dependency resolution and testing occur in later phases","install is where the final compiled output is always produced","install always uploads the finished artifact to S3","install is deprecated and no longer a valid buildspec phase"],a:[0],e:"The install phase is for installing runtime versions and global tools needed before later dependency resolution and testing."},
{q:"A company's CodeBuild project needs to reference a value from Secrets Manager where the secret is a JSON object containing multiple keys, and the buildspec should extract only the \"password\" key specifically. Which buildspec syntax accomplishes this?",o:["secrets-manager: DB_PASSWORD: \"myapp/prod/db-credentials:password\", referencing the specific JSON key with a colon suffix","It is not possible to reference a single key within a JSON secret; the entire secret object must always be pulled as one variable","parameter-store: DB_PASSWORD: \"myapp/prod/db-credentials:password\"","artifacts: files: \"myapp/prod/db-credentials:password\""],a:[0],e:"The secrets-manager section supports a colon-suffixed JSON key reference to extract a single field from a JSON secret."},
{q:"Which two of the following statements correctly describe how CodeBuild handles environment variables sourced from Secrets Manager or Parameter Store versus plaintext variables? (Select TWO)",o:["Secrets Manager and Parameter Store references are resolved at build start using the CodeBuild service role's permissions, keeping the actual secret value out of the project's stored configuration","Plaintext environment variables configured on the project are visible in the project configuration and are not treated as securely as a referenced secret","Referencing a secret from Secrets Manager requires disabling the buildspec entirely","Plaintext and Secrets Manager-sourced variables are cryptographically indistinguishable once the build starts, making the source irrelevant to security posture","CodeBuild requires all secrets to be stored as plaintext to be usable at all"],a:[0,1],multi:true,e:"Secret references are resolved at build start via the service role, keeping the value out of stored config; plaintext variables are visible in the project configuration."},
{q:"A build takes an unusually long time because the team's Maven-based Java project re-downloads its entire dependency tree from Maven Central on every single CodeBuild run. Beyond enabling caching for the local Maven repository directory, which additional AWS service could further improve build reliability and speed by fronting Maven Central with a managed, cached proxy?",o:["AWS CodeArtifact, configured with an upstream connection to Maven Central","AWS CodeStar","Amazon CloudFront, configured as a static website","AWS Systems Manager Parameter Store"],a:[0],e:"CodeArtifact configured with an upstream to Maven Central provides a managed, cached, more resilient proxy for Maven dependencies."},
{q:"A company deploying to a fleet of on-premises servers via CodeDeploy needs a hook that runs after new application files have been placed on the server but before the application is started, specifically to adjust file permissions and update configuration files. Which lifecycle hook is appropriate?",o:["BeforeInstall","AfterInstall","ApplicationStart","ValidateService"],a:[1],e:"AfterInstall is used to configure the application and adjust permissions after files are placed but before the app starts."},
{q:"A CodeDeploy deployment group targeting Lambda uses a canary traffic-shifting configuration. The team wants to run an automated smoke test against the new function version before any real production traffic is routed to it at all. Which appspec.yml hook should this test be attached to?",o:["BeforeInstall","AfterInstall","BeforeAllowTraffic","ApplicationStart"],a:[2],e:"BeforeAllowTraffic runs before any traffic shifts, making it the right place for pre-traffic validation."},
{q:"Which of the following correctly lists the standard CodeDeploy lifecycle event order for an in-place deployment to EC2/on-premises instances?",o:["Install, ApplicationStop, DownloadBundle, BeforeInstall, AfterInstall, ValidateService, ApplicationStart","ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart, ValidateService","ValidateService, ApplicationStart, AfterInstall, Install, BeforeInstall, DownloadBundle, ApplicationStop","DownloadBundle, ApplicationStart, BeforeInstall, Install, AfterInstall, ApplicationStop, ValidateService"],a:[1],e:"The standard in-place order is ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart, ValidateService."},
{q:"A company wants near-instant rollback capability if a newly deployed EC2 application version turns out to be faulty, and is willing to accept the additional cost of briefly running two full environments during each deployment. Which CodeDeploy deployment type best matches this priority?",o:["In-place deployment with AllAtOnce","Blue/green deployment, keeping the original environment running until traffic has fully and successfully shifted","In-place deployment with OneAtATime","A deployment with no deployment group configured"],a:[1],e:"Blue/green keeps the original environment running, enabling near-instant rollback by re-routing traffic."},
{q:"A CodeDeploy deployment group for an EC2 fleet is configured with a CloudWatch alarm monitoring the application's 5xx error rate, and automatic rollback is enabled for alarm-triggered failures. During a deployment, the alarm enters ALARM state. What happens next?",o:["CodeDeploy ignores the alarm and continues the deployment as planned","CodeDeploy automatically halts the deployment and rolls back by redeploying the last known-good revision","The alarm is logged but requires a human to manually trigger the rollback","The EC2 instances are immediately terminated with no redeployment"],a:[1],e:"With alarm-based automatic rollback enabled, an ALARM state halts the deployment and redeploys the last known-good revision."},
{q:"Which appspec.yml hook is used specifically to verify, as the final step of an EC2/on-premises in-place deployment, that the newly deployed application is functioning correctly — for example, by checking a health endpoint?",o:["BeforeInstall","ApplicationStart","ValidateService","DownloadBundle"],a:[2],e:"ValidateService is the final hook, used to confirm the deployed application is functioning correctly."},
{q:"A CodeDeploy appspec.yml for a Lambda deployment specifies Resources and Hooks sections but no files or permissions sections. Why does the Lambda appspec.yml format omit these sections that appear in the EC2/on-premises format?",o:["It is a mistake and the deployment will always fail without them","Lambda deployments have no filesystem to manage on a target server, so there are no files to copy or permissions to set — the appspec instead describes the function version/alias traffic shift","files and permissions are optional even for EC2 deployments and were never actually needed","Lambda appspec files must always be written in JSON instead of YAML"],a:[1],e:"Lambda deployments have no server filesystem to manage, so appspec.yml instead describes the function version/alias traffic shift via Resources and Hooks."},
{q:"A deployment group targets an EC2 Auto Scaling group and uses an in-place deployment strategy configured as OneAtATime. What is the practical effect of this deployment configuration during rollout?",o:["All instances in the ASG are updated simultaneously","Instances are updated one at a time, with each instance completing its deployment lifecycle before the next instance begins","Exactly half of the instances are updated, and the other half are left permanently on the old version","The ASG is deleted and recreated from scratch"],a:[1],e:"OneAtATime updates a single instance at a time, each completing its lifecycle before the next begins."},
{q:"Which of the following is true about the Hooks used in a CodeDeploy appspec.yml for an Amazon ECS deployment using blue/green traffic shifting?",o:["ECS deployments use the same BeforeInstall/AfterInstall/ApplicationStart/ValidateService hooks as EC2 deployments, unchanged","ECS deployments use traffic-shifting hooks such as BeforeAllowTraffic and AfterAllowTraffic, similar in concept to Lambda, rather than the EC2-style install hooks","ECS deployments do not support any lifecycle hooks at all","ECS deployments require a completely separate service outside of CodeDeploy"],a:[1],e:"ECS deployments use traffic-shifting hooks like BeforeAllowTraffic/AfterAllowTraffic, conceptually similar to Lambda, not the EC2-style install hooks."},
{q:"A CodeDeploy deployment group's ValidateService hook script returns a non-zero exit code during an in-place EC2 deployment. Assuming the deployment group has automatic rollback on deployment failure enabled, what is the expected outcome?",o:["The deployment is marked as failed, and automatic rollback redeploys the last known-good revision","The failing script is silently ignored and the deployment proceeds as successful","Only a warning is logged, with no impact on deployment status","The instance is left in an undefined intermediate state with no further action taken by CodeDeploy"],a:[0],e:"A non-zero ValidateService exit code marks the deployment failed, and automatic rollback (if enabled) redeploys the last known-good revision."},
{q:"Which of the following correctly distinguishes an in-place CodeDeploy deployment from a blue/green CodeDeploy deployment, for EC2/on-premises targets?",o:["In-place deploys stop, update, and restart the application on the same existing instances; blue/green provisions a new, separate set of instances and shifts traffic to them once ready","In-place and blue/green are simply two names for the exact same deployment mechanism","Blue/green deployments are only available for Lambda, never for EC2","In-place deployments always provision new instances, identical to blue/green"],a:[0],e:"In-place updates the existing instances directly; blue/green provisions a separate new set and shifts traffic once ready."},
{q:"A CodeDeploy deployment group's configuration determines which compute resources a deployment targets. For an EC2-based deployment group, which of the following can be used to identify the target instances?",o:["EC2 instance tags, or membership in a specified Auto Scaling group","A CloudFront distribution ID","A Route 53 hosted zone ID","A CodeArtifact domain name"],a:[0],e:"EC2 deployment groups can target instances by tag or by Auto Scaling group membership."},
{q:"Which two of the following statements about CodeDeploy automatic rollback are accurate? (Select TWO)",o:["A deployment group can be configured to automatically roll back when the deployment itself fails","A deployment group can be configured to automatically roll back when a specified CloudWatch alarm enters the ALARM state during or shortly after the deployment","Automatic rollback is only available for deployments targeting Lambda, never EC2","Automatic rollback requires manually re-running the entire CodePipeline pipeline from the source stage","CodeDeploy has no concept of rollback; failed deployments must always be fixed forward"],a:[0,1],multi:true,e:"Rollback can be triggered by deployment failure itself or by a tied CloudWatch alarm entering ALARM state."},
{q:"A company deploying to EC2 wants the fastest possible rollback path if a newly deployed blue/green environment shows elevated errors shortly after the traffic shift completes, without needing to redeploy any code. What makes blue/green rollback typically faster than in-place rollback in this situation?",o:["Blue/green rollback requires rebuilding the entire application from source","The original (blue) environment is generally kept running for a period after cutover, so rollback is simply re-routing traffic back to it rather than redeploying a previous revision","Blue/green deployments have no rollback capability at all","In-place deployments always roll back faster because there is only one environment involved"],a:[1],e:"The blue environment is kept running, so rollback is simply re-routing traffic back rather than redeploying a previous revision."},
{q:"A CodeDeploy deployment group for a Lambda function is configured with the deployment configuration name CodeDeployDefault.LambdaLinear10PercentEvery1Minute. What traffic-shifting behavior does this configuration describe?",o:["All traffic shifts to the new version immediately, with no gradual ramp","Traffic shifts to the new version in equal 10% increments every minute until 100% is reached","10% of traffic shifts once, and the remaining 90% never shifts","Traffic shifts only after a full 24-hour bake period"],a:[1],e:"LambdaLinear10PercentEvery1Minute shifts traffic in equal 10% increments every minute until reaching 100%."},
{q:"Which of the following is the correct purpose of the AfterAllowTraffic hook in a Lambda or ECS CodeDeploy appspec.yml?",o:["It runs before any traffic shifts to validate the new version is safe to receive traffic","It runs after all traffic has shifted to the new version, commonly used for post-deployment smoke tests or cleanup","It runs only if the deployment fails","It is exclusively used to install operating system patches"],a:[1],e:"AfterAllowTraffic runs once all traffic has shifted, commonly used for post-deployment smoke tests or cleanup."},
{q:"A team troubleshooting a failed EC2 in-place CodeDeploy deployment finds that the deployment failed during the AfterInstall lifecycle event. Which general category of task is most plausibly being performed at that stage, given its position in the lifecycle?",o:["Downloading the initial revision bundle from the deployment's origin location","Configuring the application or changing file/directory permissions after files have been installed but before the application starts","Validating that the application is fully up and serving traffic correctly","Terminating the underlying EC2 instance permanently"],a:[1],e:"AfterInstall's position (after Install, before ApplicationStart) fits configuring the app or setting permissions post-file-placement."},
{q:"Which two of the following are valid CodeDeploy compute platforms that a single deployment group is associated with? (Select TWO)",o:["EC2/On-Premises","AWS Lambda","Amazon Route 53","Amazon CloudFront","AWS Certificate Manager"],a:[0,1],multi:true,e:"EC2/On-Premises and AWS Lambda (along with ECS) are valid CodeDeploy compute platforms; Route 53, CloudFront, and ACM are not."},
{q:"A company's CodeDeploy deployment group needs permission to describe and manage the EC2 instances, Auto Scaling groups, and ELB target groups it deploys to, on the company's behalf. What AWS mechanism grants CodeDeploy these permissions?",o:["A CodeDeploy service role, an IAM role that CodeDeploy assumes, with a permissions policy scoped to the actions it needs","The root user's long-term access keys embedded in the appspec.yml","A CodeCommit approval rule template","An S3 bucket policy alone, with no IAM role involved"],a:[0],e:"A CodeDeploy service role, assumed by CodeDeploy, grants it the permissions needed to manage the target compute resources."},
{q:"A scenario describes a deployment that \"stops the application, deploys the new revision to the same fleet of instances, and restarts it, processing instances in batches.\" Which CodeDeploy deployment type and general behavior does this describe?",o:["Blue/green deployment","In-place deployment, deploying to the existing instances in batches according to the configured deployment configuration","A Lambda canary deployment","A CodeArtifact package promotion"],a:[1],e:"This describes an in-place deployment updating the existing fleet in batches per the deployment configuration."},
{q:"Which of the following is a valid reason a company might choose an in-place CodeDeploy deployment over blue/green for an EC2 fleet, despite in-place deployments generally having slower rollback?",o:["In-place deployments are always faster to roll back than blue/green under every circumstance","The company wants to avoid the additional infrastructure cost of running a full duplicate environment, even temporarily, and can tolerate the slower rollback tradeoff","In-place deployments are the only option CodeDeploy supports for EC2","In-place deployments automatically include canary traffic shifting"],a:[1],e:"Avoiding duplicate infrastructure cost, while accepting slower rollback, is a valid reason to choose in-place over blue/green."},
{q:"Which two of the following statements accurately distinguish the EC2/on-premises appspec.yml hook set from the Lambda/ECS appspec.yml hook set? (Select TWO)",o:["EC2/on-premises deployments use hooks such as BeforeInstall, AfterInstall, ApplicationStart, and ValidateService tied to installing files on a server","Lambda and ECS deployments use hooks such as BeforeAllowTraffic and AfterAllowTraffic tied to shifting traffic to a new version","Both compute platforms use the identical hook names with identical meanings","EC2/on-premises appspec files never support any hooks at all","Lambda appspec files require a files and permissions section identical to EC2"],a:[0,1],multi:true,e:"EC2/on-premises uses install-oriented hooks; Lambda/ECS use traffic-shifting hooks like BeforeAllowTraffic/AfterAllowTraffic."},
{q:"A company deploying a new Lambda function version wants only 10% of invocations to use the new version initially, followed by a wait period to observe error rates via a CloudWatch alarm, and then an immediate shift of the remaining 90% if no problems are detected. Which deployment strategy does this describe?",o:["Linear","Canary","Rolling","All-at-once with no traffic control"],a:[1],e:"A small initial percentage, a bake time, then an all-at-once shift of the remainder describes a canary deployment."},
{q:"A company deploying an updated ECS service wants traffic to shift to the new task set in equal, evenly spaced increments on a fixed schedule (for example, 20% every 3 minutes) rather than a single small initial slice followed by a big jump. Which deployment strategy fits this description?",o:["Canary","Linear","Blue/green with no traffic-shifting configuration","In-place, batch-by-batch"],a:[1],e:"Equal, evenly-paced increments on a fixed schedule describes a linear deployment."},
{q:"Comparing blue/green deployments to in-place (rolling) deployments for an EC2 fleet, which statement about rollback speed and mechanism is accurate?",o:["Blue/green rollback is generally faster because the original environment is kept running and rollback is simply re-routing traffic back to it, while in-place rollback requires redeploying the previous revision to already-updated instances","In-place rollback is always faster because fewer instances are involved","Both strategies have identical rollback speed and mechanism in all cases","Neither strategy supports any form of rollback"],a:[0],e:"Blue/green rollback re-routes to the still-running original environment; in-place rollback requires redeploying the previous revision."},
{q:"A company wants to minimize the blast radius of a bad deployment as much as possible by exposing the smallest feasible slice of users to a new version before committing to a full rollout, accepting a somewhat slower time-to-full-rollout as the tradeoff. Which deployment strategy best matches this priority?",o:["Rolling, with a large batch size","Canary, with a small initial percentage and an adequate bake time","Blue/green, with an immediate all-at-once cutover","All-at-once, with no staged exposure"],a:[1],e:"Canary, with a small initial slice and adequate bake time, minimizes blast radius before a wider commitment."},
{q:"Which of the following best describes the tradeoff a team accepts when choosing a rolling (in-place, batch-by-batch) deployment strategy for an EC2 fleet over a blue/green deployment?",o:["Rolling deployments avoid the cost of running duplicate infrastructure but have slower, more complex rollback, and both old and new versions may run simultaneously mid-deployment","Rolling deployments always cost more than blue/green deployments","Rolling deployments never allow old and new versions to coexist during rollout","Rolling deployments provide faster rollback than blue/green in every case"],a:[0],e:"Rolling avoids duplicate infrastructure cost but has slower rollback and possible mixed-version coexistence mid-rollout."},
{q:"A company's ECS service deployment uses a linear traffic-shifting configuration, and a CloudWatch alarm tied to the deployment enters ALARM state after 40% of traffic has already shifted to the new task set. What is the expected CodeDeploy behavior?",o:["The deployment ignores the alarm and completes the shift to 100%","The deployment halts and, with automatic rollback configured, shifts traffic back to the original task set","The deployment pauses indefinitely with no rollback option available","The alarm has no effect unless 100% of traffic has already shifted"],a:[1],e:"With automatic rollback configured, an alarm trip during the shift halts the deployment and reverts traffic to the original version."},
{q:"Which of the following scenarios is the strongest fit for a canary deployment strategy rather than a linear one, given otherwise similar requirements?",o:["A team wants a slow, perfectly even ramp with no distinct \"small initial slice\" behavior","A team specifically wants to catch a bad deployment while affecting the smallest possible number of users first, before committing to the rest of the rollout in one larger step","A team has no CloudWatch alarms configured and does not want any automated safety mechanism","A team is deploying to EC2 instances with no ALB or target-group traffic-shifting capability at all"],a:[1],e:"Canary's defining strength is minimizing initial exposure before a larger commitment, unlike linear's steadier full-window ramp."},
{q:"For EC2/on-premises deployments specifically, which statement correctly describes how canary and linear deployment concepts relate to CodeDeploy's EC2 deployment configurations?",o:["EC2/on-premises in-place deployments support canary and linear traffic shifting identically to Lambda","EC2/on-premises in-place deployments use configurations like OneAtATime, HalfAtATime, and AllAtOnce (a rolling, batch-based model), rather than the canary/linear traffic-shifting configurations used for Lambda and ECS","EC2 deployments have no deployment configuration options whatsoever","EC2 deployments always default to a canary strategy with no way to change it"],a:[1],e:"EC2/on-premises in-place deployments use rolling, batch-based configurations (OneAtATime/HalfAtATime/AllAtOnce), not canary/linear traffic shifting."},
{q:"A company chooses a blue/green deployment for its EC2-based order-processing service specifically because it wants both a fully tested new environment before any customer traffic reaches it, and the fastest possible path back to the previous version if something goes wrong post-cutover. Which tradeoff does the company implicitly accept by choosing blue/green over in-place?",o:["No tradeoff exists; blue/green has strictly no downsides compared to in-place","The temporary cost of running two full environments simultaneously during the cutover window","The loss of any ability to validate the new environment before traffic shifts","The requirement to use only Spot Instances for the new environment"],a:[1],e:"Running two full environments simultaneously during cutover is the cost tradeoff blue/green accepts for its validation and rollback benefits."},
{q:"Which of the following is the most accurate general statement about how canary and linear deployment strategies relate to blue/green deployments on platforms like Lambda and ECS?",o:["Canary and linear are unrelated, entirely separate strategies with no connection to blue/green at all","Canary and linear describe the shape of the traffic ramp used to cut traffic over from the old version to the new version — they are ways blue/green-style cutovers are executed on these platforms, not a fourth unrelated category","Canary and linear can only be used for EC2, never for Lambda or ECS","Blue/green cannot be combined with any gradual traffic-shifting behavior under any circumstance"],a:[1],e:"Canary and linear describe the traffic-ramp shape used to execute a blue/green-style cutover on platforms like Lambda and ECS."},
{q:"A retail company's finance team is concerned about the cost of running duplicate infrastructure during deployments and asks the engineering team to minimize infrastructure cost during rollouts, even if it means a slower rollback path if something goes wrong. Which EC2 deployment approach best aligns with this stated priority?",o:["Blue/green with an extended wait period before terminating the original environment","In-place (rolling) deployment, accepting the tradeoff of slower rollback in exchange for not running duplicate infrastructure","Deploying to an entirely new AWS account for every release","Doubling the Auto Scaling group's maximum capacity permanently"],a:[1],e:"In-place deployment avoids duplicate infrastructure cost, directly matching a cost-minimization priority despite slower rollback."},
{q:"Which two of the following correctly describe rolling (in-place, batch-based) deployments to an EC2 fleet? (Select TWO)",o:["Instances are updated in batches, such as one at a time or half at a time, according to the configured deployment configuration","During the rollout, it is possible for some capacity to be running the old application version while other capacity runs the new version simultaneously","Rolling deployments always provision an entirely separate, duplicate fleet of instances","Rolling deployments guarantee zero possibility of a failed batch affecting subsequent batches","Rolling deployments are only available for Lambda functions, never EC2"],a:[0,1],multi:true,e:"Batch-based updates (e.g., one/half at a time) can leave old and new versions running concurrently mid-rollout."},
{q:"A company deploying a Lambda-based API wants to validate the new version with a synthetic test transaction before any production traffic reaches it, and also wants a broader smoke test to run only once all traffic has fully shifted to the new version. Which two appspec.yml hooks correspond to these two respective needs? (Select TWO)",o:["BeforeAllowTraffic, for validation before any traffic shifts","AfterAllowTraffic, for validation after all traffic has shifted","BeforeInstall, for validation before any traffic shifts","ApplicationStart, for validation after all traffic has shifted","ValidateService, for validation before any traffic shifts"],a:[0,1],multi:true,e:"BeforeAllowTraffic supports pre-traffic validation; AfterAllowTraffic supports validation after the full shift completes."},
{q:"Which of the following best explains why a scenario requiring \"near-zero downtime and the ability to instantly revert to the exact previous state with no redeployment\" almost always points toward blue/green rather than rolling deployment, for an EC2-based service?",o:["Rolling deployments cannot run behind a load balancer under any circumstance","Blue/green keeps a complete, untouched copy of the previous environment running and simply re-routes traffic, avoiding any need to redeploy or reconstruct the previous state, unlike rolling's batch-by-batch in-place updates","Rolling deployments are always faster than blue/green in every measurable way","Blue/green deployments do not support automatic rollback"],a:[1],e:"Blue/green keeps an untouched previous environment ready, so rollback is a traffic re-route rather than a reconstruction."},
{q:"A mobile backend team deploying via ECS wants a deployment strategy that offers a middle ground: more caution than an all-at-once cutover, but a steadier, more predictable and observable ramp than a single small canary slice followed by a big jump. Which deployment strategy best matches this description?",o:["Linear traffic shifting, moving in equal, evenly-paced increments across the deployment window","All-at-once cutover with no ramp","A purely manual, unscripted deployment process","In-place deployment with no ALB involved"],a:[0],e:"Linear's evenly-paced, predictable increments are the described middle ground between all-at-once and a small canary slice."},
{q:"Which of the following correctly identifies the primary axis of tradeoff between canary/linear traffic-shifting strategies and a rolling, in-place EC2 deployment strategy?",o:["There is no meaningful tradeoff; all four strategies behave identically in every respect","Canary/linear operate on a duplicated or traffic-shiftable environment (via target groups, aliases, or task sets) allowing precise, reversible traffic control, while rolling directly updates the same fleet in place, trading that precision for lower infrastructure duplication cost","Rolling deployments always use canary traffic percentages internally","Canary and linear are exclusively used for database migrations, never for application deployment"],a:[1],e:"Canary/linear rely on a traffic-shiftable duplicated environment for reversible control; rolling updates the same fleet in place at lower duplication cost."},
{q:"A company observes that during a recent linear deployment to their ECS service, an alarm tripped at the 60% traffic-shift mark, and rollback correctly reverted all traffic to the original task set. Compared to if the same failure had occurred during a canary deployment configured with a 10% initial slice, what is the key difference in blast radius before the rollback triggered?",o:["There would be no difference; both strategies always expose the same percentage of traffic before any alarm can trigger","The canary configuration would likely have exposed fewer users to the faulty version before the alarm could trip, since its initial exposure was capped at a small fixed percentage, whereas the linear deployment had already reached 60%","Canary deployments never use CloudWatch alarms, making this comparison invalid","Linear deployments cannot be rolled back once traffic shifting begins"],a:[1],e:"Canary's capped small initial exposure likely limits blast radius more than a linear rollout that had already reached 60%."},
{q:"Which of the following is the most accurate statement about deployment strategy applicability across CodeDeploy's supported compute platforms?",o:["All four deployment strategy concepts — canary, linear, blue/green, and rolling — apply identically and interchangeably to EC2, Lambda, and ECS with no platform-specific distinctions","Canary and linear traffic-shifting configurations apply to Lambda and ECS; EC2/on-premises in-place deployments instead use rolling, batch-based configurations, while EC2 blue/green is its own separate deployment type","Rolling deployments are exclusively a Lambda concept","Blue/green deployments are exclusively an EC2 concept with no Lambda or ECS equivalent"],a:[1],e:"Canary/linear apply to Lambda and ECS; EC2/on-premises in-place deployments use rolling configurations, and EC2 blue/green is its own type."},
{q:"A team is deciding between AllAtOnce and OneAtATime for an EC2 in-place deployment configuration. Which statement correctly characterizes the tradeoff?",o:["AllAtOnce updates every instance simultaneously, finishing fastest but temporarily taking the entire fleet offline if the new version has issues; OneAtATime updates a single instance at a time, taking longer but preserving more healthy capacity if a failure is caught early","OneAtATime and AllAtOnce behave identically in every respect","AllAtOnce guarantees zero downtime under every circumstance","OneAtATime always deploys to exactly half the fleet, regardless of fleet size"],a:[0],e:"AllAtOnce is fastest but riskiest fleet-wide; OneAtATime is slower but preserves more healthy capacity if a failure is caught early."},
{q:"Which two of the following statements correctly summarize how to choose between deployment strategies for a given scenario? (Select TWO)",o:["When a requirement emphasizes minimizing the number of users exposed to a bad deployment before detection, favor canary over linear or all-at-once","When a requirement emphasizes the fastest, simplest possible rollback with no need to redeploy, favor blue/green over rolling/in-place","When cost minimization during deployment is the dominant stated constraint, blue/green is always the correct choice regardless of rollback speed","Rolling deployments are appropriate only for Lambda functions","Canary deployments are never appropriate for Lambda functions"],a:[0,1],multi:true,e:"Canary minimizes exposure before detection; blue/green offers the fastest, simplest rollback without redeployment."},
{q:"A gaming company deploying a Lambda-based matchmaking service is especially concerned about a subtle bug that only manifests under real production load, and wants the smallest possible number of live matches affected if such a bug appears, even if that means the full rollout takes longer to complete. Which deployment configuration category best serves this priority?",o:["AllAtOnce, shifting 100% of traffic immediately","A canary configuration with a small initial percentage and an adequately long bake time before the remainder shifts","A rolling EC2 deployment configuration, despite the workload running on Lambda","Disabling automatic rollback to speed up the deployment"],a:[1],e:"A canary configuration with a small initial percentage and adequate bake time minimizes live matches affected by a subtle production-only bug."},
{q:"Which of the following correctly explains why \"some capacity runs the old version and some runs the new version simultaneously\" is specifically called out as a characteristic to consider for rolling (in-place, batch-based) deployments?",o:["It is irrelevant, since applications never need to tolerate running two versions at once","During a batch-based rollout, instances updated in earlier batches run the new version while instances not yet reached still run the old version, so the application and any shared state must tolerate both versions operating concurrently until the rollout completes","It only applies to blue/green deployments, never to rolling deployments","CodeDeploy automatically pauses all traffic until every batch is updated, avoiding this concern entirely"],a:[1],e:"Batch-based rollouts mean earlier-updated batches run the new version while later batches still run the old version concurrently."},
{q:"A company's release pipeline has a Source stage, a Build stage, and a Deploy stage, executed one after another. Within the Deploy stage, they want a unit-test action and a separate security-scan action to run at the same time rather than sequentially, to reduce total pipeline duration. How is this achieved in CodePipeline?",o:["By placing both actions in the same stage and assigning them the same run order number, allowing them to execute in parallel","By creating two entirely separate pipelines and merging their results manually","CodePipeline stages can never contain more than one action","By disabling one of the two actions entirely"],a:[0],e:"Actions in the same stage sharing the same run order number execute in parallel."},
{q:"A company wants a human release manager to explicitly approve a deployment before it proceeds from a staging environment to production, and wants approvers automatically notified when their sign-off is needed. Which CodePipeline capability, combined with which notification service, satisfies this?",o:["A Manual Approval action, typically configured to publish a notification to an SNS topic subscribed to by approvers","A CodeBuild post_build phase combined with Amazon SES","A CodeDeploy ValidateService hook combined with Amazon SNS","An AppConfig validator combined with Amazon Cognito"],a:[0],e:"A Manual Approval action, typically notifying approvers via an SNS topic, provides the human sign-off gate."},
{q:"In CodePipeline, what mechanism actually carries the built application artifact produced by a CodeBuild action to the CodeDeploy action that consumes it in a later stage?",o:["A direct, unmanaged network connection between the two AWS services","An S3 bucket that CodePipeline manages, where output artifacts from one action become the input artifacts for a subsequent action","An email attachment sent automatically between build and deploy stages","A CodeCommit branch created specifically to hold each build artifact"],a:[1],e:"CodePipeline manages an S3 bucket where an action's output artifact becomes a later action's input artifact."},
{q:"A company operating a single CodePipeline pipeline in one AWS account wants that pipeline to deploy an application into a completely separate AWS account used for production, without sharing long-term credentials between accounts. Which mechanism supports this cross-account deployment pattern?",o:["A cross-account IAM role in the target account that the pipeline's role assumes via sts:AssumeRole, combined with a KMS key policy permitting that role to use the artifact bucket's encryption key","Copying the production account's root user credentials into the pipeline's build environment","Manually copying files between accounts using the console","Disabling IAM entirely in the production account for the duration of each deployment"],a:[0],e:"A cross-account IAM role assumed via sts:AssumeRole, plus a KMS key policy permitting its use, enables cross-account deployment without shared long-term credentials."},
{q:"Which of the following best describes how a modern CodePipeline pipeline is typically triggered when new code is pushed to its configured source repository branch?",o:["CodePipeline continuously polls the repository every few seconds by default with no other option","An Amazon EventBridge rule reacts to the source repository's change event and starts the pipeline execution automatically, with legacy polling still available as an older alternative","A human must always manually click a button in the console to start every single pipeline execution","Pipelines can only be triggered on a fixed daily schedule, never on a commit"],a:[1],e:"An EventBridge rule reacting to the source change event triggers the pipeline automatically; polling remains a legacy alternative."},
{q:"A company wants to temporarily prevent any new pipeline executions from reaching their production Deploy stage during an active incident, without deleting or reconfiguring the pipeline itself. Which CodePipeline capability supports this?",o:["Manually disabling the stage transition into the production Deploy stage","Permanently deleting the CodeDeploy deployment group","Deleting the entire pipeline and recreating it after the incident","Revoking all IAM permissions account-wide"],a:[0],e:"Manually disabling a stage transition blocks further executions from reaching that stage without altering the pipeline definition."},
{q:"Which of the following correctly describes the relationship between stages and actions within a CodePipeline pipeline?",o:["A pipeline consists of one or more sequential stages, and each stage contains one or more actions that operate on the pipeline's artifacts","A pipeline can only ever contain a single stage with a single action","Stages and actions are the same concept with two different names","Actions always run before the stage containing them is defined"],a:[0],e:"A pipeline consists of sequential stages, each containing one or more actions operating on pipeline artifacts."},
{q:"A company's pipeline must deploy the same application into three separate AWS Regions to support regional failover. Which CodePipeline capability directly supports deploying across multiple Regions from a single pipeline?",o:["Cross-region actions, where CodePipeline automatically replicates artifacts to a bucket in each target Region as configured","Manually re-running the pipeline three separate times, once per Region, with no built-in support otherwise","CodePipeline does not support any form of multi-Region deployment","Deploying to multiple Regions requires three fully independent, disconnected pipelines with no artifact sharing"],a:[0],e:"Cross-region actions let CodePipeline automatically replicate artifacts to buckets in each configured target Region."},
{q:"Which two of the following are accurate statements about CodePipeline manual approval actions? (Select TWO)",o:["A pipeline execution pauses at a manual approval action until a human explicitly approves or rejects it","Manual approval actions can be configured to publish a notification (commonly via SNS) alerting approvers that action is needed","Manual approval actions automatically approve themselves after exactly sixty seconds with no human involvement","Manual approval actions can only be placed as the very first action in a pipeline's very first stage","Manual approval actions require disabling all subsequent stages permanently"],a:[0,1],multi:true,e:"Execution pauses until a human decision, and approval actions commonly publish an SNS notification to alert approvers."},
{q:"A pipeline's Test stage contains a unit-test action and an integration-test action, both currently configured with the same run order and therefore running in parallel. The team later needs the integration-test action to run only after the unit-test action completes successfully. What change accomplishes this?",o:["Deleting the integration-test action entirely","Assigning the integration-test action a later (higher) run order number than the unit-test action, so it runs sequentially after the unit-test action within the same stage","Moving both actions into entirely separate, unrelated pipelines","Renaming the actions, since names alone determine execution order"],a:[1],e:"Assigning a later run order number makes the integration-test action run after the unit-test action instead of in parallel."},
{q:"Which of the following is the most accurate description of what happens to a pipeline execution if a required action within a stage fails (for example, a CodeBuild action returns a non-zero exit code)?",o:["The pipeline automatically retries the failed action indefinitely without ever stopping","The pipeline execution stops at that point by default, and later stages do not proceed, until the issue is addressed and the pipeline is re-run or a new source change triggers a fresh execution","The pipeline silently skips the failed action and proceeds directly to production regardless","The entire pipeline definition is automatically deleted upon any action failure"],a:[1],e:"By default, a failed required action stops the pipeline execution at that point; later stages do not proceed until re-run."},
{q:"A company wants its CodePipeline pipeline's Deploy stage to use CodeDeploy with a blue/green EC2 deployment configuration, including an automatic rollback tied to a CloudWatch alarm. Where is this alarm-based automatic rollback actually configured?",o:["Directly on the CodePipeline stage definition, with no involvement from CodeDeploy","On the underlying CodeDeploy deployment group that the pipeline's Deploy action targets, since CodePipeline invokes CodeDeploy to perform the actual deployment and its rollback behavior","On the CodeCommit repository's trigger configuration","On the CodeArtifact domain's security configuration"],a:[1],e:"The CloudWatch alarm and automatic rollback are configured on the CodeDeploy deployment group that CodePipeline's Deploy action targets."},
{q:"Which of the following is an accurate statement about artifact handling between CodePipeline stages?",o:["Every action in every stage must always produce an output artifact, with no exceptions","An action typically consumes one or more input artifacts (produced by an earlier action) and, when relevant to that action's purpose, produces an output artifact for later stages to consume","Artifacts are never versioned and each pipeline execution overwrites the same single artifact permanently","Artifacts can only be JSON files, never zip archives"],a:[1],e:"Actions typically consume input artifacts and, when relevant, produce output artifacts for subsequent stages."},
{q:"A security-conscious company wants to ensure that only a specific, tightly-scoped IAM role can approve or reject the Manual Approval action for their production Deploy stage, rather than any authenticated user in the account. How is this access restricted?",o:["Manual approval actions cannot be access-restricted; anyone in the account can always approve them","Through an IAM policy scoping the codepipeline:PutApprovalResult (and related) permissions to the specific pipeline/stage/action, granted only to the intended approvers' role","By deleting the IAM policies of everyone except the intended approver, account-wide","By moving the approval action into a completely different AWS account with no relationship to the pipeline"],a:[1],e:"IAM policy scoping of codepipeline:PutApprovalResult (and related actions) to the intended approvers' role restricts who can approve."},
{q:"Which two of the following are legitimate source providers CodePipeline can be configured to use for its Source stage? (Select TWO)",o:["AWS CodeCommit","A GitHub repository connected via a CodeStar Connection","An AWS Direct Connect circuit","An Amazon Route 53 hosted zone","An AWS Certificate Manager certificate"],a:[0,1],multi:true,e:"CodeCommit and a GitHub repository connected via CodeStar Connection are both valid CodePipeline source providers."},
{q:"A pipeline's Build stage action fails intermittently due to a flaky integration test, and the team wants to understand exactly which build logs correspond to a specific failed pipeline execution for debugging. Where would a developer look to trace a specific CodeBuild action's logs from within a CodePipeline execution?",o:["CodePipeline links each action's execution details to the underlying CodeBuild build, whose logs are available (commonly in CloudWatch Logs) for that specific build run","CodePipeline logs are only ever available by contacting AWS Support directly","Build logs are permanently deleted the moment a pipeline execution completes, with no way to review them afterward","Build logs can only be viewed by recreating the entire pipeline from scratch"],a:[0],e:"CodePipeline links each action to its underlying CodeBuild build, whose logs (commonly in CloudWatch Logs) are traceable for that run."},
{q:"Which of the following best explains why a company might configure a CodePipeline Deploy stage with two sequential CodeDeploy actions — one targeting a staging deployment group, followed by a manual approval action, followed by a second CodeDeploy action targeting a production deployment group — rather than a single action deploying directly to production?",o:["CodePipeline requires at least three stages in every pipeline regardless of design intent","It allows automated validation in a lower-risk staging environment first, followed by a deliberate human checkpoint, before the higher-risk production deployment occurs","CodeDeploy cannot deploy to production under any circumstance without first deploying to staging","It is required purely for artifact storage reasons with no relation to risk management"],a:[1],e:"Staging validation followed by a human checkpoint before production reduces risk compared to deploying directly to production."},
{q:"A team wants their pipeline's Source stage to trigger only on pushes to the 'main' branch of their CodeCommit repository, ignoring pushes to feature branches. Where is this branch scoping configured?",o:["It cannot be configured; CodePipeline always triggers on every branch equally","In the Source action's configuration, which specifies the exact branch (e.g., main) the source stage should watch for changes on","In the CodeArtifact domain policy","In the AppConfig deployment strategy"],a:[1],e:"The Source action's configuration specifies the exact branch the source stage watches for changes."},
{q:"A company wants to host its internally developed private npm packages while also transparently caching packages pulled from the public npm registry, so that a public registry outage doesn't block their builds. Which AWS service and configuration pattern satisfies this?",o:["AWS CodeArtifact, with a repository configured with an upstream connection to the public npmjs registry","AWS CodeCommit, storing npm packages as repository files","Amazon S3 with public read access enabled","AWS CodeStar, with no further configuration"],a:[0],e:"A CodeArtifact repository with an upstream to npmjs provides both private hosting and resilient caching of public packages."},
{q:"In AWS CodeArtifact, what is the relationship between a domain and the repositories within it?",o:["A domain is a single repository with a different name; there is no distinction","A domain is an organizational container that can hold multiple repositories, sharing security configuration and enabling package metadata deduplication across those repositories","A repository can belong to multiple domains simultaneously with no restriction","Domains are used only for billing and have no effect on repository organization"],a:[1],e:"A domain is an organizational container holding multiple repositories, sharing security configuration and enabling metadata deduplication."},
{q:"A CodeBuild buildspec needs to authenticate npm against a CodeArtifact repository before running 'npm ci'. Which command is used as a convenience wrapper to fetch an authorization token and configure the local tool's config file accordingly?",o:["aws codeartifact login --tool npm --domain <domain> --domain-owner <account-id> --repository <repo>","aws codecommit git-remote-codecommit","aws codedeploy create-deployment","aws codepipeline start-pipeline-execution"],a:[0],e:"aws codeartifact login fetches an authorization token and configures the tool's config file to point at the repository."},
{q:"Which of the following package ecosystems does AWS CodeArtifact natively support as repository formats?",o:["npm, pip, Maven, and NuGet, among others","Only Docker container images, with no support for language package managers","Only AWS Lambda deployment packages","Only CloudFormation templates"],a:[0],e:"CodeArtifact natively supports npm, pip, Maven, and NuGet repository formats, among others."},
{q:"A company wants centralized control over which specific versions of open-source dependencies its engineering teams are allowed to pull into their builds, rather than allowing direct, ungoverned access to public package registries. How does fronting public registries with a CodeArtifact upstream repository support this goal?",o:["It has no effect on version governance; CodeArtifact only mirrors whatever the public registry currently has","All build traffic flows through the CodeArtifact repository, giving the organization a single, IAM-governed control point where allowed package sources and caching behavior can be centrally managed","CodeArtifact requires disabling all public registry access entirely, with no caching capability","CodeArtifact only works for internally authored packages and cannot interact with any public registry"],a:[1],e:"Routing all build traffic through CodeArtifact gives a single, IAM-governed control point for managing allowed package sources."},
{q:"Which two of the following are accurate benefits of using AWS CodeArtifact as a caching proxy in front of a public package registry, compared to builds pulling directly from that public registry each time? (Select TWO)",o:["Protection against a public registry outage or an accidentally deleted public package version breaking the build","Faster, more consistent dependency resolution since previously fetched packages are cached within the CodeArtifact repository","CodeArtifact eliminates the need for any IAM permissions related to package access","CodeArtifact automatically rewrites application source code to remove all third-party dependencies","CodeArtifact guarantees zero cost for all package downloads regardless of usage"],a:[0,1],multi:true,e:"Caching protects against upstream outages/deletions and speeds up dependency resolution via previously cached packages."},

{q:"A developer wants to run a background cleanup task when a Lambda execution environment is shutting down. Which Lambda feature provides lifecycle events for extension shutdown?",o:["Lambda Destinations","Lambda Runtime Extensions API","Lambda Versioning","Amazon CloudWatch Alarms"],a:[1],e:"The Lambda Runtime Extensions API exposes lifecycle events allowing extensions to perform cleanup during Shutdown."},
{q:"An application requires a proprietary Linux shared library ('.so' file) to execute its C++ binary. How can this binary be packaged and run on AWS Lambda? (Select TWO.)",o:["Package the code and dependencies as an OCI-compliant container image (up to 10 GB) and deploy to Lambda","Package the binary and '.so' file inside a custom Lambda Layer and use a custom runtime (provided.al2 or provided.al2023)","Upload the binary directly to Amazon Route 53","Install the library using Windows PowerShell inside the Lambda console","Lambda cannot run compiled binaries under any circumstances"],a:[0,1],multi:true,e:"Compiled binaries and custom dependencies can be deployed via OCI container images (up to 10 GB) or Lambda Layers with custom runtimes ('provided.al2/al2023')."},
{q:"Which of the following AWS services is a push-based, asynchronous trigger for AWS Lambda?",o:["Amazon SQS","Amazon S3 event notifications","Amazon Kinesis Data Streams","Amazon DynamoDB Streams"],a:[1],e:"Amazon S3 event notifications invoke Lambda asynchronously using a push model."},
{q:"How does AWS Lambda integrate with stream-based and queue-based event sources like Amazon SQS, Kinesis, and DynamoDB Streams?",o:["The services push HTTP requests directly to Lambda's public IP address","Lambda's internal Event Source Mapping polls the source on the developer's behalf and invokes the function with batches of records","The developer must run an EC2 instance that reads messages and calls 'lambda:Invoke'","The services write records directly to the function's '/tmp' folder"],a:[1],e:"Lambda uses internal Event Source Mappings (pollers) to poll queues/streams and batch records into function invocations."},
{q:"Which of the following is a push-based, synchronous trigger for AWS Lambda?",o:["Amazon API Gateway (REST API / HTTP API)","Amazon S3 's3:ObjectCreated:*'","Amazon EventBridge scheduled rule","Amazon SNS topic notification"],a:[0],e:"Amazon API Gateway invokes Lambda synchronously using the 'RequestResponse' invocation type, waiting for the HTTP response."},
{q:"When AWS Lambda polls an Amazon SQS standard queue via an Event Source Mapping, what happens when a batch of messages is successfully processed by the function without throwing an error?",o:["The Lambda function handler must explicitly call 'sqs:DeleteMessage' for each message","Lambda's Event Source Mapping automatically deletes the successfully processed messages from the SQS queue","The messages remain in the queue until the 14-day retention limit expires","SQS moves the messages to a Dead-Letter Queue automatically"],a:[1],e:"When a Lambda function processing an SQS Event Source Mapping returns successfully without errors, Lambda automatically deletes the batch from SQS."},
{q:"A Lambda function processes records from an Amazon Kinesis Data Stream. A poison-pill record causes the function to throw an exception on every attempt. What is the default behavior of the stream poller, and what problem does it cause?",o:["The record is discarded immediately; downstream processing continues","The poller retries the failing batch repeatedly until the data expires (e.g., 24 hours), blocking the entire shard from making progress","Kinesis deletes the entire stream","Lambda automatically routes the poison-pill record to Amazon S3"],a:[1],e:"In stream processing (Kinesis/DynamoDB Streams), a failing record blocks the entire shard because records must be processed in order."},
{q:"Which configuration on a stream Event Source Mapping (Kinesis/DynamoDB Streams) automatically breaks a failing batch into two smaller sub-batches to isolate a malformed record?",o:["MaximumRecordAgeInSeconds","BisectBatchOnFunctionError","MaximumRetryAttempts","ParallelizationFactor"],a:[1],e:"'BisectBatchOnFunctionError' automatically splits a failing stream batch in half upon error to isolate the single bad record."},
{q:"A developer configures an Event Source Mapping between an Amazon SQS queue and a Lambda function. The function handler takes 20 seconds to process a batch of messages. What should the SQS queue's Visibility Timeout be set to, according to AWS best practices?",o:["Equal to the function timeout (20 seconds)","At least 6 times the Lambda function timeout (e.g., 120 seconds)","0 seconds to allow immediate re-processing","Exactly 15 minutes"],a:[1],e:"AWS recommends setting SQS Visibility Timeout to at least 6 times the Lambda function timeout to allow sufficient time for retries."},
{q:"What is the concurrency scaling model when an AWS Lambda function is triggered by an Amazon Kinesis Data Stream without the 'ParallelizationFactor' setting?",o:["One Lambda worker per message in the stream","One concurrent Lambda execution per active shard in the stream","Up to 1,000 concurrent executions per shard","Concurrency is always locked at 1 for the entire stream"],a:[1],e:"By default, Lambda processes Kinesis data streams with one concurrent worker per active shard to preserve order."},
{q:"A developer wants to increase processing throughput for a high-volume Kinesis Data Stream where partition keys have high cardinality within each shard. Which Event Source Mapping setting allows up to 10 concurrent Lambda invocations per shard?",o:["BatchSize","ParallelizationFactor (set to 10)","MaximumBatchingWindowInSeconds","TumblingWindowInSeconds"],a:[1],e:"'ParallelizationFactor' (up to 10) allows concurrent Lambda invocations per shard when partition keys are well-distributed."},
{q:"An asynchronous invocation of an AWS Lambda function fails all automatic retry attempts. The developer wants to automatically capture the error details, original payload, and stack trace without writing custom error-handling code. Which feature should be configured?",o:["Lambda Function URL","Lambda On-Failure Destination (targeting SQS, SNS, EventBridge, or another Lambda)","CloudWatch Metric Filters","Step Functions Pass State"],a:[1],e:"Lambda On-Failure Destinations automatically route async invocation execution records (including errors, stack trace, and payload) to SQS, SNS, EventBridge, or Lambda."},
{q:"Which two AWS services can be configured as a Lambda Destination for asynchronous invocation outcomes (on-success or on-failure)? (Select TWO.)",o:["Amazon SQS queue","Amazon EventBridge event bus","Amazon EBS volume","Amazon Route 53 hosted zone","AWS KMS key"],a:[0,1],multi:true,e:"SQS queues, SNS topics, EventBridge event buses, and other Lambda functions are valid targets for Lambda Destinations."},
{q:"A developer uses the AWS CLI to trigger a Lambda function asynchronously. Which invocation type parameter must be specified in the 'aws lambda invoke' command?",o:["'--invocation-type RequestResponse'","'--invocation-type Event'","'--invocation-type DryRun'","'--invocation-type AsyncBatch'"],a:[1],e:"'--invocation-type Event' specifies asynchronous invocation in the AWS CLI."},
{q:"When a developer invokes a Lambda function using '--invocation-type Event', what HTTP status code does the Lambda API return immediately upon accepting the payload?",o:["200 OK","202 Accepted","204 No Content","400 Bad Request"],a:[1],e:"An asynchronous invocation accepted by Lambda immediately returns HTTP status code '202 Accepted'."},
{q:"A team uses an Amazon SNS topic to notify a Lambda function. If the Lambda function experiences an unhandled runtime exception, who handles the retries?",o:["The SNS service retries according to its message delivery policy, and Lambda also applies its internal asynchronous invocation retry behavior (up to 2 retries)","The client that published the message to SNS must reconnect and retry","The message is immediately deleted without retries","SNS converts the message into an email to root"],a:[0],e:"SNS applies its own delivery retry policy, and once delivered to Lambda asynchronously, Lambda applies its 2 automatic retries."},
{q:"A developer is designing a Lambda function triggered by Amazon S3 object uploads. During peak hours, thousands of images are uploaded simultaneously. How does Lambda scale to handle these push events?",o:["S3 buffers all events in a single internal queue and invokes one Lambda instance at a time","Lambda automatically scales out concurrent execution environments up to the account/burst concurrency limits","S3 drops events that exceed 100 uploads per second","The developer must pre-allocate EC2 instances for S3 triggers"],a:[1],e:"Lambda automatically scales concurrent execution environments to match incoming push events up to burst and account concurrency limits."},
{q:"An Event Source Mapping for Amazon SQS has a 'BatchSize' of 10 and a 'MaximumBatchingWindowInSeconds' of 30. Under what conditions will Lambda invoke the function?",o:["Only when exactly 10 messages have arrived","Only after 30 seconds have passed, regardless of message count","As soon as 10 messages are available OR 30 seconds have elapsed, whichever occurs first","When the total payload size reaches 10 MB"],a:[2],e:"Event Source Mappings trigger an invocation when either 'BatchSize' records are collected OR 'MaximumBatchingWindowInSeconds' elapses."},
{q:"A Lambda function processes messages from an Amazon SQS standard queue. A batch of 10 messages is received, but message #4 causes an unhandled error. To prevent reprocessing messages #1, #2, and #3, which SQS Event Source Mapping feature should the developer implement?",o:["BisectBatchOnFunctionError","ReportBatchItemFailures (returning a list of failed message IDs in 'batchItemFailures')","Disabling batch processing entirely","Setting visibility timeout to 0"],a:[1],e:"'ReportBatchItemFailures' allows returning a list of failed message IDs in 'batchItemFailures', ensuring only failed messages are retried."},
{q:"What happens when an AWS Lambda function triggered synchronously by Amazon API Gateway times out after 29 seconds (API Gateway's integration timeout ceiling)?",o:["Lambda continues running for 15 minutes, but API Gateway returns a '504 Gateway Timeout' error to the client","API Gateway immediately retries the Lambda function three times","The client receives a '200 OK' with an empty body","API Gateway automatically provisions more memory to Lambda"],a:[0],e:"API Gateway enforces a maximum integration timeout of 29 seconds, returning a 504 Gateway Timeout if the backend does not respond in time."},
{q:"Which two event sources support Lambda Destinations for on-failure reporting? (Select TWO.)",o:["Asynchronous invocations from Amazon S3","Event Source Mappings from Amazon Kinesis Data Streams","Synchronous invocations from Application Load Balancer","Direct synchronous invocations from AWS SDK with 'RequestResponse'","Invocations from API Gateway REST APIs"],a:[0,1],multi:true,e:"Lambda Destinations support asynchronous invocations (e.g., S3) and stream Event Source Mappings (Kinesis/DynamoDB Streams)."},
{q:"An application uses a DynamoDB Streams trigger with AWS Lambda. What is the maximum duration that change records remain available in DynamoDB Streams before they expire?",o:["1 hour","24 hours","7 days","14 days"],a:[1],e:"DynamoDB Streams retains change data records for exactly 24 hours."},
{q:"What is the default unreserved concurrency limit for all AWS Lambda functions in an AWS account within a single Region?",o:["100 concurrent executions","1,000 concurrent executions","10,000 concurrent executions","Unlimited"],a:[1],e:"The default account concurrency limit for AWS Lambda is 1,000 concurrent executions per Region."},
{q:"A developer notices that during a flash sale, an analytics Lambda function consumes 950 out of the account's 1,000 available concurrency units, causing critical customer checkout Lambda functions to fail with '429 TooManyRequestsException'. What should the developer configure to prevent the analytics function from starving the rest of the account?",o:["Set a reserved concurrency limit on the analytics function (e.g., 50) and a reserved concurrency allocation on the checkout function","Increase the memory of the analytics function to 10,240 MB","Set the timeout of the checkout function to 1 second","Switch the analytics function to synchronous invocation"],a:[0],e:"Setting reserved concurrency on the noisy analytics function limits its concurrency ceiling, while reserving concurrency for checkout protects its capacity."},
{q:"If a developer sets 'ReservedConcurrentExecutions = 0' on an AWS Lambda function, what is the effect?",o:["The function can scale infinitely without any concurrency limit","The function is effectively disabled and will reject all incoming invocation requests with throttling errors","The function only runs when no other function in the account is active","The function is permanently deleted from the account"],a:[1],e:"Setting 'ReservedConcurrentExecutions = 0' completely disables the function and throttles all incoming invocations."},
{q:"What is the formula for calculating the concurrent executions of an AWS Lambda function?",o:["'Concurrency = Invocations Per Second × Average Execution Duration (in seconds)'","'Concurrency = Memory Allocation / Timeout'","'Concurrency = Total Invocations / Number of Shards'","'Concurrency = Batch Size × Visibility Timeout'"],a:[0],e:"Concurrency is calculated as 'Invocations Per Second × Average Execution Duration (in seconds)'."},
{q:"A Lambda function processes 500 requests per second, and each execution takes an average of 200 milliseconds (0.2 seconds). How many concurrent executions does this function consume?",o:["25 concurrent executions","100 concurrent executions","500 concurrent executions","1,000 concurrent executions"],a:[1],e:"'500 req/sec × 0.2 sec = 100 concurrent executions'."},
{q:"What error code is returned when a synchronous invocation of AWS Lambda exceeds available concurrency limits?",o:["'500 InternalServerError'","'429 TooManyRequestsException'","'403 ForbiddenException'","'503 ServiceUnavailable'"],a:[1],e:"When concurrency limits are exceeded, synchronous invocations return '429 TooManyRequestsException'."},
{q:"What happens when an asynchronous invocation (e.g., from Amazon SNS) is throttled due to reaching account concurrency limits?",o:["The event is dropped immediately and permanently lost","Lambda automatically places the event in an internal queue and retries the invocation for up to 6 hours with exponential backoff","Lambda raises an alert in the AWS Health Dashboard","SNS terminates the subscription"],a:[1],e:"Throttled asynchronous invocations are queued internally by Lambda and retried automatically for up to 6 hours."},
{q:"What is Lambda \"burst concurrency\"?",o:["A temporary boost in memory allocation during heavy network I/O","The initial concurrency level that a function can reach immediately (between 500 and 3,000 depending on the Region) before scaling up by 500 additional concurrent executions per minute","An emergency failover mode that transfers execution to EC2","A feature that allows a single invocation to exceed the 15-minute timeout"],a:[1],e:"Burst concurrency is the initial burst capacity (500–3,000 depending on Region) available immediately before growing by 500/minute."},
{q:"A company has a backend relational database (Amazon RDS PostgreSQL) that can support a maximum of 50 concurrent database connections. A Lambda function connects directly to this database. During peak traffic, Lambda scales to 800 concurrent executions, causing database connection exhaustion and crashes. Which two solutions prevent Lambda from overwhelming the database? (Select TWO.)",o:["Set 'ReservedConcurrentExecutions = 50' on the Lambda function","Deploy Amazon RDS Proxy between Lambda and the PostgreSQL database to pool and manage database connections","Increase the Lambda function's memory to maximum","Increase the database timeout to 2 hours","Configure Lambda in provisioned concurrency mode with 500 instances"],a:[0,1],multi:true,e:"Capping Lambda concurrency via 'ReservedConcurrentExecutions = 50' and deploying Amazon RDS Proxy for connection pooling both protect the database."},
{q:"How does Provisioned Concurrency differ from Reserved Concurrency in AWS Lambda?",o:["Reserved Concurrency allocates a maximum ceiling and guarantees capacity from the account pool; Provisioned Concurrency pre-warms execution environments so handlers respond immediately with zero cold starts","Reserved Concurrency eliminates cold starts; Provisioned Concurrency throttles invocations","Reserved Concurrency is billed per hour; Provisioned Concurrency is completely free","Provisioned Concurrency can only be configured for Python functions"],a:[0],e:"Reserved Concurrency sets a ceiling and guarantees capacity from the pool; Provisioned Concurrency pre-warms environments to eliminate cold starts."},
{q:"A developer configures Application Auto Scaling on Lambda Provisioned Concurrency. What metric is commonly used as the target tracking metric?",o:["'ProvisionedConcurrencyUtilization' (e.g., maintain 70% utilization)","'InvocationsPerSecond'","'DurationMilliseconds'","'ErrorCount'"],a:[0],e:"'ProvisionedConcurrencyUtilization' is the standard metric used by Application Auto Scaling to adjust warm capacity."},
{q:"An e-commerce API experiences a predictable surge of traffic every day at 9:00 AM. Invocations during this surge suffer from 800ms cold start latency. What is the most cost-effective and reliable solution?",o:["Set up scheduled Application Auto Scaling to increase Provisioned Concurrency before 9:00 AM and scale it down after peak hours","Keep 1,000 Provisioned Concurrency instances running 24/7","Rewrite the entire application in Assembly","Run a continuous ping script every 5 seconds to keep all instances warm"],a:[0],e:"Scheduled Application Auto Scaling scales up Provisioned Concurrency prior to known morning traffic spikes and scales down afterward."},
{q:"A developer wants to publish a new version of a Lambda function and assign a human-readable name like 'PROD' that points to version 2. Which Lambda resource represents this pointer?",o:["Lambda Layer","Lambda Alias","Lambda Extension","Lambda Destination"],a:[1],e:"A Lambda Alias is a named pointer (e.g., 'PROD') that references a specific published function version."},
{q:"When using Lambda Aliases with weighted routing, what capability does this provide during software releases?",o:["Automatic rollback on CloudWatch alarms by shifting traffic (e.g., 90% to v1, 10% to v2) for canary deployments","Multi-region active-active replication","Automatic memory allocation optimization","Zero-cost deployment execution"],a:[0],e:"Lambda Aliases with weighted routing support canary deployments by shifting traffic percentages between two versions (e.g., 90/10) with automated rollback."},
{q:"By default, what network environment does an AWS Lambda function run in?",o:["Inside the default VPC of the account with full access to private RDS databases","In a secure, AWS-managed VPC with direct outbound access to the public internet and public AWS endpoints, but no direct access to private VPC resources","Inside an isolated on-premises data center","On a public EC2 instance with an Elastic IP"],a:[1],e:"Lambda runs by default in an AWS-managed VPC with internet access but no access to private customer VPC subnets."},
{q:"A developer needs an AWS Lambda function to query an Amazon ElastiCache (Redis) cluster deployed inside a private subnet of a custom VPC. What configuration is required?",o:["Configure the Lambda function's VPC settings with the appropriate VPC ID, private Subnet IDs, and Security Group IDs","Make the ElastiCache cluster publicly accessible over the internet","Attach an Internet Gateway directly to the Lambda function","Deploy the Lambda function code onto the ElastiCache node"],a:[0],e:"Accessing private VPC resources like ElastiCache requires configuring the Lambda function with VPC subnets and security groups."},
{q:"A developer attaches an AWS Lambda function to a private subnet in a VPC to access an internal Amazon RDS database. After this change, the function can query RDS, but calls to a public third-party weather API begin timing out. What is the root cause?",o:["Lambda functions in a VPC cannot make HTTP calls","Attaching a Lambda function to private subnets removes its default internet route; outbound internet traffic requires a NAT Gateway in a public subnet with appropriate route table entries","The third-party API blocked AWS IP addresses","The Lambda function's execution role is missing the 'ec2:CreateNetworkInterface' permission"],a:[1],e:"VPC attachment removes default internet access; outbound internet calls from private subnets require a NAT Gateway in a public subnet."},
{q:"Which IAM permissions must an AWS Lambda function's execution role have in order to connect to an Amazon VPC?",o:["'ec2:CreateNetworkInterface', 'ec2:DescribeNetworkInterfaces', 'ec2:DeleteNetworkInterface' (or the AWS managed policy 'AWSLambdaVPCAccessExecutionRole')","'s3:GetObject' and 's3:PutObject'","'iam:PassRole' and 'sts:AssumeRole'","'rds:Connect' and 'elasticache:Connect'"],a:[0],e:"The 'AWSLambdaVPCAccessExecutionRole' managed policy grants permission to create, describe, and delete network interfaces (ENIs) in the VPC."},
{q:"How does AWS Lambda's Hyperplane ENI architecture improve VPC-enabled Lambda functions?",o:["It eliminates the need for security groups","It uses shared, pre-provisioned Elastic Network Interfaces (ENIs) per subnet/security-group combination, drastically reducing cold start connection delays when launching new execution environments","It provides unlimited free bandwidth to the internet","It assigns a dedicated public IPv4 address to each concurrent invocation"],a:[1],e:"Hyperplane ENIs provide shared, pre-provisioned network interfaces across Lambda functions in the same subnet/SG, eliminating cold-start ENI attachment delays."},
{q:"If an AWS Lambda function inside a VPC needs to access Amazon DynamoDB and Amazon S3 without routing traffic through a NAT Gateway or traversing the public internet, what should the developer configure in the VPC?",o:["Direct Connect connection","VPC Gateway Endpoints for DynamoDB and S3 (free of data processing charges)","A second Internet Gateway","An Elastic IP attached to the Lambda function"],a:[1],e:"VPC Gateway Endpoints for S3 and DynamoDB allow direct, private access from VPC subnets without NAT Gateways or internet traversal."},
{q:"A Lambda function requires a database password. The security team mandates that credentials must never be stored as plaintext in environment variables or code repositories, and must support automatic rotation. Which AWS service should store the password?",o:["Amazon S3 Glacier","AWS Secrets Manager","AWS CloudTrail","Amazon DynamoDB local"],a:[1],e:"AWS Secrets Manager securely stores database credentials with encryption and supports automated key rotation."},
{q:"What is the function of the AWS Lambda Execution Role?",o:["An IAM role that grants the caller permission to invoke the Lambda function","An IAM role assumed by the Lambda service when executing the function, granting permissions to access other AWS services (like DynamoDB, S3, CloudWatch Logs)","A role that manages AWS billing for the function","A local Linux user account inside the Lambda container"],a:[1],e:"The Execution Role is an IAM role assumed by Lambda to grant the function permissions to interact with other AWS services."},
{q:"Which policy type is used to grant another AWS service or cross-account principal permission to invoke an AWS Lambda function (e.g., allowing Amazon S3 to call 'lambda:InvokeFunction')?",o:["IAM Identity-Based User Policy","Lambda Resource-Based Policy (Function Policy)","S3 Bucket ACL","VPC Route Table Policy"],a:[1],e:"A Resource-Based Policy (Function Policy) grants external services or accounts permission to invoke the Lambda function."},
{q:"A developer attempts to configure an S3 bucket notification to invoke a Lambda function. The console returns an error stating that S3 does not have permission to invoke the function. Which command resolves this issue?",o:["'aws iam create-user'","'aws lambda add-permission --function-name MyFunction --principal s3.amazonaws.com --action lambda:InvokeFunction --source-arn <bucket-arn>'","'aws s3api put-bucket-acl --grant-read'","'aws sts get-caller-identity'"],a:[1],e:"'aws lambda add-permission' adds a statement to the function's resource-based policy granting S3 permission to invoke 'lambda:InvokeFunction'."},
{q:"An application processes sensitive HIPAA-compliant medical records using AWS Lambda. The compliance officer requires all data at rest and in transit to be encrypted with customer-managed KMS keys. How should the developer configure Lambda environment variables?",o:["Environment variables cannot be encrypted","Enable Lambda helper encryption at rest with a customer-managed AWS KMS key and use encryption helpers in the console for client-side decryption","Store the variables in a public GitHub repository","Save the keys inside the '/tmp' folder"],a:[1],e:"Lambda supports environment variable encryption helpers using customer-managed KMS keys for at-rest security."},
{q:"A developer needs to restrict a Lambda function inside a VPC so that it can only receive inbound traffic from an Application Load Balancer and initiate outbound calls only to an RDS database port (5432). Which AWS security feature controls this traffic at the ENI level?",o:["IAM Roles","Security Groups","S3 Bucket Policies","AWS WAF on S3"],a:[1],e:"Security Groups act as a virtual firewall at the ENI level to control inbound and outbound traffic rules."},
{q:"Which two statements regarding AWS Lambda execution in a VPC are true? (Select TWO.)",o:["Lambda functions configured for VPC access should be associated with private subnets across multiple Availability Zones for high availability","Placing a Lambda function in a public subnet grants it an automatic public IP and direct internet access","VPC-enabled Lambda functions share ENIs created across the same subnet and security group combination","Lambda functions in a VPC cannot access Amazon CloudWatch Logs","Attaching to a VPC reduces the maximum function execution timeout to 5 minutes"],a:[0,2],multi:true,e:"Lambda in VPC should use private subnets across multiple AZs for HA, and functions share Hyperplane ENIs with matching subnet/SG configs."},
{q:"A developer wants to invoke a Lambda function over HTTPS via a dedicated, built-in HTTP(S) endpoint without setting up an Application Load Balancer or Amazon API Gateway. Which Lambda feature provides this?",o:["Lambda Function URLs","Lambda Aliases","Lambda Layers","Lambda Destinations"],a:[0],e:"Lambda Function URLs provide a dedicated HTTPS endpoint directly built into the function without API Gateway or ALB."},
{q:"Which authentication modes are natively supported by Lambda Function URLs? (Select TWO.)",o:["'AWS_IAM' (requiring SigV4 signed requests from authorized IAM identities)","'NONE' (publicly accessible endpoint, with optional CORS configuration)","'COGNITO_USER_POOLS' directly without API Gateway","'BASIC_AUTH' with plaintext username and password","'MUTUAL_TLS_ONLY' with hardcoded client certs"],a:[0,1],multi:true,e:"Lambda Function URLs support 'AWS_IAM' authentication (SigV4) and 'NONE' (public access with optional CORS)."},
{q:"A developer configures a Lambda Function URL with 'AuthType: NONE' for a webhook endpoint. How can the developer restrict cross-origin requests from web browsers to only allow invocations from 'https://example.com'?",o:["Configure CORS headers on the Function URL allowing 'Access-Control-Allow-Origin: https://example.com'","Create an S3 lifecycle policy","Attach an IAM role to the browser","Delete the Function URL and switch to Amazon MQ"],a:[0],e:"Configuring CORS headers directly on the Function URL restricts web browser cross-origin requests to specified origins like 'https://example.com'."},
{q:"A developer notices that a Python Lambda function that connects to Amazon RDS PostgreSQL runs slowly on initial requests because creating a new database connection takes 400ms. Subsequent invocations in the same container take only 15ms. How can this connection overhead be minimized across warm invocations?",o:["Re-open the database connection inside the handler function on every invocation","Initialize the database connection object outside the handler at global scope so warm execution environments reuse the existing open connection","Increase the database connection timeout to 1 hour","Run the function in an EC2 instance instead"],a:[1],e:"Initializing database connections outside the handler allows warm execution environments to reuse existing connections across invocations."},
{q:"Which AWS service provides distributed tracing capabilities to visualize latency bottlenecks across a serverless architecture involving API Gateway, Lambda, and DynamoDB?",o:["AWS CloudTrail","AWS X-Ray","Amazon CloudWatch Synthetics","AWS Trusted Advisor"],a:[1],e:"AWS X-Ray provides end-to-end distributed tracing and service maps across serverless components."},
{q:"How does a developer enable active AWS X-Ray tracing on an AWS Lambda function?",o:["Install the X-Ray daemon on an EC2 instance","In the Lambda function configuration, set Tracing mode to 'Active' (or in SAM 'Tracing: Active') and include the AWS X-Ray SDK in the function code","Add 'xray:true' as an environment variable","X-Ray is automatically enabled on all AWS accounts and cannot be configured"],a:[1],e:"Setting Tracing mode to 'Active' and including the X-Ray SDK instruments the function for distributed tracing."},
{q:"What segment does AWS Lambda create in an X-Ray trace, and what is created by the X-Ray SDK inside the function?",o:["Lambda creates the service parent segment (recording overhead, cold start init, and invoke duration); the X-Ray SDK creates subsegments for outgoing HTTP/AWS API calls","Lambda creates the subsegment; the SDK creates the root trace","X-Ray only captures errors and drops successful segments","Lambda requires an on-premises agent to generate X-Ray segments"],a:[0],e:"Lambda generates the parent service segment (init, invoke, overhead); the X-Ray SDK generates subsegments for downstream calls."},
{q:"In an AWS Lambda function's CloudWatch Logs stream, which log line format is automatically generated by the Lambda runtime at the end of every invocation to summarize billing and performance?",o:["'[INFO] Execution successful'","'REPORT RequestId: ... Duration: 45.20 ms Billed Duration: 46 ms Memory Size: 128 MB Max Memory Used: 64 MB Init Duration: 150.12 ms'","'SUMMARY: Status=200, CPU=10%'","'DEBUG: Container terminated'"],a:[1],e:"The 'REPORT' log line records RequestId, Duration, Billed Duration, Memory Size, Max Memory Used, and Init Duration."},
{q:"A developer examines a Lambda function's CloudWatch REPORT log line and sees 'Memory Size: 512 MB' and 'Max Memory Used: 498 MB'. What action should the developer take?",o:["Decrease the memory allocation to 256 MB to save money","Increase the memory allocation (e.g., to 1024 MB) to provide a safety margin and avoid potential out-of-memory runtime crashes","Do nothing, because Lambda automatically allocates more memory when needed","Delete the CloudWatch log group"],a:[1],e:"Using 498 MB out of 512 MB is dangerously close to the limit; increasing memory provides a safety margin against out-of-memory crashes."},
{q:"An AWS Lambda function is configured with 1024 MB memory and executes in 200ms. If the function is reconfigured to 2048 MB memory and its duration drops to 100ms, how does the compute cost per invocation change (ignoring free tier)?",o:["Cost doubles","Cost remains approximately the same (1024 MB × 0.2s = 204.8 GB-s vs. 2048 MB × 0.1s = 204.8 GB-s) while user latency is halved","Cost is cut in half","Cost increases by 4x"],a:[1],e:"Compute cost is proportional to GB-seconds ('Memory × Duration'); doubling memory while halving duration yields identical cost ('204.8 GB-s') with better latency."},
{q:"Which CloudWatch metric indicates the number of Lambda invocations that failed due to unhandled exceptions in function code?",o:["'Throttles'","'Errors'","'ConcurrentExecutions'","'DeadLetterErrors'"],a:[1],e:"The 'Errors' metric tracks invocations that failed due to unhandled function exceptions."},
{q:"Which CloudWatch metric indicates that invocation requests were rejected because the function or account exceeded concurrency limits?",o:["'Duration'","'Throttles'","'DeadLetterErrors'","'IteratorAge'"],a:[1],e:"The 'Throttles' metric tracks invocation requests rejected due to concurrency limits."},
{q:"A developer is monitoring an AWS Lambda function that processes an Amazon Kinesis Data Stream. The 'IteratorAge' CloudWatch metric is steadily increasing over several hours. What does this indicate?",o:["The Lambda function is processing records faster than they arrive","The function is falling behind the stream, and records are taking longer to be processed after being written to the shard","The Kinesis stream has been deleted","The Lambda function execution environment has frozen"],a:[1],e:"Increasing 'IteratorAge' means the Lambda stream consumer is falling behind and data is aging in the shard before being processed."},
{q:"What two actions can reduce a growing 'IteratorAge' on a stream-based Lambda Event Source Mapping (Kinesis/DynamoDB Streams)? (Select TWO.)",o:["Increase the 'ParallelizationFactor' to process multiple batches per shard concurrently","Optimize function execution time (e.g., increase memory or improve code performance)","Decrease the Kinesis retention period to 1 hour","Switch to an SQS standard queue","Set Lambda timeout to 1 second"],a:[0,1],multi:true,e:"Increasing 'ParallelizationFactor' (more workers per shard) and optimizing function duration both increase processing throughput and lower IteratorAge."},
{q:"A developer is packaging a Python Lambda function with external dependencies ('requests', 'numpy', 'pandas'). The zipped package size is 75 MB. What is the recommended method to deploy this package?",o:["Paste the raw code directly into the Lambda inline code editor","Upload the '.zip' archive to an Amazon S3 bucket and configure the Lambda function code to point to the S3 object location","Email the zip file to AWS Support","Store the zip file inside an SQS message body"],a:[1],e:"Packages larger than 50 MB should be uploaded to an Amazon S3 bucket and referenced in the Lambda function configuration."},
{q:"What is the uncompressed deployment package size limit for an AWS Lambda function (including layers)?",o:["50 MB","250 MB","500 MB","10 GB"],a:[1],e:"The uncompressed deployment package size limit (code plus all layers) for AWS Lambda is 250 MB."},
{q:"What is the maximum container image size supported by AWS Lambda when deploying functions packaged as Docker/OCI images?",o:["250 MB","1 GB","10 GB","50 GB"],a:[2],e:"AWS Lambda supports OCI container images up to 10 GB in size."},
{q:"A developer wants to optimize a container image deployed to AWS Lambda to minimize cold start download times. Which best practice should be followed?",o:["Use multi-stage Docker builds to keep the final image minimal, using an official AWS base image for Lambda","Include all development build tools, compilers, and test suites in the final production image","Store the container image in a third-party private repository outside AWS","Build the image on an EC2 instance with 128 vCPUs"],a:[0],e:"Multi-stage Docker builds based on official AWS base images strip build-time dependencies, keeping images small and fast to pull."},
{q:"Which AWS tool allows developers to automatically analyze Lambda functions across memory configurations and find the optimal balance between execution speed and cost?",o:["AWS Cost Explorer","AWS Lambda Power Tuning (open-source Step Functions state machine tool)","Amazon Inspector","AWS Budgets"],a:[1],e:"AWS Lambda Power Tuning is an open-source Step Functions tool that benchmarks functions across memory sizes to find the best cost/performance balance."},
{q:"When writing unit tests for a Lambda function that calls Amazon DynamoDB, how should the developer test the business logic without making live AWS network calls?",o:["Run the test against production DynamoDB tables using admin credentials","Mock the 'boto3' client/resource using libraries like 'unittest.mock' or 'moto'","Disable internet access on the development laptop","Hardcode mock responses inside the production Lambda handler"],a:[1],e:"Mocking the 'boto3' client using 'unittest.mock' or 'moto' isolates business logic without making live cloud network calls."},
{q:"A developer wants to test a Lambda function in the AWS management console. What feature allows creating and saving reusable JSON event payloads representing different test scenarios (e.g., valid payload, missing fields, malformed data)?",o:["CloudWatch Metrics","Console Shareable Test Events","Lambda Layers","Secrets Manager"],a:[1],e:"Console Shareable Test Events allow saving and sharing JSON payloads for testing different invocation scenarios directly in the console."},
{q:"An online ticketing service anticipates a 50x spike in traffic when concert tickets go on sale at 10:00 AM. The backend is an API Gateway + Lambda architecture writing to DynamoDB. What combination of actions should the team take to guarantee readiness and prevent cold starts and throttling?",o:["Pre-warm the system by configuring Provisioned Concurrency on the Lambda function prior to 10:00 AM, ensure DynamoDB has sufficient on-demand/provisioned capacity, and verify account concurrency quotas","Increase Lambda function timeout to 15 minutes and disable API Gateway caching","Deploy the API onto a single t3.micro EC2 instance","Switch the Lambda functions to run on local developer laptops"],a:[0],e:"Pre-warming via Provisioned Concurrency, verifying DynamoDB capacity, and checking concurrency quotas ensures readiness for massive traffic spikes."},
{q:"A media company processes user-submitted videos. Users upload files up to 2 GB to Amazon S3. The processing pipeline requires: (1) extracting audio, (2) running speech-to-text, (3) translating subtitles, and (4) encoding the video into multiple bitrates. Steps 1–3 take 2 minutes each; step 4 takes 35 minutes. How should the team architect this workflow?",o:["Run the entire pipeline inside a single AWS Lambda function","Orchestrate the workflow using AWS Step Functions: use Lambda functions for steps 1–3 (under 15 min), and trigger an AWS Batch or Amazon ECS Fargate task for step 4 (exceeds 15 min limit)","Run everything on an SQS worker thread inside a Lambda function with a 60-minute timeout","Have S3 execute ffmpeg directly on the storage node"],a:[1],e:"Step Functions orchestrates the workflow, using Lambda for short tasks (<15 min) and ECS/Fargate/Batch for long video encoding (>15 min)."},
{q:"A payments microservice needs to: (1) process payment events from SQS, (2) record charges in a private Aurora PostgreSQL database inside a VPC, (3) call an external Stripe API over the public internet, and (4) ensure no duplicate charges occur upon SQS retries. Which architecture meets all requirements?",o:["Lambda function attached to VPC private subnets with a NAT Gateway for Stripe access; idempotency key check in DynamoDB; SQS Event Source Mapping with DLQ","Lambda function running in default AWS network without VPC attachment, storing credit card numbers in local memory","EC2 instance with public IP running cron jobs without database encryption","Step Functions state machine with no error handling"],a:[0],e:"VPC private subnets with NAT Gateway for Stripe, DynamoDB idempotency checks, and SQS with DLQ satisfy all networking and fault-tolerance needs."},
{q:"A financial reporting service uses AWS Lambda to generate end-of-month summaries. The function frequently runs out of memory when processing large customer datasets. What immediate change should the developer make?",o:["Split the function across multiple AWS accounts","Increase the function's memory configuration in the Lambda console or IaC template (up to 10,240 MB)","Compress the operating system files inside '/tmp'","Convert the function to an S3 event notification"],a:[1],e:"Increasing memory allocation (up to 10,240 MB) resolves out-of-memory errors for memory-intensive data processing."},
{q:"An e-commerce backend needs to notify three independent microservices whenever a user cancels an order: (1) inventory restock, (2) customer refund, (3) CRM update. The order service must publish the event once and return immediately. If any microservice fails, it should retry independently without affecting others. Which architecture implements this?",o:["Order service publishes to an Amazon SNS topic; three separate Amazon SQS queues subscribe to the topic; each queue triggers its own dedicated Lambda function","Order service calls each Lambda function sequentially using synchronous 'RequestResponse' invocations","Order service writes the cancellation event to a local text file on an EC2 instance","Order service creates three new Lambda functions dynamically on every request"],a:[0],e:"SNS topic with three subscribed SQS queues (fan-out pattern) allows publishing once while each consumer retries independently."},
{q:"A mobile game uses AWS Lambda to calculate daily leaderboards. The function takes 8 minutes to run on 128 MB memory and times out during holiday traffic. Analysis shows the calculation is heavily CPU-bound. What is the most effective way to optimize this function?",o:["Increase the memory allocation to 1536 MB or higher, which proportionally increases CPU power and drastically cuts duration","Increase the timeout to 3 hours","Switch from Python to Bash script","Reduce the memory to 64 MB to reduce compute complexity"],a:[0],e:"Increasing memory allocation proportionally increases CPU allocation, significantly speeding up CPU-bound tasks."},
{q:"A developer is building a serverless webhook receiver for third-party GitHub pull request events. The webhook receiver must validate HMAC signatures, write the event payload to an S3 bucket, and return a '200 OK' within 2 seconds. Detailed analytics processing on the payload takes up to 4 minutes. How should this be designed?",o:["Single synchronous Lambda function that validates, writes to S3, processes analytics for 4 minutes, and then returns 200 OK","Webhook Lambda validates signature, puts payload to S3, publishes an event to an Amazon SQS queue, and immediately returns 200 OK; a second worker Lambda asynchronously processes the analytics from SQS","Process everything client-side in the GitHub browser tab","Store the webhook in an in-memory variable on an EC2 instance"],a:[1],e:"Decoupling fast validation (returns 200 OK immediately) from background processing via an SQS queue ensures responsive webhooks."},
{q:"A company has 20 Lambda functions in an account. Function A has an unhandled bug that causes an infinite loop of asynchronous retries, consuming 1,000 concurrent executions. Functions B through T start failing with throttling errors. What is the immediate mitigation and the architectural fix?",o:["Set 'ReservedConcurrentExecutions = 0' on Function A to immediately stop the runaway function, and allocate appropriate reserved concurrency to critical business functions","Delete the entire AWS account and recreate it","Restart the AWS Lambda regional data center","Increase the timeout of Functions B through T"],a:[0],e:"Setting 'ReservedConcurrentExecutions = 0' immediately halts the runaway function, while reserved concurrency protects critical workloads."},
{q:"An image processing pipeline receives 500 images per second. Each image upload emits an event to an SQS queue. A Lambda function processes the queue with a batch size of 10. The image processing takes 2 seconds per batch. How many concurrent Lambda executions will be active in steady state?",o:["10 concurrent executions","100 concurrent executions (50 batches/sec × 2 sec duration = 100 concurrent executions)","500 concurrent executions","1,000 concurrent executions"],a:[1],e:"'500 images/sec ÷ 10 images/batch = 50 batches/sec'. Concurrency = '50 batches/sec × 2 sec = 100 concurrent executions'."},
{q:"A developer is designing an AWS Lambda function that must query an Amazon RDS MySQL instance. Under high concurrency, opening hundreds of new database connections causes RDS to run out of memory. Which AWS service should be introduced between Lambda and RDS?",o:["Amazon RDS Proxy","Amazon DynamoDB Accelerator (DAX)","Amazon CloudFront","AWS AppSync"],a:[0],e:"Amazon RDS Proxy pools and shares database connections, protecting RDS from connection exhaustion under high Lambda concurrency."},
{q:"A developer writes a Lambda function that queries a DynamoDB table. The developer observes high latency on the first invocation after deployment, but subsequent invocations are very fast. What two factors contribute to this initial latency? (Select TWO.)",o:["The Lambda runtime initialization and cold start of the execution environment","Initializing the DynamoDB SDK client, loading SSL certificates, and establishing the initial TCP/TLS connection","DynamoDB rebuilding its primary key index on every deployment","The local laptop's network latency affecting the cloud execution","AWS billing validation checks"],a:[0,1],multi:true,e:"Cold start initialization of the runtime/container and the initial TLS/SDK client setup account for the latency on the first invocation."},
{q:"A company needs to deploy a legacy 8 GB machine learning model with specialized binary dependencies onto AWS Lambda. The zipped code package exceeds 250 MB. How can this function be deployed?",o:["It cannot be deployed to Lambda; it must run on a physical on-premises server","Package the model and dependencies into a Docker container image (up to 10 GB), push to Amazon ECR, and configure Lambda to deploy from the container image","Split the zip file into 32 separate 25 MB files and upload via FTP","Convert the model into plain text environment variables"],a:[1],e:"Deploying as an OCI container image (up to 10 GB) via Amazon ECR allows running large models and custom dependencies on Lambda."},
{q:"An AWS Lambda function is configured to process an SQS queue. The function fails on a specific message due to a database schema mismatch. The message is retried repeatedly, causing other valid messages in the queue to be delayed. What configuration should be applied to the SQS queue?",o:["Set 'DelaySeconds = 900'","Configure a Dead-Letter Queue (DLQ) with 'maxReceiveCount = 3' on the redrive policy","Delete the queue and recreate it as a FIFO queue","Increase SQS message retention to 30 days"],a:[1],e:"A Dead-Letter Queue (DLQ) with 'maxReceiveCount = 3' isolates poison messages after 3 failed attempts, unblocking other queue messages."},
{q:"A team needs to implement a serverless API where requests are authenticated via custom token logic in a Lambda function before invoking the backend service. Which API Gateway feature accomplishes this?",o:["Lambda Authorizer (formerly Custom Authorizer)","Lambda Layer","Lambda Extension","VPC Gateway Endpoint"],a:[0],e:"Lambda Authorizers execute custom bearer token or request parameter authentication logic in Lambda before routing requests to backend integrations."},
{q:"A developer wants to ensure that an AWS Lambda function can safely read and write to an Amazon S3 bucket named 'company-analytics-2026'. Which policy and attachment should be configured?",o:["Attach an IAM role with an S3 policy granting 's3:GetObject' and 's3:PutObject' on 'arn:aws:s3:::company-analytics-2026/*' to the Lambda execution role","Make the S3 bucket public to all users","Hardcode the AWS root account credentials in the Lambda code","Attach an S3 bucket policy allowing all actions to 'Principal: \"*\"'"],a:[0],e:"The principle of least privilege requires granting 's3:GetObject' and 's3:PutObject' on the specific bucket ARN via the Lambda execution role."},
{q:"A Lambda function processes orders. When an order fails validation, the developer wants to send a notification to an SNS topic without writing custom SNS publishing code inside the function error handler. Which feature enables this for asynchronous invocations?",o:["Lambda On-Failure Destination pointing to the SNS topic ARN","Amazon Route 53 Health Checks","SQS Dead-Letter Queue with manual polling","CloudWatch Alarms sending email to SNS"],a:[0],e:"Lambda On-Failure Destinations automatically route failed asynchronous invocation details to an SNS topic without writing custom error code."},
{q:"An architect reviews a serverless design and needs to confirm whether Lambda is the right compute choice. Which combination of workload characteristics makes AWS Lambda the ideal compute platform?",o:["Predictable 24/7 continuous 100% CPU utilization running for days with no variation","Event-driven execution, short-to-medium duration (<15 minutes), bursty or unpredictable traffic, with automatic scaling and zero idle compute costs","Long-running monolithic enterprise application requiring 64 GB RAM and 4 hours of uninterrupted execution per transaction","Real-time sub-millisecond audio streaming requiring low-level hardware kernel modifications"],a:[1],e:"Lambda is optimal for event-driven, short/medium duration workloads with bursty/unpredictable traffic seeking zero idle costs and automatic scaling."}
];

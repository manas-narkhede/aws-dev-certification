<title>Fundamentals Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eceeec; --ink:#141a1f; --muted:#5c6670;
  --border:#dde1de; --accent:#0d7377; --accent-ink:#ffffff; --accent-soft:#e3f1f0;
  --success:#1f8a44; --success-bg:#e5f6ea; --success-border:#a9dfb8;
  --danger:#c8402f; --danger-bg:#fbe9e6; --danger-border:#f0b8ac;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151a; --surface:#171e25; --surface-2:#1d252c; --ink:#edf1f3; --muted:#93a3ac;
    --border:#2b343c; --accent:#37c9c2; --accent-ink:#08211f; --accent-soft:#173430;
    --success:#5fd489; --success-bg:#123321; --success-border:#256b45;
    --danger:#f38672; --danger-bg:#3a1c17; --danger-border:#7a3226;
  }
}
:root[data-theme="dark"]{
  --bg:#10151a; --surface:#171e25; --surface-2:#1d252c; --ink:#edf1f3; --muted:#93a3ac;
  --border:#2b343c; --accent:#37c9c2; --accent-ink:#08211f; --accent-soft:#173430;
  --success:#5fd489; --success-bg:#123321; --success-border:#256b45;
  --danger:#f38672; --danger-bg:#3a1c17; --danger-border:#7a3226;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:"Public Sans",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 80px;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600;}
h1{font-size:22px; font-weight:800; margin:4px 0 18px; text-wrap:balance; letter-spacing:-.01em;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap;}
.stat{display:flex; flex-direction:column; align-items:flex-end;}
.stat .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:18px; font-weight:600;}
.stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
.progress-track{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin:14px 0 28px; border:1px solid var(--border);}
.progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .35s ease;}
@media (prefers-reduced-motion: reduce){ .progress-fill{transition:none;} }

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.qnum{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:10px;}
.qtext{font-size:16.5px; font-weight:600; line-height:1.55; margin-bottom:20px; text-wrap:balance;}
.multi-hint{display:inline-block; font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 10px; margin-bottom:14px;}

.opt{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:13px 14px; margin-bottom:10px; cursor:pointer; font:inherit; color:var(--ink); font-size:14.5px; line-height:1.5; transition:border-color .15s, background .15s;}
.opt:hover{border-color:var(--accent);}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.opt .mark{flex:0 0 22px; height:22px; border-radius:6px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; color:var(--muted); margin-top:1px;}
.opt.selected{border-color:var(--accent); background:var(--accent-soft);}
.opt.selected .mark{border-color:var(--accent); color:var(--accent);}
.opt.correct{border-color:var(--success-border); background:var(--success-bg);}
.opt.correct .mark{border-color:var(--success); color:var(--success); background:var(--success-bg);}
.opt.incorrect{border-color:var(--danger-border); background:var(--danger-bg);}
.opt.incorrect .mark{border-color:var(--danger); color:var(--danger); background:var(--danger-bg);}
.opt:disabled{cursor:default;}
.opt:disabled:hover{border-color:var(--border);}
.opt.correct:hover, .opt.incorrect:hover{border-color:inherit;}

.actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
button.btn{font:inherit; font-weight:700; font-size:14px; border-radius:9px; padding:11px 18px; cursor:pointer; border:1.5px solid transparent;}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--accent);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.explain{margin-top:16px; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.55; border:1px solid var(--border); background:var(--surface-2);}
.explain b{color:var(--accent);}

.summary{text-align:center; padding:10px 0 20px;}
.score-big{font-family:"IBM Plex Mono",monospace; font-size:52px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.score-pct{color:var(--muted); font-size:15px; margin-top:2px;}
.pass{color:var(--success);} .fail{color:var(--danger);}
.miss-list{text-align:left; margin-top:22px; border-top:1px solid var(--border); padding-top:18px;}
.miss-list h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;}
.miss-item{font-size:14px; padding:8px 0; border-bottom:1px dashed var(--border);}
.miss-item b{font-family:"IBM Plex Mono",monospace;}

.footer-note{text-align:center; color:var(--muted); font-size:12px; margin-top:22px;}
</style>

<div class="wrap">
  <div class="eyebrow">Module 00 · AWS Certified Developer – Associate</div>
  <h1>Exam Overview &amp; Fundamentals</h1>
  <div class="topbar">
    <div class="stat">
      <span class="num" id="posNum">1 / 120</span>
      <span class="lbl">Question</span>
    </div>
    <div class="stat">
      <span class="num" id="scoreNum">0</span>
      <span class="lbl">Correct</span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div id="quizArea"></div>
  <div class="footer-note">Progress is saved automatically in this browser. Use 1–5 or A–E on your keyboard to answer.</div>
</div>

<script>
const QUESTIONS = [
{q:"A candidate is 40 minutes into a 130-minute DVA-C02 exam and has spent 12 minutes stuck on a single multi-response question about IAM cross-account roles, unable to decide between two plausible-looking options. According to recommended exam pacing strategy, what should the candidate do?",o:["Continue working the question until certain, since accuracy matters more than pace","Flag the question for review, select the best current guess, and move on to the remaining questions","Leave the question blank and return to it only if time remains at the very end","Restart the exam section to reset the timer for that question"],a:[1],e:"Flag it, guess your current best answer, and move on; Pearson VUE allows returning to flagged questions, and burning excessive time on one question risks not reaching later ones."},
{q:"A developer reviewing their DVA-C02 score report learns that out of 65 total questions, only 50 contributed to their scaled score. What is the reason for this, and what should the developer's strategy have been during the exam?",o:["15 questions were technical glitches that AWS automatically discarded; no strategy change was needed","15 questions were unscored items AWS was trialing for future exams, indistinguishable from scored ones, so every question should be answered as if it counts","The candidate answered 15 questions incorrectly, which AWS excludes from scoring as a courtesy","15 questions were optional bonus questions that only improve the score, never lower it"],a:[1],e:"15 of 65 are unscored trial questions, indistinguishable from scored ones, so treat every question as if it counts."},
{q:"A DVA-C02 question describes a company that needs to reduce compute cost for a fault-tolerant batch job in the most cost-effective way possible, while a second, otherwise similar question about a single-instance production database asks for the most reliable solution. Why might the correct answer differ between these two questions even though both involve EC2 pricing models?",o:["The constraint keyword in each question (cost vs. reliability) changes which pricing/architecture tradeoff is actually being tested, so identical-looking scenarios can have different correct answers","DVA-C02 questions about EC2 always have the same correct answer regardless of wording","Only the second question is a real scored question; the first is unscored and doesn't need careful reading","The constraint keywords are decorative and don't affect the correct answer"],a:[0],e:"The constraint keyword (cost vs. reliability) is exactly what determines which tradeoff, and therefore which answer, is correct."},
{q:"While reading a DVA-C02 scenario, a candidate notices the stem describes two separate requirements: the solution must be secure and must require no manual intervention to rotate credentials. One answer option satisfies only the security requirement but not the automation requirement. How should this option be treated?",o:["Selected, since it partially satisfies the scenario","Eliminated, because a correct answer must satisfy every explicitly stated requirement in the stem, not just some of them","Selected only if no other option mentions rotation at all","Flagged as the best answer if it is the shortest option"],a:[1],e:"A correct answer must satisfy every explicitly stated requirement, not just some of them; partial satisfaction means elimination."},
{q:"A test-taker has eliminated two of four options on a multiple-choice DVA-C02 question because they violate the security best practices covered in Module 00, but is still unsure which of the remaining two is correct. Both remaining options use a legitimate AWS secret-storage service. What should the test-taker look for next to break the tie?",o:["The option that is worded most simply, regardless of technical accuracy","The specific feature-level detail that distinguishes the two services (for example, which one natively supports the exact capability the stem asks for, such as automatic rotation)","Whichever option appears first alphabetically","Whichever option was also correct on a previous, unrelated question"],a:[1],e:"When two legitimate options remain, the tie-breaker is the specific AWS feature-level detail the stem is actually testing."},
{q:"Which combination of exam-day facts should shape a candidate's overall pacing strategy for the 65-question, 130-minute DVA-C02 exam?",o:["Roughly two minutes are available per question on average, and unscored questions are indistinguishable from scored ones","Only scored questions need to be answered; unscored questions can be skipped entirely","There is a strict per-domain minimum score in addition to the overall 720 pass mark","Wrong answers subtract points, so leaving uncertain questions blank protects the overall score"],a:[0],e:"About two minutes per question on average, and unscored questions look identical to scored ones so all must be treated as counting."},
{q:"A company's compliance team requires that a new application survive the complete loss of a single data center without any downtime. An architect proposes deploying EC2 instances behind a load balancer in only one Availability Zone, arguing this is sufficient. Why does this proposal fail to meet the requirement?",o:["A single Availability Zone already spans multiple data centers, so no change is needed","An Availability Zone maps to independent data center(s); a failure there would take down every instance in it, so the workload must span at least two AZs to survive that failure","Availability Zones cannot host EC2 instances at all","Load balancers automatically create redundant Availability Zones when attached"],a:[1],e:"An AZ maps to independent data center(s); single-AZ deployment doesn't survive that AZ's failure, so at least two AZs are required."},
{q:"A regulated healthcare company must ensure patient records processed by its application never leave a specific country's borders, using AWS's default data-residency behavior rather than a custom replication policy. Which AWS concept, used as-is, satisfies this requirement?",o:["Placing all resources in one Availability Zone","Deploying only within a single AWS Region located in that country, since Regions are isolated and data does not leave a Region unless explicitly configured to","Using only Edge locations within that country","Enabling AWS Organizations consolidated billing"],a:[1],e:"Regions are isolated by default; choosing a Region within the required country satisfies default data residency with no extra configuration."},
{q:"A developer provisions an EBS volume in the eu-west-1b Availability Zone and then attempts to attach it to a running EC2 instance in eu-west-1c. The attach operation fails. What is the most likely cause?",o:["EBS volumes can only attach to instances launched from the same AMI","EBS volumes are Availability Zone-scoped and can only attach to instances within that same AZ","EBS volumes require the instance to be stopped for at least 24 hours before attaching","EBS volumes can only be attached in the us-east-1 Region"],a:[1],e:"EBS volumes are AZ-scoped and only attach to instances within the same AZ."},
{q:"A solutions team is deciding where to deploy a new IAM policy that must apply consistently no matter which AWS Region their application later expands into. Which characteristic of IAM makes this straightforward?",o:["IAM policies must be manually copied to every Region an application uses","IAM is a global service, so identities and policies are not tied to any single Region","IAM policies are Region-scoped like EC2 and must be replicated","IAM requires a separate account per Region"],a:[1],e:"IAM is a global service; identities and policies aren't Region-specific."},
{q:"A media company wants to reduce latency for video content delivered to users across five continents without deploying and managing EC2 fleets in every Region. Which AWS capability directly addresses this?",o:["Launching EC2 Auto Scaling groups in every Region worldwide","Amazon CloudFront caching content at edge locations close to end users globally","Creating additional Availability Zones in each Region","Increasing the size of EC2 instances in the primary Region"],a:[1],e:"CloudFront's edge locations cache content close to users globally without deploying compute in every Region."},
{q:"Which two statements about AWS Availability Zones are correct?",o:["An AWS Region typically provides three or more Availability Zones","Availability Zones within a Region are connected by high-bandwidth, low-latency networking links","A single Availability Zone spans every Region in a geographic continent","Availability Zones share a single point of power and cooling failure with each other","An Availability Zone is a billing construct with no relationship to physical infrastructure"],a:[0,1],multi:true,e:"Regions provide 3+ AZs, and AZs are interconnected with high-bandwidth, low-latency links."},
{q:"A gaming company wants ultra-low-latency compute placed physically closer to a specific major metropolitan area than any standard AWS Region can provide, for a small subset of latency-sensitive matchmaking servers. Which AWS infrastructure concept is designed for this use case?",o:["A standard Availability Zone","An AWS Local Zone","A second full Region","An S3 bucket with Transfer Acceleration"],a:[1],e:"AWS Local Zones bring compute physically closer to specific metro areas for latency-sensitive use cases."},
{q:"Which of the following AWS services operates as a Regional service rather than a global one?",o:["IAM","Amazon DynamoDB","Amazon Route 53","Amazon CloudFront"],a:[1],e:"DynamoDB is Regional; IAM, Route 53, and CloudFront are global services."},
{q:"A startup is choosing between deploying its primary application in a single Region with Multi-AZ redundancy versus a full active-active multi-Region architecture. The startup's requirement is only to tolerate the loss of one data center, not an entire geographic Region, and they want to minimize operational complexity. Which approach best matches the actual requirement?",o:["Multi-Region active-active, since more redundancy is always better regardless of requirements","Single Region with resources spread across multiple Availability Zones, since that directly satisfies the stated data-center-failure requirement with less operational complexity than multi-Region","A single Availability Zone with frequent manual backups","Multi-Region with only one Availability Zone used per Region"],a:[1],e:"The stated requirement (survive one data center's loss, minimize complexity) is exactly satisfied by Multi-AZ within a single Region; multi-Region is unnecessary added complexity here."},
{q:"An S3 bucket named acme-invoices-2026 is created in the ap-southeast-2 Region. A developer on another team, in another AWS account, later tries to create a bucket with the exact same name in us-east-1. What happens?",o:["It succeeds, because S3 bucket names are unique only within a Region","It fails, because S3 bucket names must be globally unique across all AWS accounts and Regions, even though the bucket's data itself resides in one chosen Region","It succeeds, because S3 buckets are Availability Zone-scoped, not Regional","It fails only if both accounts belong to the same AWS Organization"],a:[1],e:"S3 bucket names are globally unique across all accounts and Regions, even though the underlying data resides in one Region."},
{q:"A company operating in the EU wants to use CloudFront to serve static assets to global users while ensuring the origin S3 bucket's actual object data remains stored only in an EU Region. Is this combination possible under AWS's Region/edge-location model?",o:["No, CloudFront requires the origin's data to be replicated to every edge location's Region","Yes — CloudFront edge locations cache and serve copies of content globally, while the origin S3 bucket's authoritative data still resides only in the EU Region it was created in","No, S3 buckets used as CloudFront origins are automatically converted to global storage","Yes, but only if the AWS account has Enterprise support"],a:[1],e:"CloudFront edge locations cache copies globally while the S3 origin's authoritative data stays in its one chosen Region."},
{q:"Which statement correctly distinguishes a Region from an Availability Zone for exam purposes?",o:["They are interchangeable terms for the same concept","A Region is a geographic area containing multiple isolated Availability Zones; surviving a data center failure requires spanning AZs, while surviving a Region failure requires a second Region entirely","An Availability Zone contains multiple Regions","Regions are used only for billing, and Availability Zones are used only for compute"],a:[1],e:"A Region contains multiple isolated AZs; data center failure maps to multi-AZ, Region failure maps to multi-Region."},
{q:"A developer needs to run a handful of AWS CLI commands from a shared workstation that does not have and should not have the CLI installed locally, using their existing console sign-in. Which AWS tool best fits this need?",o:["AWS Cloud9","AWS CloudShell","A new EC2 instance dedicated to running CLI commands","AWS CodeArtifact"],a:[1],e:"CloudShell provides a browser-based, pre-authenticated shell with no local install needed."},
{q:"A team wants a full browser-based IDE — code editor, debugger, and terminal together — pre-configured with the AWS CLI and SDKs and backed by an IAM role, so a new contractor can start contributing without setting up a local development environment. Which service is purpose-built for this?",o:["AWS CloudShell","AWS Cloud9","Amazon Cognito","AWS CodeStar"],a:[1],e:"Cloud9 is a full browser IDE (editor, debugger, terminal) pre-configured with AWS tooling and an IAM role."},
{q:"A developer runs aws configure --profile staging and enters a separate access key and secret key from their default profile. They then run aws s3 ls. Which credentials are used?",o:["The staging profile's credentials, because named profiles are always used regardless of flags","The default profile's credentials, because no --profile staging flag was passed on the aws s3 ls command itself","Both profiles' credentials are merged automatically","The command fails because two profiles cannot coexist"],a:[1],e:"Without the --profile staging flag on that specific command, the default profile's credentials are used."},
{q:"An application deployed on an EC2 instance needs to call the Amazon S3 API. The team is deciding between hardcoding an IAM user's access keys into the application's configuration file versus attaching an IAM role to the EC2 instance. Which approach is correct, and why?",o:["Hardcoded access keys, because they never expire and are simpler to manage","An IAM role (instance profile), because it provides temporary, automatically-rotated credentials without ever storing a long-term secret on the instance","Either approach is equally secure as long as the config file is not committed to source control","Hardcoded access keys, because IAM roles cannot be attached to running instances"],a:[1],e:"An IAM role/instance profile provides temporary, auto-rotated credentials, avoiding any long-term secret on the instance."},
{q:"A CI/CD build agent running on AWS CodeBuild needs to call several AWS APIs during a build. Following AWS security best practice, how should it obtain credentials?",o:["Store an IAM user's long-term access keys as plaintext environment variables in the build project","Attach an IAM service role to the CodeBuild project so it receives temporary credentials automatically","Prompt a human to paste in temporary credentials at the start of every build","Disable IAM entirely for the build project to simplify configuration"],a:[1],e:"Attach an IAM service role to the CodeBuild project rather than embedding static long-term keys."},
{q:"Which of the following correctly orders the AWS SDK's default credential resolution behavior from HIGHEST to LOWEST priority, for code running on an EC2 instance with both environment variables set and an instance role attached?",o:["Instance role credentials, then environment variables","Environment variables, then the shared credentials file, then the instance role (as the last fallback)","The instance role is always used regardless of any other configured source","Whichever source was configured most recently in time"],a:[1],e:"The default chain checks env vars and the credentials file before falling back to the instance role last."},
{q:"A developer wants to verify, from the command line, exactly which IAM identity (user or role) and which AWS account their currently active credentials belong to, before running a potentially destructive command. Which CLI command accomplishes this?",o:["aws iam list-users","aws sts get-caller-identity","aws configure list-profiles","aws ec2 describe-instances"],a:[1],e:"aws sts get-caller-identity reports the account, ARN, and user/role ID behind the active credentials."},
{q:"A security audit flags that a legacy application still authenticates to AWS using a hardcoded access key and secret key embedded directly in its source code repository. What is the recommended remediation, consistent with AWS best practices covered across this exam?",o:["Leave it as-is if the repository is private","Replace the hardcoded credentials with an IAM role (if running on AWS compute) or, if that isn't possible, retrieve credentials at runtime from a secret-management service rather than embedding them in code","Rotate the key once per year and continue embedding it in the code","Move the credentials into a code comment for visibility"],a:[1],e:"Replace hardcoded credentials with an IAM role where possible, or retrieve secrets at runtime from a secret-management service."},
{q:"Which AWS access method is most appropriate for an application's runtime code (as opposed to a human operator) to call AWS APIs programmatically?",o:["The AWS Management Console","An AWS SDK, using credentials obtained via an attached IAM role","AWS CloudShell","Manually typing AWS CLI commands during each request"],a:[1],e:"Application runtime code should use an SDK backed by role-derived credentials, not manual console/CLI steps."},
{q:"A developer wants to switch between three different AWS accounts (dev, staging, prod) from their local terminal without repeatedly re-entering credentials. What CLI feature is designed for this?",o:["Multiple simultaneous root user logins","Named CLI profiles configured via aws configure --profile <name>, selected per command with --profile","A single shared IAM user across all three accounts","Disabling IAM in two of the three accounts"],a:[1],e:"Named CLI profiles let you switch between multiple accounts'/credential sets easily via --profile."},
{q:"Which two of the following are true about how the AWS Management Console, AWS CLI, and AWS SDKs relate to each other?",o:["All three ultimately call the same underlying AWS REST APIs","All three are governed by the same IAM permissions, so a denied action fails identically regardless of which one is used","The Console has special access that bypasses IAM policy evaluation","The CLI and SDKs share credentials but the Console uses a completely separate authorization system","Only the SDK is capable of triggering billing charges"],a:[0,1],multi:true,e:"All three access paths call the same underlying APIs and are governed by identical IAM permissions."},
{q:"A junior developer asks why their application code should never read the raw response of the EC2 instance metadata service into application logs. What is the security concern being addressed?",o:["It has no security implications; it is purely a performance concern","The metadata service can expose the instance's temporary IAM role credentials, and logging that response risks leaking those credentials","The metadata service response is always encrypted, so logging it is safe","Only Windows instances expose sensitive data via metadata"],a:[1],e:"The metadata service can expose temporary IAM role credentials; logging its raw response risks leaking them."},
{q:"A company wants new engineers to be productive on day one without installing any local tooling, while still being able to write, run, and debug code in an environment that has AWS credentials pre-configured through an IAM role rather than static keys. Which AWS service is the best fit?",o:["AWS Cloud9","Amazon EC2 with manual SSH key distribution","AWS CodeArtifact","Amazon Cognito"],a:[0],e:"Cloud9 offers a ready-to-code browser IDE preconfigured with an IAM role, no local setup required."},
{q:"Which statement about AWS CloudShell is accurate?",o:["It requires a separate CLI installation on the user's machine","It is a browser-based shell, pre-authenticated with the user's console credentials, requiring no local setup","It can only run PowerShell commands","It provisions a permanent, billed EC2 instance per user"],a:[1],e:"CloudShell is browser-based and pre-authenticated with the user's console credentials, no local install needed."},
{q:"A developer's IAM identity has one policy attached that grants s3:* on all resources, and a second policy that explicitly denies s3:DeleteObject on a specific bucket. What is the net effect when the developer attempts to delete an object in that bucket?",o:["The delete succeeds because the broad Allow was attached more recently","The delete is denied, because an explicit Deny in any applicable policy always overrides an Allow, regardless of how broad the Allow is","The delete succeeds because Allow always takes precedence over Deny","The result is undefined and depends on which policy is evaluated first"],a:[1],e:"An explicit Deny in any applicable policy always overrides an Allow, no matter how broad that Allow is."},
{q:"An IAM user has no policies attached at all — not directly, not through a group, and no resource-based policy grants them access either. What can this user do when calling any AWS API?",o:["Everything, since no explicit Deny exists","Nothing, because the default behavior for any action not explicitly allowed is implicit deny","Only read-only actions","Only actions available through the Console, not the CLI"],a:[1],e:"With zero applicable policies, the default implicit deny applies to everything."},
{q:"A Lambda function's execution role currently has no permissions policy granting DynamoDB access, and the function's code calls dynamodb:GetItem. The call fails with an AccessDenied error. What is the correct fix?",o:["Give the Lambda function a set of hardcoded IAM user access keys instead of using a role","Attach or expand a permissions policy on the Lambda function's execution role to grant the required DynamoDB actions","Delete and recreate the DynamoDB table so it inherits new default permissions","Disable IAM enforcement for the Lambda service"],a:[1],e:"Expand the Lambda execution role's permissions policy rather than introducing static credentials."},
{q:"A platform team wants developers to be able to create their own IAM roles for new microservices, but must guarantee that none of those self-created roles can ever be granted permissions broader than a predefined safe maximum, even by accident. Which IAM feature is designed exactly for this?",o:["A permissions boundary attached to the roles developers are allowed to create","An inline policy on the developer's own IAM user","Enabling MFA on the developer's IAM user","A resource-based policy on an S3 bucket"],a:[0],e:"A permissions boundary caps the maximum permissions any role created under it can ever have."},
{q:"Which IAM policy type is created and maintained directly by AWS, cannot be edited by customers, and is typically broader in scope than a hand-tailored policy for a specific task?",o:["Inline policy","Customer managed policy","AWS managed policy","Permissions boundary"],a:[2],e:"AWS managed policies are authored/maintained by AWS and can't be edited by customers."},
{q:"A company wants a policy that is reusable across 12 different IAM roles, independently versioned, and centrally auditable from one place. Which policy type best satisfies these requirements?",o:["An inline policy duplicated across all 12 roles","A customer managed policy, attached to all 12 roles","A resource-based bucket policy","A permissions boundary"],a:[1],e:"A customer managed policy is reusable, independently versioned, and centrally auditable across many identities."},
{q:"Under what circumstance is an inline IAM policy the more appropriate choice over a customer managed policy?",o:["When the exact same permission set needs to be reused across many unrelated identities","When a tightly-scoped, one-off permission needs to be permanently and exclusively tied to a single identity's lifecycle, being deleted automatically if that identity is deleted","Inline policies should never be used under any circumstance","When the policy needs to be shared across AWS accounts"],a:[1],e:"Inline policies suit a tightly-scoped, one-off permission permanently tied to a single identity's lifecycle."},
{q:"Which two components must an IAM role assumed by an AWS Lambda function have configured correctly for the function to both be allowed to assume the role AND perform its intended actions?",o:["A trust policy naming lambda.amazonaws.com as a trusted principal allowed to call sts:AssumeRole","A permissions policy granting the specific actions the function's code needs to perform","A long-term IAM user access key embedded in the function's environment variables","A Route 53 hosted zone","An EC2 key pair"],a:[0,1],multi:true,e:"A trust policy (who can assume the role) and a permissions policy (what it can do) are both required."},
{q:"A company in Account A wants to grant a partner company in Account B temporary, auditable access to a specific S3 bucket, without creating any IAM user or sharing any long-term credentials across the account boundary. What is the recommended pattern?",o:["Create an IAM user in Account A and email its access key to Account B","Create an IAM role in Account A with a trust policy naming Account B as a trusted principal; Account B's principals call sts:AssumeRole to receive temporary credentials","Share Account A's root user password with Account B","Disable IAM on the S3 bucket"],a:[1],e:"Cross-account role assumption via a trust policy avoids ever sharing long-term credentials."},
{q:"What does a successful call to sts:AssumeRole return to the caller?",o:["A new, permanent IAM user","Temporary security credentials: an access key ID, secret access key, and session token, valid for a limited duration","A CloudFormation stack ARN","A permanent replacement for the caller's original credentials"],a:[1],e:"AssumeRole returns temporary credentials: access key, secret key, and session token."},
{q:"A policy statement includes a condition requiring aws:MultiFactorAuthPresent to be true, attached to an Allow statement for a sensitive iam:DeleteRole action. What is the effect of this condition?",o:["It has no functional effect and is purely documentation","It restricts the Allow so the action only succeeds if the caller authenticated using multi-factor authentication","It requires the caller to be using a VPN","It automatically enables MFA for the caller if they don't already have it"],a:[1],e:"This condition restricts the Allow to only succeed when the caller authenticated with MFA."},
{q:"Two policy statements apply to the same IAM role: one grants dynamodb:Query and dynamodb:GetItem scoped to a single table's ARN; a second, broader statement elsewhere grants dynamodb:* on all resources. From a least-privilege design perspective, what is the problem with this combination?",o:["There is no problem; combining broad and narrow statements is the recommended pattern","The broad wildcard statement undermines the least-privilege intent of the narrow statement, since the role effectively has unrestricted DynamoDB access across all tables","DynamoDB does not support wildcard resource ARNs, so the broad statement is invalid","The narrow statement silently overrides the broad one automatically"],a:[1],e:"The broad wildcard statement undermines the least-privilege intent of the narrower one, since Allows combine."},
{q:"A company uses AWS Organizations to manage 15 linked AWS accounts and wants to enforce an account-wide guardrail preventing any identity in any of those accounts — even an account administrator — from ever disabling CloudTrail logging. Which mechanism operates at the right scope to enforce this?",o:["An IAM permissions boundary applied individually to every user in every account","A Service Control Policy (SCP) applied at the AWS Organizations level","An S3 bucket policy","A Lambda resource-based policy"],a:[1],e:"SCPs, applied at the Organizations/OU level, are the right scope for an account-wide, unbypassable guardrail."},
{q:"Which statement correctly describes the relationship between Service Control Policies (SCPs) and IAM policies?",o:["SCPs replace IAM policies entirely; once SCPs are enabled, IAM policies are ignored","SCPs set the maximum available permissions (guardrails) at the account/OU level; IAM policies still must separately grant the actual permissions within whatever an SCP allows","SCPs only apply to S3 and have no effect on other services","SCPs and IAM policies are evaluated completely independently with no interaction"],a:[1],e:"SCPs set maximum available permissions as guardrails; IAM policies still grant actual permissions within that boundary."},
{q:"An engineer wants to identify whether any S3 bucket or IAM role in their account has been configured to allow access from outside their AWS account or AWS Organization, possibly unintentionally. Which AWS capability is designed to surface exactly this?",o:["AWS Budgets","IAM Access Analyzer","Amazon Inspector","AWS Trusted Advisor (Basic support tier)"],a:[1],e:"IAM Access Analyzer identifies resources shared with entities outside the account/organization."},
{q:"A resource-based policy is attached directly to an S3 bucket, granting a specific external AWS account read access to objects in that bucket. Which of the following is true about this policy type compared to an identity-based policy?",o:["Resource-based policies can only be used with IAM users, never with external accounts","A resource-based policy is attached to the resource itself (here, the bucket) rather than to an identity, and can grant access to principals outside the resource owner's own account","Resource-based policies cannot include a Principal element","Resource-based policies always take lower precedence than identity-based policies"],a:[1],e:"A resource-based policy attaches to the resource and can grant access to principals outside the owner's account."},
{q:"Which two of the following actions would violate the principle of least privilege for an IAM role attached to a Lambda function whose only job is to read (not write) items from a single specified DynamoDB table?",o:["Granting only dynamodb:GetItem and dynamodb:Query scoped to that table's ARN","Granting dynamodb:* scoped to all resources","Granting dynamodb:DeleteTable scoped to that same table's ARN, in addition to the read actions","Granting dynamodb:GetItem scoped only to that table's ARN","Omitting any DynamoDB permissions entirely"],a:[1,2],multi:true,e:"A wildcard grant and an unnecessary DeleteTable permission both exceed what a read-only function needs."},
{q:"A policy's Resource element is set to arn:aws:s3:::finance-reports/*. Which of the following does this scope the statement to?",o:["The bucket resource itself only, not any objects inside it","The objects stored inside the finance-reports bucket, not the bucket resource itself (bucket-level actions like s3:ListBucket require the bucket ARN without the /* suffix)","Every bucket in the AWS account","Nothing; this is invalid ARN syntax"],a:[1],e:"The /* suffix scopes to objects inside the bucket; bucket-level actions need the bare bucket ARN."},
{q:"What is the correct way to interpret least privilege when a DVA-C02 question asks which IAM policy a developer should attach to a new role?",o:["Attach the broadest AWS managed policy available, to avoid future access issues","Grant only the specific actions and resources required for the role's actual task, and nothing more","Always attach AdministratorAccess for new roles during initial development, then narrow it later","Least privilege only applies to production environments, not development"],a:[1],e:"Least privilege means granting only what's actually required for the task, nothing broader."},
{q:"An IAM policy simulator check shows that a user is denied s3:GetObject on a bucket despite having an identity-based policy that allows s3:* on all resources. Investigation reveals the bucket has a bucket policy explicitly denying access from any principal outside a specific VPC endpoint, and the user is connecting from outside that VPC. What determines the final outcome?",o:["The identity-based Allow wins because it is more specific","The explicit Deny in the bucket's resource-based policy wins over the identity-based Allow, regardless of how broad the Allow is","The most recently modified policy wins","Bucket policies cannot deny access that an identity policy allows"],a:[1],e:"The resource-based policy's explicit Deny overrides the identity-based Allow regardless of its breadth."},
{q:"Which of the following is NOT a valid value for the Effect element in an IAM policy statement?",o:["Allow","Deny","Restrict","Both A and B are the only valid values, making C invalid"],a:[2],e:"Restrict is not a valid Effect value; only Allow and Deny are valid."},
{q:"A company wants every new IAM role created by its development teams to automatically be prevented from ever being granted iam:* (full IAM administration) permissions, no matter what policies a developer later attaches to that role. Which single IAM feature enforces this at role-creation time?",o:["A permissions boundary set to deny/exclude iam:* actions, attached to every role developers create","A customer managed policy attached after the fact","An inline policy attached to the developer's own user","MFA enforcement on the developer's user"],a:[0],e:"A permissions boundary constrains the maximum permissions any role created under it can ever receive, including iam:*."},
{q:"Two IAM policies are evaluated for a single API call: Policy X allows the action with no conditions; Policy Y denies the same action only when the request does not originate from a specific corporate IP range. A request arrives from outside that IP range. What is the result?",o:["Allowed, because Policy X is unconditional","Denied, because Policy Y's explicit Deny condition is met by this request, and explicit Deny always overrides Allow","Allowed, because two policies conflicting always defaults to Allow","The system throws an error and the request is discarded"],a:[1],e:"Policy Y's Deny condition is met by this request, and an explicit Deny always overrides an Allow."},
{q:"Which best explains why AWS recommends using IAM roles instead of IAM users for workloads running on EC2, Lambda, or ECS?",o:["Roles are cheaper than users","Roles provide temporary, automatically-rotated credentials obtained via assumption, eliminating the need to store and manage long-term secrets on compute resources","Roles support more total permissions than users can ever have","Roles are required for the console to function at all"],a:[1],e:"Roles provide temporary, auto-rotated credentials, removing the need to manage long-term secrets on compute resources."},
{q:"A condition key of aws:SourceIp is added to a Deny statement in an S3 bucket policy, denying all access to requests NOT originating from 198.51.100.0/24. What does this achieve?",o:["It encrypts all objects in the bucket automatically","It restricts bucket access to only the specified IP range by explicitly denying everything outside it","It only affects the AWS Management Console, not the CLI or SDK","It has no effect on S3, since S3 does not support IP-based conditions"],a:[1],e:"This Deny statement restricts bucket access to only the specified IP range."},
{q:"Fine-grained access control that lets each authenticated end user of an application access only the DynamoDB items belonging to their own user ID, using a single shared IAM role rather than one role per user, is best achieved using:",o:["A separate IAM role manually created for every application end user","IAM policy condition keys such as dynamodb:LeadingKeys, mapping the caller's identity to the partition key they're allowed to access","Removing IAM entirely for that table","A permissions boundary with no condition keys"],a:[1],e:"dynamodb:LeadingKeys scopes per-user access to items matching the caller's own partition key via a single shared role."},
{q:"Which two statements correctly describe IAM groups?",o:["Groups allow applying a shared set of policies to many IAM users at once","Groups can be nested inside other groups for hierarchical permission management","Groups cannot be used as a principal in a resource-based policy","Groups can be assumed by EC2 instances the same way roles can","Groups replace the need for any IAM policy entirely"],a:[0,2],multi:true,e:"Groups apply shared policies to many users, and cannot act as a principal in a resource-based policy."},
{q:"A new employee's IAM user is added to a group that grants read-only S3 access, and separately has an inline policy directly on their user granting s3:DeleteBucket. With no explicit Deny anywhere, what can this user do?",o:["Only read-only S3 actions, since group policies always take precedence over inline policies","Both the read-only group-granted actions and the individually-granted s3:DeleteBucket action, since without conflicting explicit Denies, all applicable Allows across every attached policy combine","Nothing, because a user cannot have both a group policy and an inline policy simultaneously","Only s3:DeleteBucket, since inline policies override group policies entirely"],a:[1],e:"Without conflicting explicit Denies, all Allows across every attached policy (group and inline) combine."},
{q:"A company's security team wants to periodically verify that no IAM policy in the account grants overly permissive access (such as full-wildcard action and resource) before it causes an incident. Besides manual review, which AWS-native capability supports this kind of proactive analysis?",o:["AWS Budgets","IAM Access Analyzer, which can also validate policies against AWS best practices","Amazon Route 53 health checks","AWS CodeArtifact"],a:[1],e:"IAM Access Analyzer supports proactive policy validation against best practices, beyond manual review."},
{q:"Which of the following is the most accurate summary of IAM policy evaluation order for a single API request touching one resource?",o:["Random order between all applicable policies","Explicit Deny (in any applicable identity-based, resource-based, permissions boundary, or SCP policy) beats explicit Allow, which beats the default implicit deny","Whichever policy was created first always wins","Resource-based policies are always ignored if an identity-based policy exists"],a:[1],e:"Explicit Deny (from any applicable policy source) beats explicit Allow, which beats implicit deny by default."},
{q:"A company runs its application on self-managed EC2 instances. During a security review, the team is asked who is responsible for patching the guest operating system running on those instances. According to the Shared Responsibility Model, who owns this task?",o:["AWS, as part of security of the cloud","The customer, since guest OS patching on EC2 falls under security in the cloud","Neither party; AWS EC2 instances patch themselves automatically with no configuration","AWS Support, but only on the Enterprise support plan"],a:[1],e:"Guest OS patching on EC2 is the customer's security in the cloud responsibility."},
{q:"A team migrating a workload from EC2 to AWS Lambda asks how their patching responsibilities change. Which statement accurately describes the shift?",o:["Responsibilities are identical on both services; nothing changes","On Lambda, AWS patches the underlying execution environment and manages the runtime host, while the customer still owns their function code, chosen runtime version, dependencies, and the IAM permissions granted to the function","On Lambda, the customer becomes responsible for patching the physical hardware","Moving to Lambda eliminates all customer security responsibilities entirely"],a:[1],e:"On Lambda, AWS manages the execution host/runtime patching, but code, dependencies, runtime choice, and IAM stay with the customer."},
{q:"For an Amazon RDS database with auto minor version upgrade enabled, who is responsible for applying the database engine's minor version patches?",o:["The customer must manually apply every minor patch","AWS applies them automatically as part of the managed RDS service","A third-party contractor selected by AWS","The patches are optional and never required"],a:[1],e:"With auto minor version upgrade enabled, AWS applies RDS engine minor patches as part of the managed service."},
{q:"Regardless of which AWS service is used — EC2, Lambda, RDS, or DynamoDB — which of the following always remains the customer's responsibility under the Shared Responsibility Model?",o:["Patching the hypervisor","IAM configuration and classification/protection of the customer's own data","Physical data center security","Maintaining the global network backbone"],a:[1],e:"IAM configuration and data classification/protection are always customer responsibilities, across every service."},
{q:"A company enables server-side encryption on an S3 bucket using an AWS KMS customer-managed key. Which parts of this setup are the customer's responsibility versus AWS's?",o:["AWS is responsible for everything, including key policy configuration","The customer is responsible for choosing to enable encryption, configuring the KMS key and its policy/rotation settings; AWS is responsible for the underlying encryption implementation and physical security of the storage","The customer has no responsibility once encryption is enabled once","Encryption at rest is impossible on S3 regardless of configuration"],a:[1],e:"The customer configures encryption and key settings; AWS implements and physically secures the underlying mechanism."},
{q:"Who is responsible for configuring TLS/HTTPS so that data is encrypted in transit between a client and an application's own API endpoints?",o:["AWS automatically encrypts all traffic with no customer configuration required, for every service","The customer must explicitly configure TLS/HTTPS for their own application endpoints","This responsibility does not exist on AWS","Only AWS Support can configure this, upon request"],a:[1],e:"Customers must explicitly configure TLS/HTTPS for their own application endpoints; it isn't automatic for arbitrary apps."},
{q:"Which phrase pairing correctly matches security OF the cloud and security IN the cloud to their respective owners?",o:["OF the cloud = customer; IN the cloud = AWS","OF the cloud = AWS (physical infrastructure, hypervisor, managed-service internals); IN the cloud = customer (data, IAM config, guest OS where applicable, application-level security)","Both phrases refer to AWS's responsibilities only","Both phrases refer to the customer's responsibilities only"],a:[1],e:"OF the cloud is AWS's job (infrastructure); IN the cloud is the customer's job (data, IAM, app security)."},
{q:"A company using DynamoDB (a fully managed NoSQL database) asks whether the Shared Responsibility Model still applies, given how much AWS manages. Which statement is correct?",o:["The model no longer applies once a service is fully managed","The model still applies — AWS manages more of the underlying infrastructure (servers, OS, patching, scaling) for a fully managed service, but the customer still owns IAM permissions, data content, and access configuration","The customer has zero responsibilities on any fully managed service","AWS becomes responsible for the customer's IAM policies once a service is fully managed"],a:[1],e:"The model still applies; AWS manages more infrastructure on fully managed services, but IAM/data ownership stays with the customer."},
{q:"A startup's new backend developer assumes that because AWS handles security, they don't need to configure IAM policies carefully for their Lambda functions. Why is this assumption incorrect?",o:["It is actually correct; AWS configures all IAM policies automatically","IAM configuration (least-privilege permissions, role scoping) is explicitly a customer responsibility under the Shared Responsibility Model, regardless of how managed the compute service is","Only EC2-based workloads require IAM configuration by the customer","IAM only matters for AWS Support cases, not application security"],a:[1],e:"IAM configuration remains a customer responsibility regardless of how managed the underlying compute service is."},
{q:"Which of these responsibilities shifts from the customer toward AWS as a workload moves from EC2 to Elastic Beanstalk to Lambda, in terms of increasing service abstraction?",o:["IAM permission configuration","Underlying server/OS/infrastructure management","Application code correctness","Data classification decisions"],a:[1],e:"Underlying server/OS/infrastructure management increasingly shifts to AWS as abstraction increases; IAM, code, and data classification stay with the customer."},
{q:"A company stores personally identifiable information (PII) in an application database and asks AWS Support who is responsible for classifying that data as sensitive and applying appropriate access controls. What is the correct answer?",o:["AWS Support classifies and protects all customer data automatically","The customer is responsible for data classification (e.g., identifying PII/PHI) and for applying the appropriate access controls and encryption","Data classification is not necessary on AWS","Only Amazon Macie users need to classify data; everyone else is exempt"],a:[1],e:"The customer is responsible for classifying sensitive data and applying appropriate controls."},
{q:"Under the Shared Responsibility Model, which of the following is always AWS's responsibility, with no service-dependent exceptions?",o:["The customer's application-level authentication logic","Physical security of AWS data centers and the global network infrastructure","The customer's choice of IAM policy scope","The customer's encryption key rotation schedule"],a:[1],e:"Physical data center and global network security are always AWS's responsibility, with no service-dependent exceptions."},
{q:"Which two of the following are customer responsibilities on Amazon RDS, even with automated backups and Multi-AZ enabled?",o:["Configuring IAM database authentication or credential management appropriately","Choosing appropriate instance sizing and monitoring for the workload","Patching the underlying hypervisor","Replacing failed physical storage hardware","Building the RDS service's internal replication engine"],a:[0,1],multi:true,e:"Credential/IAM database auth configuration and appropriate instance sizing/monitoring remain customer responsibilities even with Multi-AZ."},
{q:"A company assumes that enabling Multi-AZ on RDS makes patch management no longer necessary. Why is this assumption wrong?",o:["Multi-AZ has nothing to do with patching, and even with auto minor version upgrade, the customer is still responsible for approving/scheduling major version upgrades and overall database configuration decisions","Multi-AZ disables all patching permanently","Multi-AZ transfers all future responsibilities to the customer instead","Multi-AZ is unrelated to RDS entirely"],a:[0],e:"Multi-AZ addresses availability, not patch/version management; major version upgrade decisions remain a customer responsibility."},
{q:"A company runs a batch video-rendering workload that can tolerate interruption and automatically resume from checkpoints, and wants to minimize compute cost as much as possible. Which EC2 pricing model offers the deepest discount for this profile?",o:["On-Demand Instances","Standard Reserved Instances","Spot Instances","Dedicated Hosts"],a:[2],e:"Spot Instances offer the deepest discount for interruption-tolerant, checkpointable workloads."},
{q:"A finance team commits to running a fixed fleet of application servers 24/7 for the next three years and wants the largest possible discount in exchange for that commitment, while accepting reduced flexibility to change instance families later. Which purchasing option best fits?",o:["Spot Instances","Standard Reserved Instances","On-Demand Instances","Dedicated Instances with no commitment"],a:[1],e:"Standard RIs trade reduced flexibility for the largest discount on a 1-3 year commitment."},
{q:"A company runs commercial database software licensed per physical CPU socket, a licensing model that requires visibility into and control over the specific physical server the software runs on. Which EC2 purchasing option satisfies this licensing requirement?",o:["On-Demand Instances","Spot Instances","Dedicated Hosts","Savings Plans"],a:[2],e:"Dedicated Hosts expose the physical server, satisfying socket-based licensing requirements."},
{q:"A team wants a compute discount that flexibly applies across a mix of EC2 instances, Fargate tasks, and Lambda invocations, without committing to a specific instance family or service ahead of time. Which pricing construct is designed for this flexibility?",o:["Standard Reserved Instances","Compute Savings Plans","Spot Instances","Dedicated Hosts"],a:[1],e:"Compute Savings Plans flexibly apply across EC2, Fargate, and Lambda usage."},
{q:"Which of the following workloads is the LEAST appropriate candidate for Spot Instances?",o:["A CI/CD build fleet that can restart failed jobs automatically","A distributed batch-rendering farm designed for node loss","A single-node production database with no replica and no automated failover","An ad-hoc data analysis cluster that checkpoints progress periodically"],a:[2],e:"A single-node production database with no failover is the worst fit for Spot's interruption model."},
{q:"An AWS Organization with consolidated billing has 8 linked accounts. One account purchases a set of Reserved Instances. Under default settings, can the RI discount apply to matching instance usage in the other 7 linked accounts?",o:["No, RI discounts never share across accounts under any configuration","Yes, RI (and Savings Plan) discounts can be shared across linked accounts within an AWS Organization under consolidated billing","Only if each account separately purchases its own identical RIs","Only if all 8 accounts are in the same Availability Zone"],a:[1],e:"RI/Savings Plan discounts can be shared across linked accounts under AWS Organizations consolidated billing."},
{q:"A small team is testing AWS services in a non-production sandbox account and wants email-based, business-hours support access if they run into a service question, without paying for 24/7 guaranteed response times. Which AWS Support plan tier fits this need most cost-effectively?",o:["Basic","Developer","Business","Enterprise"],a:[1],e:"Developer support provides business-hours email access appropriate for sandbox/testing use."},
{q:"A company running a production workload experiences an outage and needs guaranteed access to a support engineer 24/7 with fast response times, but does not require a named Technical Account Manager. Which is the minimum support tier that satisfies this?",o:["Basic","Developer","Business","None of the paid tiers include 24/7 engineer access"],a:[2],e:"Business support is the minimum tier including 24/7 engineer access with fast response times."},
{q:"Which AWS Support plan is the only one that includes a dedicated Technical Account Manager (TAM)?",o:["Business","Developer","Enterprise","Basic"],a:[2],e:"Only Enterprise support includes a dedicated Technical Account Manager."},
{q:"A finance team wants automatic email alerts whenever forecasted AWS spend is on track to exceed a monthly threshold, before the month closes. Which AWS service is purpose-built for this?",o:["AWS Cost Explorer alone, with no alerting capability","AWS Budgets, which supports threshold-based and forecasted-spend alerts","AWS CloudTrail","AWS Trusted Advisor Basic checks only"],a:[1],e:"AWS Budgets supports threshold and forecasted-spend alerting."},
{q:"Which AWS service is best suited for visualizing and forecasting historical AWS spend trends over time, without configuring proactive alerts?",o:["AWS Cost Explorer","Amazon CloudWatch Logs","AWS Config","AWS X-Ray"],a:[0],e:"Cost Explorer is designed for visualizing and forecasting historical spend trends."},
{q:"A workload has highly unpredictable, bursty traffic, and the team explicitly does not want to make any capacity commitment. Which EC2 pricing model matches this requirement, accepting a higher per-unit cost in exchange for maximum flexibility?",o:["Standard Reserved Instances","On-Demand Instances","3-year Savings Plans","Dedicated Hosts"],a:[1],e:"On-Demand suits unpredictable, bursty usage with no commitment, at a higher per-unit cost."},
{q:"Which two statements correctly distinguish Savings Plans from Reserved Instances?",o:["Savings Plans commit to a consistent dollar-per-hour spend, applied flexibly across eligible usage, rather than to one specific instance configuration","Reserved Instances commit to specific instance attributes (family, in the case of Standard RIs) in exchange for their discount","Savings Plans can only be purchased for exactly 6 months","Reserved Instances can never be resold or exchanged under any circumstance","Savings Plans and Reserved Instances provide identical discounts with zero differences"],a:[0,1],multi:true,e:"Savings Plans commit to flexible $/hour spend; RIs commit to specific instance attributes for their discount."},
{q:"A company's AWS Free Tier 12-month period has expired, but their monthly Lambda usage remains under 1 million requests and under 400,000 GB-seconds of compute time. What happens to their Lambda charges for usage within those limits?",o:["They are billed normally since the 12-month Free Tier has expired","They remain free, because certain Lambda usage is part of an Always Free tier that does not expire after 12 months","They are billed at double the standard rate as a post-Free-Tier penalty","Free Tier eligibility is determined solely by account age, unrelated to usage amount"],a:[1],e:"Some Lambda usage falls under an Always Free tier that persists beyond the initial 12 months."},
{q:"Dedicated Hosts, compared to Dedicated Instances, provide which additional capability that matters for certain enterprise licensing scenarios?",o:["A larger discount over On-Demand pricing in all cases","Visibility into and control over the specific physical server and its socket/core layout","Automatic conversion to Spot pricing","Free data transfer between Regions"],a:[1],e:"Dedicated Hosts provide visibility/control over the physical server's socket and core layout."},
{q:"A company wants to reduce EC2 compute costs by up to approximately 90% for a workload consisting of many small, independent, restartable worker processes, and is willing to accept instance interruption with a short notice period. Which pricing model delivers this level of discount?",o:["On-Demand Instances","Spot Instances","Standard Reserved Instances","Dedicated Hosts"],a:[1],e:"Spot Instances can offer up to roughly 90% savings for interruption-tolerant, restartable workloads."},
{q:"Which AWS Support plan tier provides access to the complete set of Trusted Advisor checks (not just the limited free checks)?",o:["Basic only","Business and above","Developer only","No support tier includes Trusted Advisor"],a:[1],e:"Business support (and above) includes access to the full set of Trusted Advisor checks."},
{q:"A team wants to set a hard monthly spending limit alert of 5,000 dollars for a specific project, tagged accordingly, with a notification sent once forecasted spend is projected to cross that limit before month-end. Which AWS capability, combined with cost allocation tags, achieves this?",o:["AWS Budgets scoped by cost allocation tag, with a forecasted-spend alert","AWS CloudTrail event filtering","Amazon GuardDuty findings","AWS Config conformance packs"],a:[0],e:"AWS Budgets, scoped by cost allocation tag, with a forecasted-spend alert, satisfies this exactly."},
{q:"Which of the following is NOT one of the standard EC2 purchasing options?",o:["On-Demand","Spot","Guaranteed Instances","Reserved Instances / Savings Plans"],a:[2],e:"Guaranteed Instances is not a real EC2 purchasing option."},
{q:"A billing analyst notices Reserved Instance coverage is at 60% for steady-state workloads, while some short-lived dev/test instances remain uncovered and running On-Demand. Is this mixed approach considered a cost-optimization anti-pattern?",o:["Yes, everything should always run as Reserved Instances","No — matching predictable steady-state usage to Reserved Instances/Savings Plans while leaving unpredictable short-lived usage on On-Demand is the recommended cost-optimization pattern, not an anti-pattern","Yes, all workloads should run exclusively On-Demand","No, but only because Spot Instances were not used instead"],a:[1],e:"Matching steady-state usage to RIs/Savings Plans while leaving unpredictable usage On-Demand is the recommended pattern."},
{q:"A company is deciding between a cheaper single-AZ RDS deployment and a more expensive Multi-AZ deployment with automatic failover for a production order-processing database. Choosing Multi-AZ despite the added cost primarily reflects a deliberate tradeoff favoring which Well-Architected pillar over Cost Optimization?",o:["Sustainability","Reliability","Performance Efficiency","Operational Excellence"],a:[1],e:"Paying more for Multi-AZ failover is a deliberate Reliability-over-Cost tradeoff."},
{q:"Which Well-Architected Framework pillar is most directly concerned with encryption choices, IAM least-privilege design, and identity/access management decisions?",o:["Cost Optimization","Security","Performance Efficiency","Sustainability"],a:[1],e:"Encryption and IAM least-privilege design fall under the Security pillar."},
{q:"A team automates infrastructure deployments and replaces error-prone manual server configuration steps with repeatable, version-controlled infrastructure-as-code templates. This change is best described as optimizing for which pillar?",o:["Operational Excellence","Security only","Cost Optimization only","None of the six pillars directly"],a:[0],e:"Automating deployments and removing manual, error-prone steps maps to Operational Excellence."},
{q:"How many pillars does the AWS Well-Architected Framework currently define?",o:["4","5","6","8"],a:[2],e:"The framework currently defines six pillars."},
{q:"A company tags all of its AWS resources with env, owner, and cost-center keys. Which two practical benefits does this tagging strategy directly enable?",o:["Cost allocation reports broken down by team or environment","Automatic relocation of resources to a different AWS Region","Automation scripts that can identify and act on resources by tag (for example, stopping all env=dev resources overnight)","Replacing the need for any IAM policy","Automatic encryption of all tagged resources"],a:[0,2],multi:true,e:"Tags enable cost allocation reporting and tag-based automation."},
{q:"Can an IAM policy grant or restrict access based on a resource's tag value, rather than only its ARN?",o:["No, tags have no relationship to IAM at all","Yes, using condition keys such as aws:ResourceTag to scope access based on a resource's tags","Only for EC2 instances, no other service","Only when using the root user"],a:[1],e:"aws:ResourceTag condition keys allow tag-based access control in IAM policies."},
{q:"A team consistently over-provisions EC2 instance sizes to be safe, without ever reviewing actual CPU/memory utilization data to right-size afterward. This practice most directly conflicts with which Well-Architected pillar?",o:["Security","Cost Optimization","Reliability","Sustainability is entirely unrelated to compute sizing"],a:[1],e:"Chronic over-provisioning without right-sizing review is a Cost Optimization anti-pattern."},
{q:"Which AWS capability allows viewing and managing resources across multiple different AWS services together, grouped by a shared tag rather than by service type?",o:["AWS Resource Groups","Amazon Route 53","AWS Certificate Manager","AWS X-Ray"],a:[0],e:"AWS Resource Groups let you view/manage resources across services by shared tag."},
{q:"A company's leadership asks the cloud team to reduce the carbon footprint of its workloads by choosing efficient instance types, right-sizing, and using managed services where practical. This objective maps most directly to which Well-Architected pillar, introduced as the sixth pillar?",o:["Reliability","Sustainability","Security","Performance Efficiency"],a:[1],e:"Sustainability, the sixth pillar, addresses environmental/carbon-footprint impact of workloads."},
{q:"Which Well-Architected pillar is best demonstrated by a multi-AZ Auto Scaling Group with automated health-check-based instance replacement, ensuring the application recovers automatically from an instance or AZ failure?",o:["Cost Optimization","Reliability","Sustainability","Security"],a:[1],e:"Automated, multi-AZ failure recovery is a textbook Reliability pattern."},

];

let idx = 0, score = 0, answered = new Array(QUESTIONS.length).fill(false), correctFlags = new Array(QUESTIONS.length).fill(false), missed = [];
const STORAGE_KEY = "aws-dva-quiz-00";

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({idx, score, answered, correctFlags}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.answered) && d.answered.length === QUESTIONS.length){
      idx = d.idx; score = d.score; answered = d.answered; correctFlags = d.correctFlags;
      return true;
    }
  }catch(e){}
  return false;
}

const quizArea = document.getElementById("quizArea");
const posNum = document.getElementById("posNum");
const scoreNum = document.getElementById("scoreNum");
const progressFill = document.getElementById("progressFill");

function updateTop(){
  posNum.textContent = (idx+1) + " / " + QUESTIONS.length;
  scoreNum.textContent = score;
  const answeredCount = answered.filter(Boolean).length;
  progressFill.style.width = (answeredCount / QUESTIONS.length * 100) + "%";
}

function renderQuestion(){
  const item = QUESTIONS[idx];
  const isMulti = !!item.multi;
  const done = answered[idx];
  let html = "";
  html += '<div class="card">';
  html += '<div class="qnum">Question ' + (idx+1) + '</div>';
  if(isMulti) html += '<div class="multi-hint">Select all that apply</div><br>';
  html += '<div class="qtext">' + escapeHtml(item.q) + '</div>';
  item.o.forEach((optText, i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = "opt";
    if(done){
      if(item.a.includes(i)) cls += " correct";
      else if(item.picked && item.picked.includes(i)) cls += " incorrect";
    } else if(item.picked && item.picked.includes(i)){
      cls += " selected";
    }
    html += '<button class="' + cls + '" data-i="' + i + '" ' + (done?'disabled':'') + '>' +
      '<span class="mark">' + letter + '</span><span>' + escapeHtml(optText) + '</span></button>';
  });
  if(done){
    html += '<div class="explain"><b>' + (correctFlags[idx] ? "Correct. " : "Not quite. ") + '</b>' + escapeHtml(item.e) + '</div>';
  }
  html += '<div class="actions">';
  if(isMulti && !done){
    html += '<button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>';
  }
  if(done){
    if(idx < QUESTIONS.length - 1){
      html += '<button class="btn btn-primary" id="nextBtn">Next question</button>';
    } else {
      html += '<button class="btn btn-primary" id="finishBtn">See results</button>';
    }
  }
  html += '<button class="btn btn-ghost" id="resetBtn">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  updateTop();
  wireOptions(item, isMulti, done);
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function wireOptions(item, isMulti, done){
  const opts = quizArea.querySelectorAll(".opt");
  opts.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(done) return;
      const i = parseInt(btn.dataset.i, 10);
      if(isMulti){
        item.picked = item.picked || [];
        const pos = item.picked.indexOf(i);
        if(pos >= 0) item.picked.splice(pos,1); else item.picked.push(i);
        renderQuestion();
        const submitBtn = document.getElementById("submitBtn");
        if(submitBtn) submitBtn.disabled = !(item.picked && item.picked.length > 0);
      } else {
        item.picked = [i];
        commitAnswer(item);
      }
    });
  });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn){
    submitBtn.disabled = !(item.picked && item.picked.length > 0);
    submitBtn.addEventListener("click", ()=> commitAnswer(item));
  }
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ idx++; save(); renderQuestion(); });
  const finishBtn = document.getElementById("finishBtn");
  if(finishBtn) finishBtn.addEventListener("click", renderSummary);
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", resetAll);
}

function commitAnswer(item){
  if(answered[idx]) return;
  answered[idx] = true;
  const correct = item.picked.length === item.a.length && item.picked.every(p => item.a.includes(p));
  correctFlags[idx] = correct;
  if(correct) score++; else missed.push(idx);
  save();
  renderQuestion();
}

function renderSummary(){
  const pct = Math.round(score / QUESTIONS.length * 100);
  const passed = pct >= 72;
  let html = '<div class="card summary">';
  html += '<div class="eyebrow">Results</div>';
  html += '<div class="score-big">' + score + ' / ' + QUESTIONS.length + '</div>';
  html += '<div class="score-pct ' + (passed?'pass':'fail') + '">' + pct + '% — ' + (passed ? "Solid, above the ~72% pass bar" : "Below the ~72% pass bar — revisit the notes") + '</div>';
  const missedList = answered.map((_,i)=>i).filter(i => !correctFlags[i]);
  if(missedList.length){
    html += '<div class="miss-list"><h3>Review these questions</h3>';
    missedList.forEach(i=>{
      html += '<div class="miss-item"><b>Q' + (i+1) + '.</b> ' + escapeHtml(QUESTIONS[i].q) + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="actions" style="justify-content:center; margin-top:22px;">';
  html += '<button class="btn btn-primary" id="restartBtn">Restart quiz</button>';
  html += '<button class="btn btn-ghost" id="resetBtn2">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  document.getElementById("restartBtn").addEventListener("click", resetAll);
  document.getElementById("resetBtn2").addEventListener("click", resetAll);
}

function resetAll(){
  idx = 0; score = 0; missed = [];
  answered = new Array(QUESTIONS.length).fill(false);
  correctFlags = new Array(QUESTIONS.length).fill(false);
  QUESTIONS.forEach(q => { delete q.picked; });
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderQuestion();
}

document.addEventListener("keydown", (e)=>{
  const map = {"1":0,"2":1,"3":2,"4":3,"5":4,"a":0,"b":1,"c":2,"d":3,"e":4,"A":0,"B":1,"C":2,"D":3,"E":4};
  if(e.key in map){
    const opts = quizArea.querySelectorAll(".opt:not(:disabled)");
    const i = map[e.key];
    if(opts[i]) opts[i].click();
  } else if(e.key === "Enter"){
    const nb = document.getElementById("nextBtn") || document.getElementById("finishBtn") || document.getElementById("submitBtn");
    if(nb && !nb.disabled) nb.click();
  }
});

if(load()){
  if(answered.every(Boolean)) renderSummary(); else renderQuestion();
} else {
  renderQuestion();
}
</script>

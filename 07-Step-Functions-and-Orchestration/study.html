const NOTES_MD = `# Module 07 — Step Functions & Orchestration

Domain focus: primarily **Development with AWS Services (32%)** — Step Functions is the exam's flagship answer whenever a scenario needs to coordinate multiple AWS services in a defined sequence, with visibility, retries, and error handling built in rather than hand-rolled. It also carries the exam's explicit **orchestration vs. choreography** architectural-pattern distinction (Domain 1.1), and touches Deployment (Domain 3) lightly through CloudFormation/SAM-managed state machines, which gets full depth in module 13. By day 4 of the sprint you already know Lambda (module 04) and SQS/SNS/EventBridge (module 06) — Step Functions is the piece that ties those primitives into a single, coordinated, debuggable workflow.

## 1. What Step Functions actually is

AWS Step Functions is a fully managed **orchestration service**: you define a **state machine** — a sequence of steps ("states") with explicit transitions, branching logic, parallelism, and error handling — and Step Functions executes it, tracking exactly which state is active, what data is flowing through it, and what happened at every step. Contrast this with wiring services together yourself with Lambda functions calling other Lambda functions, or chaining SQS queues and EventBridge rules: that approach works, but the "what's the current state of this business process, and what failed" question becomes something you have to reconstruct from scattered logs. Step Functions makes the workflow itself a first-class, inspectable resource.

A state machine is defined in the **Amazon States Language (ASL)** — a JSON-based, declarative language. You are not writing imperative code that says "call this, then call that"; you're describing a graph of states and how execution should move between them, including what happens on success, on specific errors, and on timeout. The state machine definition is itself deployable infrastructure (often via CloudFormation or SAM — see module 13), which is exactly why the exam frames Step Functions as a Deployment-domain topic too, not just a Development-domain one.

**Why this matters for the exam:** whenever a scenario describes multiple steps that must happen *in order*, with conditional branching, needing to survive partial failures, needing a human approval step, or needing built-in retry/backoff without you writing that logic yourself — Step Functions is very often the correct answer, ahead of "chain Lambda functions together" or "use SQS to pass messages between services."

## 2. Core building block: states and the ASL

Every state machine has a \`StartAt\` field naming the first state, and a \`States\` object mapping state names to their definitions. Each state has a \`Type\`, and (except for terminal states) a \`Next\` field pointing to the following state, or an \`End: true\` flag marking it as the last state in that branch.

### The state types you must know

| State Type | Purpose |
|---|---|
| **Task** | Does actual work — invokes a Lambda function, calls another AWS service directly via an SDK integration, or coordinates an activity worker. This is where business logic executes. |
| **Choice** | Branching logic — evaluates conditions against the current state's input data and routes execution to different next states based on the result (like an if/else or switch statement). |
| **Parallel** | Executes multiple fixed branches of states concurrently within the same execution, waiting for all branches to complete before moving on. Good for a known, fixed number of independent sub-workflows. |
| **Map** | Iterates over an array in the input, running the same set of states once per array element — either concurrently (up to a configurable concurrency) or sequentially. Good for a variable-length collection (unlike Parallel's fixed branches). |
| **Wait** | Pauses execution for a specified duration or until a specified timestamp before continuing — no compute is consumed while waiting. |
| **Pass** | Passes its input to its output, optionally transforming or injecting data, without doing any real work. Useful for reshaping data, mocking a step during development, or injecting static values. |
| **Succeed** | Stops the execution successfully — a clean terminal "this branch/workflow finished" marker. |
| **Fail** | Stops the execution and marks it as failed, with a custom \`Error\` and \`Cause\` you define — used for explicit business-logic failures (e.g., "validation failed"), distinct from an unhandled runtime exception. |

**Exam trap:** Map is for iterating over a *variable-length array* (e.g., "process every item in this order," where the number of items isn't known until runtime). Parallel is for a *fixed, known number* of different branches doing different things (e.g., "check inventory AND charge payment AND reserve shipping, simultaneously"). Confusing these two is a common distractor pattern — if the scenario says "for each file in the batch" or "for every record in the array," that's Map; if it says "do these three specific, different things at the same time," that's Parallel.

## 3. Standard vs. Express workflows

Step Functions offers two workflow types, chosen when you create the state machine, and this comparison is one of the most heavily tested facts in this module.

| Aspect | **Standard Workflows** | **Express Workflows** |
|---|---|---|
| Execution semantics | **Exactly-once** — each step runs once, cleanly | **At-least-once** — a step could run more than once under failure conditions, so steps should be idempotent |
| Max duration | Up to **1 year** | Up to **5 minutes** |
| Execution history | Full, detailed execution history retained and viewable per-execution in the console (list of every state transition, input/output at each step) | No per-execution history in the console by default; you enable **CloudWatch Logs** for execution data instead |
| Pricing model | Priced **per state transition** | Priced **per execution** (based on number of invocations, duration, and memory consumed) |
| Best fit | Long-running, auditable, often human-involved workflows: order processing, approval chains, ETL orchestration | High-volume, high-throughput, short-duration event processing: IoT telemetry ingestion, streaming data transformation, mobile-backend request processing |
| Throughput character | Lower-throughput, transition-priced — cost scales with how many discrete steps a single execution takes | Built for very high execution volume — cost scales with executions and duration, not step count |

**Exam trap:** "Exactly-once" vs. "at-least-once" is the semantic detail the exam loves to test with a scenario like "a payment must never be double-charged, and the workflow runs for up to 20 minutes" → **Standard** (exactly-once, well within the 1-year cap). Compare to "a company ingests millions of IoT sensor events per day, each needing a short transformation workflow lasting a few seconds" → **Express** (high volume, short duration, at-least-once is acceptable because the transformation Lambda is idempotent). If a scenario needs exactly-once guarantees, Express is disqualified outright regardless of how well it fits everything else.

## 4. Error handling: Retry and Catch

This is where Step Functions earns its keep versus hand-rolled orchestration — retry-with-backoff and structured error handling are declarative, built into the state definition, not code you write yourself.

### Retry
A \`Retry\` array on a Task, Parallel, or Map state lists one or more retry rules, each matching specific errors and defining backoff behavior:

\`\`\`json
"Retry": [
  {
    "ErrorEquals": ["States.Timeout", "Lambda.ServiceException"],
    "IntervalSeconds": 2,
    "MaxAttempts": 3,
    "BackoffRate": 2.0
  }
]
\`\`\`

- \`ErrorEquals\` — the specific error name(s) this rule handles (AWS-predefined names like \`States.Timeout\`, \`States.TaskFailed\`, \`Lambda.ServiceException\`, or custom error strings your Lambda function throws), or \`States.ALL\` to catch anything.
- \`IntervalSeconds\` — how long to wait before the first retry.
- \`MaxAttempts\` — how many retry attempts to make (not counting the original attempt) before giving up and treating it as a failure the state's \`Catch\` block (if any) can handle.
- \`BackoffRate\` — a multiplier applied to the interval after each retry (e.g., \`2.0\` doubles the wait each time: 2s, 4s, 8s...).
- Newer state machines also support a \`JitterStrategy\` (\`FULL\` or \`NONE\`) to randomize the exact wait within the backoff window, avoiding the "thundering herd" problem where many failed executions retry at the exact same moment.

This is **the exact same exponential-backoff-and-jitter concept from module 04's Lambda/SDK retry discussion** — Step Functions just gives you a declarative way to configure it at the workflow level instead of writing retry loops in application code.

### Catch
A \`Catch\` array defines what to do when a state fails outright (either the underlying error isn't retried, or all retries are exhausted):

\`\`\`json
"Catch": [
  {
    "ErrorEquals": ["States.ALL"],
    "ResultPath": "$.error",
    "Next": "NotifyFailure"
  }
]
\`\`\`

- \`ErrorEquals\` — which errors this catch handles (you can have multiple \`Catch\` entries targeting different errors to different fallback states).
- \`Next\` — which state to transition to on catching the error (a cleanup step, a notification, a compensating "rollback" action).
- \`ResultPath\` — where to inject the error details into the state's data, so downstream states can inspect what went wrong.

**Exam trap:** \`Retry\` handles *transient* failures by trying again; \`Catch\` handles the case where retrying either isn't appropriate or has been exhausted, by routing to a different state (often a cleanup/compensation/notification path) rather than failing the entire execution outright. A state can have both: retry a few times, and only if all retries fail, catch and route to a fallback.

## 5. Integration patterns

Step Functions Task states can integrate with the outside world in a few distinct ways:

1. **Lambda invocation** — the most common pattern; a Task state invokes a Lambda function (either via the legacy \`Resource: "arn:aws:lambda:...:function:Name"\` shorthand or the recommended \`Resource: "arn:aws:states:::lambda:invoke"\` with explicit \`Parameters\`).
2. **Direct AWS SDK service integrations** — Step Functions can call over 200 AWS services' APIs *directly* from a Task state, with no Lambda function in between — e.g., putting an item into DynamoDB, publishing to SNS, sending to SQS, starting an ECS task, or calling Batch. This reduces cost, latency, and the amount of glue code you'd otherwise write in a "do-nothing" Lambda function whose only job is calling another AWS API.
3. **Activity workers** — a legacy-but-still-valid pattern where a worker process (running anywhere — EC2, on-premises, a container) polls Step Functions for work using the Activity Task API, does the work itself, and reports success/failure back. Useful when the work must happen outside AWS-managed compute (e.g., on a physical device or a long-running custom process not well suited to Lambda).
4. **Wait for callback with a task token (\`.waitForTaskToken\`)** — the pattern for **human-in-the-loop** or **long-running external work** that doesn't fit neatly into a synchronous call. The Task state pauses and waits (up to that workflow's max duration) until *something else* calls back to Step Functions with a **task token** via \`SendTaskSuccess\`, \`SendTaskFailure\`, or \`SendTaskHeartbeat\`. Common uses: an approval step where a manager clicks a link in an email (the link's backend calls \`SendTaskSuccess\` with the token), or a long-running third-party job (e.g., a video encoding service) that calls back only when it's genuinely done, rather than Step Functions polling it.

**Exam trap:** "A workflow must pause until a human approves a request, potentially hours or days later" → this is the textbook signal for the **\`.waitForTaskToken\`** integration pattern, not a \`Wait\` state (which only pauses for a *known* duration/timestamp, not an arbitrary external event) and not a tight polling loop.

## 6. The Map state for parallel iteration

The Map state runs the same sub-workflow once per element of an input array. Two execution modes:

- **Inline Map** (the "classic" Map state) — runs iterations within the state machine's own execution, with a configurable \`MaxConcurrency\` to control how many iterations run at once (0 means "as much concurrency as possible").
- **Distributed Map** — a newer mode designed for very large-scale fan-out (tens of thousands to millions of items, e.g. every object in an S3 bucket), where each iteration runs as its own separate, trackable child execution rather than inline, giving much higher scale and per-item observability at the cost of some added complexity.

A basic Map state:

\`\`\`json
"ProcessEachLineItem": {
  "Type": "Map",
  "ItemsPath": "$.orderItems",
  "MaxConcurrency": 5,
  "Iterator": {
    "StartAt": "ValidateLineItem",
    "States": {
      "ValidateLineItem": {
        "Type": "Task",
        "Resource": "arn:aws:lambda:us-east-1:123456789012:function:ValidateLineItem",
        "End": true
      }
    }
  },
  "ResultPath": "$.validatedItems",
  "Next": "ShipOrder"
}
\`\`\`

**Exam trap:** if a scenario says the number of items to process is only known at runtime (a variable-length array from the input, or every object under an S3 prefix), that's Map — often Distributed Map at real scale. If it says a fixed, small number of *different, named* operations must happen concurrently, that's Parallel.

## 7. Input/output processing: InputPath, Parameters, ResultPath, OutputPath

This is the part of ASL that trips up almost everyone at first, because four different fields all touch "the data," but at different points in a state's execution:

1. **\`InputPath\`** — filters what part of the *incoming* state data the state actually receives, before it does anything. Default \`$\` (the whole input).
2. **\`Parameters\`** — reshapes or constructs the exact payload sent to the state's task/resource, which can mix static values, values pulled from the (already-InputPath-filtered) input via a \`.$\` suffixed key (e.g., \`"orderId.$": "$.orderId"\`), and intrinsic functions (e.g., \`States.Format\`).
3. **\`ResultPath\`** — determines *where in the original state data* the task's result gets placed. Default \`$\` means the result *replaces* the entire input. Setting it to something like \`$.taskResult\` instead *merges* the result into the input as a new field, preserving everything else that was already there — critical when a later state still needs the earlier data.
4. **\`OutputPath\`** — filters what part of the (post-\`ResultPath\`) combined data gets passed on to the *next* state as its input. Default \`$\` (everything).

Worked example — a Task state receiving \`{"orderId": "5521", "customer": {"id": "c-9"}}\`:

- With no \`ResultPath\` set (default \`$\`), if \`ValidateOrder\` returns \`{"isValid": true}\`, the *entire* state data becomes \`{"isValid": true}\` — the original \`orderId\` and \`customer\` are gone, which breaks any later state that needed them.
- With \`"ResultPath": "$.validation"\`, the state data becomes \`{"orderId": "5521", "customer": {"id": "c-9"}, "validation": {"isValid": true}}\` — nothing is lost, and the next state's Choice logic can test \`$.validation.isValid\`.

**Exam trap:** a scenario describing "a later state in the workflow lost access to data it needed from an earlier step" is almost always pointing at a missing or wrong \`ResultPath\` — the default behavior replaces the entire input with the task's result, silently discarding everything else, unless you explicitly merge with a \`ResultPath\`.

## 8. A complete worked ASL example

The following state machine validates an order, branches on validity, then fans out into a \`Parallel\` state to reserve inventory and charge payment simultaneously — with a \`Retry\` on the payment call (transient gateway errors) and a \`Catch\` that routes any failure to a rollback/notification path:

\`\`\`json
{
  "Comment": "Order processing: validate, branch, then parallel inventory + payment with retry/catch",
  "StartAt": "ValidateOrder",
  "States": {
    "ValidateOrder": {
      "Type": "Task",
      "Resource": "arn:aws:states:::lambda:invoke",
      "Parameters": {
        "FunctionName": "ValidateOrder",
        "Payload.$": "$"
      },
      "ResultPath": "$.validation",
      "Retry": [
        {
          "ErrorEquals": ["Lambda.ServiceException", "States.Timeout"],
          "IntervalSeconds": 2,
          "MaxAttempts": 3,
          "BackoffRate": 2.0
        }
      ],
      "Catch": [
        {
          "ErrorEquals": ["States.ALL"],
          "ResultPath": "$.error",
          "Next": "NotifyFailure"
        }
      ],
      "Next": "IsOrderValid"
    },
    "IsOrderValid": {
      "Type": "Choice",
      "Choices": [
        {
          "Variable": "$.validation.Payload.isValid",
          "BooleanEquals": true,
          "Next": "ReserveAndCharge"
        }
      ],
      "Default": "NotifyFailure"
    },
    "ReserveAndCharge": {
      "Type": "Parallel",
      "ResultPath": "$.parallelResults",
      "Branches": [
        {
          "StartAt": "ReserveInventory",
          "States": {
            "ReserveInventory": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": { "FunctionName": "ReserveInventory", "Payload.$": "$" },
              "End": true
            }
          }
        },
        {
          "StartAt": "ChargePayment",
          "States": {
            "ChargePayment": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": { "FunctionName": "ChargePayment", "Payload.$": "$" },
              "Retry": [
                {
                  "ErrorEquals": ["States.Timeout", "PaymentGateway.ThrottlingException"],
                  "IntervalSeconds": 1,
                  "MaxAttempts": 5,
                  "BackoffRate": 2.0,
                  "JitterStrategy": "FULL"
                }
              ],
              "End": true
            }
          }
        }
      ],
      "Catch": [
        {
          "ErrorEquals": ["States.ALL"],
          "ResultPath": "$.error",
          "Next": "RollbackOrder"
        }
      ],
      "Next": "ShipOrder"
    },
    "ShipOrder": {
      "Type": "Task",
      "Resource": "arn:aws:states:::lambda:invoke",
      "Parameters": { "FunctionName": "ShipOrder", "Payload.$": "$" },
      "End": true
    },
    "RollbackOrder": {
      "Type": "Task",
      "Resource": "arn:aws:states:::lambda:invoke",
      "Parameters": { "FunctionName": "RollbackOrder", "Payload.$": "$" },
      "Next": "NotifyFailure"
    },
    "NotifyFailure": {
      "Type": "Fail",
      "Error": "OrderProcessingFailed",
      "Cause": "Order validation or processing could not complete successfully"
    }
  }
}
\`\`\`

Notice every concept from this module in one place: a \`Task\` with \`Retry\` and \`Catch\`, a \`Choice\` branching on the result, a \`Parallel\` fan-out with its own per-branch \`Retry\` and shared \`Catch\`, and explicit \`ResultPath\`/\`Parameters\` usage keeping the data intact as it flows through.

## 9. Orchestration vs. choreography — the design-pattern decision

This is an explicit architectural-pattern distinction the exam tests directly (Domain 1, Task Statement 1 — architectural patterns), and it's the natural companion to module 04's broader pattern catalogue and module 06's event-driven services.

| Aspect | **Orchestration** (Step Functions) | **Choreography** (EventBridge) |
|---|---|---|
| Control model | A **central coordinator** (the state machine) explicitly defines the sequence, branching, and error handling for every step | **No central controller** — each service independently reacts to events it cares about, publishing further events as needed |
| Visibility | One place to see the whole workflow's status, execution history, and current state | Distributed by nature — understanding the full flow means tracing across many independently-deployed consumers and their logs |
| Coupling | Services are decoupled from *each other*, but the workflow definition is coupled to *knowing about every step* | Services are decoupled from each other *and* from any central definition — a publisher doesn't know or care who's listening |
| Adding a new step | Requires editing the central state machine definition | A new consumer simply subscribes to an existing event — no change needed to the publisher or any other consumer |
| Failure handling | Centralized \`Retry\`/\`Catch\` at the state-machine level, with a single execution to inspect | Each consumer handles its own retries/failures independently (e.g., its own SQS dead-letter queue) |
| Best fit | Complex, ordered, stateful business processes: order fulfillment, approval chains, multi-step data pipelines, anything needing an audit trail of "what happened, in what order" | Simple, independent reactions to domain events where strict ordering isn't required: "when an order ships, notify billing AND update analytics AND alert the warehouse," each independently, with no single process needing to track them all |

**Exam trap:** a scenario describing a workflow that must be strictly sequential, needs conditional branching, needs a visual audit trail of exactly what happened and in what order, or needs a human approval step — that's **orchestration → Step Functions**. A scenario describing multiple *independent* services each reacting to the same business event without needing to know about each other, and where the order between them genuinely doesn't matter — that's **choreography → EventBridge**. If the scenario explicitly needs centralized error handling and a single place to see workflow status, that phrase alone should pull you toward Step Functions even if EventBridge could technically also route the events.

## 10. Visual debugging via the console

Every Standard Workflow execution can be inspected in the Step Functions console as a **visual graph** of the state machine, with the actual path taken through it highlighted, and the exact input/output JSON at every single state available for inspection. This turns "why did this workflow fail" from a log-archaeology exercise into clicking the red (failed) state and reading its error and input directly. Express Workflows rely on CloudWatch Logs for this instead, since they don't retain the same kind of per-execution history by default — another reason Express is a worse fit when deep, ongoing auditability matters more than raw throughput.

## 11. Deployment: a brief forward-look to module 13

State machines are just another resource you can define as code. In CloudFormation, \`AWS::StepFunctions::StateMachine\` takes the ASL definition (inline or referencing an S3 object); AWS SAM has a dedicated \`AWS::Serverless::StateMachine\` resource type with a friendlier authoring experience for ASL alongside your Lambda functions in the same template. Step Functions also supports **versions and aliases** for a state machine (conceptually similar to Lambda versions/aliases), letting you publish an immutable version of a definition and shift execution traffic between versions gradually. Full CI/CD and IaC treatment of this lives in module 13 — for now, just know that "how do I deploy and version a Step Functions workflow safely" is a CloudFormation/SAM answer, not a manual console-editing one.

## 12. Use cases worth memorizing

- **Order processing** — validate, reserve inventory, charge payment, ship, with compensating rollback logic on failure (the worked example above).
- **Data pipelines / ETL** — coordinate a sequence of Glue jobs, Lambda transformations, and Athena queries, using Map to fan out over many files or partitions.
- **Approval workflows** — human-in-the-loop processes (expense approval, document review, content moderation escalation) using the \`.waitForTaskToken\` pattern, potentially pausing for hours or days.

## 13. Worked real-world scenarios

**Scenario A — the double-charged customer.** A retail company originally chained their order-processing steps with a sequence of Lambda functions, each invoking the next directly. During a regional network blip, a payment-charging Lambda function was invoked twice for the same order because an upstream retry mechanism (build outside Step Functions) didn't know the first invocation had actually succeeded just before the connection dropped — the customer was billed twice. Migrating this workflow to a Step Functions **Standard** workflow (exactly-once execution semantics) around the same Lambda functions, with explicit \`Retry\`/\`Catch\` blocks replacing the ad hoc retry code, eliminates this class of bug: Step Functions itself guarantees each state executes exactly once per execution, and any transient failure is handled by a declared, auditable \`Retry\` policy rather than an unreliable, hand-rolled loop. **Lesson:** "must never double-charge" is a strong signal for Standard workflows' exactly-once guarantee, not just "use Step Functions" generically — Express would have been the wrong choice here.

**Scenario B — the expense report that waited three days.** A company's expense-approval process needs a manager to review and approve or reject a submitted report, sometimes not for a day or two given normal scheduling. The team's first attempt used a \`Wait\` state with a fixed retry-poll loop, checking every few minutes whether an external "approvals" DynamoDB table had been updated — burning needless state transitions and adding complexity for no benefit. Switching the approval step to a Task state using the **\`.waitForTaskToken\`** integration pattern lets the execution pause indefinitely (well within Standard's 1-year cap) with zero polling cost; the state resumes the instant the manager clicks "Approve" in an email link, whose backend Lambda function calls \`SendTaskSuccess\` with the token, carrying the manager's decision as the task's result. **Lesson:** an arbitrary-duration wait for an external human or system decision is the callback-token pattern, not a polling loop or a \`Wait\` state (which only handles a *known* duration or timestamp).

**Scenario C — the thumbnail pipeline that needed both speed and scale.** A photo-sharing company processes millions of newly uploaded images per day, generating three thumbnail sizes for each, and wants the lowest possible per-image cost and highest possible throughput, tolerating the rare double-processed image (their thumbnail-generation Lambda function is idempotent — regenerating the same thumbnail twice is harmless). This is an **Express** workflow, not Standard: the work per image completes in a few seconds (well under Express's 5-minute cap), volume is enormous (favoring per-execution, not per-state-transition, pricing), and at-least-once semantics are acceptable given the idempotent processing step. Within that Express workflow, a **Map** state (potentially Distributed Map if fed a batch manifest rather than one image per execution) fans out the three thumbnail-size generations concurrently per image. **Lesson:** high-volume + short-duration + tolerable-duplicate-processing is the Express signal; the same requirements phrased as "must never process twice" and "can run for tens of minutes" would flip the answer to Standard.

## Key exam traps

- **Standard = exactly-once, up to 1 year, priced per state transition, full console execution history.** **Express = at-least-once, up to 5 minutes, priced per execution, relies on CloudWatch Logs.** "Must never double-process" always eliminates Express.
- **Map** iterates a variable-length array (unknown count until runtime); **Parallel** runs a fixed, known number of different branches concurrently. Don't swap them.
- **\`Retry\`** handles transient errors by trying again with backoff (optionally with jitter, same backoff-and-jitter concept from module 04); **\`Catch\`** handles a state failing outright (after retries are exhausted, or for non-retried errors) by routing to a fallback/cleanup state.
- **\`.waitForTaskToken\`** is the pattern for human-in-the-loop approval or long-running external work of arbitrary/unknown duration — not a \`Wait\` state (fixed duration/timestamp only) and not a polling loop.
- **\`ResultPath\`** defaults to replacing the entire state's data with the task's result — a classic "later state lost data it needed" bug is almost always a missing or wrong \`ResultPath\`.
- **Orchestration (Step Functions)** = central coordinator, explicit sequence, single place to see workflow status — best for complex, ordered, auditable processes. **Choreography (EventBridge)** = no central controller, independent reactions to events — best for simple, decoupled, order-independent reactions. A requirement for centralized visibility/error-handling across steps pulls the answer toward Step Functions even when EventBridge could technically route the same events.
- Direct AWS SDK service integrations from a Task state can eliminate "glue" Lambda functions whose only job is calling another AWS API — the exam favors this over an unnecessary Lambda function in the middle when the scenario doesn't need custom logic, just a service call.
- State machines are deployed as code (CloudFormation \`AWS::StepFunctions::StateMachine\` or SAM \`AWS::Serverless::StateMachine\`), and support versions/aliases for safer rollout — full depth in module 13.

{q:"A junior developer asks why ASL is described as \"declarative\" rather than \"imperative,\" having only written procedural code before. Which explanation is most accurate?",o:["ASL describes the desired states and transitions between them, and Step Functions determines how to execute that graph, rather than the author writing step-by-step procedural instructions","ASL is declarative purely because it is written in YAML instead of JSON","ASL is declarative because it has no branching logic of any kind","ASL is declarative only when used inside Express workflows"],a:[0],e:"ASL describes states/transitions declaratively; Step Functions determines how to execute that graph."},

{q:"A payment-gateway Task state's Retry rule specifically targets a custom error named \"PaymentGateway.ThrottlingException,\" waiting longer between each successive attempt. Which broader concept, first introduced in this course's discussion of resilient Lambda/SDK service calls, does this Retry configuration directly build on?",o:["EC2 instance metadata retrieval","Exponential backoff and jitter for handling throttled or transient API calls","VPC subnet routing tables","S3 bucket versioning"],a:[1],e:"This is the same exponential-backoff-and-jitter concept applied to resilient Lambda/SDK service calls."},
{q:"A developer wants a caught error's details, such as its name and cause, to be inserted into the state's data so a downstream notification state can describe exactly what went wrong. Which Catch block field controls where those details are placed?",o:["\"ErrorEquals\"","\"Next\"","\"ResultPath\"","\"IntervalSeconds\""],a:[2],e:"\"ResultPath\" on a Catch block places the caught error's details into the state's data."},
{q:"A Task state has neither a Retry block nor a Catch block configured, and its underlying Lambda function throws an unhandled exception during execution. What is the most likely outcome for the overall execution?",o:["The execution automatically retries the state forever","The state fails, and since there is no Catch block to route to a fallback, the execution as a whole fails","The state silently succeeds with an empty result","The workflow pauses indefinitely, waiting for a manual restart"],a:[1],e:"With no Catch block, an unhandled failure propagates to fail the overall execution."},
{q:"A workflow author is designing what a Catch block's target (\"Next\") state should actually do once a failure is caught. Which two of the following are legitimate, commonly used purposes for that target state? (Select TWO)",o:["A dedicated cleanup or rollback state that compensates for work already completed","A notification state, such as one invoking a Lambda function or an SNS integration, that alerts an operations team of the failure","A field that must always point back to the exact same state that just failed, with no alternative permitted","Only a Succeed state, since Fail states can never be reached from a Catch block","Only a Wait state, since Catch blocks cannot lead to Task states"],a:[0,1],multi:true,e:"A Catch target commonly leads to a cleanup/rollback state or a notification/alerting state."},
{q:"A Parallel state has one branch that fails after exhausting its own internal retries, and the Parallel state's own Catch block is configured to route to a \"RollbackOrder\" state. What happens next in the execution?",o:["Only the failed branch is rolled back while the other branches continue running independently forever","The Parallel state's failure is caught, and execution transitions to \"RollbackOrder\" as defined","The entire state machine definition is permanently deleted","The failure is ignored, and the workflow proceeds as if the Parallel state had succeeded"],a:[1],e:"The Parallel state's Catch block catches the branch failure and routes to \"RollbackOrder\" as configured."},
{q:"A developer asks a colleague to summarize, in one sentence, how Retry and Catch differ in purpose within ASL. Which summary is most accurate?",o:["Retry and Catch serve the exact same purpose and are fully interchangeable","Retry attempts to recover from a transient failure by trying the same state again with backoff, while Catch defines what to do once a failure is treated as unrecoverable, whether immediately or after retries are exhausted","Retry is only usable on Parallel states, and Catch is only usable on Task states","Catch always executes before any retry attempt is made, regardless of configuration"],a:[1],e:"Retry recovers from transient failures via backoff; Catch defines the fallback once a failure is unrecoverable."},
{q:"A state's Retry array contains a rule targeting \"States.Timeout\" with three max attempts, and a separate rule targeting \"CustomApp.ValidationError\" with zero max attempts, effectively acting as a non-retry for that error. Why might a team deliberately configure a rule this way for validation errors?",o:["To ensure a genuinely non-transient error, like a validation failure that will never succeed no matter how many times it's retried, fails fast and moves directly to any Catch handling, rather than wasting time and cost retrying something that cannot succeed","Because ASL requires every distinct error type to appear somewhere in the Retry array","Because a MaxAttempts value of 0 causes an infinite retry loop","Because Retry rules must always be listed in alphabetical order by error name"],a:[0],e:"Setting MaxAttempts to 0 for a non-transient error lets it fail fast into Catch handling instead of wasting retries."},
{q:"A state definition includes multiple Catch entries, each targeting a different category of error. Which two statements correctly describe how multiple Catch entries on the same state behave? (Select TWO)",o:["Different Catch entries can target different sets of errors and route to different fallback states","Catch entries are evaluated in order, with the first matching entry's \"Next\" being used","Only exactly one Catch entry is ever permitted per state","Catch entries cannot use \"States.ALL\" as a catch-all fallback","A state's Catch entries must all point to the identical fallback state"],a:[0,1],multi:true,e:"Different Catch entries can target different errors and route differently, evaluated in order with the first match applied."},
{q:"A workflow author wants a Task state to retry almost immediately on its first retry attempt, with essentially no delay, but to back off exponentially on subsequent attempts. Which combination of Retry fields controls this behavior?",o:["\"MaxAttempts\" alone, since no other timing fields exist in ASL","\"IntervalSeconds,\" set very low for the first wait, combined with \"BackoffRate\" to control the growth of subsequent waits","\"ErrorEquals\" only, since it directly controls timing","There is no supported way to control the initial retry delay in ASL"],a:[1],e:"A low initial IntervalSeconds combined with BackoffRate controls near-immediate first retries and exponential subsequent growth."},
{q:"A workflow's Task state needs to run custom business logic — validating an order against several rules — as part of a processing step. Which integration pattern does invoking a Lambda function from that Task state represent?",o:["An activity worker integration","A Lambda invocation integration, one of the most common Task state patterns","A wait-for-callback integration","A direct EC2 integration"],a:[1],e:"Invoking a Lambda function from a Task state is the Lambda invocation integration pattern."},
{q:"A team wants a Task state to write directly to a DynamoDB table without writing or maintaining a \"glue\" Lambda function whose only job is calling PutItem on their behalf. Which integration approach satisfies this requirement?",o:["A direct AWS SDK service integration, letting the Task state call the DynamoDB API directly via a resource such as \"arn:aws:states:::dynamodb:putItem\"","An activity worker running on a dedicated EC2 instance","A Wait state configured to poll DynamoDB on an interval","This is not possible; a Lambda function is always required as an intermediary"],a:[0],e:"A direct AWS SDK service integration lets the Task state call DynamoDB's API without an intermediary Lambda function."},
{q:"A video-encoding job is performed by custom software running on a fleet of on-premises servers, entirely outside AWS. The team wants that fleet to poll Step Functions for available work and report success or failure back once each job completes. Which integration pattern fits this requirement?",o:["A direct AWS SDK service integration","An activity worker, using the Activity Task API to poll for and report on work happening outside AWS-managed compute","A Map state","A Choice state"],a:[1],e:"Activity workers poll for and report on work performed outside AWS-managed compute, fitting an on-premises fleet."},
{q:"A workflow needs to pause at a specific step until a human manager clicks \"Approve\" in an emailed link, which could happen anytime within the next several days. Which integration pattern is designed for this kind of arbitrary-duration, human-driven pause?",o:["A Wait state configured for a multi-day fixed duration","The \".waitForTaskToken\" callback pattern, where the state pauses until an external process calls SendTaskSuccess or SendTaskFailure with the task's token","A Retry block configured with a very high MaxAttempts value","A Map state iterating over the set of possible manager responses"],a:[1],e:"The waitForTaskToken callback pattern supports an arbitrary-duration pause for human approval, unlike a fixed-duration Wait state."},
{q:"An external approval system needs to resume a Task state that is currently paused under the \".waitForTaskToken\" pattern, signaling that the work completed successfully and providing the result. Which API call does it use?",o:["SendTaskSuccess, passing the task token and the result data","StartExecution","DescribeStateMachine","PutTargets"],a:[0],e:"SendTaskSuccess resumes a paused callback task and supplies its result."},
{q:"A long-running external job periodically wants to signal to a paused \".waitForTaskToken\" task that it's still actively being worked on, without yet completing it, so the task isn't mistakenly treated as abandoned. Which API call accomplishes this?",o:["SendTaskHeartbeat","SendTaskFailure","StopExecution","GetExecutionHistory"],a:[0],e:"SendTaskHeartbeat signals a paused task is still being actively worked on, preventing premature timeout."},
{q:"A developer is deciding whether a specific Task state should use a direct AWS SDK service integration instead of invoking a Lambda function. Which two reasons legitimately support choosing the direct integration for that step? (Select TWO)",o:["The step is a straightforward API call, such as putting an item in DynamoDB or publishing to SNS, with no custom transformation logic required, so a Lambda function would only add unneeded latency, cost, and code to maintain","Direct SDK integrations support calling a very large number of AWS service APIs without an intermediary function","Direct SDK integrations are the only mechanism by which Step Functions can ever call any AWS service","Lambda functions cannot be invoked from Step Functions under any configuration","Direct SDK integrations eliminate the need for an IAM execution role entirely"],a:[0,1],multi:true,e:"Simple API calls with no custom logic favor direct integrations, which cover a large number of AWS service APIs."},
{q:"A workflow's document-review step must pause for an unknown, potentially long duration until a third-party vendor's system finishes an asynchronous job and calls back with the result. The vendor's own system is able to call an AWS API directly once its work is done. Which task-token API would the vendor's callback call to signal success?",o:["SendTaskSuccess, passing the previously issued task token and the job's result","CreateStateMachine","UpdateStateMachine","ListExecutions"],a:[0],e:"SendTaskSuccess, using the previously issued task token, is how an external system signals successful completion."},
{q:"A team is evaluating whether the activity-worker integration pattern still has a place in a mostly Lambda-based, modern architecture. Which two statements about activity workers are accurate? (Select TWO)",o:["Activity workers poll Step Functions for available work using the Activity Task API, rather than being invoked directly by Step Functions","Activity workers are useful when the actual processing must happen outside AWS-managed compute, such as on physical devices or long-running custom on-premises processes","Activity workers are the newest, most recommended integration pattern for typical Lambda-based workflows","Activity workers are structurally incapable of reporting a failure back to Step Functions","Activity workers require no polling mechanism of any kind"],a:[0,1],multi:true,e:"Activity workers poll via the Activity Task API and suit processing that must occur outside AWS-managed compute."},
{q:"A platform team notes that direct AWS SDK service integrations can eliminate many \"glue\" Lambda functions, but a reviewer points out this doesn't remove every other consideration. Which two statements about direct SDK service integrations are accurate? (Select TWO)",o:["They can reduce the number of \"glue\" Lambda functions needed purely to call another AWS service's API","They still require the state machine's execution role to hold the specific IAM permissions needed for the called API action","They eliminate the need for any IAM role whatsoever on the state machine","They can only be used from within a Map state's iterator","They are structurally incompatible with Retry and Catch blocks"],a:[0,1],multi:true,e:"Direct integrations reduce glue Lambda functions but still require correctly scoped IAM permissions on the execution role."},
{q:"A scenario describes a workflow needing to call over a dozen different AWS services' APIs directly, with minimal custom logic required at each individual step. Which Step Functions capability most directly reduces the number of \"glue\" Lambda functions otherwise needed for this kind of workflow?",o:["The Wait state","Direct AWS SDK service integrations, which let Task states call many AWS service APIs natively","The Choice state","The Fail state"],a:[1],e:"Direct AWS SDK service integrations let Task states call many AWS APIs natively, cutting down on glue Lambda functions."},
{q:"A workflow uses \".waitForTaskToken\" for a document-review step, but no timeout or heartbeat expectation is configured for that pause, and the reviewer never responds. What is the practical operational risk here?",o:["The execution could remain paused indefinitely, up to the workflow type's maximum duration, so teams typically configure a timeout or heartbeat expectation to avoid an execution silently stalling forever","The execution automatically fails after exactly 60 seconds regardless of configuration","Step Functions automatically approves the pending request after 24 hours with no configuration needed","The task token becomes reusable for a completely different, unrelated execution"],a:[0],e:"Without a timeout or heartbeat expectation, a waitForTaskToken pause can stall indefinitely up to the workflow's max duration."},
{q:"A Task state simply needs to publish a message to an SNS topic, with no custom transformation logic required at all. Which integration approach introduces the most unnecessary operational overhead for this specific, simple use case?",o:["A direct AWS SDK service integration calling SNS's Publish API directly from the Task state","Standing up and maintaining a dedicated activity-worker process solely to poll for and forward this one simple publish call","Scoping the direct integration's IAM execution role narrowly to just the sns:Publish action","Using the Task state's native Parameters field to shape the message before publishing via the direct integration"],a:[1],e:"Standing up a dedicated activity worker for a single simple SNS publish call is disproportionate, unnecessary overhead."},
{q:"An architect reviews how task tokens function within the \".waitForTaskToken\" pattern before rolling it out. Which two statements about task tokens are accurate? (Select TWO)",o:["The task token uniquely identifies the specific paused task within a specific execution, so a callback using that token resumes the correct execution","SendTaskFailure lets an external system explicitly fail the paused task, which triggers that state's Catch block if one is configured","Task tokens are shared globally across every execution of a given state machine, with no per-execution distinction","Task tokens are usable only with activity workers, never with Task states integrated directly","A task token expires the instant it is issued and can never be used afterward"],a:[0,1],multi:true,e:"Task tokens identify a specific paused task within a specific execution, and SendTaskFailure triggers that state's Catch if configured."},
{q:"A workflow's Task state directly integrates with AWS Batch to submit a job, and the team wants that Task state to remain paused until the submitted job actually finishes, rather than proceeding the moment the submission API call returns. What best describes this capability?",o:["This is not possible; direct integrations always behave as fire-and-forget submissions with no way to wait for completion","Certain direct SDK integrations support a \"run a job and wait for it to complete\" pattern, distinct from simply calling the API and immediately moving on, letting the Task state pause until the downstream job's actual completion","This requires standing up an activity worker in every case","This requires converting the Task state into a Map state"],a:[1],e:"Certain direct integrations support \"run and wait for completion\" semantics rather than simple fire-and-forget submission."},
{q:"A developer is deciding whether a given workflow step should invoke a Lambda function or use a direct AWS SDK service integration instead. Which factor most accurately points toward choosing the Lambda function?",o:["The step requires custom business logic, data transformation, or calling a non-AWS third-party API that a direct service integration alone cannot perform","Lambda functions are always cheaper than direct integrations in every possible case","Direct integrations cannot be used from within a Parallel state","Lambda is the only integration pattern Step Functions supports at all"],a:[0],e:"Custom logic, transformation, or third-party API calls a direct integration can't perform point toward using Lambda."},
{q:"A workflow's approval step uses the callback pattern, and the external system calls SendTaskFailure instead of SendTaskSuccess after determining the request should be rejected. What happens next in the state machine?",o:["The workflow ignores the failure signal and proceeds as though the step had succeeded","The state is treated as failed, triggering that state's Retry (if configured) and then Catch (if configured), the same as any other Task state failure","The entire AWS account's Step Functions service becomes disabled","SendTaskFailure has no defined effect anywhere in ASL"],a:[1],e:"SendTaskFailure is treated as a state failure, subject to that state's Retry and Catch configuration like any other failure."},
{q:"A developer is summarizing the four Task state integration approaches covered in this module for a study guide. Which two statements correctly capture how these patterns relate to one another? (Select TWO)",o:["Lambda invocation, direct AWS SDK service integrations, activity workers, and the waitForTaskToken callback pattern together cover synchronous custom logic, direct API calls, external polling workers, and asynchronous human or long-running callbacks, respectively","All four integration patterns require a Lambda function to be present somewhere in the call chain","Direct SDK integrations and Lambda invocations are functionally the exact same underlying mechanism, just named differently","The waitForTaskToken pattern is usable only for Lambda-invoked Task states","These four patterns give Step Functions the flexibility to fit synchronous, asynchronous, custom, and external-worker-based work into the same state machine model"],a:[0,4],multi:true,e:"The four patterns cover synchronous custom logic, direct API calls, external polling, and async callbacks, giving Step Functions broad integration flexibility."},
{q:"A developer configuring a Map state needs to specify the exact path, within the incoming input data, to the array the Map state should iterate over. Which field is used for this?",o:["\"ItemsPath\"","\"InputPath\"","\"MaxConcurrency\"","\"Iterator\" alone, with no separate field needed"],a:[0],e:"\"ItemsPath\" specifies where in the input the array to iterate over is located."},
{q:"A team wants to limit how many Map state iterations run at the same time, to avoid overwhelming a downstream dependency with concurrent calls. Which field controls this?",o:["\"ItemsPath\"","\"MaxConcurrency\"","\"ResultPath\"","\"BackoffRate\""],a:[1],e:"\"MaxConcurrency\" caps how many Map iterations run simultaneously."},
{q:"A company needs to process every object under an S3 prefix, potentially hundreds of thousands of objects, with each object's processing tracked as its own separately observable child execution rather than running inline within a single, large parent execution. Which Map state mode is designed for this scale?",o:["Inline (classic) Map","Distributed Map","Parallel","Choice"],a:[1],e:"Distributed Map is designed for very large-scale fan-out with separately trackable child executions."},
{q:"A developer omits the \"ResultPath\" field entirely from a Task state's definition. What is the default behavior in that case?",o:["It defaults to \"$\", meaning the task's result replaces the entirety of the state's data, discarding whatever else was present in the input","It defaults to automatically preserving all prior data with no further configuration needed","It defaults to storing the result only in CloudWatch Logs, never in the state's own data","Omitting \"ResultPath\" causes an immediate validation error at deployment time"],a:[0],e:"The default ResultPath of \"$\" causes the task's result to replace the entire state data."},
{q:"A later state in a workflow reports that it can no longer access a field that was clearly present several steps earlier in the execution's original input. Which ASL misconfiguration is the most likely culprit?",o:["A missing or incorrectly scoped \"ResultPath\" on an earlier Task state, causing its result to overwrite the entire state data instead of merging in as a new field","A Choice state evaluated one of its conditions incorrectly","The Lambda function invoked by an earlier state had too little memory allocated","The state machine's IAM execution role is missing a specific permission"],a:[0],e:"A missing or misconfigured ResultPath is the classic cause of a later state losing access to earlier data."},
{q:"A workflow author wants a state to receive only a specific sub-portion of the incoming state data, filtered out before any Parameters transformation or the actual task execution takes place. Which ASL field is used for this?",o:["\"OutputPath\"","\"InputPath\"","\"ResultPath\"","\"ResultSelector\""],a:[1],e:"\"InputPath\" filters the incoming data a state receives before Parameters or task execution."},
{q:"A workflow author wants to control what portion of a state's combined data, after \"ResultPath\" has already merged in the task's result, gets passed along to the next state as its input. Which ASL field accomplishes this?",o:["\"InputPath\"","\"Parameters\"","\"OutputPath\"","\"ItemsPath\""],a:[2],e:"\"OutputPath\" filters the post-ResultPath combined data before it's passed to the next state."},
{q:"A Task state's \"Parameters\" field includes the entry \"orderId.$\": \"$.orderId\". A developer new to ASL asks what the \".$\" suffix on that key actually indicates. What is the correct answer?",o:["It marks the field as required by an attached IAM policy","It indicates the value should be dynamically resolved from the current state's InputPath-filtered input using the given JSONPath, rather than treated as a literal string","It disables that particular field entirely","It is a syntax error and would cause the definition to fail validation"],a:[1],e:"The \".$\" suffix indicates the value should be dynamically resolved via JSONPath from the input, not treated literally."},
{q:"A developer is explaining how InputPath and Parameters work together on a single Task state. Which two statements accurately describe their respective roles? (Select TWO)",o:["InputPath filters which portion of the incoming state data the state considers as its starting input","Parameters can reshape, add static values to, or pull dynamic values (via \".$\") from that InputPath-filtered input to construct the exact payload sent to the state's resource","InputPath and Parameters both apply only strictly after the task has already executed","Parameters can only ever contain static, hardcoded values, never data pulled dynamically from the input","InputPath is usable only inside Map states, never within ordinary Task states"],a:[0,1],multi:true,e:"InputPath filters the starting input; Parameters reshapes/constructs the payload from that filtered input."},
{q:"A team wants a Task state's result merged into the existing state data under a new key called \"paymentResult,\" preserving every other field already present, such as \"orderId\" and \"customer.\" Which ResultPath configuration achieves this?",o:["\"ResultPath\": \"$\"","\"ResultPath\": \"$.paymentResult\"","Omitting \"ResultPath\" entirely","\"OutputPath\": \"$.paymentResult\""],a:[1],e:"Setting \"ResultPath\": \"$.paymentResult\" merges the result as a new field, preserving existing data."},
{q:"A developer is trying to understand the correct sequence in which InputPath, Parameters, the task's execution, ResultPath, and OutputPath are applied to a single Task state's data. Which ordering is correct, from first to last?",o:["OutputPath, ResultPath, task execution, Parameters, InputPath","InputPath filters the input, Parameters shapes the payload sent to the resource, the task executes, ResultPath merges the result into the state data, and OutputPath filters what's passed to the next state","Parameters, InputPath, ResultPath, task execution, OutputPath","They are all applied simultaneously, with no defined order between them"],a:[1],e:"The correct order is InputPath, Parameters, task execution, ResultPath, then OutputPath."},
{q:"A Map state's \"ItemsPath\" points to \"$.orderItems,\" but the incoming state data for a particular execution has no \"orderItems\" field at all, because it was omitted or misnamed upstream. What is the most likely outcome?",o:["The Map state silently skips all iteration and proceeds to the next state as though it had succeeded","The Map state fails with a runtime error, since it cannot locate the array it was told to iterate over","The Map state treats the entire input as a single-element array automatically","The Map state pauses indefinitely, waiting for the missing field to eventually appear"],a:[1],e:"A Map state fails at runtime if its configured ItemsPath cannot locate an array in the input."},
{q:"A developer is investigating the \"ResultSelector\" field available on certain ASL states. Which two statements about it are accurate? (Select TWO)",o:["It lets you reshape a task's raw result into a custom structure before ResultPath merges it into the state data","It is applied before ResultPath, transforming the resource's raw output","It fully replaces the need for InputPath in every state where it is used","It can only be used inside Choice states","It disables all error handling configured for that state"],a:[0,1],multi:true,e:"ResultSelector reshapes a task's raw output before ResultPath merges it into the state data."},
{q:"A developer configures \"OutputPath\": \"$.validatedOrder\" on a state, but the merged state data, after ResultPath has run, has no \"validatedOrder\" field at that path. What is the likely consequence?",o:["The next state receives the full, unfiltered data regardless of the mismatch","This mismatch will typically cause an error, since OutputPath is attempting to filter to a path that doesn't exist in the state's data","The workflow automatically creates an empty \"validatedOrder\" field to satisfy the OutputPath reference","OutputPath mismatches are always silently ignored with no effect on execution"],a:[1],e:"An OutputPath referencing a nonexistent path in the state's data typically causes a runtime error."},
{q:"A developer needs to invoke a Lambda function with a custom-constructed payload built from several fields of the incoming data, then merge just that Lambda function's response into the state data under a new key, without discarding the rest of the original input. Which combination of ASL fields accomplishes this?",o:["\"InputPath\" alone, with no other fields needed","\"Parameters\" to construct the custom payload sent to the function, and \"ResultPath\" set to a specific new key (not \"$\") to merge the response without discarding existing data","\"OutputPath\" alone, with no Parameters or ResultPath configured","\"MaxConcurrency,\" since it governs how payloads are constructed"],a:[1],e:"Parameters constructs the custom payload, while a non-\"$\" ResultPath merges the response without discarding prior data."},
{q:"A workflow author intentionally wants a Task state's result to completely replace all prior state data, discarding everything from before that state, because the next state genuinely only needs the fresh result. Which configuration achieves this, and is in fact the default behavior if left unset?",o:["\"ResultPath\": \"$.newData\"","\"ResultPath\": \"$\", or simply omitting ResultPath entirely, since \"$\" is the default","\"InputPath\": \"$\"","\"MaxConcurrency\": 0"],a:[1],e:"\"$\" (the default) causes the task's result to fully replace the prior state data, as intended here."},
{q:"A company's checkout process must validate an order, reserve inventory, charge payment, and ship the order, strictly in that sequence, with a single place to see the current status and a defined rollback path if any step fails. Which architectural pattern, and corresponding AWS service, best fits this requirement?",o:["Choreography, using EventBridge alone with no central coordinator","Orchestration, using AWS Step Functions as the central coordinator that defines the explicit sequence and error handling","Choreography, using S3 event notifications exclusively","Orchestration, using Amazon SNS as the coordinating service"],a:[1],e:"Strict sequencing, centralized status, and rollback handling are hallmarks of orchestration via Step Functions."},
{q:"A company wants three independent teams' services to each react to a single \"OrderShipped\" event — one updates an analytics dashboard, another sends a customer notification, and a third updates inventory forecasting — with no team needing to know about or coordinate with the others, and no strict ordering required. Which architectural pattern best fits, and which AWS service is the natural implementation choice?",o:["Orchestration, using a single Step Functions state machine jointly owned by all three teams","Choreography, using Amazon EventBridge to let each team's service independently subscribe to and react to the event","Orchestration, requiring all three teams to embed their logic inside one shared Lambda function","Choreography, requiring a shared database table that all three teams poll continuously"],a:[1],e:"Independent, order-independent reactions to a shared event are the classic choreography fit via EventBridge."},
{q:"An architect is asked to describe, in one sentence, the core structural difference between orchestration and choreography as architectural patterns. Which description is most accurate?",o:["Orchestration relies on a central coordinator explicitly directing the sequence of steps, while choreography has no central controller, with each service independently reacting to events","Orchestration and choreography are simply two different names for the identical underlying pattern","Choreography always uses fewer distinct AWS services than orchestration","Orchestration cannot handle branching logic, while choreography can"],a:[0],e:"Orchestration uses a central coordinator directing steps; choreography has no central controller, with independent reactions."},
{q:"A team debating orchestration versus choreography for a new workflow raises a concern: in a purely choreographed design, understanding the full end-to-end flow requires tracing logs and configuration across many independently deployed services. Which pattern's design more directly avoids this specific downside?",o:["Choreography, since it has no single point of failure","Orchestration, since a central state machine definition and its execution history provide one place to see the full workflow's status and history","Neither pattern addresses this particular concern","This concern applies only to Lambda-based workflows, not to choreography generally"],a:[1],e:"A central state machine's execution history provides one place to see the full workflow's status, unlike distributed choreography."},
{q:"A team is listing the typical advantages of a choreography-based design over an orchestration-based one. Which two of the following are accurate advantages of choreography? (Select TWO)",o:["Adding a new consumer of an existing event requires no changes to the event publisher or to any other existing consumer","Services remain loosely coupled, since publishers do not need to know who, if anyone, is listening","It automatically provides a single visual execution history for the entire business process","It guarantees exactly-once processing of every event by every consumer","It eliminates the need for any error handling within consuming services"],a:[0,1],multi:true,e:"New consumers can subscribe without publisher changes, and choreography keeps services loosely coupled."},
{q:"A team is listing the typical advantages of an orchestration-based design over a choreography-based one for a complex, ordered business process. Which two of the following are accurate advantages of orchestration? (Select TWO)",o:["Centralized, declarative Retry and Catch handling at the workflow level, rather than each service independently reinventing its own error handling","A single execution history showing the exact sequence and outcome of every step, aiding audits and debugging","Complete elimination of the need for any IAM permissions anywhere in the workflow","Guaranteed lower cost in every possible scenario, regardless of workload shape","No possibility of ever needing to invoke a Lambda function"],a:[0,1],multi:true,e:"Orchestration centralizes Retry/Catch handling and provides a single, auditable execution history."},
{q:"A scenario states that a workflow's steps must happen in a specific, strictly enforced order, with conditional branching and a human-approval step partway through the process. Which pattern, and AWS service, does this most strongly point toward?",o:["Choreography via EventBridge, since it supports Lambda as a target","Orchestration via Step Functions, given the need for enforced sequencing, branching, and a pausable human-approval step","Choreography via SNS fan-out to multiple subscribers","Neither pattern applies; this scenario requires a fully custom-built scheduler"],a:[1],e:"Enforced sequencing, branching, and a pausable approval step are all hallmarks of orchestration via Step Functions."},
{q:"A scenario describes several completely independent microservices that each need to be notified whenever a new customer signs up, with each microservice's reaction being entirely self-contained and order-independent. Introducing a central Step Functions state machine to coordinate these reactions would primarily introduce which drawback compared to a choreography approach?",o:["Unnecessary coupling of independent, order-independent reactions to a central workflow definition that must be modified every time a new independent reactor is added, when a choreographed event-driven design would let new services simply subscribe to the existing event with zero changes elsewhere","Step Functions is structurally incapable of invoking more than one Lambda function","Step Functions has no mechanism to invoke Lambda functions in parallel","Choreography is structurally incapable of using IAM at all"],a:[0],e:"Centralizing independent, order-independent reactions unnecessarily couples them to a workflow definition that must change for every new reactor."},
{q:"A study-guide question asks how orchestration and choreography relate to the exam's Domain 1, Task Statement 1 coverage of architectural patterns. Which statement correctly ties the two concepts together?",o:["Orchestration and choreography are unrelated to any exam domain and appear only informally in AWS marketing material","They represent two named, testable architectural patterns for coordinating multiple services, and the exam expects a candidate to match a scenario's coordination requirements — centralized and ordered versus independent and event-reactive — to the correct pattern and its representative AWS service","Only choreography is ever tested on the exam; orchestration is explicitly out of scope","The exam does not require memorizing either pattern by name"],a:[1],e:"Orchestration and choreography are testable, named architectural patterns tied to a scenario's coordination requirements."},
{q:"A company currently coordinates a five-step business process using a chain of EventBridge rules, each triggering the next Lambda function in sequence, effectively hand-rolling ordering through event routing. They increasingly struggle to answer \"what state is a given execution currently in, and what happened at each step\" without digging through several services' separate logs. Which change most directly solves this specific operational pain point?",o:["Adding even more EventBridge rules to the existing chain","Migrating the process to a Step Functions Standard workflow, which centralizes the sequence and provides a single, inspectable execution history per run","Switching every Lambda function in the chain to a larger memory allocation","Adding additional SQS queues between each existing step"],a:[1],e:"Migrating to a Standard Step Functions workflow centralizes sequencing and gives a single inspectable execution history per run."},
{q:"An architect is choosing between orchestration and choreography for four different candidate scenarios and must pick the strongest candidate for choreography specifically. Which scenario fits best?",o:["A strict, multi-step approval chain requiring centralized retry logic and a full audit trail of exact step ordering","A checkout process where inventory reservation must complete successfully before payment is even attempted","Three independent teams' services each needing to react, without any required ordering between them, whenever a \"UserRegistered\" event occurs","A workflow needing a human-in-the-loop approval step that can pause for several days"],a:[2],e:"Independent, order-independent reactions to a shared event are the strongest choreography fit among the options."},
{q:"A study group is compiling the conditions under which the exam expects \"orchestration\" (Step Functions), rather than \"choreography\" (EventBridge), to be the correct architectural answer. Which two conditions correctly belong on that list? (Select TWO)",o:["The scenario requires a strictly ordered sequence of steps with centralized error handling and a single place to audit exactly what happened","The scenario requires a human-in-the-loop pause of arbitrary duration as an explicit step in a defined process","The scenario describes services that must remain completely unaware of one another and react independently with no defined order","The scenario has no requirement for step ordering, retries, or centralized visibility of any kind","Cost must always be minimized regardless of any other stated requirement"],a:[0,1],multi:true,e:"Centralized error handling/auditability and an arbitrary-duration human-in-the-loop pause both point to orchestration."},
{q:"A study group is listing commonly cited, exam-relevant use cases for AWS Step Functions. Which two of the following belong on that list? (Select TWO)",o:["Coordinating a multi-step order-processing workflow spanning inventory, payment, and shipping","Running a human-in-the-loop approval workflow that pauses for a manager's decision","Hosting a static website with globally distributed edge caching","Serving as a relational database engine with ACID transaction guarantees","Acting as a content delivery network for streaming video"],a:[0,1],multi:true,e:"Order-processing coordination and human-in-the-loop approval workflows are core, commonly cited Step Functions use cases."},
{q:"A data engineering team needs to coordinate a sequence of AWS Glue jobs and Lambda-based transformations, fanning out over many data partitions using a Map state, with full auditability of each run for compliance purposes. Which combination of Step Functions choices best fits these requirements?",o:["An Express workflow with no Map state involved","A Standard workflow, using Map (potentially Distributed Map at scale) to fan out over partitions, giving both durability for a multi-step pipeline and per-execution audit history","A Choice state used entirely in isolation with no Task states","A Parallel state containing exactly one branch"],a:[1],e:"A Standard workflow with Map (or Distributed Map at scale) provides both durability and full per-execution auditability for the pipeline."},
{q:"A platform team wants to define a Step Functions state machine as infrastructure as code within an existing CloudFormation template, alongside their other application resources. Which CloudFormation resource type do they use?",o:["AWS::Lambda::Function","AWS::StepFunctions::StateMachine","AWS::SNS::Topic","AWS::EC2::Instance"],a:[1],e:"\"AWS::StepFunctions::StateMachine\" is the CloudFormation resource type for a state machine."},
{q:"A team using AWS SAM wants a more streamlined way to author a Step Functions state machine alongside the Lambda functions it invokes, within the same SAM template. Which SAM resource type provides this?",o:["AWS::Serverless::Function exclusively, with no dedicated state machine resource available","AWS::Serverless::StateMachine","AWS::Serverless::Api","AWS::Serverless::LayerVersion"],a:[1],e:"\"AWS::Serverless::StateMachine\" is the SAM resource type for authoring a state machine alongside Lambda functions."},
{q:"A platform team wants to roll out a new version of a Step Functions state machine definition gradually, shifting a portion of execution traffic to it before fully committing, conceptually similar to how Lambda handles versions and aliases. Which Step Functions capability supports this?",o:["State machine versions and aliases, which allow publishing an immutable version of a definition and shifting execution traffic between versions gradually","A feature that allows a single state machine definition to run in two AWS Regions simultaneously with no additional configuration","A capability unrelated to deployment that only affects IAM permissions","A feature that eliminates the need for CloudFormation entirely"],a:[0],e:"State machine versions and aliases support publishing immutable versions and shifting traffic gradually, like Lambda's model."},
{q:"A DevOps team is designing how Step Functions state machines fit into their existing CI/CD pipeline. Which two statements about deploying state machines this way are accurate? (Select TWO)",o:["The ASL definition can be maintained as a file in source control and deployed via CloudFormation or SAM alongside related Lambda functions","Versions and aliases can support safer, gradual rollout of a new state machine definition","State machines can only ever be created manually through the console, never via infrastructure as code","CI/CD pipelines are structurally incapable of deploying any Application Integration service, including Step Functions","Deploying a new state machine version always immediately deletes the execution history of every prior version"],a:[0,1],multi:true,e:"ASL can be source-controlled and deployed via CloudFormation/SAM, and versions/aliases support safer gradual rollout."},
{q:"A company reviews three workflows: an approval workflow (Standard, using waitForTaskToken), an order-processing workflow (Standard, requiring exactly-once execution), and an IoT enrichment workflow (Express, high volume and short duration). Which statement correctly evaluates whether each workflow's chosen type matches its stated requirement?",o:["All three should use Express for cost savings, since Standard is never worth its extra cost","The approval and order-processing workflows correctly use Standard, given their long/arbitrary-duration and exactly-once needs respectively, and the IoT workflow correctly uses Express, given its high volume, short duration, and tolerance for at-least-once processing","All three should use Standard, since Express is structurally unable to invoke Lambda functions","The IoT workflow should switch to Standard because Express cannot handle high request volume"],a:[1],e:"Each workflow's chosen type correctly matches its stated duration, exactly-once, or high-volume/short-duration requirement."},
{q:"A security review of a Step Functions-based order workflow finds three issues: an execution role granting broader permissions than any Task state actually needs, a payment Task state running on an Express workflow, and a missing ResultPath causing a downstream state to lose earlier order data. Which set of fixes correctly addresses all three findings?",o:["Scope the execution role down to least privilege for the specific resources each Task state calls, migrate the payment step's guarantees to a Standard workflow given the need to avoid duplicate charges, and add an explicit ResultPath so the task's result merges into the state data rather than replacing it","Delete the execution role entirely, since Step Functions does not require IAM to function","Leave the Express workflow unchanged, since payment steps are always safe under at-least-once semantics","Remove ResultPath entirely from every state in the workflow to avoid the issue altogether"],a:[0],e:"Scoping the role to least privilege, using Standard for the payment step's exactly-once need, and adding ResultPath together address all three findings."},
{q:"A senior developer is asked to summarize this module's core theme for a teammate studying separately, in a single sentence covering when to reach for Step Functions versus a looser event-driven approach. Which summary best captures it?",o:["Step Functions should be used for absolutely every workflow, regardless of requirements, since it is strictly superior in all cases","Reach for Step Functions (orchestration) when a process needs an explicit, centrally coordinated, auditable sequence with built-in retry and error handling — including exactly-once guarantees, long pauses for human input, or fan-out over variable-length data — and reach for EventBridge (choreography) when independent services simply need to react to shared events with no required central coordination or ordering","Step Functions and EventBridge are functionally identical, and the choice between them never actually matters","Choreography is always the correct choice because it has no associated cost"],a:[1],e:"Orchestration fits centrally coordinated, auditable, retry-driven processes; choreography fits independent, order-agnostic event reactions."}
];

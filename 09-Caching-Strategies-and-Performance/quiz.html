body{background:var(--bg); color:var(--ink); font-family:"Public Sans",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}

h1{font-size:22px; font-weight:800; margin:4px 0 18px; text-wrap:balance; letter-spacing:-.01em;}

.opt:disabled:hover{border-color:var(--border);}

.actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}

.score-big{font-family:"IBM Plex Mono",monospace; font-size:52px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.score-pct{color:var(--muted); font-size:15px; margin-top:2px;}
.score-pct.pass{color:var(--success); font-weight:700;}
.score-pct.fail{color:var(--danger); font-weight:700;}
.miss-list{margin-top:28px; text-align:left; border-top:1px solid var(--border); padding-top:20px;}

.miss-item{padding:10px 12px; background:var(--surface-2); border-radius:8px; margin-bottom:8px; font-size:13.5px; line-height:1.45; border-left:3px solid var(--danger);}

.footer-note{text-align:center; color:var(--muted); font-size:12px; margin-top:24px; font-family:"IBM Plex Mono",monospace;}

<script>
const QUESTIONS = [
  {
    "q": "A developer is building an e-commerce catalog service where product details are read frequently but updated infrequently. The team wants to implement an in-memory cache using Amazon ElastiCache for Redis. To avoid filling the cache with products that customers never view, data should only be loaded into the cache when a customer actually requests it. If a product is updated, the stale cache entry must be deleted. Which caching pattern is being implemented?",
    "o": [
      "Write-Through",
      "Lazy Loading (Cache-Aside)",
      "Read-Through with DAX",
      "Refresh-Ahead"
    ],
    "a": [
      1
    ],
    "e": "Lazy Loading (Cache-Aside) only populates data on-demand when a read miss occurs, preventing cache pollution from unread data, and invalidates stale keys on write."
  },
  {
    "q": "An application developer writes the following pseudocode function to retrieve customer profile records: ``` function getCustomer(customerId): data = cache.get(customerId) if data is not null: return data data = database.find(customerId) cache.set(customerId, data, ttl=600) return data ``` Which caching pattern does this code represent?",
    "o": [
      "Write-Through",
      "Lazy Loading (Cache-Aside)",
      "Read-Through",
      "Write-Behind"
    ],
    "a": [
      1
    ],
    "e": "The pseudocode checks cache first, queries DB on miss, and writes result to cache with a TTL — the textbook Lazy Loading (Cache-Aside) read pattern."
  },
  {
    "q": "A financial reporting service requires that all write operations to a transaction database immediately update the in-memory cache at the exact same time the database is updated. The team can tolerate slightly higher write latency in exchange for guaranteeing that subsequent reads immediately observe the newly written data without a cache miss. Which caching pattern meets these requirements?",
    "o": [
      "Lazy Loading",
      "Write-Through",
      "Read-Through",
      "Exponential Backoff"
    ],
    "a": [
      1
    ],
    "e": "Write-Through synchronously writes to both the database and the cache on every write operation, guaranteeing immediate freshness on subsequent reads."
  },
  {
    "q": "A developer is evaluating whether to adopt Write-Through caching or Lazy Loading for an application where 90% of written records are archived data that will never be queried again by users. What is the primary disadvantage of using Write-Through caching in this scenario?",
    "o": [
      "Write-Through caching fails to maintain data freshness after database updates",
      "Write-Through caching consumes unnecessary cache memory by storing cold data that is never read",
      "Write-Through caching results in high cache miss rates for popular read keys",
      "Write-Through caching requires changes to the database engine's storage engine"
    ],
    "a": [
      1
    ],
    "e": "Write-Through caches every written record regardless of whether it is ever read, consuming valuable memory on cold or archived records."
  },
  {
    "q": "A developer is reviewing an application using Lazy Loading with an in-memory cache. A separate administrative batch job directly updates 10,000 records in the underlying relational database without invoking the application API or deleting any cache keys. What will happen when users read those updated records through the application API before the cache entries expire?",
    "o": [
      "The application will immediately query the database and retrieve the updated values",
      "The application will continue to serve stale, un-updated values from the cache until the cache entries expire or are invalidated",
      "The in-memory cache will automatically detect the database change via binlog replication",
      "The application will throw a CacheConsistencyException"
    ],
    "a": [
      1
    ],
    "e": "Because Lazy Loading relies on application-level invalidation during writes, out-of-band database writes bypass cache deletion, leaving stale data until TTL expiry."
  },
  {
    "q": "A developer needs to implement a caching architecture where application code does not contain any branching logic to check the cache or query the database on a cache miss. Instead, the application makes standard API calls to a caching layer, and the caching layer transparently queries the backend database when a miss occurs. Which caching pattern is described?",
    "o": [
      "Read-Through",
      "Write-Behind",
      "Client-Side In-Memory Map",
      "Lazy Loading"
    ],
    "a": [
      0
    ],
    "e": "In Read-Through caching, the caching layer/client transparently fetches missing data from the database on a miss without application-level branching logic."
  },
  {
    "q": "An application uses DynamoDB Accelerator (DAX) in front of an Amazon DynamoDB table. When the application issues a `GetItem` request for an item not currently in DAX, DAX fetches the item from DynamoDB, stores it in memory, and returns it to the client without requiring custom cache-miss code in the application. Which caching pattern does DAX implement for read operations?",
    "o": [
      "Lazy Loading (Cache-Aside)",
      "Read-Through",
      "Refresh-Ahead",
      "Write-Around"
    ],
    "a": [
      1
    ],
    "e": "DAX acts as a transparent Read-Through cache for DynamoDB; the application calls standard DynamoDB SDK methods against DAX without custom miss-handling code."
  },
  {
    "q": "A developer is comparing the operational characteristics of Lazy Loading and Write-Through caching. Which two statements accurately describe the trade-offs between these two strategies? (Select TWO.)",
    "o": [
      "Lazy Loading only caches requested data, preventing cache churn from cold writes",
      "Write-Through caching eliminates all read latency on initial misses for keys that have never been written",
      "Write-Through caching introduces higher write latency because every write must update both the database and the cache",
      "Lazy Loading ensures that newly written data is immediately populated in cache before any read occurs",
      "Lazy Loading requires the caching layer to be fully API-compatible with the backend database SDK"
    ],
    "a": [
      0,
      2
    ],
    "multi": true,
    "e": "Lazy Loading only caches requested data (saving cache memory), while Write-Through incurs higher write latency because every write updates both DB and cache."
  },
  {
    "q": "A social media application updates user profile bios. The developer implements the write path for a Lazy Loading caching strategy. What sequence of operations should the write function execute when a user updates their bio?",
    "o": [
      "Update the database first, then write the new bio directly into the cache with a 24-hour TTL",
      "Update the database first, then delete (invalidate) the user's cached profile entry",
      "Delete the database record first, then update the cache entry",
      "Write to the cache only, and allow a background worker to persist the data to the database asynchronously"
    ],
    "a": [
      1
    ],
    "e": "The standard write path for Lazy Loading updates the source of truth (DB) first, then invalidates (deletes) the cached key so the next read fetches fresh data."
  },
  {
    "q": "A backend service implements a Write-Through caching strategy. What is a key failure mode that developers must handle in their application code during a write operation?",
    "o": [
      "The cache read failing due to missing TTL parameters",
      "A partial failure where the database write succeeds but the subsequent cache write fails, leaving the cache stale",
      "A cache miss during a write operation triggering an unhandled database lock",
      "Inability to read from the database when the cache cluster reaches maximum memory"
    ],
    "a": [
      1
    ],
    "e": "In Write-Through caching, a failure during the secondary cache write can leave the cache out of sync with the newly updated database record."
  },
  {
    "q": "An architect wants to minimize development effort by accelerating reads for an existing DynamoDB table without rewriting data access methods or managing Redis client connections. Which solution provides transparent Read-Through caching with full DynamoDB API compatibility?",
    "o": [
      "Amazon ElastiCache for Memcached",
      "DynamoDB Accelerator (DAX)",
      "Amazon CloudFront with Lambda@Edge",
      "Amazon S3 Select"
    ],
    "a": [
      1
    ],
    "e": "DynamoDB Accelerator (DAX) provides managed, API-compatible, transparent Read-Through in-memory caching specifically for DynamoDB."
  },
  {
    "q": "A developer wants to implement a hybrid caching strategy that combines Write-Through and Lazy Loading. How does combining these two patterns benefit the application?",
    "o": [
      "Write-Through guarantees freshness for written items, while Lazy Loading handles cache misses for legacy items that have not been modified recently",
      "The combination removes the need for any in-memory caching infrastructure",
      "The combination reduces all write operations to single-digit microsecond latency",
      "The combination eliminates the need for database storage"
    ],
    "a": [
      0
    ],
    "e": "Combining Write-Through with Lazy Loading ensures fresh data for updated items while allowing cold/legacy items to be loaded on-demand on first read."
  },
  {
    "q": "In a Lazy Loading architecture, what occurs on the first read request for an item that has never been queried since the cache was flushed?",
    "o": [
      "The application returns a null response immediately",
      "A cache miss occurs; the application queries the primary database, populates the cache with the retrieved item, and returns it",
      "The caching layer rejects the request with an HTTP 404 error",
      "The database automatically pushes all table rows into the cache"
    ],
    "a": [
      1
    ],
    "e": "On a cache miss in Lazy Loading, the application queries the database, writes the fetched data into the cache with a TTL, and returns it to the caller."
  },
  {
    "q": "A team is designing a high-throughput ticketing platform. When ticket prices change, the system must ensure that no customer sees an outdated price, but during regular browsing, read traffic must be offloaded from the database. The team selects Write-Through caching. Why is Write-Through preferred over pure Lazy Loading without invalidation for this use case?",
    "o": [
      "Write-Through eliminates database writes completely",
      "Write-Through guarantees that the cache is synchronized with the new price immediately upon writing to the database",
      "Write-Through is completely serverless and requires no compute instances",
      "Write-Through allows reading directly from disk replicas instead of memory"
    ],
    "a": [
      1
    ],
    "e": "Write-Through synchronizes the cache immediately upon every database write, ensuring no caller receives outdated price data."
  },
  {
    "q": "An engineer is reviewing code that implements a cache-aside pattern. The code catches network exceptions when communicating with the ElastiCache cluster and falls back directly to the primary database. What design principle does this implementation follow?",
    "o": [
      "Strong Consistency Isolation",
      "Graceful Degradation / Fault Tolerance",
      "Zero-Downtime Replication",
      "Sharded Partitioning"
    ],
    "a": [
      1
    ],
    "e": "Catching cache communication failures and falling back directly to the primary database is an example of graceful degradation and fault tolerance."
  },
  {
    "q": "Which of the following pseudocode blocks accurately illustrates a Write-Through caching pattern for an item update?",
    "o": [
      "``` function updateItem(id, data): database.save(id, data) cache.delete(id) ```",
      "``` function updateItem(id, data): database.save(id, data) cache.set(id, data) ```",
      "``` function updateItem(id, data): cache.set(id, data) queue.push(id, data) ```",
      "``` function updateItem(id, data): if cache.exists(id): database.save(id, data) ```"
    ],
    "a": [
      1
    ],
    "e": "Write-Through updates both the database and the cache synchronously as part of the write operation."
  },
  {
    "q": "A developer is designing a caching strategy for a microservice where cached objects must be structured differently than raw database rows (e.g., aggregating data from three separate SQL tables). Which caching pattern and service combination is most appropriate?",
    "o": [
      "DynamoDB Accelerator (DAX) with Read-Through",
      "Amazon ElastiCache (Redis) with Lazy Loading implemented in application code",
      "Amazon S3 Glacier Flexible Retrieval with direct queries",
      "Amazon RDS Read Replica with automatic JSON formatting"
    ],
    "a": [
      1
    ],
    "e": "ElastiCache with application-level Lazy Loading allows custom data transformations and aggregations across multiple backend tables before caching."
  },
  {
    "q": "What is the primary difference in code location between Lazy Loading and Read-Through caching?",
    "o": [
      "In Lazy Loading, the miss-handling logic is written inside the application code; in Read-Through, it is handled transparently by the caching layer or client library",
      "In Lazy Loading, logic lives in the database trigger; in Read-Through, logic lives in CloudFront",
      "In Read-Through, the application must manage TCP socket connections manually",
      "Lazy Loading cannot be used with Python or Node.js runtimes"
    ],
    "a": [
      0
    ],
    "e": "In Lazy Loading, miss-handling is written explicitly in application code; in Read-Through, the caching layer or SDK handles misses transparently."
  },
  {
    "q": "A developer notices that after deploying a Write-Through caching pattern, the average latency of `PUT /products/{id}` API requests increased by 15ms. What is the root cause of this increase?",
    "o": [
      "Write-Through caching forces the database to flush all tables to disk",
      "The API must now wait for both the database update and the cache update to complete before returning a response",
      "Write-Through caching encrypts data twice using AWS KMS",
      "The caching engine locks all read operations during a write"
    ],
    "a": [
      1
    ],
    "e": "Write-Through requires waiting for two network round trips (database write + cache write) to complete before returning a response."
  },
  {
    "q": "An application uses Lazy Loading with ElastiCache for Redis. A developer reports that whenever a new product is added to the database, the product is not found in the cache until someone visits the product page. Is this expected behavior?",
    "o": [
      "No, Redis should automatically discover new database records",
      "Yes, because Lazy Loading only populates cache entries on-demand upon a read cache miss",
      "No, this indicates a broken connection between Redis and the RDS instance",
      "Yes, but only if the database is running Amazon Aurora Serverless"
    ],
    "a": [
      1
    ],
    "e": "Lazy Loading is reactive; new items are only cached when a client issues a read request that triggers a cache miss."
  },
  {
    "q": "A developer is architecting a news feed caching solution. Which two criteria indicate that Lazy Loading is a better choice than Write-Through? (Select TWO.)",
    "o": [
      "The majority of published articles are never read by more than one or two users",
      "The application requires absolute zero tolerance for stale reads immediately after an article is edited",
      "Memory capacity on the cache cluster is limited and should only store actively read articles",
      "Write latency must be maximized while read latency is completely unconstrained",
      "The backend database does not support primary keys"
    ],
    "a": [
      0,
      2
    ],
    "multi": true,
    "e": "Lazy Loading avoids caching articles that are rarely read (saving memory) and is ideal when cache capacity is constrained."
  },
  {
    "q": "What happens in a Read-Through cache when the backend database is temporarily unreachable during a cache miss?",
    "o": [
      "The cache automatically invents synthetic data to return to the caller",
      "The cache returns an error or exception indicating that the underlying source of truth could not be queried",
      "The cache converts the request into a Write-Through operation",
      "The cache drops the client connection without an HTTP response code"
    ],
    "a": [
      1
    ],
    "e": "If the primary source of truth is unreachable during a cache miss, the Read-Through cache returns an error because it cannot fulfill the fetch."
  },
  {
    "q": "A gaming application stores player scores in an Amazon RDS PostgreSQL database. The developer wants to implement caching using Amazon ElastiCache for Redis. What must the developer do in the application code to implement Lazy Loading?",
    "o": [
      "Configure PostgreSQL to publish write-ahead log events directly to Redis port 6379",
      "Write code that checks Redis for the player score, queries RDS if not found, and saves the score to Redis with a TTL before returning",
      "Install the DAX client library in the application",
      "Enable the Multi-AZ feature on the RDS DB instance"
    ],
    "a": [
      1
    ],
    "e": "Implementing Lazy Loading requires application code to check Redis, query RDS on miss, and write the fetched result to Redis with a TTL."
  },
  {
    "q": "An application uses a Write-Through caching pattern. During a network partition between the application and ElastiCache, the database write succeeds, but the cache update fails. Which strategy best maintains eventual consistency without crashing the write request?",
    "o": [
      "Roll back the database transaction, return an error, and retry the entire operation",
      "Invalidate/delete the cache key (or log the key for asynchronous invalidation) so the next read triggers a fresh fetch from the database",

    ],
    "e": "Deleting the cache key upon a write failure ensures that subsequent reads will re-fetch the fresh value from the database."
  },
  {

      "Lazy Loading optimizes for storage capacity; Write-Through optimizes for database security",
      "Lazy Loading optimizes write latency and cache memory efficiency at the cost of initial read latency and potential staleness; Write-Through optimizes read freshness and eliminates read misses for written keys at the cost of higher write latency and potential cache pollution",

  {

  },
  {

let idx = 0, score = 0, answered = new Array(QUESTIONS.length).fill(false), correctFlags = new Array(QUESTIONS.length).fill(false), missed = [];
const STORAGE_KEY = "aws-dva-quiz-09";

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({idx, score, answered, correctFlags}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.answered) && d.answered.length === QUESTIONS.length){
      idx = d.idx; score = d.score; answered = d.answered; correctFlags = d.correctFlags;
      return true;
    }
  }catch(e){}
  return false;
}

const quizArea = document.getElementById("quizArea");
const posNum = document.getElementById("posNum");
const scoreNum = document.getElementById("scoreNum");
const progressFill = document.getElementById("progressFill");

function updateTop(){
  posNum.textContent = (idx+1) + " / " + QUESTIONS.length;
  scoreNum.textContent = score;
  const answeredCount = answered.filter(Boolean).length;
  progressFill.style.width = (answeredCount / QUESTIONS.length * 100) + "%";
}

function renderQuestion(){
  const item = QUESTIONS[idx];
  const isMulti = !!item.multi;
  const done = answered[idx];
  let html = "";
  html += '<div class="card">';
  html += '<div class="qnum">Question ' + (idx+1) + '</div>';
  if(isMulti) html += '<div class="multi-hint">Select all that apply</div><br>';
  html += '<div class="qtext">' + escapeHtml(item.q) + '</div>';
  item.o.forEach((optText, i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = "opt";
    if(done){
      if(item.a.includes(i)) cls += " correct";
      else if(item.picked && item.picked.includes(i)) cls += " incorrect";
    } else if(item.picked && item.picked.includes(i)){
      cls += " selected";
    }
    html += '<button class="' + cls + '" data-i="' + i + '" ' + (done?'disabled':'') + '>' +
      '<span class="mark">' + letter + '</span><span>' + escapeHtml(optText) + '</span></button>';
  });
  if(done){
    html += '<div class="explain"><b>' + (correctFlags[idx] ? "Correct. " : "Not quite. ") + '</b>' + escapeHtml(item.e) + '</div>';
  }
  html += '<div class="actions">';
  if(isMulti && !done){
    html += '<button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>';
  }
  if(done){
    if(idx < QUESTIONS.length - 1){
      html += '<button class="btn btn-primary" id="nextBtn">Next question</button>';
    } else {
      html += '<button class="btn btn-primary" id="finishBtn">See results</button>';
    }
  }
  html += '<button class="btn btn-ghost" id="resetBtn">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  updateTop();
  wireOptions(item, isMulti, done);
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function wireOptions(item, isMulti, done){
  const opts = quizArea.querySelectorAll(".opt");
  opts.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(done) return;
      const i = parseInt(btn.dataset.i, 10);
      if(isMulti){
        item.picked = item.picked || [];
        const pos = item.picked.indexOf(i);
        if(pos >= 0) item.picked.splice(pos,1); else item.picked.push(i);
        renderQuestion();
        const submitBtn = document.getElementById("submitBtn");
        if(submitBtn) submitBtn.disabled = !(item.picked && item.picked.length > 0);
      } else {
        item.picked = [i];
        commitAnswer(item);
      }
    });
  });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn){
    submitBtn.disabled = !(item.picked && item.picked.length > 0);
    submitBtn.addEventListener("click", ()=> commitAnswer(item));
  }
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ idx++; save(); renderQuestion(); });
  const finishBtn = document.getElementById("finishBtn");
  if(finishBtn) finishBtn.addEventListener("click", renderSummary);
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", resetAll);
}

function commitAnswer(item){
  if(answered[idx]) return;
  answered[idx] = true;
  const correct = item.picked.length === item.a.length && item.picked.every(p => item.a.includes(p));
  correctFlags[idx] = correct;
  if(correct) score++; else missed.push(idx);
  save();
  renderQuestion();
}

function renderSummary(){
  const pct = Math.round(score / QUESTIONS.length * 100);
  const passed = pct >= 72;
  let html = '<div class="card summary">';
  html += '<div class="eyebrow">Results</div>';
  html += '<div class="score-big">' + score + ' / ' + QUESTIONS.length + '</div>';
  html += '<div class="score-pct ' + (passed?'pass':'fail') + '">' + pct + '% — ' + (passed ? "Solid, above the ~72% pass bar" : "Below the ~72% pass bar — revisit the notes") + '</div>';
  const missedList = answered.map((_,i)=>i).filter(i => !correctFlags[i]);
  if(missedList.length){
    html += '<div class="miss-list"><h3>Review these questions</h3>';
    missedList.forEach(i=>{
      html += '<div class="miss-item"><b>Q' + (i+1) + '.</b> ' + escapeHtml(QUESTIONS[i].q) + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="actions" style="justify-content:center; margin-top:22px;">';
  html += '<button class="btn btn-primary" id="restartBtn">Restart quiz</button>';
  html += '<button class="btn btn-ghost" id="resetBtn2">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  document.getElementById("restartBtn").addEventListener("click", resetAll);
  document.getElementById("resetBtn2").addEventListener("click", resetAll);
}

function resetAll(){
  idx = 0; score = 0; missed = [];
  answered = new Array(QUESTIONS.length).fill(false);
  correctFlags = new Array(QUESTIONS.length).fill(false);
  QUESTIONS.forEach(q => { delete q.picked; });
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderQuestion();
}

document.addEventListener("keydown", (e)=>{
  const map = {"1":0,"2":1,"3":2,"4":3,"5":4,"a":0,"b":1,"c":2,"d":3,"e":4,"A":0,"B":1,"C":2,"D":3,"E":4};
  if(e.key in map){
    const opts = quizArea.querySelectorAll(".opt:not(:disabled)");
    const i = map[e.key];
    if(opts[i]) opts[i].click();
  } else if(e.key === "Enter"){
    const nb = document.getElementById("nextBtn") || document.getElementById("finishBtn") || document.getElementById("submitBtn");
    if(nb && !nb.disabled) nb.click();
  }
});

if(load()){
  if(answered.every(Boolean)) renderSummary(); else renderQuestion();
} else {
  renderQuestion();
}
</script>

{q:"A publisher service needs to notify five different downstream systems of the same event, where three subscribers need durable, retriable delivery (best served by SQS) and two subscribers need immediate, low-latency push delivery (best served by Lambda). Which single-topic design supports both delivery needs simultaneously from one publish call?",o:["An SNS topic with three SQS subscriptions and two Lambda subscriptions","Five separate SNS topics, each with a single subscription","A single SQS queue polled by all five systems","A Kinesis Data Stream with five shards, one per subscriber"],a:[0],e:"A single topic can mix SQS and Lambda subscriptions, satisfying both durable-retriable and low-latency-push needs from one publish call."},
{q:"A publisher sends messages to a shared SNS topic tagging each with a message attribute named event_type. A subscription's filter policy is set to {\"event_type\": [\"order_shipped\"]}. What happens when a message with event_type set to \"order_created\" is published to the topic?",o:["The subscriber receives the message anyway, since filter policies are advisory only","SNS does not deliver that message to this subscription, since it does not match the filter policy, while other subscriptions without this filter (or with a matching filter) may still receive it","The publish call fails outright","The message is automatically converted to have event_type \"order_shipped\""],a:[1],e:"The non-matching message is filtered out for this subscription only; other subscriptions are unaffected by this one's filter policy."},
{q:"What is the primary cost/traffic optimization benefit of using SNS subscription filter policies, as tested under Domain 4 (Troubleshooting and Optimization)?",o:["Filter policies reduce the size of the SNS topic's storage footprint","Filter policies cause SNS to discard non-matching messages before delivery, preventing subscribers from receiving and having to process/discard irrelevant messages themselves, which reduces wasted invocations, polling cycles, and processing cost","Filter policies eliminate the need for IAM permissions on subscribers","Filter policies automatically compress message bodies to reduce data transfer costs"],a:[1],e:"Filtering discards non-matching messages before delivery, saving the subscriber the cost/effort of receiving and discarding them itself."},
{q:"At what level is an SNS filter policy configured?",o:["On the topic itself, applying identically to every subscriber","On an individual subscription, allowing different subscribers to the same topic to receive different filtered subsets of published messages","On the publisher's IAM role","On the SQS queue, independent of SNS entirely"],a:[1],e:"Filter policies are attached per-subscription, enabling differentiated delivery from one topic."},
{q:"By default, what does an SNS filter policy match against?",o:["The full message body text only","Message attributes attached to the published message (message-body filtering is also available as a separate, newer capability)","The publisher's IAM user name","The subscriber's AWS account ID only"],a:[1],e:"Filter policies match message attributes by default; message-body filtering is a separate, newer capability."},
{q:"A company has three subscribers to a single SNS topic: one needs only messages where order_value is 100 or greater, one needs only \"order_cancelled\" events, and one needs every message with no filtering. Which SNS capability allows this differentiated delivery from a single topic without modifying the publisher?",o:["Three separate topics must be created, since one topic cannot support differentiated delivery","Per-subscription filter policies, using numeric and string matching, applied independently to each subscription","SNS delivers identically to all subscribers with no filtering capability","The publisher must send three separate messages, one per intended subscriber"],a:[1],e:"Independent per-subscription filter policies (numeric and string matching) enable this differentiated delivery from a single topic."},
{q:"Before a company implemented SNS filter policies, a finance-focused Lambda function that only cared about roughly 200 \"refund\" events per day was being invoked for all 50,000 daily events published to the topic, discarding the other 49,800 internally. After implementing a filter policy scoped to the Lambda's subscription, what is the expected operational effect?",o:["No change; filter policies do not affect Lambda invocation counts","The Lambda function's invocation count drops to approximately the number of matching events (around 200/day), since SNS filters out non-matching messages before delivery rather than after","The Lambda function will now be invoked more often than before","The topic itself will be deleted and recreated"],a:[1],e:"Filtering before delivery drops the Lambda's invocation count to roughly the matching subset, around 200/day."},
{q:"Which example correctly demonstrates SNS filter policy syntax for matching a numeric message attribute greater than or equal to a threshold?",o:["{\"order_value\": {\"gte\": 100}}","{\"order_value\": [{\"numeric\": [\">=\", 100]}]}","{\"order_value\": \">=100\"}","{\"filter\": \"order_value >= 100\"}"],a:[1],e:"SNS numeric filter syntax uses {\"attribute\": [{\"numeric\": [\">=\", 100]}]}."},
{q:"A subscription's filter policy is removed entirely (left unset). What is the resulting delivery behavior for that subscription?",o:["The subscription receives no messages at all until a filter policy is added","The subscription receives every message published to the topic, since no filter policy means no filtering is applied","The subscription automatically inherits the filter policy of another subscription","SNS rejects publishes to topics with any subscription lacking a filter policy"],a:[1],e:"No filter policy means the subscription receives every message published to the topic."},
{q:"Which two of the following are accurate statements about SNS subscription filter policies? (Select TWO)",o:["They are evaluated per-subscription, so different subscribers to the same topic can receive different filtered subsets of the same published stream","They reduce unnecessary consumer-side processing and cost by filtering non-matching messages out before delivery","They must be identical across every subscription on a given topic","They can only match against the literal string \"true\" or \"false\"","They are configured on the SQS queue rather than the SNS subscription"],a:[0,1],multi:true,e:"Filter policies are per-subscription (enabling differentiated delivery) and reduce consumer-side cost/processing by filtering before delivery."},
{q:"A company wants to eliminate wasted SQS polling and Lambda invocation cost currently incurred because every subscriber to their SNS topic receives and then discards the vast majority of irrelevant messages in code. Which single change addresses this most directly, without altering the publisher?",o:["Reduce the number of subscribers","Attach an appropriately scoped filter policy to each subscription based on the message attributes each subscriber actually needs","Switch the topic to a FIFO SNS topic with no other changes","Increase the SQS visibility timeout on each subscribing queue"],a:[1],e:"Scoping each subscription's filter policy to what that subscriber actually needs eliminates the wasted delivery/processing without touching the publisher."},
{q:"Which of the following filter policy examples would match messages where a region attribute is anything other than \"test-region\"?",o:["{\"region\": [\"test-region\"]}","{\"region\": [{\"anything-but\": \"test-region\"}]}","{\"region\": {\"not\": \"test-region\"}}","{\"region\": \"!test-region\"}"],a:[1],e:"The \"anything-but\" operator matches any value except the specified one(s)."},
{q:"A developer configures a filter policy on a subscription but publishes messages without including the attribute the filter policy checks. What is the resulting behavior for that subscription, by default?",o:["The message is always delivered, since a missing attribute is treated as an automatic match","The message does not match the filter policy and is not delivered to that subscription, since the referenced attribute is absent","SNS raises a publish-time error requiring the attribute to be present","The subscription is automatically disabled"],a:[1],e:"A message lacking the attribute the filter checks does not match and is not delivered to that subscription."},
{q:"Which two of the following scenarios are well-suited to SNS filter policies as the correct optimization mechanism, rather than requiring a code change in the subscriber? (Select TWO)",o:["A subscriber only cares about a specific subset of event types published to a shared topic and currently discards the rest in its own code","A subscriber wants to permanently change the structure of the message body before it is delivered","A subscriber only cares about numeric threshold-based events (e.g., order_value >= 100) out of a broader published stream","A subscriber wants to encrypt messages at rest using its own KMS key","A subscriber wants to change which AWS Region the topic is hosted in"],a:[0,2],multi:true,e:"Both are content-based delivery-scoping needs that filter policies solve without any subscriber code change."},
{q:"A company's monthly Lambda bill unexpectedly spikes because a function subscribed to a busy SNS topic is invoked for every message, even though it only acts on less than 1% of them. Which fix most directly reduces both cost and unnecessary invocations without changing the function's code?",o:["Rewrite the Lambda function in a faster runtime","Apply a subscription filter policy scoped to the specific message attributes the function actually needs to act on","Increase the Lambda function's memory allocation","Move the function's logic into the SNS topic's resource policy"],a:[1],e:"A filter policy scoped to the attributes the function needs stops SNS from invoking it for non-matching messages at all."},
{q:"What is the default event bus that every AWS account automatically has available, without any setup?",o:["The custom event bus","The partner event bus","The default event bus, which receives events from many AWS services natively","The Kinesis event bus"],a:[2],e:"Every account has a default event bus that receives many native AWS service events automatically."},
{q:"A company wants to isolate their own application's custom business events from the higher-volume stream of native AWS service events, to keep rule matching simpler and more scoped. Which EventBridge resource should they create?",o:["A partner event bus","A custom event bus dedicated to their application's events","A new AWS account","A second default event bus"],a:[1],e:"A custom event bus isolates an application's own events from the higher-volume default bus."},
{q:"Which EventBridge resource type allows an AWS account to receive events directly from an integrated SaaS vendor (such as a monitoring or support-ticketing platform) without building a custom webhook receiver?",o:["A custom event bus","A partner event bus","An SQS-backed event bus","A Kinesis event bus"],a:[1],e:"A partner event bus is the integration point for receiving events directly from an integrated SaaS partner."},
{q:"What two components does an EventBridge rule require in order to route matching events? (Select TWO)",o:["An event pattern describing which events the rule should match","At least one target that the matching event should be sent to","A VPC endpoint policy","A Kinesis shard ID","An IAM user with console access"],a:[0,1],multi:true,e:"A rule needs both an event pattern (or schedule) to match against and at least one target to invoke."},
{q:"A developer wants an EventBridge rule to trigger a Lambda function every day at exactly 12:00 UTC, on a fixed calendar schedule. Which expression type should the schedule use?",o:["A rate() expression, since it supports exact calendar timing","A cron() expression, such as cron(0 12 * * ? *)","An event pattern matching a scheduled-event source","A Kinesis shard iterator"],a:[1],e:"cron() expressions support exact calendar-based timing, such as a fixed daily time."},
{q:"Which of the following is a valid EventBridge rate() expression for triggering a target every 5 minutes?",o:["rate(5 minutes)","cron(5 minutes)","every(5, minutes)","schedule(5m)"],a:[0],e:"rate(5 minutes) is valid EventBridge rate syntax."},
{q:"A company wants to reprocess a set of application events that were published to a custom EventBridge bus last week, after fixing a bug in the downstream Lambda function that originally failed to handle them correctly. Which EventBridge capability supports this without asking the original producer to resend the events?",o:["EventBridge archive and replay, assuming the relevant events were archived","A FIFO SQS redrive policy","A Kinesis Data Analytics query","SNS message retention"],a:[0],e:"EventBridge archive and replay lets previously archived events be replayed onto a bus without producer involvement."},
{q:"Which of the following can serve as a target for an EventBridge rule?",o:["Only AWS Lambda functions","Lambda functions, SQS queues, SNS topics, Step Functions state machines, Kinesis streams, and 20+ other target types","Only Amazon S3 buckets","Only another AWS account's root user"],a:[1],e:"EventBridge rules support Lambda, SQS, SNS, Step Functions, Kinesis, and 20+ other target types."},
{q:"A team wants to route events based on rich content within the event body — for example, only matching events where a nested \"detail.state\" field equals \"CANCELLED\" and a nested \"detail.amount\" field exceeds 500 — to a specific Lambda target. Which EventBridge capability enables this content-based routing?",o:["A rate() expression","An event pattern with nested field matching, including numeric comparison operators","An SQS message attribute filter","A Kinesis partition key"],a:[1],e:"Event patterns support nested field matching, including numeric comparison operators, for content-based routing."},
{q:"What is EventBridge Pipes designed to simplify, compared to a full bus/rule/target setup?",o:["Connecting one specific source (such as an SQS queue, DynamoDB stream, or Kinesis stream) directly to one specific target, with optional filtering and an optional enrichment step in between, without needing a separate bus and rule","Replacing SNS entirely for all pub/sub use cases","Providing a dedicated compute runtime that replaces Lambda","Automatically converting Standard SQS queues into FIFO queues"],a:[0],e:"Pipes simplifies wiring one specific source to one specific target with optional filtering/enrichment, without a full bus/rule setup."},
{q:"Which of the following event sources can natively publish events onto an AWS account's default EventBridge bus with zero developer setup?",o:["Only custom application code explicitly configured to do so","Many native AWS services (such as EC2 state changes or CodePipeline stage changes), which publish events to the default bus automatically","Only Amazon S3","Only Lambda functions with a specific IAM permission"],a:[1],e:"Many native AWS services publish state-change events to the default bus automatically, with zero developer setup."},
{q:"A company wants to trigger a nightly data-cleanup Lambda function at 2:00 AM UTC without maintaining a dedicated cron server or EC2 instance. Which approach is the modern, serverless-appropriate solution?",o:["An EventBridge scheduled rule using a cron() expression targeting the Lambda function","A permanently running EC2 instance with a crontab entry","A Standard SQS queue with a 24-hour delay","An SNS topic subscribed via email, manually triggered each night"],a:[0],e:"An EventBridge scheduled rule with a cron() expression targeting Lambda is the modern, serverless-appropriate nightly-job solution."},
{q:"Which of the following correctly distinguishes EventBridge from SNS in terms of typical source variety?",o:["SNS natively integrates with 200+ AWS services out of the box, while EventBridge does not","EventBridge natively integrates with a very wide range of AWS services and SaaS partners in addition to custom application events, while SNS is primarily built for publishing from your own application","Both services have identical native source integrations","Neither service integrates natively with any AWS service"],a:[1],e:"EventBridge's native source integration (AWS services + SaaS partners) is far broader than SNS, which is primarily for your own application's publishes."},
{q:"A company needs to route different types of structured application events (e.g., OrderCreated, OrderCancelled, InventoryLow) from multiple internal microservices to different targets based on the event's type and content, with some events also needing to reach a partner SaaS analytics platform. Which service is best suited as the central routing layer for this scenario?",o:["A single SQS Standard queue shared by all event types","Amazon EventBridge, using event patterns on a custom bus to route by event type/content, potentially alongside a partner event bus integration","A single SNS topic with no filtering, letting every subscriber discard irrelevant events itself","Amazon Athena"],a:[1],e:"EventBridge's content-based routing on a custom bus, plus optional partner bus integration, directly fits this multi-source, multi-target scenario."},
{q:"Which two of the following are accurate about EventBridge archive and replay? (Select TWO)",o:["Archived events can be replayed back onto a bus within a specified time window","Retention for an archive can be set to a defined period or kept indefinitely","Replay requires the original producer application to resend every event manually","Archive and replay are only available for the default event bus, never custom buses","Replay permanently deletes the archived copy of each event once replayed"],a:[0,1],multi:true,e:"Archived events can be replayed within a specified window, and archive retention can be time-bound or indefinite."},
{q:"A rule on an EventBridge custom bus has the following event pattern: {\"source\": [\"myapp.orders\"], \"detail-type\": [\"OrderStateChange\"], \"detail\": {\"state\": [\"CANCELLED\"]}}. Which of the following incoming events would this rule match?",o:["An event with source \"myapp.orders\", detail-type \"OrderStateChange\", and detail.state \"SHIPPED\"","An event with source \"myapp.orders\", detail-type \"OrderStateChange\", and detail.state \"CANCELLED\"","An event with source \"myapp.inventory\", detail-type \"OrderStateChange\", and detail.state \"CANCELLED\"","An event with source \"myapp.orders\", detail-type \"InventoryChange\", and detail.state \"CANCELLED\""],a:[1],e:"Only the event matching source, detail-type, and detail.state exactly as specified satisfies the pattern."},
{q:"Which statement best summarizes when EventBridge is preferred over SNS for a routing scenario?",o:["When the scenario involves routing based on the structured content of many different event types from many different sources, including native AWS service events, SaaS partner events, or scheduled triggers","When the scenario is a simple one-to-many fanout of a custom application message to email, SMS, and SQS subscribers with no content-based routing needed","EventBridge should always be preferred regardless of scenario, since it can fully replace SNS","EventBridge cannot integrate with Lambda, unlike SNS"],a:[0],e:"EventBridge fits scenarios needing content-based routing across many event types/sources, native AWS integration, or scheduling — not every scenario, contrary to option C."},
{q:"A rule's target invocation fails repeatedly (for example, the target Lambda function is throttled). What is the general behavior for handling this kind of target delivery failure on an EventBridge rule?",o:["EventBridge silently drops the event permanently with no retry or failure-handling options","EventBridge supports retry policies and can be configured with a dead-letter queue for a rule's target to capture events that fail after retries are exhausted","The entire event bus is disabled until manually re-enabled","EventBridge automatically deletes the failing target"],a:[1],e:"EventBridge rules support retry policies and an optional dead-letter queue for a target's exhausted-retry failures."},
{q:"Which two of the following are valid uses of EventBridge scheduled rules? (Select TWO)",o:["Triggering a Lambda function every hour using a rate(1 hour) expression","Triggering a target at a specific calendar time daily using a cron() expression","Filtering messages based on SNS message attributes","Guaranteeing exactly-once delivery semantics identical to SQS FIFO","Providing a managed SQL query engine over a Kinesis stream"],a:[0,1],multi:true,e:"Both rate() and cron() expressions are valid ways to define an EventBridge scheduled rule's trigger timing."},
{q:"A company integrates a third-party incident-management SaaS platform so that whenever an incident is created in that external tool, a corresponding event appears in the company's AWS account for automated routing. Which EventBridge concept most directly names this integration point?",o:["A custom event bus created entirely by the company","A partner event bus, provisioned as part of the SaaS integration","An SQS dead-letter queue","A Kinesis Data Analytics application"],a:[1],e:"A partner event bus is the named integration point for a SaaS platform's events to appear in the account."},
{q:"Compared to SQS, is an EventBridge bus by itself considered a durable, replayable data store for arbitrary time periods without extra configuration?",o:["Yes, EventBridge buses retain all events indefinitely by default with no configuration needed","Not by itself — durability/replay requires explicitly configuring archive and replay, or routing to a durable downstream target like SQS; the bus itself is primarily a routing mechanism, not a default long-term store","Yes, but only for FIFO-configured event buses","EventBridge cannot be combined with SQS as a target under any circumstance"],a:[1],e:"The bus itself is a routing mechanism; durable replay requires explicit archive/replay configuration or a durable downstream target."},
{q:"A retail company wants: (1) every native AWS CodePipeline stage-change event routed to a Slack-notification Lambda, (2) custom \"InventoryLow\" events from their own microservice routed to a restocking Lambda, and (3) a nightly cleanup job triggered on a fixed schedule — all managed through one consistent routing mechanism. Which service most directly supports all three requirements together?",o:["Amazon SQS, using three separate queues","Amazon EventBridge, using rules on the default bus for the native events, a custom bus (or the default bus) with an event pattern for the custom events, and a scheduled rule for the nightly job","Amazon SNS, using a single unfiltered topic","AWS Direct Connect"],a:[1],e:"EventBridge covers native AWS events, custom event routing, and scheduled rules all through one consistent rule-based mechanism."},
{q:"What is the base unit of throughput capacity in an Amazon Kinesis Data Stream?",o:["A partition","A shard","A topic","A message group"],a:[1],e:"A shard is the base throughput unit of a Kinesis Data Stream."},
{q:"In classic (shared-fan-out) mode, what is the approximate write throughput limit per shard in a Kinesis Data Stream?",o:["1 MB/sec or 1,000 records/sec","10 MB/sec or 10,000 records/sec","100 KB/sec or 100 records/sec","Unlimited, bounded only by account-level quotas"],a:[0],e:"Each shard supports roughly 1 MB/sec or 1,000 records/sec of write throughput in classic mode."},
{q:"What role does a Kinesis Data Streams partition key play?",o:["It encrypts the record body","It determines which shard a given record is routed to, and records sharing the same partition key stay ordered within that shard","It sets the record's retention period individually","It defines the IAM permissions required to read that record"],a:[1],e:"The partition key determines shard routing, and same-key records stay ordered within that shard."},
{q:"A team notices that one shard in their Kinesis Data Stream is consistently near its throughput limit while other shards in the same stream sit mostly idle, even though total account-level throughput needs are well within the stream's overall provisioned capacity. What is the most likely root cause?",o:["The stream's retention period is set too low","An uneven or low-cardinality partition key choice is routing a disproportionate share of records to a single shard, creating a \"hot shard\"","Kinesis Data Streams cannot have more than one shard active at a time","The consumer is using long polling incorrectly"],a:[1],e:"An uneven/low-cardinality partition key creates a hot shard even when overall provisioned capacity is sufficient."},
{q:"Which AWS-provided library is designed to simplify building a custom Kinesis Data Streams consumer, handling shard discovery, checkpointing, and load balancing across multiple consumer instances automatically?",o:["The Kinesis Client Library (KCL)","The AWS SDK for S3","The Systems Manager Agent","The Kinesis Producer Library (KPL), which is consumer-side only"],a:[0],e:"The Kinesis Client Library (KCL) handles shard discovery, checkpointing, and load balancing for custom consumers."},
{q:"What is the default data retention period for a Kinesis Data Stream, and what is the maximum it can be extended to?",o:["Default 24 hours, extendable up to 365 days","Default 7 days, extendable up to 30 days","Default 1 hour, extendable up to 24 hours","Default 30 days, with no ability to extend further"],a:[0],e:"Default retention is 24 hours, extendable up to 365 days."},
{q:"Why does Kinesis Data Streams' retention window matter for enabling \"replay\" of stream data, in a way that SQS fundamentally cannot support once a message has been consumed?",o:["SQS also supports full replay identically to Kinesis","A Kinesis record remains available for any consumer to re-read at any position within the retention window, whereas an SQS message is deleted once a consumer successfully processes and deletes it, with no mechanism to re-read it afterward","Kinesis retention has no bearing on replay capability","Replay in Kinesis requires deleting and recreating the stream every time"],a:[1],e:"Kinesis records remain re-readable within the retention window; SQS deletes a message once successfully consumed, with no replay mechanism."},
{q:"A media company wants three independent applications — real-time fraud detection, a live dashboard, and nightly batch archival — to each read the full, same set of clickstream events independently, at their own pace, with the ability for any one of them to recover and re-read recent data if it falls behind or fails. Which Kinesis Data Streams characteristic directly supports this requirement?",o:["Its ability to support multiple independent consumers each tracking their own read position against the same underlying stream data, within the retention window","Its requirement that only one consumer may read from the stream at any given time","Its automatic deletion of records immediately after the first consumer reads them","Its lack of any retention period"],a:[0],e:"Multiple independent consumers, each tracking their own position within the retention window, is the defining Kinesis Data Streams capability this requires."},
{q:"Which of the following is a valid way for a Lambda function to consume records from a Kinesis Data Stream?",o:["Lambda cannot consume from Kinesis Data Streams under any configuration","Via an event source mapping, similar in concept to SQS, where Lambda's poller reads shard iterators and invokes the function with batches of records","Only via a manually configured API Gateway proxy in front of the stream","Only by first exporting the stream's data to S3"],a:[1],e:"Lambda consumes Kinesis via an event source mapping conceptually similar to SQS, reading shard iterators in batches."},
{q:"A producer application needs to write records to a Kinesis Data Stream. Which of the following are legitimate producer options? (Select TWO)",o:["The Kinesis Producer Library (KPL)","The AWS SDK's PutRecord/PutRecords API calls","An SNS filter policy","An SQS visibility timeout extension","An EventBridge archive"],a:[0,1],multi:true,e:"The KPL and direct SDK PutRecord/PutRecords calls are both legitimate ways to write records to a stream."},
{q:"What does Kinesis Data Streams On-Demand capacity mode provide, compared to manually provisioned shard mode?",o:["Automatic scaling of stream capacity without the developer manually managing or resizing shard counts","A permanently fixed number of shards that can never change","Unlimited free throughput with no billing implications","Elimination of the need for any consumer application"],a:[0],e:"On-Demand mode auto-scales stream capacity without manual shard management."},
{q:"Which statement accurately reflects why Kinesis Data Streams, rather than SQS, is the appropriate choice for a scenario requiring strict ordering across a high-volume stream while supporting multiple independently-scaling downstream analytics consumers reading the same data?",o:["SQS FIFO queues cannot be read by more than one consumer type, and even Standard SQS deletes messages upon consumption, preventing multiple independent full reads of the same data — Kinesis retains records for replay by multiple independent consumers within its retention window","SQS and Kinesis are functionally identical for this use case","Kinesis cannot preserve ordering under any circumstance","SQS FIFO provides unlimited independent-consumer replay identical to Kinesis"],a:[0],e:"SQS's single-read/delete model prevents multiple independent full replays, while Kinesis retains records for exactly that purpose within its retention window."},
{q:"In Kinesis Data Streams, what does \"checkpointing\" (typically handled by the Kinesis Client Library) refer to?",o:["Encrypting records at rest","Tracking how far a given consumer application has read within a shard, so it can resume from the correct position after a restart or failure","Deleting records once read by any consumer","Setting the shard's throughput limit"],a:[1],e:"Checkpointing tracks a consumer's read progress within a shard so it can resume correctly after a restart."},
{q:"A poorly chosen Kinesis partition key uses a constant literal value for every record regardless of the record's actual content. What is the most likely consequence?",o:["Every record is routed to the same single shard, creating a severe hot-shard bottleneck regardless of how many shards the stream has","Records are evenly distributed across all shards automatically regardless of partition key value","This has no effect on shard distribution","The stream automatically rejects records with a constant partition key"],a:[0],e:"A constant partition key routes every record to the same shard, creating a severe bottleneck."},
{q:"Which two of the following are true about Kinesis Data Streams consumers? (Select TWO)",o:["Multiple independent consumer applications can read the same stream data concurrently, each maintaining its own position","A record is permanently deleted from the stream as soon as any single consumer reads it","Consumers can use the Kinesis Client Library to handle shard discovery and checkpointing automatically","Only one consumer application may ever be attached to a given stream","Kinesis Data Streams has no concept of consumer read position"],a:[0,2],multi:true,e:"Multiple independent consumers can read the same data at their own pace, and KCL automates shard discovery/checkpointing."},
{q:"A stream architecture needs a producer to write IoT sensor telemetry at high volume, with strict per-device ordering (all readings from the same device processed in the order they were generated) while allowing several independent downstream systems to each process the full stream. Which partition key strategy best achieves the per-device ordering requirement?",o:["A constant partition key shared by every device","A randomly generated partition key on every record, unrelated to the device","The device ID used as the partition key, ensuring all of a given device's records land on and stay ordered within the same shard","No partition key at all, since Kinesis does not use partition keys"],a:[2],e:"Using the device ID as the partition key keeps each device's records ordered together on a single shard."},
{q:"What best describes the core function of Amazon Kinesis Data Firehose?",o:["A fully managed delivery service that buffers and delivers streaming data near-real-time to fixed destinations such as S3, Redshift, or OpenSearch Service, without requiring shard management","A raw, low-level shard-based streaming storage service identical to Kinesis Data Streams","A relational database service for transactional workloads","A service exclusively for running ad-hoc SQL queries against S3 data"],a:[0],e:"Firehose is a fully managed delivery service to fixed destinations, requiring no shard management."},
{q:"Which of the following is NOT a native delivery destination for Kinesis Data Firehose?",o:["Amazon S3","Amazon Redshift","Amazon OpenSearch Service","Amazon DynamoDB as a direct native destination for streamed records"],a:[3],e:"DynamoDB is not one of Firehose's native delivery destinations (S3, Redshift, and OpenSearch Service are)."},
{q:"A team needs to transform incoming JSON records into Parquet format and enrich each record with an additional computed field before Firehose delivers them to S3. Which Firehose capability supports this?",o:["Firehose cannot transform data in any way; only raw pass-through delivery is supported","An inline data transformation step using an attached Lambda function, invoked by Firehose before delivery","A Kinesis Data Streams partition key change","An SNS filter policy applied to the delivery stream"],a:[1],e:"An attached Lambda function performs inline transformation before Firehose delivers the records."},
{q:"Which statement accurately contrasts the operational overhead of Kinesis Data Streams versus Kinesis Data Firehose?",o:["Both require identical manual shard management","Data Streams requires the developer to manage shard count/scaling (or use On-Demand mode) and write custom consumer logic; Firehose is fully managed, auto-scales, and delivers directly to fixed destinations with no shard management or custom consumer code required","Firehose requires more manual operational management than Data Streams","Neither service requires any configuration whatsoever"],a:[1],e:"Data Streams requires shard/consumer management; Firehose is fully managed with automatic delivery and no shard management."},
{q:"A company wants streaming clickstream data delivered reliably into S3 for later batch analysis, with minimal custom code and no desire to manage stream shard capacity themselves. Which Kinesis service best fits this specific requirement?",o:["Kinesis Data Streams with a custom KCL consumer","Kinesis Data Firehose, configured with S3 as the destination","Kinesis Data Analytics alone, with no delivery destination","Amazon Athena, since it can ingest streaming data directly"],a:[1],e:"Firehose configured with S3 as the destination directly fits this minimal-code, no-shard-management delivery need."},
{q:"What is the typical minimum buffering interval characteristic of Kinesis Data Firehose before it delivers buffered records to its destination, making it \"near-real-time\" rather than instantaneous?",o:["Firehose delivers every record with zero buffering delay, identical to Data Streams","Firehose buffers by size or time interval (with a minimum around 60 seconds, configurable higher) before flushing to the destination","Firehose buffers for exactly 24 hours before every delivery","Firehose has no buffering mechanism at all"],a:[1],e:"Firehose buffers by size or time (minimum around 60 seconds, configurable) before flushing to its destination."},
{q:"Which AWS capability allows a developer to run continuous SQL or Apache Flink queries directly against a live Kinesis Data Stream or Firehose delivery stream, such as computing a rolling 5-minute average in real time?",o:["Amazon Athena","Kinesis Data Analytics","Amazon OpenSearch Service","AWS Glue Data Catalog alone"],a:[1],e:"Kinesis Data Analytics runs continuous SQL/Flink queries directly against a live stream."},
{q:"A company currently has a Kinesis Data Analytics application computing a real-time aggregate over a Kinesis Data Stream. Which of the following accurately describes how Data Analytics relates to the underlying stream's storage?",o:["Data Analytics maintains its own separate, independently retained copy of every record indefinitely","Data Analytics queries the source stream's data in real time and can output results to another stream/Firehose, but does not itself serve as the stream's durable storage layer","Data Analytics replaces the need for a Kinesis Data Stream entirely","Data Analytics can only run batch queries once every 24 hours"],a:[1],e:"Data Analytics queries the source stream in real time and can output elsewhere, but is not itself the stream's durable storage."},
{q:"Which two of the following are accurate statements comparing Kinesis Data Streams to Kinesis Data Firehose? (Select TWO)",o:["Data Streams supports replay/re-reading of data by multiple independent consumers within its retention window; Firehose does not retain a separately re-readable copy once delivered","Firehose requires the developer to provision and manage shard count manually","Data Streams is fully managed with automatic delivery to S3/Redshift/OpenSearch and no custom consumer code","Firehose supports inline Lambda-based transformation of records before delivery to its destination","Both services have an identical operational model with no meaningful difference"],a:[0,3],multi:true,e:"Data Streams supports multi-consumer replay that Firehose does not retain, and Firehose supports inline Lambda transformation before delivery."},
{q:"A company's security logs need to be delivered continuously into an OpenSearch Service domain for near-real-time search and dashboarding, with minimal custom ingestion code. Which Kinesis service is the most direct fit for this specific delivery requirement?",o:["Kinesis Data Streams with a hand-written OpenSearch client consumer","Kinesis Data Firehose, configured with OpenSearch Service as its destination","Kinesis Data Analytics exclusively","Amazon Athena"],a:[1],e:"Firehose configured with OpenSearch Service as the destination is the direct, minimal-code fit for this delivery need."},
{q:"Which of the following scenarios most clearly calls for Kinesis Data Firehose rather than Kinesis Data Streams?",o:["A scenario requiring multiple independent consumer applications to each replay the last 7 days of raw event data at their own pace","A scenario requiring strict, application-managed shard-level consumer checkpointing for a custom real-time fraud-detection engine","A scenario simply requiring reliable, minimally-managed delivery of streaming data into S3 with light transformation, and no need to replay or have multiple independent readers of the raw stream","A scenario requiring records to be reprocessed by three separate custom-built consumer applications independently"],a:[2],e:"Simple, minimally-managed delivery into S3 with no replay/multi-reader need is Firehose's sweet spot."},
{q:"What happens to a record once Kinesis Data Firehose has successfully delivered it to its configured destination (for example, S3)?",o:["The record remains available for further independent reads by other consumer applications directly from Firehose, similar to Data Streams","Firehose itself does not retain a separately queryable copy of the record for other consumers; the delivered copy now lives at the destination (e.g., S3), which can itself be queried later, e.g., via Athena","The record is automatically deleted from S3 after delivery","Firehose converts the record into an SNS notification automatically"],a:[1],e:"Once delivered, the record lives at the destination (e.g., S3); Firehose itself doesn't retain a separately re-readable copy like Data Streams does."},
{q:"A retail company needs both (1) a durable stream that three independent applications can each replay from the last 48 hours, and (2) a simple, low-maintenance pipeline delivering the same data into S3 for occasional Athena queries. Which combination of Kinesis services addresses both needs together?",o:["Kinesis Data Streams alone, with no Firehose involved for the S3 delivery need","Kinesis Data Firehose alone, since it also supports full independent replay","A Kinesis Data Stream (for the three replaying consumer applications) with a Kinesis Data Firehose consumer attached to the same stream, delivering to S3 for the Athena use case","Amazon SQS for both needs simultaneously"],a:[2],e:"A Data Stream serving the three replaying consumers, with a Firehose consumer also attached for S3/Athena delivery, satisfies both needs together."},
{q:"Which of the following is an accurate, developer-level summary distinguishing the three Kinesis family services?",o:["Data Streams = you manage shards/consumers/replay; Firehose = fully managed delivery with no shard management; Data Analytics = real-time SQL/Flink queries over a stream","All three Kinesis services are functionally identical with different names","Firehose provides shard-based replay identical to Data Streams","Data Analytics is a raw storage layer with no query capability"],a:[0],e:"Data Streams = self-managed shards/consumers/replay; Firehose = fully managed delivery; Data Analytics = real-time SQL/Flink over a stream."},
{q:"A team needs a simple task queue where each unit of work (a video-transcoding job) should be picked up and processed by exactly one worker, with no requirement for multiple independent consumers to see the same job or for historical jobs to be replayed. Which service is the most appropriately scoped choice?",o:["Amazon Kinesis Data Streams, for its replay capability","Amazon SQS, since the workload is a straightforward decoupled work queue with single-consumer-group semantics","Amazon EventBridge, for its content-based routing","Amazon OpenSearch Service"],a:[1],e:"A single-consumer-group work queue with no replay need is squarely SQS's use case."},
{q:"A company's IoT platform ingests continuous sensor telemetry that must be (1) processed in real time by a fraud/anomaly detector, (2) simultaneously archived raw to S3 for compliance, and (3) independently fed into a live aggregation dashboard — all three consuming the same underlying data independently. Which service family is purpose-built for this multi-independent-consumer streaming requirement?",o:["Amazon SQS Standard queues","Amazon Kinesis (Data Streams feeding independent consumers, potentially with Firehose for the S3 archival leg)","Amazon SNS with a single unfiltered topic","AWS Direct Connect"],a:[1],e:"Multiple independent consumers reading the same continuous telemetry data, with archival, is the Kinesis family's defining strength."},
{q:"A scenario states: \"Various internal microservices emit different structured event types; a scheduled nightly job must also run; and events from a third-party SaaS incident-management tool must be ingested and routed based on content.\" Which service most directly satisfies all three needs through one consistent mechanism?",o:["Amazon SQS","Amazon EventBridge, using its content-based event patterns, scheduled rules, and partner event bus support","Amazon Kinesis Data Streams","Amazon Athena"],a:[1],e:"EventBridge's content-based patterns, scheduled rules, and partner bus support together cover all three stated needs."},
{q:"A single application event must reach an email distribution list, an SMS number for on-call paging, and a durable SQS queue for later audit processing — all from one publish action, with no need for content-based routing across many different event sources. Which service is the best-scoped fit?",o:["Amazon EventBridge, since it should always be preferred over SNS","Amazon SNS, publishing once to a topic with email, SMS, and SQS subscriptions","Amazon Kinesis Data Streams","Amazon Athena"],a:[1],e:"A single SNS publish fanning out to email, SMS, and SQS subscriptions is the best-scoped fit with no content-based routing requirement."},
{q:"Which service would NOT be an appropriate fit for a requirement stating \"data must be replayable by multiple independently-scaling consumer applications, each reading the full stream at its own pace\"?",o:["Amazon Kinesis Data Streams","Amazon SQS, since a message is removed from visibility/deleted once a single consumer successfully processes it, preventing independent full replay by multiple separate consumer applications","A Kinesis Data Stream with multiple KCL-based consumer applications","Kinesis, generally, given its retention-window-based replay model"],a:[1],e:"SQS's consume-once/delete model does not support independent full replay by multiple separate consumer applications."},
{q:"A company is deciding how to notify downstream systems of state changes to native AWS resources (such as an EC2 instance stopping) without writing any custom polling code to detect those changes. Which service natively publishes such AWS resource state-change events with no custom producer code required?",o:["Amazon SQS","Amazon EventBridge's default event bus, which already receives many native AWS service events automatically","Amazon Kinesis Data Streams","Amazon Athena"],a:[1],e:"The default EventBridge bus already receives many native AWS resource state-change events automatically, with no custom producer code."},
{q:"Which two of the following statements correctly distinguish SQS from Kinesis Data Streams as decoupling mechanisms? (Select TWO)",o:["SQS is best suited to a work-queue pattern where a message is processed once by one logical consumer group and then removed","Kinesis is best suited when multiple independent consumer applications need to replay and process the same data at their own pace","SQS supports unlimited historical replay identical to Kinesis","Kinesis cannot be consumed by more than one application under any circumstance","SQS and Kinesis are interchangeable in every scenario with no meaningful architectural difference"],a:[0,1],multi:true,e:"SQS fits a single-consumer-group work queue; Kinesis fits multiple independent consumers replaying the same data."},
{q:"A scenario describes a requirement for \"guaranteed ordering of commands issued against a single customer's account, with each command processed exactly once, and no need for multiple independent applications to replay the command history.\" Which service and configuration is the best fit, as opposed to a broader Kinesis-based design?",o:["A Kinesis Data Stream with one shard per customer","An SQS FIFO queue, using the customer account ID as the message group ID","An SNS topic with no filtering","Amazon Athena querying S3 on a schedule"],a:[1],e:"An SQS FIFO queue keyed by account ID as the message group ID directly provides ordering and exactly-once processing without needing Kinesis's broader replay model."},
{q:"What does Amazon Athena allow a developer to do with data already stored in Amazon S3?",o:["Run standard SQL queries directly against the S3 data (e.g., CSV, JSON, Parquet) without provisioning a database cluster or loading the data elsewhere first","Automatically convert the S3 bucket into a relational database engine","Replace the need for S3 entirely by migrating the data into Athena's own storage","Provide real-time transactional writes directly into S3 objects"],a:[0],e:"Athena runs standard SQL directly against S3 data with no cluster provisioning or data loading step."},
{q:"How is Amazon Athena typically billed?",o:["A flat monthly subscription fee regardless of usage","Per query, based on the amount of data scanned — which is why using columnar formats like Parquet and partitioning the data can directly reduce cost","Per hour that a dedicated Athena cluster is running, whether or not queries are executed","Athena has no billing model; it is included free with any AWS account"],a:[1],e:"Athena bills per query based on data scanned, making columnar formats and partitioning direct cost levers."},
{q:"A team wants to occasionally run ad-hoc SQL reports over application access logs that a Kinesis Data Firehose delivery stream has been landing in S3. Which AWS service is the natural fit for this occasional, serverless SQL analysis, without provisioning a dedicated database or Redshift cluster?",o:["Amazon Athena","Amazon DynamoDB","AWS Direct Connect","Amazon Route 53"],a:[0],e:"Athena is the natural serverless, ad-hoc SQL fit for occasional reporting over S3-resident log data."},
{q:"A platform team wants to centralize log output from many microservices into one place where engineers can run near-real-time full-text search and view operational dashboards during an incident. Which AWS service is most directly suited to this developer-relevant log analytics and dashboarding use case, commonly fed via a Kinesis Data Firehose delivery stream?",o:["Amazon Athena, exclusively","Amazon OpenSearch Service, including its Dashboards feature for visualization","Amazon Kinesis Data Streams, with no other service involved","AWS Direct Connect"],a:[1],e:"OpenSearch Service (with Dashboards) is the developer-relevant fit for centralized near-real-time log search and operational dashboards."}
];

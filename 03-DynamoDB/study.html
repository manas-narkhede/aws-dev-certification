const NOTES_MD = `# Module 03 — DynamoDB

Domain focus: almost entirely **Development with AWS Services (32%)**, mapping directly onto Domain 1 Task Statement 3 ("Use data stores in application development"). DynamoDB is one of the single most heavily tested services on DVA-C02 — beyond the questions that ask about it directly, it shows up constantly as the backing store in Lambda/API Gateway scenario questions in later modules. Get this module genuinely solid; it pays off repeatedly.

## 1. Relational vs. non-relational — why DynamoDB exists

A relational database (module 08: RDS, Aurora) stores data in fixed-schema tables with rows and columns, enforces relationships via foreign keys, and guarantees full **ACID** transactions (Atomicity, Consistency, Isolation, Durability) across arbitrary joins. That power costs you: schema changes are disruptive, joins get expensive as data grows, and scaling *write* throughput horizontally across many nodes is hard — the classic answer is "buy a bigger box" (vertical scaling) or add read replicas (which only helps reads).

DynamoDB is a fully managed, serverless **NoSQL key-value and document database**. It trades relational features (no joins, no arbitrary ad-hoc queries, limited transaction scope) for near-unlimited horizontal scalability, single-digit-millisecond latency at any scale, and zero server management — AWS handles partitioning, replication, and patching entirely. The schema is flexible: only the primary key attributes are declared up front; every item can otherwise carry a different set of attributes.

**The exam's mental model:** if a scenario needs complex joins, multi-table ad-hoc queries, or strict relational integrity across many entities → RDS/Aurora. If a scenario needs massive, predictable-pattern read/write throughput, low and consistent latency at any scale, and you already know your access patterns up front → DynamoDB. "Access patterns known in advance" is the tell — with DynamoDB you design the table *around how you'll query it*, not around normalized entity relationships.

## 2. Core building blocks: tables, items, attributes

- **Table** — a collection of items (roughly: a "table" in the loose sense, not a relational one).
- **Item** — a single record (like a row), uniquely identified by its primary key. Maximum item size is **400 KB**, including attribute names and values.
- **Attribute** — a name-value pair on an item (like a column), but items in the same table don't need matching attributes beyond the required primary key fields — this is the "schema-less" part.

Supported data types: scalars (\`String\`, \`Number\`, \`Binary\`, \`Boolean\`, \`Null\`), document types (\`List\`, \`Map\` — nested JSON-like structures), and set types (\`String Set\`, \`Number Set\`, \`Binary Set\` — unordered, unique values).

\`\`\`json
{
  "orderId": {"S": "ORD-4471"},
  "customerId": {"S": "CUST-9981"},
  "status": {"S": "SHIPPED"},
  "items": {"L": [{"M": {"sku": {"S": "A100"}, "qty": {"N": "2"}}}]},
  "totalCents": {"N": "5499"}
}
\`\`\`
That's the raw, wire-level attribute-value JSON format the DynamoDB API actually speaks. Application code almost never builds this by hand — see §15 on serialization.

## 3. Primary keys: simple vs. composite

Every table needs exactly one primary key, chosen at creation and immutable afterward:

- **Simple primary key** — just a **partition key**. Every item's partition key value must be unique in the table (it behaves like a traditional unique ID column).
- **Composite primary key** — a **partition key + sort key**. The *combination* must be unique, but many items can share the same partition key, differentiated by their sort key. This is the far more common real-world design — e.g., partition key \`customerId\`, sort key \`orderDate\`, letting you store every order for a customer under one partition key and retrieve them ordered by date.

Internally, DynamoDB runs the partition key value through an internal hash function to decide which physical storage partition the item lives on. Items sharing a partition key are always co-located and sorted by sort key on that partition — which is exactly what makes range queries against a composite key fast (§6, Query).

## 4. High-cardinality partition keys and avoiding hot partitions

This is one of the most frequently tested DynamoDB concepts on DVA-C02, and it's the one beginners most often get backwards.

DynamoDB divides a table's total provisioned (or on-demand) throughput across its physical partitions based on the **distribution of partition key values actually being read/written**. If your access pattern hammers a small number of partition key values — or worse, uses a **low-cardinality** attribute (one with only a handful of distinct values, like \`status\` with values \`PENDING\`/\`SHIPPED\`/\`DELIVERED\`) as the partition key — all that traffic lands on one or a few physical partitions. Those partitions throttle (\`ProvisionedThroughputExceededException\`) even though the table's *aggregate* provisioned capacity looks more than sufficient on a dashboard. This is the **hot partition** problem.

**The fix is a high-cardinality partition key** — an attribute with many distinct values, spreading reads and writes evenly across the underlying partitions. A well-designed table uses something like \`userId\`, \`deviceId\`, or \`orderId\` as the partition key (many distinct values, roughly even access frequency) rather than a coarse categorical attribute.

When you genuinely need to query *by* a low-cardinality attribute (like "give me all orders with status = SHIPPED"), the right tool is a **Global Secondary Index** on that attribute (§5) — not making it your base table's partition key.

**Write sharding** is the escape hatch when even a naturally high-cardinality key still has a single "hot" value you can't avoid (e.g., one celebrity user's \`userId\` gets disproportionate traffic). The pattern: append a random or calculated suffix to the partition key at write time (\`userId#1\`, \`userId#2\`, ... \`userId#9\`), spreading that one logical entity's items across several physical partitions; on read, fan out across all the suffix values and merge results in application code.

**Exam trap:** a question describing throttling on a table with "plenty" of provisioned capacity, where the workload skews heavily toward a small set of key values, is almost always testing hot-partition recognition — the fix is a better-chosen (higher-cardinality) partition key or write sharding, **not** simply raising provisioned throughput further.

## 5. Secondary indexes: GSI vs. LSI

Base-table queries only work efficiently against the primary key. To query efficiently by other attributes, you add a secondary index.

| | Local Secondary Index (LSI) | Global Secondary Index (GSI) |
|---|---|---|
| Partition key | Same as base table | Can be a different attribute |
| Sort key | Different attribute than base table's sort key | Can be any attribute (or none) |
| When created | Only at table creation time — cannot add/remove later | Anytime, including after the table exists |
| Throughput | Shares the base table's provisioned RCU/WCU | Has its own provisioned RCU/WCU (or scales independently under on-demand) |
| Consistency | Supports both eventually and **strongly** consistent reads | **Eventually consistent reads only** |
| Limit per table | Max 5 | Max 20 (default quota, raisable) |
| Size constraint | All items for one partition key value (base table + all LSIs combined) capped at 10 GB | No such per-partition-key cap |

**Mental shortcut:** LSI = "same partition key, different sort order, locked in at creation." GSI = "essentially a separate, differently-keyed index table that DynamoDB maintains asynchronously for you" — far more flexible, and the one you reach for by default. Because a GSI is propagated asynchronously from the base table, it can only ever be eventually consistent — there's a small replication lag between a base-table write and that write showing up in the GSI.

**Exam trap:** "the team needs to add a new query pattern to a table that's already been live in production for a year" → must be a GSI (LSIs can only be defined at table creation). "The requirement explicitly needs a strongly consistent read on the alternate key" → must be an LSI (GSIs can't do it).

## 6. Query vs. Scan

- **Query** — requires a partition key value (equality only) and optionally a sort key condition (\`=\`, \`<\`, \`>\`, \`BETWEEN\`, \`begins_with\`, etc.). Extremely efficient: DynamoDB goes straight to the relevant partition and reads a contiguous, sorted range. You can further narrow results with a \`FilterExpression\`, but note it's applied **after** the matching items are read and RCUs are already consumed — a filter reduces what's *returned*, not what's *read* (and billed).
- **Scan** — reads **every item in the table (or index)**, then optionally applies a filter. This is expensive at scale: it consumes read capacity for the entire table regardless of how selective the filter is, and gets slower as the table grows. \`Limit\`, pagination, and **parallel scan** (splitting the scan across multiple workers using \`Segment\`/\`TotalSegments\`) can make a necessary scan less painful, but none of them turn it into a cheap operation.

**Rule of thumb the exam wants:** design your table's keys and indexes so that every real access pattern can be satisfied with \`Query\`. \`Scan\` is acceptable for occasional full-table analytics/export jobs, not for a hot path in a request-serving application. A question describing "slow, expensive reads that get worse as the table grows" on a table lacking a matching index is a Scan-vs-Query diagnosis almost every time.

## 7. Capacity modes: On-Demand vs. Provisioned (+ Auto Scaling)

Throughput is measured in:
- **RCU (Read Capacity Unit)** — 1 strongly consistent read/sec of an item up to 4 KB (or 2 eventually consistent reads/sec of the same size — eventually consistent reads are half the cost).
- **WCU (Write Capacity Unit)** — 1 write/sec of an item up to 1 KB (transactional writes cost double, §10).

| | Provisioned | On-Demand |
|---|---|---|
| Setup | You specify RCU/WCU ahead of time | No capacity planning — scales instantly to traffic |
| Cost model | Pay for what's provisioned, whether used or not | Pay per request actually made |
| Best for | Steady, predictable traffic you can forecast | Spiky, unpredictable, or new/unknown workloads |
| Scaling | Manual, or automatic via **Application Auto Scaling** (define a target utilization % and min/max RCU/WCU bounds; it adjusts provisioned capacity to track the target) | Automatic and instant, no configuration |
| Overrun behavior | Throttling (\`ProvisionedThroughputExceededException\`) if traffic exceeds provisioned capacity and auto scaling hasn't caught up yet | Scales to absorb spikes; extreme, sudden spikes can still briefly throttle if they exceed DynamoDB's internal scale-up ability |

You can switch between the two modes, but only **once per 24 hours**. The SDK's default retry/backoff behavior helps absorb brief throttling in provisioned mode while auto scaling reacts — but it isn't a substitute for correctly-provisioned capacity or a well-distributed key design.

**Exam trap:** "unpredictable/spiky new application, team has no historical traffic data to forecast capacity" → On-Demand. "Stable, well-understood, cost-sensitive steady-state traffic" → Provisioned with Auto Scaling, generally cheaper per unit at scale.

## 8. Consistency models

DynamoDB replicates each item across multiple Availability Zones within a Region for durability. That replication isn't instantaneous, which is why you choose per-read:

| | Eventually consistent read | Strongly consistent read |
|---|---|---|
| Default? | Yes | No — must set \`ConsistentRead: true\` |
| Might return stale data | Yes, for a very short window (typically sub-second) after a write | No — always reflects all writes that completed before the read began |
| RCU cost | 1 RCU per 4 KB | 2 RCU per 4 KB (double) |
| Latency | Slightly lower | Slightly higher |
| Available on GSIs? | Yes | **No — GSIs only ever support eventually consistent reads** |

**Exam trap:** a scenario needing "read-your-writes" correctness immediately after a write (e.g., a user submits a form and the next screen must show the just-saved value) needs \`ConsistentRead: true\` on the base table — and if that read pattern happens to require a GSI, the correct fix is redesigning to query the base table (or an LSI) instead, since a GSI structurally cannot give you strong consistency.

## 9. DynamoDB Streams

A **Stream** is an ordered, time-ordered log of item-level changes (insert, modify, remove) on a table, retained for **24 hours**. Enable it with one of four \`StreamViewType\` settings controlling what each change record captures: \`KEYS_ONLY\`, \`NEW_IMAGE\`, \`OLD_IMAGE\`, or \`NEW_AND_OLD_IMAGES\` (both before and after states — the most commonly used, since it lets consuming code diff a change).

The overwhelmingly common integration is a **Lambda event source mapping**: Lambda polls the stream and invokes your function with a batch of change records whenever new ones appear — this is DynamoDB's change-data-capture (CDC) mechanism. Typical uses:
- Replicating changes into another table, a search index (e.g. OpenSearch), or a data warehouse.
- Maintaining a derived aggregate or materialized view (e.g., incrementing a running total whenever an order item is inserted).
- Fanning changes out to other systems via SNS/EventBridge for downstream event-driven processing.
- Cross-Region replication (this is, in fact, how DynamoDB Global Tables work under the hood).

**Exam trap:** "capture every change to a table and trigger downstream processing without polling the table yourself" is a Streams + Lambda question nearly every time it appears. Don't confuse Streams (change events, 24-hour retention, item-level deltas) with TTL-triggered deletes (§13) — TTL deletions *do* appear in a stream, but the stream itself isn't the deletion mechanism.

## 10. Transactions: TransactWriteItems / TransactGetItems

DynamoDB supports ACID transactions across **up to 100 items (or 4 MB), spanning multiple tables** within the same account and Region:

- **\`TransactWriteItems\`** — an all-or-nothing batch of up to 100 \`Put\`/\`Update\`/\`Delete\`/\`ConditionCheck\` actions. Either every action succeeds, or none of them apply — no partial writes.
- **\`TransactGetItems\`** — an atomic, consistent snapshot read across multiple items/tables at once.

Transactional operations cost **double** the RCU/WCU of the equivalent non-transactional call, reflecting the extra coordination work.

Use transactions when an operation must maintain an invariant across more than one item — e.g., transferring funds (debit account A, credit account B, both-or-neither), or decrementing inventory while creating an order record atomically. \`ConditionCheck\` actions let you include a condition on an item *without writing to it*, useful for enforcing invariants that live on a different item than the one being written.

**Exam trap:** don't reach for \`TransactWriteItems\` for a single-item conditional update — that's a plain conditional \`PutItem\`/\`UpdateItem\` (§12) at half the cost. Transactions are for **multi-item, cross-table atomicity**.

## 11. DAX (DynamoDB Accelerator)

DAX is a fully managed, **in-memory cache** that sits in front of DynamoDB, purpose-built for it — not a general-purpose cache like ElastiCache (module 09 covers that comparison in depth). Key properties:

- **API-compatible** with the DynamoDB SDK — pointing existing application code at a DAX cluster instead of DynamoDB directly typically requires changing only the client/endpoint construction, not your Get/Put/Query calls.
- Delivers **microsecond** read latency (vs. single-digit-millisecond for DynamoDB itself) for cache hits.
- **Write-through**: writes go to DynamoDB through DAX, and DAX's item cache is updated as part of that write.
- Caches both individual item lookups (item cache) and the results of \`Query\`/\`Scan\` calls (query cache), each with a configurable TTL.
- Deployed as a cluster with a primary node and optional read replicas across AZs for high availability and read scaling.

**When the exam wants DAX:** a read-heavy application needing microsecond-level response times, with an acceptable tolerance for briefly-stale cached reads (it's an eventually-consistent cache layer — don't reach for DAX when a requirement demands strong read-your-writes consistency on every single read). Not a fit for write-heavy workloads (DAX doesn't meaningfully speed up writes) or as a substitute for Streams-based CDC.

## 12. Conditional writes and optimistic locking

A \`ConditionExpression\` on \`PutItem\`, \`UpdateItem\`, or \`DeleteItem\` makes the write succeed **only if** the condition evaluates true against the item's *current* state; otherwise it fails with a \`ConditionalCheckFailedException\` and nothing is written. This is how DynamoDB enforces invariants without needing a separate locking mechanism.

Two extremely common patterns:
- **Insert-only / prevent overwrite:** \`ConditionExpression: "attribute_not_exists(orderId)"\` on a \`PutItem\` — guarantees you never silently clobber an existing item.
- **Optimistic locking via a version attribute:** every item carries a \`version\` number; an update's condition expression requires \`version = :expectedVersion\`, and the update itself increments \`version\`. If two clients read the same item and both try to update it, only the first write succeeds — the second fails the condition check (its \`:expectedVersion\` is now stale) and the client must re-read and retry. AWS's \`DynamoDBMapper\` (Java SDK) has a built-in \`@DynamoDBVersionAttribute\` for exactly this pattern; other SDKs implement it manually with an explicit \`ConditionExpression\`.

DynamoDB has no native **pessimistic** locking (no "lock this row until I'm done" primitive) — optimistic locking (detect-and-retry on conflict) is the idiomatic approach, which fits its high-concurrency, horizontally-scaled design.

**Exam trap:** "prevent two concurrent requests from both successfully applying the same update, without heavy application-side locking infrastructure" → conditional writes with a version attribute, not a distributed lock service.

## 13. TTL (Time to Live)

TTL lets you designate one attribute (storing a Unix epoch timestamp) as the item's expiration marker. Once that time passes, DynamoDB automatically deletes the item in the background — typically within 48 hours of expiration — **at no additional write-capacity cost**. TTL deletions do show up in DynamoDB Streams (if enabled), distinguishable from application-driven deletes by an identity marker showing DynamoDB itself performed the deletion, which is handy if downstream processing needs to react differently to expired-and-purged data versus explicit user deletes.

Typical uses: session tokens, temporary cache-like rows, event/log records that only need to live for a defined retention window, expiring promotional codes. This is DynamoDB's main built-in answer to "manage a data lifecycle without a scheduled cleanup job."

**Exam trap:** TTL deletion isn't instantaneous — a scenario demanding items disappear from *queries* at the exact expiration second still needs an application-level filter on the expiry attribute; TTL is a background reaper for storage/cost hygiene, not a real-time query-time guarantee.

## 14. DynamoDB Local and SAM for local testing

**DynamoDB Local** is a downloadable (JAR or Docker image) implementation of the DynamoDB API that runs entirely on your machine — no AWS account calls, no cost, no network dependency. It's used for local development and automated tests so you're not hitting a real table (and its real cost/throughput limits) on every test run. AWS SAM CLI supports spinning up Lambda functions locally alongside a DynamoDB Local container for realistic offline integration testing of an event-driven, DynamoDB-backed application before deploying anything to AWS.

**Exam trap:** if a question emphasizes fast, free, offline iteration during development/CI without touching real AWS resources, DynamoDB Local (not a low-provisioned real table) is the intended answer.

## 15. CRUD and batch operations via the SDK

The core single-item operations: \`GetItem\`, \`PutItem\` (full item replace), \`UpdateItem\` (partial, in-place attribute update — generally preferred over \`PutItem\` when you only need to change a few attributes, since it avoids re-sending/overwriting the whole item), \`DeleteItem\`, plus \`Query\` and \`Scan\` (§6).

Batch operations trade a little flexibility for fewer round trips:
- **\`BatchGetItem\`** — up to 100 items / 16 MB across up to 100 tables in one call. Still consumes capacity per item as if requested individually; a partial failure returns \`UnprocessedKeys\` that the client must retry (with backoff).
- **\`BatchWriteItem\`** — up to 25 put/delete requests / 16 MB per call. No partial \`UpdateItem\` support in a batch (only whole-item put or delete). Partial failures return \`UnprocessedItems\`, again requiring retry.

**Serialization matters in practice:** application objects (a Python dict, a Java POJO, a JS object) aren't the wire-format attribute-value JSON shown in §2 — the SDK's document client / marshaller handles converting your native objects to/from that format. In Python, \`boto3.resource("dynamodb")\` (the higher-level resource client) does this transparently; the lower-level \`boto3.client("dynamodb")\` requires you to build/parse attribute-value dictionaries by hand. Java's \`DynamoDBMapper\` and the AWS SDK for JavaScript's \`DynamoDBDocumentClient\` play the same role. This "serializing/deserializing for persistence" step is exactly what those higher-level clients exist to hide.

\`\`\`python
import boto3
table = boto3.resource("dynamodb").Table("Orders")

# PutItem
table.put_item(Item={"orderId": "ORD-4471", "customerId": "CUST-9981", "status": "PENDING"})

# UpdateItem with a condition (optimistic locking pattern)
table.update_item(
    Key={"orderId": "ORD-4471"},
    UpdateExpression="SET #s = :new, version = version + :inc",
    ConditionExpression="version = :expected",
    ExpressionAttributeNames={"#s": "status"},
    ExpressionAttributeValues={":new": "SHIPPED", ":expected": 3, ":inc": 1},
)

# Query — partition key required, sort key optional
resp = table.query(
    KeyConditionExpression="customerId = :c AND orderDate > :d",
    ExpressionAttributeValues={":c": "CUST-9981", ":d": "2026-01-01"},
)
\`\`\`

## 16. Fine-grained access control: \`dynamodb:LeadingKeys\`

This ties directly back to module 00's IAM policy JSON. DynamoDB supports an IAM policy \`Condition\` key, \`dynamodb:LeadingKeys\`, that restricts a caller to only reading/writing items whose **partition key** matches a specific value — commonly a policy variable resolved from the caller's identity, such as \`\${cognito-identity.amazonaws.com:sub}\` (the authenticated Cognito identity pool user's ID). Combined with a Cognito identity pool issuing temporary, per-user IAM credentials, this lets you enforce **row-level, per-user data isolation directly at the IAM layer** — a mobile or web client can only ever see its own rows, with no server-side authorization code required to check "does this row belong to this user."

\`\`\`json
{
  "Version": "2012-10-17",
  "Statement": [{
    "Effect": "Allow",
    "Action": ["dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:Query"],
    "Resource": "arn:aws:dynamodb:us-east-1:111122223333:table/UserProfiles",
    "Condition": {
      "ForAllValues:StringEquals": {
        "dynamodb:LeadingKeys": ["\${cognito-identity.amazonaws.com:sub}"]
      }
    }
  }]
}
\`\`\`

**Exam trap:** a scenario asking for "each mobile app user to access only their own items, without building custom server-side authorization logic" is a \`dynamodb:LeadingKeys\` + Cognito identity pool question — the table's partition key must actually be (or be prefixed by) the user identifier for this to work at all, which is one more reason partition key design (§3–4) matters from day one.

## 17. Ephemeral vs. persistent storage, in DynamoDB's context

DynamoDB itself is always a **persistent** data store — every successful write is durably replicated across multiple AZs before being acknowledged. Where "ephemeral vs. persistent" bites on DynamoDB-adjacent exam questions: DAX (§11) is an in-memory, **ephemeral** cache layer sitting in front of the persistent DynamoDB table underneath it — losing/restarting a DAX node doesn't lose data, because DynamoDB remains the durable source of truth. The same pattern recurs elsewhere in this course (module 01's instance store vs. EBS, module 09's ElastiCache vs. RDS): a fast, volatile cache layer in front of a slower, durable system-of-record. Recognizing which role a given service is playing in a scenario — "cache in front of" vs. "the actual persistent store" — is a recurring exam skill, not a DynamoDB-specific one.

## 18. Worked real-world scenarios

**Scenario A — the flash-sale hot partition.** An e-commerce company's \`Orders\` table uses \`orderStatus\` (values: \`PENDING\`, \`SHIPPED\`, \`DELIVERED\`, \`CANCELLED\`) as the partition key, because early on it seemed convenient for a dashboard query that groups orders by status. During a flash sale, write throughput spikes and the table starts throwing \`ProvisionedThroughputExceededException\` — even though CloudWatch shows the table's aggregate provisioned WCU is nowhere near its limit. The root cause: nearly every new order lands in the \`PENDING\` partition, because \`orderStatus\` is a low-cardinality attribute with only four possible values — all that write traffic concentrates onto one physical partition regardless of how much *total* capacity is provisioned. The fix: redesign the base table around a high-cardinality key (\`orderId\` as partition key), and add a **GSI** with \`orderStatus\` as its partition key to serve the "all orders in status X" dashboard query the original design was trying to optimize for. This is the single most common hot-partition pattern the exam tests.

**Scenario B — GSI vs. LSI for a messaging app.** A chat application stores messages with \`conversationId\` (partition key) and \`sentAt\` (sort key) on the base table, supporting "get all messages in a conversation, in order" efficiently via \`Query\`. Product now wants a new screen: "show me all messages a specific user has ever sent, across every conversation, most recent first." That's a completely different partition key (\`senderId\` instead of \`conversationId\`), and the feature is being added to a table that's already live in production with data. An LSI is disqualified immediately — LSIs can only be defined at table creation, and this table already exists with real data. The answer is a **GSI** with \`senderId\` as its partition key and \`sentAt\` as its sort key, added to the live table without disrupting existing traffic, accepting that reads against it will be eventually consistent (acceptable here — a "message history" screen doesn't need read-your-writes strictness the way a payment confirmation would).

**Scenario C — per-user row isolation without server-side auth code.** A mobile app lets each authenticated user store personal notes. The team wants users to only ever be able to read or write their own notes, and wants to avoid hand-writing "does \`note.userId == currentUser.id\`" checks in every single API handler — that logic is easy to forget in a new endpoint and represents a real security risk if missed. The design: a Cognito identity pool authenticates users and vends temporary IAM credentials scoped by a role with a \`dynamodb:LeadingKeys\` condition tying access to \`\${cognito-identity.amazonaws.com:sub}\`, against a \`Notes\` table whose partition key is the user's Cognito identity ID. The mobile app's SDK calls hit DynamoDB directly with those temporary credentials; IAM itself refuses any \`Query\`/\`GetItem\`/\`PutItem\` attempting to touch a partition key that isn't the caller's own identity — enforcement moves from "application code that could have a bug" to "the IAM policy engine, which cannot be bypassed by a missed \`if\` statement."

## Comparison: DynamoDB vs. RDS at a glance (full depth in module 08)

| | DynamoDB | RDS (relational) |
|---|---|---|
| Schema | Flexible (only key attributes fixed) | Fixed, enforced |
| Scaling | Horizontal, near-limitless, managed automatically | Vertical primarily; read replicas for read scaling |
| Query flexibility | Access patterns must be designed for up front; no joins | Arbitrary SQL joins/aggregations |
| Consistency | Tunable per-read (eventual/strong); transactions available but scoped | Full ACID by default across the whole dataset |
| Latency at scale | Consistently single-digit ms regardless of table size | Can degrade as data/joins grow without tuning |
| Ops overhead | Fully serverless (with on-demand mode) | You manage instance sizing, patching windows (unless Aurora Serverless) |

## Key exam traps from this module
- Low-cardinality partition keys cause hot partitions and throttling even when aggregate table capacity looks sufficient — fix with a high-cardinality key or write sharding, not more provisioned capacity.
- LSIs must be created at table creation and can't be added later; GSIs can be added anytime but are eventually-consistent only.
- \`Query\` requires a partition key and is efficient; \`Scan\` reads the whole table and gets more expensive as it grows — filters reduce what's returned, not what's read/billed.
- Strongly consistent reads cost 2x the RCU of eventually consistent reads and are never available on a GSI.
- On-Demand capacity mode suits unpredictable/spiky/new workloads; Provisioned (+ Auto Scaling) suits steady, forecastable ones and is generally cheaper at scale.
- \`TransactWriteItems\`/\`TransactGetItems\` are for multi-item, cross-table atomicity at double the capacity cost — not a substitute for a simple single-item conditional write.
- Conditional writes with a version attribute implement optimistic locking; DynamoDB has no native pessimistic locking.
- TTL deletion is background/eventual (up to ~48 hours after expiry), not an instant, query-time guarantee.
- DAX accelerates reads (microsecond latency, write-through, eventually-consistent cache) — it does not meaningfully speed up writes and is not a CDC mechanism.
- DynamoDB Streams + Lambda is the standard change-data-capture pattern; retention is only 24 hours.
- \`dynamodb:LeadingKeys\` in an IAM condition enforces per-user row-level access at the identity layer, typically paired with a Cognito identity pool — and only works if the partition key design actually matches the identity being restricted.
- DynamoDB Local is the free, offline, no-AWS-account way to develop/test against the DynamoDB API before deploying.

{q:"A developer responds to hot partition throttling by doubling the table's provisioned WCU from 2000 to 4000. The throttling continues at the same rate. Why doesn't increasing total capacity fix the problem?",o:["DynamoDB ignores provisioned capacity settings entirely","Provisioned capacity is distributed across physical partitions; if traffic concentrates on one partition due to a low-cardinality or skewed key, that partition still receives only its fraction of the total capacity, regardless of the aggregate","The WCU increase hasn't been applied yet; it takes 24 hours","DynamoDB only supports read capacity, not write capacity"],a:[1],e:"Provisioned capacity is divided across partitions; a hot partition only receives its fraction regardless of total capacity."},

{q:"A developer runs a Scan on a 10 GB DynamoDB table with a FilterExpression to find the 50 items matching a specific attribute value. How many read capacity units are consumed?",o:["RCUs for only the 50 matching items","RCUs for the entire 10 GB table, since a Scan reads every item and the FilterExpression reduces what is returned but not what is read","No RCUs, since Scans are free","RCUs for exactly half the table"],a:[1],e:"A Scan reads every item in the table; the FilterExpression only reduces what's returned, not what's read and billed."},

{q:"Which two statements about Query and Scan in DynamoDB are accurate? (Select TWO.)",o:["A Query requires a partition key value and efficiently reads only the items on the matching partition","A Scan reads every item in the table (or index) regardless of any FilterExpression applied","A FilterExpression on a Scan reduces the number of items read from storage, saving RCU","A Query does not support FilterExpression","A Scan is always faster than a Query for any workload"],a:[0,1],multi:true,e:"Query efficiently reads matching partition items; Scan reads every item regardless of filters."},
{q:"A developer applies a FilterExpression to a Query that returns 1000 matching items from a partition of 5000. How many items' worth of read capacity is consumed?",o:["1000, because the filter reduces what's read","5000, because a FilterExpression on a Query is applied after the items are read from the partition, consuming capacity for all items in the key-condition range, not just those matching the filter","0, because queries are free","500, half the partition"],a:[1],e:"FilterExpression on a Query applies after reading; capacity is consumed for all items in the key-condition range."},

{q:"What does the Limit parameter control on a Query or Scan operation?",o:["The total number of items the operation can ever return across all pages","The maximum number of items evaluated (before any filter is applied) in a single response page; the application must paginate using LastEvaluatedKey to get remaining results","The maximum number of RCUs consumed","The total storage size of the table"],a:[1],e:"Limit controls items per page; pagination via LastEvaluatedKey retrieves subsequent pages."},

{q:"How often can a DynamoDB table be switched between on-demand and provisioned capacity modes?",o:["Unlimited switches per day","Once per 24-hour period","Once per week","A table's capacity mode is permanent and cannot be changed"],a:[1],e:"Capacity mode can be switched once per 24-hour period."},
{q:"Which two of the following are accurate statements about DynamoDB capacity units? (Select TWO.)",o:["1 WCU supports 1 write per second of an item up to 1 KB","Transactional writes (TransactWriteItems) consume double the WCU of non-transactional writes","Eventually consistent reads consume the same RCU as strongly consistent reads","1 RCU supports 1 eventually consistent read per second of an item up to 1 KB","On-demand capacity mode has no per-request cost"],a:[0,1],multi:true,e:"1 WCU = 1 write/sec up to 1 KB; transactional writes cost double WCU."},
{q:"A team configures DynamoDB auto scaling on a provisioned table with a target utilization of 70%, minimum 100 RCU, and maximum 1000 RCU. During a traffic spike, utilization reaches 95%. What happens?",o:["Auto scaling immediately adds capacity to bring utilization back toward 70%","Auto scaling increases provisioned RCU toward the maximum, but there may be a brief delay during which throttling can occur while auto scaling reacts","Auto scaling reduces capacity to enforce the 70% target","Auto scaling is only available for on-demand tables"],a:[1],e:"Auto scaling increases capacity toward maximum, but brief throttling may occur during the reaction delay."},
{q:"A user submits a form that writes to DynamoDB, and the next page immediately reads the just-written data to display a confirmation. Using the default (eventually consistent) read, the confirmation page occasionally shows stale data. Which change fixes this?",o:["Enable DynamoDB Streams","Set ConsistentRead: true on the GetItem/Query call to perform a strongly consistent read that reflects all completed writes","Add a GSI on the confirmation attribute","Switch to on-demand capacity mode"],a:[1],e:"ConsistentRead: true ensures the read reflects all completed writes (read-your-writes correctness)."},
{q:"A developer wants to read data from a GSI with strong consistency. Is this possible?",o:["Yes, GSIs support both eventually and strongly consistent reads","No, GSIs only support eventually consistent reads; for strongly consistent reads, the developer must query the base table or an LSI","Yes, but only if the GSI uses a KEYS_ONLY projection","Yes, but only in on-demand capacity mode"],a:[1],e:"GSIs only support eventually consistent reads; strongly consistent reads require the base table or an LSI."},
{q:"An application reads a 12 KB item from DynamoDB using eventually consistent reads. How many RCUs does this consume?",o:["3 RCU","1.5 RCU (12 KB = 3 × 4 KB blocks; eventually consistent reads cost half, so 1.5 RCU)","6 RCU","12 RCU"],a:[1],e:"12 KB = 3 × 4 KB blocks; eventually consistent = half cost = 1.5 RCU."},
{q:"Which statement correctly describes the tradeoff between eventually consistent and strongly consistent reads?",o:["Strongly consistent reads are always faster and cheaper","Eventually consistent reads cost half the RCU and may have slightly lower latency, but can return stale data for a brief window after a write; strongly consistent reads always reflect the latest completed write but cost double and may have slightly higher latency","There is no cost difference between the two","Eventually consistent reads are never used in production applications"],a:[1],e:"Eventually consistent reads are cheaper and faster but may return stale data briefly; strongly consistent reads always reflect the latest write at double cost."},
{q:"A developer notices that reads from a DynamoDB table sometimes return data that was written a fraction of a second ago, and sometimes don't. Which consistency model is this behavior characteristic of?",o:["Strongly consistent reads","Eventually consistent reads, which may return slightly stale data for a brief window after a write","Transactional reads","This indicates a service bug"],a:[1],e:"Intermittent stale data after recent writes is characteristic of eventually consistent reads."},
{q:"A team needs \"read-your-writes\" correctness on a specific access pattern that currently uses a GSI. Since GSIs don't support strong consistency, what should the team do?",o:["Set ConsistentRead: true on the GSI query","Redesign the access pattern to query the base table (or an LSI that supports the required key structure) instead of the GSI, since only the base table and LSIs support strongly consistent reads","Enable DynamoDB Streams to achieve strong consistency on the GSI","Switch to on-demand capacity mode for the GSI"],a:[1],e:"Since GSIs can't provide strong consistency, the access pattern must be redesigned to use the base table or an LSI."},
{q:"A company needs to trigger a Lambda function every time an item in a DynamoDB table is inserted, modified, or deleted, to replicate changes into an Elasticsearch (OpenSearch) search index. Which DynamoDB feature enables this?",o:["TTL","DynamoDB Streams with a Lambda event source mapping, which invokes the function with a batch of change records","A GSI configured to replicate data to OpenSearch","DynamoDB auto scaling"],a:[1],e:"DynamoDB Streams with a Lambda event source mapping captures and processes item-level changes."},
{q:"Which StreamViewType captures both the old and new images of an item whenever it is modified?",o:["KEYS_ONLY","NEW_IMAGE","OLD_IMAGE","NEW_AND_OLD_IMAGES"],a:[3],e:"NEW_AND_OLD_IMAGES captures both the before and after states of an item on every change."},
{q:"How long are DynamoDB Stream records retained before they expire?",o:["7 days","24 hours","1 hour","Indefinitely"],a:[1],e:"DynamoDB Streams records are retained for 24 hours."},
{q:"A developer enables DynamoDB Streams on a table with StreamViewType set to NEW_IMAGE. A Lambda function processes the stream and needs to compute the difference between an item's old and new states. Can it do this with the NEW_IMAGE view type?",o:["Yes, NEW_IMAGE includes both the old and new states","No, NEW_IMAGE only includes the new state of the item; to compare old and new states, the StreamViewType must be set to NEW_AND_OLD_IMAGES","Yes, all view types include both states by default","No, stream records never include item data"],a:[1],e:"NEW_IMAGE only includes the new state; NEW_AND_OLD_IMAGES is needed to compare old and new."},
{q:"Which of the following is NOT a typical use case for DynamoDB Streams?",o:["Replicating changes to a search index like OpenSearch","Maintaining a materialized view or derived aggregate","Directly querying the stream as a replacement for the base table","Triggering downstream event-driven processing via Lambda"],a:[2],e:"Streams are for change data capture, not as a queryable data store replacement."},
{q:"A developer configures a Lambda function as a DynamoDB Streams consumer. The function processes each batch of records and updates an analytics dashboard. If the function fails to process a batch, what happens?",o:["The failed records are permanently lost","Lambda retries the batch (records are not removed from the stream until successfully processed), potentially blocking newer records on the same shard until the failure is resolved","DynamoDB automatically deletes the stream","The records are sent to an SQS queue automatically"],a:[1],e:"Lambda retries failed batches; records aren't removed until successfully processed, potentially blocking the shard."},
{q:"Which two of the following are accurate statements about DynamoDB Streams? (Select TWO.)",o:["DynamoDB Streams provides a time-ordered log of item-level changes on a table","DynamoDB Streams retains records indefinitely with no expiration","The most common integration pattern is a Lambda event source mapping polling the stream","DynamoDB Streams replaces the need for any indexes on the table","Stream records are only generated for insert operations, not updates or deletes"],a:[0,2],multi:true,e:"Streams are time-ordered item-level change logs; Lambda event source mapping is the most common consumer pattern."},
{q:"A TTL expiration deletes an item from a DynamoDB table. Does this deletion appear in the DynamoDB Stream?",o:["No, TTL-triggered deletions are not captured by DynamoDB Streams","Yes, TTL-triggered deletions appear in the stream with a special identity marker indicating the system (not a user) performed the deletion","Only if the stream's view type is set to KEYS_ONLY","Only if the table uses provisioned capacity mode"],a:[1],e:"TTL-triggered deletions appear in the stream with a system identity marker distinguishing them from user-driven deletes."},
{q:"A company uses DynamoDB Global Tables for multi-Region replication. What underlying mechanism does Global Tables use to replicate changes across Regions?",o:["S3 Cross-Region Replication","DynamoDB Streams, which captures changes and propagates them to replica tables in other Regions","Lambda functions manually copying items between tables","SQS queues bridging the Regions"],a:[1],e:"DynamoDB Global Tables use Streams as the underlying replication mechanism."},
{q:"A developer enables DynamoDB Streams and sets up a Lambda consumer. The Lambda function takes too long to process large batches, causing the event source mapping to fall behind. What should the developer do to improve throughput?",o:["Disable DynamoDB Streams","Increase the Lambda function's batch size, increase parallelization factor, or optimize the function's processing code to handle records faster","Switch to a Scan-based polling approach","Delete the table and recreate it"],a:[1],e:"Increasing batch size, parallelization factor, or optimizing function code improves stream processing throughput."},
{q:"A banking application needs to atomically transfer funds between two accounts stored in DynamoDB — debiting one account and crediting another. If either operation fails, neither should apply. Which DynamoDB feature supports this?",o:["BatchWriteItem","TransactWriteItems, which provides all-or-nothing ACID transactions across multiple items","A conditional PutItem on each item separately","DynamoDB Streams"],a:[1],e:"TransactWriteItems provides all-or-nothing ACID transactions across multiple items."},
{q:"How many items can a single TransactWriteItems or TransactGetItems call span?",o:["Up to 10 items","Up to 100 items (or 4 MB total)","Up to 1000 items","Unlimited items"],a:[1],e:"Transactions support up to 100 items or 4 MB per call."},
{q:"What is the WCU cost of a transactional write compared to a non-transactional write of the same item?",o:["The same cost","Double the WCU of a non-transactional write","Half the WCU","10x the WCU"],a:[1],e:"Transactional writes cost double the WCU of non-transactional writes."},
{q:"A developer uses TransactWriteItems for a single-item conditional update. A colleague suggests this is inefficient. Why?",o:["TransactWriteItems does not support conditions","A simple conditional UpdateItem or PutItem with a ConditionExpression achieves the same single-item atomicity at half the WCU cost, since transactions are for multi-item/cross-table atomicity","TransactWriteItems is faster for single items","Conditional writes are not supported in DynamoDB"],a:[1],e:"A simple conditional UpdateItem achieves single-item atomicity at half the WCU cost of a transaction."},
{q:"What is the purpose of a ConditionCheck action within a TransactWriteItems call?",o:["It writes a new item to the table","It verifies a condition on an item without writing to it, useful for enforcing invariants on items other than those being modified in the transaction","It deletes an item from the table","It reads an item and returns it to the application"],a:[1],e:"ConditionCheck verifies a condition without writing, useful for invariants on related items within a transaction."},
{q:"Can a TransactWriteItems call span multiple DynamoDB tables?",o:["No, transactions are limited to a single table","Yes, TransactWriteItems can include Put, Update, Delete, and ConditionCheck actions across multiple tables within the same AWS account and Region","Yes, but only across tables in different Regions","Only if all tables share the same partition key"],a:[1],e:"TransactWriteItems can span multiple tables within the same account and Region."},
{q:"Which two of the following are accurate statements about DynamoDB transactions? (Select TWO.)",o:["TransactWriteItems provides all-or-nothing atomicity — either every action succeeds, or none apply","TransactGetItems provides an atomic, consistent snapshot read across multiple items","Transactional operations consume the same WCU/RCU as non-transactional operations","DynamoDB transactions support cross-Region operations","TransactWriteItems can include up to 1000 items per call"],a:[0,1],multi:true,e:"TransactWriteItems is all-or-nothing; TransactGetItems provides atomic, consistent snapshot reads."},
{q:"A developer attempts to use TransactWriteItems to update 200 items in a single call. What happens?",o:["The transaction succeeds normally","The call fails, because TransactWriteItems supports a maximum of 100 items per call","DynamoDB automatically splits it into two 100-item transactions","The call succeeds but only the first 100 items are updated"],a:[1],e:"TransactWriteItems supports a maximum of 100 items per call."},
{q:"A read-heavy e-commerce application needs microsecond-level read latency from DynamoDB for product catalog lookups. Which AWS service provides an in-memory caching layer purpose-built for DynamoDB?",o:["Amazon ElastiCache","DAX (DynamoDB Accelerator)","Amazon CloudFront","Amazon MemoryDB"],a:[1],e:"DAX is a fully managed in-memory cache purpose-built for DynamoDB with microsecond read latency."},
{q:"A developer switches their application from using the standard DynamoDB SDK client to a DAX client. How much code refactoring is typically required?",o:["The entire data access layer must be rewritten with a completely different API","Minimal — DAX is API-compatible with the DynamoDB SDK, so typically only the client/endpoint construction changes, not the Get/Put/Query calls themselves","The application must switch to a REST API instead of the SDK","DAX requires a completely different query language"],a:[1],e:"DAX is API-compatible with the DynamoDB SDK; typically only the client construction changes."},
{q:"What type of cache consistency does DAX provide?",o:["Strong consistency — DAX always returns the most recent data","Eventually consistent — DAX is a cache layer, and cached items may be briefly stale until the cache TTL expires or the item is refreshed","No caching at all; DAX passes every request through to DynamoDB","DAX provides strong consistency for writes and eventual consistency for reads simultaneously"],a:[1],e:"DAX is an eventually consistent cache; cached items may be briefly stale."},
{q:"A developer configures DAX to cache Query results. Which two types of cache does DAX maintain? (Select TWO.)",o:["An item cache for individual GetItem results","A query cache for Query and Scan results","A write cache that batches writes for later processing","A metadata cache for table schema information","A stream cache for DynamoDB Streams records"],a:[0,1],multi:true,e:"DAX maintains an item cache (GetItem) and a query cache (Query/Scan results)."},
{q:"When a write is made through DAX, what happens?",o:["The write goes directly to DynamoDB, bypassing DAX entirely","DAX is write-through: the write passes through DAX to DynamoDB, and DAX updates its item cache with the newly written data","The write is cached in DAX only and never reaches DynamoDB","DAX queues the write for batch processing later"],a:[1],e:"DAX is write-through: writes pass through to DynamoDB, and the item cache is updated."},
{q:"A team has a write-heavy workload with minimal reads. Would DAX provide meaningful performance improvement?",o:["Yes, DAX significantly accelerates writes","No, DAX primarily accelerates reads by caching results; it does not meaningfully speed up write operations","Yes, DAX batches writes for improved throughput","No, DAX cannot be used with tables that have any writes"],a:[1],e:"DAX primarily accelerates reads; it doesn't meaningfully speed up writes."},
{q:"An application requires strongly consistent reads on every request. Is DAX appropriate for this use case?",o:["Yes, DAX supports strongly consistent reads from the cache","No, DAX is an eventually consistent cache layer; if every read must be strongly consistent, DAX's cached responses may not meet the requirement, and strongly consistent reads should go directly to DynamoDB","Yes, but only if the DAX cluster has more than 3 nodes","DAX automatically switches between consistency modes"],a:[1],e:"DAX is eventually consistent; if every read must be strongly consistent, DAX's cache may not meet the requirement."},
{q:"Which statement best describes the relationship between DAX and DynamoDB in terms of data durability?",o:["DAX replaces DynamoDB as the durable data store","DynamoDB is the durable source of truth; DAX is a volatile, in-memory cache layer — losing/restarting a DAX node doesn't lose data because DynamoDB retains everything","DAX provides higher durability than DynamoDB","DAX stores data on disk for durability, not in memory"],a:[1],e:"DynamoDB is the durable source of truth; DAX is a volatile in-memory cache layer."},
{q:"A developer wants to prevent a PutItem operation from silently overwriting an existing item with the same primary key. Which mechanism achieves this?",o:["Enabling versioning on the DynamoDB table","Adding a ConditionExpression: \"attribute_not_exists(pk)\" to the PutItem call, which fails the write if an item with that primary key already exists","Using a BatchWriteItem instead","Setting the table to read-only mode"],a:[1],e:"attribute_not_exists(pk) prevents the write if the item already exists — preventing silent overwrites."},
{q:"Two concurrent requests both read item X with version=3, then both attempt to update it. Using optimistic locking with a version attribute, what happens?",o:["Both updates succeed, and the version remains 3","The first update succeeds (setting version=4); the second fails with ConditionalCheckFailedException because its ConditionExpression expects version=3, which is now stale","Both updates fail","DynamoDB automatically merges the two updates"],a:[1],e:"The first update succeeds; the second fails ConditionalCheckFailedException because the version is now stale."},
{q:"What exception does DynamoDB return when a ConditionExpression on a write evaluates to false?",o:["ProvisionedThroughputExceededException","ConditionalCheckFailedException","ValidationException","ResourceNotFoundException"],a:[1],e:"ConditionalCheckFailedException is returned when a ConditionExpression evaluates to false."},
{q:"Does DynamoDB support native pessimistic locking (e.g., \"lock this row until I'm done\")?",o:["Yes, DynamoDB has built-in row-level locking","No, DynamoDB does not provide native pessimistic locking; the idiomatic approach is optimistic locking using conditional writes with a version attribute","Yes, but only in on-demand capacity mode","Yes, through DynamoDB Streams"],a:[1],e:"DynamoDB has no native pessimistic locking; optimistic locking via conditional writes is the idiomatic approach."},
{q:"A Java developer uses the DynamoDB SDK's @DynamoDBVersionAttribute annotation on a version field. What does this annotation enable?",o:["Server-side encryption of the version field","Automatic optimistic locking: the SDK automatically adds a ConditionExpression checking the version and increments it on every update","DynamoDB Streams tracking for the version field only","Automatic TTL expiration based on the version value"],a:[1],e:"@DynamoDBVersionAttribute enables automatic optimistic locking with condition checks and version increments."},
{q:"Which two of the following are valid uses of ConditionExpressions in DynamoDB? (Select TWO.)",o:["Preventing overwrites of existing items by checking attribute_not_exists(pk)","Implementing optimistic locking by requiring version = :expectedVersion before allowing an update","Defining the partition key for a Query operation","Configuring the table's provisioned throughput","Setting the TTL attribute for an item"],a:[0,1],multi:true,e:"ConditionExpressions prevent overwrites (attribute_not_exists) and implement optimistic locking (version checks)."},
{q:"A developer implements optimistic locking and the second concurrent update fails with ConditionalCheckFailedException. What should the application do?",o:["Immediately retry the same update without re-reading the item","Re-read the item to get the current version, apply the business logic to the current state, and retry the update with the new version — the standard optimistic locking retry pattern","Delete the item and recreate it","Switch to a Scan operation"],a:[1],e:"The standard pattern is re-read, re-apply logic, and retry with the current version."},
{q:"A ConditionExpression on an UpdateItem checks attribute_exists(email). The item does not have an email attribute. What happens?",o:["The update succeeds, and the email attribute is created","The update fails with ConditionalCheckFailedException because the condition attribute_exists(email) evaluates to false","The condition is ignored","DynamoDB automatically adds a null email attribute"],a:[1],e:"attribute_exists(email) evaluates to false if email doesn't exist, failing the condition check."},
{q:"A session management system stores session records in DynamoDB and wants sessions to be automatically deleted after 24 hours without any application-side cleanup logic. Which DynamoDB feature supports this?",o:["DynamoDB Streams","TTL (Time to Live), which automatically deletes items when a designated timestamp attribute indicates they have expired","A GSI with a time-based sort key","Conditional writes"],a:[1],e:"TTL automatically deletes items when their designated timestamp attribute passes the current time."},
{q:"A developer sets a TTL attribute on items to expire at midnight. At 12:01 AM, the developer queries for those items and finds they are still present. Is this expected behavior?",o:["No, this indicates TTL is misconfigured","Yes, TTL deletion is a background process and items are typically deleted within 48 hours of expiration, not instantly at the exact expiration time","No, TTL always deletes items at the exact second of expiration","Yes, but only in provisioned capacity mode"],a:[1],e:"TTL deletion is background/eventual, typically within 48 hours of expiration, not instant."},
{q:"Does a TTL-triggered deletion consume write capacity units?",o:["Yes, TTL deletions consume WCU like any other delete operation","No, TTL-triggered deletions do not consume any additional write capacity","Only if the table is in provisioned mode","Only if DynamoDB Streams is enabled"],a:[1],e:"TTL-triggered deletions do not consume write capacity."},
{q:"A developer needs items to disappear from query results at the exact moment they expire, not within the 48-hour TTL background deletion window. How should this be implemented?",o:["Rely solely on TTL for real-time query filtering","Add a FilterExpression or application-level check against the expiry attribute to exclude expired items from query results, while still using TTL for background storage cleanup","Disable TTL and manually delete items with a scheduled Lambda","Use a Scan to find and delete expired items in real time"],a:[1],e:"Add a filter or application check on the expiry attribute for real-time query exclusion; TTL handles background cleanup."},
{q:"A mobile application authenticates users through Amazon Cognito. Each user stores personal notes in a DynamoDB table. The team wants each user to access only their own notes, enforced at the IAM layer without server-side authorization code in the application. Which mechanism supports this?",o:["A bucket policy on the DynamoDB table","An IAM policy with a dynamodb:LeadingKeys condition restricting access to items whose partition key matches the caller's Cognito identity, combined with temporary credentials from a Cognito identity pool","A GSI filtering by user ID","DynamoDB Streams filtering by user ID"],a:[1],e:"dynamodb:LeadingKeys with Cognito identity pool credentials enforces per-user row-level access at the IAM layer."},
{q:"For the dynamodb:LeadingKeys condition to enforce per-user access, what must be true about the table's partition key?",o:["The partition key must be a Number type","The partition key must be (or be prefixed by) the user's identity value that the IAM policy variable resolves to","The partition key can be any attribute unrelated to the user's identity","The partition key must be a GSI key, not a base table key"],a:[1],e:"The partition key must correspond to the user's identity for LeadingKeys to restrict access correctly."},
{q:"Which IAM policy variable is commonly used with dynamodb:LeadingKeys to represent the authenticated Cognito Identity Pool user's unique identifier?",o:["${aws:username}","${cognito-identity.amazonaws.com:sub}","${aws:PrincipalTag/userId}","${s3:prefix}"],a:[1],e:"${cognito-identity.amazonaws.com:sub} resolves to the authenticated Cognito Identity Pool user's unique ID."},
{q:"Which two statements about dynamodb:LeadingKeys are accurate? (Select TWO.)",o:["It restricts a caller to items whose partition key matches a specific value, typically derived from the caller's identity","It eliminates the need for any custom server-side authorization code to check data ownership","It works with any partition key design, regardless of whether the key relates to the user's identity","It is a feature of S3 bucket policies, not DynamoDB IAM policies","It provides row-level encryption for DynamoDB items"],a:[0,1],multi:true,e:"LeadingKeys restricts by partition key matching the caller's identity, eliminating custom authorization code."},
{q:"A developer designs a DynamoDB table for a multi-user note-taking app but uses noteId (a random UUID) as the partition key. Can dynamodb:LeadingKeys be used to restrict each user to their own notes in this design?",o:["Yes, dynamodb:LeadingKeys works with any partition key regardless of its value","No, because noteId doesn't correspond to the user's identity; the table's partition key must be (or contain) the user identifier for LeadingKeys to enforce per-user isolation","Yes, but only if a GSI is added","No, because DynamoDB does not support IAM conditions"],a:[1],e:"A random noteId doesn't correspond to any user identity, so LeadingKeys cannot enforce per-user isolation."},
{q:"A company wants users to access their own data through a mobile app backed by DynamoDB, using Cognito identity pools for authentication. Which combination of features enforces per-user data isolation at the IAM layer?",o:["DynamoDB Streams + Lambda for authorization","Cognito identity pool issuing temporary credentials scoped by an IAM role with a dynamodb:LeadingKeys condition matching the Cognito user's identity, against a table whose partition key is the user identifier","A bucket policy on the DynamoDB table","DynamoDB auto scaling with per-user throughput limits"],a:[1],e:"Cognito identity pool + IAM role with LeadingKeys + user-identifier partition key enforces per-user isolation."},
{q:"A developer uses BatchGetItem to retrieve 120 items in a single call. What happens?",o:["The call succeeds and returns all 120 items","The call fails, because BatchGetItem supports a maximum of 100 items per call","DynamoDB automatically splits it into two calls","The call succeeds but only returns the first 50 items"],a:[1],e:"BatchGetItem supports a maximum of 100 items per call."},
{q:"A BatchWriteItem call partially succeeds, with some items written and others failing due to insufficient capacity. Where are the failed items reported?",o:["In a DynamoDB Stream record","In the response's UnprocessedItems field, which the application must retry with exponential backoff","They are silently dropped with no indication","In a CloudWatch alarm notification"],a:[1],e:"Partially failed items appear in UnprocessedItems for the application to retry with backoff."},
{q:"Does BatchWriteItem support UpdateItem operations?",o:["Yes, BatchWriteItem supports Put, Update, and Delete","No, BatchWriteItem only supports Put and Delete operations — not partial updates (UpdateItem)","Yes, but only for items smaller than 1 KB","No, BatchWriteItem only supports Delete operations"],a:[1],e:"BatchWriteItem supports only Put and Delete, not UpdateItem."},
{q:"Which Python boto3 interface transparently handles DynamoDB's wire-format attribute-value serialization (e.g., {\"S\": \"value\"}), so the developer works with plain Python dictionaries?",o:["boto3.client(\"dynamodb\") — the low-level client","boto3.resource(\"dynamodb\") — the higher-level resource client with built-in marshalling","Both handle serialization identically","Neither; serialization must always be done manually"],a:[1],e:"boto3.resource(\"dynamodb\") transparently handles attribute-value serialization/deserialization."},
{q:"A developer reads a 3.5 KB item using eventually consistent reads. How many RCUs are consumed?",o:["1 RCU","0.5 RCU (3.5 KB rounds up to 4 KB = 1 RCU for strongly consistent, but eventually consistent costs half = 0.5 RCU)","3.5 RCU","2 RCU"],a:[1],e:"3.5 KB rounds to 4 KB = 1 RCU (strongly consistent); eventually consistent = 0.5 RCU."},
{q:"A developer writes a 2.5 KB item to DynamoDB. How many WCUs are consumed?",o:["2.5 WCU","3 WCU (2.5 KB rounds up to 3 KB = 3 WCU)","1 WCU","0.5 WCU"],a:[1],e:"2.5 KB rounds up to 3 KB = 3 WCU."},
{q:"Which two features of the DynamoDB SDK's higher-level document clients (e.g., Java DynamoDBMapper, JS DynamoDBDocumentClient) are accurate? (Select TWO.)",o:["They automatically serialize/deserialize application objects to/from DynamoDB's native attribute-value format","They can implement optimistic locking via version attributes with built-in annotations","They bypass all DynamoDB API quotas and limits","They eliminate the need for any IAM permissions","They use a proprietary protocol incompatible with the standard DynamoDB API"],a:[0,1],multi:true,e:"Higher-level clients handle serialization and support optimistic locking via version annotations."},
{q:"A developer encounters UnprocessedKeys in a BatchGetItem response. What should the application do?",o:["Ignore the unprocessed items permanently","Retry the request for the items listed in UnprocessedKeys, using exponential backoff to avoid continued throttling","Delete the unprocessed items from the table","Switch to a Scan operation to retrieve them"],a:[1],e:"Retry UnprocessedKeys with exponential backoff to handle throttling."},
{q:"A company's DynamoDB table is throttling during peak hours. Investigation reveals: (1) the partition key is a low-cardinality attribute (status), (2) the table uses provisioned capacity with no auto scaling, and (3) a dashboard frequently Scans the entire table. Which combination of changes addresses all three issues?",o:["Increase provisioned WCU only","Change the partition key to a high-cardinality attribute, enable auto scaling on provisioned capacity, and replace the full-table Scan with a targeted Query against a GSI","Switch to on-demand capacity only","Disable DynamoDB Streams"],a:[1],e:"A high-cardinality key fixes hot partitions, auto scaling adjusts capacity dynamically, and a GSI-backed Query replaces the expensive Scan."},
{q:"A mobile app developer needs to implement: (1) per-user row isolation without custom authorization code, (2) microsecond-level read latency for frequently accessed profile data, and (3) automatic cleanup of expired session records without a cleanup Lambda. Which combination of DynamoDB features satisfies all three requirements?",o:["GSI for isolation, ElastiCache for caching, lifecycle rules for cleanup","dynamodb:LeadingKeys with a Cognito identity pool for per-user isolation, DAX for microsecond read latency, and TTL for automatic session expiration","A Scan with FilterExpression for isolation, DynamoDB Streams for caching, conditional writes for cleanup","S3 for storage, CloudFront for caching, SQS for cleanup"],a:[1],e:"LeadingKeys for isolation, DAX for microsecond reads, TTL for automatic cleanup."},
{q:"A social media company stores posts in DynamoDB. The most critical access patterns are: (1) get all posts by a user in reverse chronological order, and (2) get all posts in a specific category sorted by likes. The table has been in production for 6 months. Which key and index design satisfies both patterns?",o:["A base table with userId as the partition key and createdAt as the sort key (for pattern 1), plus a GSI with category as the partition key and likeCount as the sort key (for pattern 2, added to the existing table)","A base table with category as the partition key for both patterns","Two separate tables, one for each access pattern","A single Scan with filters for both patterns"],a:[0],e:"Base table key supports user-posts query; a GSI (addable to existing table) supports category-sorted query."},
{q:"A financial platform needs: (1) atomically transfer funds between two accounts (debit one, credit another), (2) prevent double-spending by ensuring the source account has sufficient funds before the debit, and (3) maintain a version attribute to prevent concurrent conflicting transfers. Which DynamoDB feature combination satisfies all three requirements?",o:["Two separate UpdateItem calls with no transaction","A TransactWriteItems call containing a ConditionCheck on the source account's balance and version, an Update debiting the source, and an Update crediting the destination — all-or-nothing atomicity with conditional checks","A BatchWriteItem call","DynamoDB Streams with a Lambda function"],a:[1],e:"TransactWriteItems with ConditionCheck on balance/version, plus debit and credit updates, ensures atomic transfer with conflict detection."},
{q:"A developer migrates a relational database to DynamoDB and wants to maintain a search index in OpenSearch, synchronized with DynamoDB changes. Which approach provides near-real-time synchronization with minimal operational overhead?",o:["A scheduled Lambda function that Scans the DynamoDB table hourly and updates OpenSearch","DynamoDB Streams with a Lambda event source mapping that processes change records and updates the OpenSearch index in near-real-time","A manual export/import process run weekly","A GSI that automatically replicates to OpenSearch"],a:[1],e:"DynamoDB Streams + Lambda provides near-real-time change data capture for OpenSearch synchronization."},

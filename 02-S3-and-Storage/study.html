{q:"A developer stores temporary thumbnail images in S3. These thumbnails can be regenerated from the original source images at any time, and the team wants to save approximately 20% compared to Standard-IA pricing. Which storage class is the best fit, given the data is reproducible?",o:["S3 Standard","S3 One Zone-IA","S3 Glacier Flexible Retrieval","S3 Glacier Deep Archive"],a:[1],e:"One Zone-IA is ~20% cheaper than Standard-IA and suitable for reproducible, non-critical data."},
{q:"Which two statements correctly describe the relationship between durability and availability in Amazon S3?",o:["Durability (11 nines for Standard) measures how likely an object is to be lost; availability measures how often the service is reachable and responsive","Availability varies by storage class (99.99% for Standard down to 99.5% for One Zone-IA), while durability is the same 11 nines across all classes except One Zone-IA","Durability and availability are the same metric expressed in different units","One Zone-IA has higher availability than S3 Standard","S3 Standard-IA has the same availability as S3 Standard"],a:[0,1],multi:true,e:"Durability measures data loss probability; availability measures service reachability. Availability varies by class while durability is consistently 11 nines except One Zone-IA's AZ-scope risk."},
{q:"A company's application writes new objects to an S3 bucket every few minutes, then deletes and replaces them within hours. A developer suggested moving these objects to S3 Standard-IA to reduce storage costs. What is the primary problem with this suggestion?",o:["Standard-IA does not support object deletion","Standard-IA has a minimum storage duration charge (30 days) and a per-GB retrieval fee, making it more expensive than Standard for frequently-deleted, frequently-accessed objects","Standard-IA only stores objects up to 1 MB in size","Standard-IA is not available in any AWS Region"],a:[1],e:"Standard-IA's 30-day minimum charge and retrieval fee make it more expensive than Standard for frequently-deleted, frequently-accessed objects."},
{q:"A data analytics team stores large CSV files in S3. The files are accessed heavily when first created, then go untouched for months, and the team is unsure exactly when access will drop off for any given file. They want AWS to automatically optimize storage costs without any manual tier management or retrieval fees. Which S3 feature is designed for this?",o:["S3 lifecycle policies with manually configured transitions","S3 Intelligent-Tiering, which moves objects between Frequent and Infrequent Access tiers automatically based on access patterns with no retrieval fees","S3 One Zone-IA with manual monitoring","S3 Glacier Flexible Retrieval with expedited retrieval"],a:[1],e:"Intelligent-Tiering automatically optimizes without manual lifecycle management and charges no retrieval fees."},
{q:"Which S3 storage class stores objects in only a single Availability Zone rather than redundantly across at least three AZs?",o:["S3 Standard","S3 Standard-IA","S3 One Zone-IA","S3 Glacier Deep Archive"],a:[2],e:"One Zone-IA stores data in a single AZ, unlike all other classes which use at least three AZs."},
{q:"A company stores quarterly financial reports in S3. The reports are accessed frequently in the quarter they cover, rarely in the subsequent year, and almost never after that — but compliance requires 7-year retention with millisecond retrieval available at all times. Which storage class is the best fit for reports older than one year?",o:["S3 Glacier Flexible Retrieval","S3 Glacier Deep Archive","S3 Glacier Instant Retrieval","S3 Standard"],a:[2],e:"Glacier Instant Retrieval provides millisecond access at low cost for data accessed roughly quarterly, with a 90-day minimum."},
{q:"A developer notices that S3 Intelligent-Tiering charges a small per-object monitoring and automation fee. Under what circumstance would this fee make Intelligent-Tiering more expensive than simply using S3 Standard?",o:["When storing a very large number of very small objects that are all accessed frequently — the per-object fee exceeds the savings from tiering","Intelligent-Tiering is always cheaper than Standard regardless of the number of objects","The monitoring fee only applies in the first month after enabling Intelligent-Tiering","The monitoring fee is waived for objects larger than 128 KB"],a:[0],e:"The per-object monitoring fee can exceed savings when many small objects are all frequently accessed and wouldn't benefit from tiering."},
{q:"What is the minimum billable object size for S3 Standard-IA?",o:["1 KB","128 KB","1 MB","There is no minimum billable object size"],a:[1],e:"Standard-IA bills at a minimum of 128 KB per object."},
{q:"A startup wants to store log files that might be needed for debugging but are accessed less than once per month. The team wants fast retrieval when needed and the lowest possible cost. Which two storage classes should they evaluate? (Select TWO.)",o:["S3 Standard-IA","S3 Glacier Instant Retrieval","S3 Standard","S3 Glacier Deep Archive","S3 One Zone-IA"],a:[0,1],multi:true,e:"Standard-IA and Glacier Instant Retrieval both provide fast retrieval for infrequently accessed data at different price/access-frequency tradeoffs."},
{q:"A company is evaluating whether to use S3 Glacier Instant Retrieval or S3 Glacier Flexible Retrieval for archived audit data. The key difference affecting their decision is retrieval latency. Which statement correctly describes this difference?",o:["Both classes offer millisecond retrieval with no difference in latency","Glacier Instant Retrieval provides millisecond retrieval; Glacier Flexible Retrieval requires minutes to hours depending on the retrieval tier chosen","Glacier Flexible Retrieval is faster than Glacier Instant Retrieval","Neither class supports retrieval without restoring from tape backup"],a:[1],e:"Glacier Instant Retrieval is milliseconds; Glacier Flexible Retrieval ranges from minutes (Expedited) to hours (Standard/Bulk)."},
{q:"A team stores reproducible data (generated thumbnails) that is rarely accessed. They want the cheapest infrequent-access storage class and are comfortable with the data being stored in a single Availability Zone. If the AZ experiences a total failure, the data can be regenerated. Which class fits?",o:["S3 Standard-IA","S3 One Zone-IA","S3 Standard","S3 Glacier Deep Archive"],a:[1],e:"One Zone-IA is the cheapest IA option and suits reproducible data where single-AZ risk is acceptable."},
{q:"Which S3 Intelligent-Tiering capability must be explicitly enabled and is not active by default?",o:["Automatic movement between Frequent and Infrequent Access tiers","Optional Archive Instant Access, Archive Access, and Deep Archive Access tiers","The per-object monitoring fee","Millisecond retrieval from the Frequent Access tier"],a:[1],e:"Archive-tier options within Intelligent-Tiering must be explicitly opted into."},
{q:"A developer wants to understand the cost implications of storing 1 million objects, each 64 KB, in S3 Standard-IA. What billing concern should they be aware of?",o:["No concern — Standard-IA is always cheaper than Standard for any object size","Each object is billed at the 128 KB minimum, meaning the actual storage cost is roughly double what the raw data size suggests","Standard-IA does not accept objects smaller than 128 KB","Standard-IA bills only for the actual bytes stored, with no minimum"],a:[1],e:"64 KB objects are billed at the 128 KB minimum, roughly doubling effective storage cost."},
{q:"A company needs to archive data for regulatory compliance. The data must be retained for 180 days minimum, and retrieval is never expected to be needed in less than 48 hours. Cost must be minimized above all else. Which storage class is the best fit?",o:["S3 Standard","S3 Glacier Flexible Retrieval","S3 Glacier Deep Archive","S3 Standard-IA"],a:[2],e:"Glacier Deep Archive has a 180-day minimum matching the requirement and the lowest cost, with 48-hour retrieval acceptable."},
{q:"Which two statements about S3 storage classes are accurate? (Select TWO.)",o:["S3 Standard offers 99.99% availability and stores objects across at least three Availability Zones","S3 Glacier Flexible Retrieval objects can be directly downloaded without a restore request","S3 One Zone-IA offers the same 11-nines durability as S3 Standard","S3 Standard-IA has no per-GB retrieval fee","S3 Intelligent-Tiering eliminates retrieval fees by automatically managing tier transitions"],a:[0,4],multi:true,e:"S3 Standard uses 3+ AZs with 99.99% availability; Intelligent-Tiering's automatic tier management eliminates retrieval fees."},
{q:"A news organization's articles reference images stored in S3. Images linked to trending articles are accessed millions of times per day, while older images may not be accessed for months. Which storage class is the correct choice for the trending images during their high-access period?",o:["S3 Standard","S3 Standard-IA","S3 Glacier Instant Retrieval","S3 One Zone-IA"],a:[0],e:"S3 Standard provides the highest availability and throughput for frequently accessed, high-traffic content."},
{q:"A developer argues that S3 One Zone-IA provides the same durability as S3 Standard. Is this accurate?",o:["Yes, both provide 99.999999999% (11 nines) durability","No, One Zone-IA stores data in a single AZ and thus loses the multi-AZ durability guarantee that protects against an entire AZ's destruction","One Zone-IA provides higher durability than Standard","Durability is not a meaningful metric for any S3 storage class"],a:[1],e:"One Zone-IA stores data in a single AZ, so an AZ-level failure could cause data loss, unlike Standard's multi-AZ design."},
{q:"A company wants to automatically move log files from S3 Standard to Standard-IA after 30 days, then to Glacier Flexible Retrieval after 90 days, and permanently delete them after 365 days. Which S3 feature automates this progression?",o:["S3 Intelligent-Tiering","S3 lifecycle policies with transition and expiration actions","S3 versioning","S3 Block Public Access"],a:[1],e:"Lifecycle policies with transition and expiration actions automate the described tiered progression."},
{q:"A team has versioning enabled on a production bucket. Old versions of objects are consuming significant storage, but the team wants to keep the most recent version on Standard while automatically transitioning noncurrent versions to Glacier after 30 days and deleting them after one year. Which lifecycle rule configuration supports this?",o:["A single lifecycle rule targeting current versions only","A lifecycle rule with NoncurrentVersionTransitions and NoncurrentVersionExpiration actions","Disabling versioning to remove old versions","A bucket policy denying access to old versions"],a:[1],e:"NoncurrentVersionTransitions and NoncurrentVersionExpiration target old versions specifically."},
{q:"A developer discovers that their S3 storage bill includes charges for incomplete multipart upload parts from failed uploads that were never completed or aborted. Which lifecycle rule action prevents this ongoing cost?",o:["NoncurrentVersionExpiration","AbortIncompleteMultipartUpload, configured to clean up parts after a specified number of days","Transition to Glacier Flexible Retrieval","Enable S3 Intelligent-Tiering"],a:[1],e:"AbortIncompleteMultipartUpload cleans up orphaned parts after a configured number of days."},
{q:"Which of the following is NOT a valid lifecycle rule action?",o:["Transition objects to a cheaper storage class after N days","Expire (permanently delete) objects after N days","Transition objects from Glacier back to S3 Standard automatically","Abort incomplete multipart uploads after N days"],a:[2],e:"Lifecycle rules cannot transition objects from Glacier back to Standard; that requires an explicit restore request."},
{q:"A lifecycle rule is configured to transition objects from Standard to Standard-IA after 30 days. An object is deleted after only 10 days. How is the storage billed for the deleted object?",o:["Only for the 10 days the object existed","For the full 30-day minimum storage duration charge of Standard-IA, since the lifecycle rule had the object marked for IA transition","For 10 days at the Standard rate, since the object was deleted before the transition occurred and Standard has no minimum storage duration","For 90 days at the Glacier rate"],a:[2],e:"The object was deleted before the transition occurred, so only Standard-rate billing applies for the 10 days it existed."},
{q:"A company has a lifecycle rule transitioning objects to Standard-IA at 30 days, then to Glacier Flexible Retrieval at 90 days. A compliance officer asks: can a lifecycle rule move objects from Glacier back to Standard automatically? What is the correct answer?",o:["Yes, lifecycle rules support bidirectional transitions between any storage classes","No, transitioning from Glacier back to Standard requires an explicit restore request followed by a copy to Standard; lifecycle rules only transition in the archive direction","Only with S3 Intelligent-Tiering enabled","Only if MFA Delete is configured"],a:[1],e:"Lifecycle rules transition toward archive classes only; returning from Glacier requires a restore request followed by a copy."},
{q:"Which two of the following are valid lifecycle rule filter criteria for scoping which objects a rule applies to? (Select TWO.)",o:["Object key prefix (e.g., logs/)","Object tags","The IAM user who uploaded the object","The encryption algorithm used on the object","The AWS Region the bucket is located in"],a:[0,1],multi:true,e:"Lifecycle rules can be scoped by key prefix and/or object tags."},
{q:"A team wants to keep only the 3 most recent versions of each object and automatically delete all older versions. Can a single lifecycle rule accomplish this?",o:["Yes, lifecycle rules support a NoncurrentVersionExpiration action with a NoncurrentDays parameter that expires versions older than a specified number of days, effectively limiting the version count","No, lifecycle rules cannot target noncurrent versions at all","Yes, lifecycle rules have a \"keep N versions\" parameter that directly specifies the number of versions to retain","No, this requires a custom Lambda function with no lifecycle rule involvement"],a:[0],e:"NoncurrentVersionExpiration with NoncurrentDays expires versions older than a specified number of days, indirectly controlling version count over time."},
{q:"A developer configures a lifecycle rule with the following transitions: Standard → Standard-IA at 30 days, Standard-IA → Glacier Flexible Retrieval at 90 days, Glacier Flexible Retrieval → Glacier Deep Archive at 180 days. Which statement about this configuration is accurate?",o:["Objects must wait in each class for the minimum storage duration before the next transition can occur, and the total days must be cumulative from object creation","Each transition timer resets to zero when the object changes class","Lifecycle rules cannot chain more than two transitions","The transitions execute in reverse order, from cheapest to most expensive"],a:[0],e:"Transition days are cumulative from object creation, and objects must stay in each class for its minimum storage duration."},
{q:"A company's bucket has no lifecycle rules and uses multipart upload extensively for large video files. Over time, numerous abandoned uploads accumulate. What is the primary operational risk of not configuring a lifecycle rule to abort incomplete multipart uploads?",o:["The abandoned parts will automatically delete themselves after 24 hours","The incomplete parts continue to consume storage and incur charges indefinitely until manually aborted or cleaned up by a lifecycle rule","Incomplete multipart uploads do not consume any storage","The abandoned parts will corrupt existing completed objects"],a:[1],e:"Incomplete parts consume storage and incur charges until explicitly cleaned up."},
{q:"A developer accidentally overwrites a critical configuration file stored as an S3 object. The bucket has versioning enabled. How can the developer recover the previous version?",o:["Contact AWS Support to restore from a backup tape","Retrieve the previous version by specifying its version ID in a GET request, since versioning preserves every version of every object","The previous version is permanently lost regardless of versioning","Delete the bucket and recreate it to trigger a rollback"],a:[1],e:"Versioning preserves every version; the previous version is retrieved by specifying its version ID."},
{q:"When versioning is enabled, what happens when a DELETE request is sent for an object without specifying a version ID?",o:["The object and all its versions are permanently deleted","A delete marker is inserted, making the object appear deleted via normal GET/LIST, but all previous versions remain recoverable","The most recent version is permanently deleted while older versions are preserved","The DELETE request is rejected with an error"],a:[1],e:"A DELETE without a version ID inserts a delete marker; previous versions remain recoverable."},
{q:"A security team wants to ensure that even if an administrator's credentials are compromised, no one can permanently delete object versions or change the bucket's versioning state without additional multi-factor authentication. Which S3 feature addresses this?",o:["S3 Block Public Access","MFA Delete","Server-side encryption with SSE-KMS","S3 Transfer Acceleration"],a:[1],e:"MFA Delete requires multi-factor authentication for permanent version deletion or versioning state changes."},
{q:"Once versioning is enabled on an S3 bucket, can it be returned to the \"unversioned\" state?",o:["Yes, versioning can be fully disabled and reverted to the unversioned state","No, once enabled, versioning can only be suspended (new writes stop getting versioned, but existing versions remain); it cannot revert to the original unversioned state","Yes, but only by deleting and recreating the bucket","Yes, by contacting AWS Support"],a:[1],e:"Once enabled, versioning can only be suspended, never returned to the unversioned state."},
{q:"A company has versioning enabled on a bucket with millions of objects. Each object has been updated dozens of times, resulting in hundreds of millions of noncurrent versions. Storage costs have grown significantly. What is the recommended approach to control these costs while keeping versioning enabled?",o:["Disable versioning entirely","Configure lifecycle rules with NoncurrentVersionTransitions (to cheaper classes) and NoncurrentVersionExpiration (to delete old versions after a retention period)","Delete the bucket and recreate it without versioning","Contact AWS Support to request a storage credit"],a:[1],e:"Lifecycle rules with NoncurrentVersionTransitions and NoncurrentVersionExpiration control old-version costs."},
{q:"Which of the following statements about S3 versioning is accurate?",o:["Versioning protects against accidental bucket deletion","An S3 bucket must be completely empty — including all versions and delete markers — before it can be deleted","Versioning doubles the availability SLA of the bucket","Versioning automatically transitions old versions to Glacier"],a:[1],e:"A bucket must be completely empty (all versions and delete markers) before it can be deleted."},
{q:"A developer wants to undo a delete operation on a versioned object that currently shows a delete marker as its latest version. What action restores the object?",o:["Re-upload the object from scratch, since delete markers are permanent","Delete the delete marker itself (by specifying its version ID in a DELETE request), which causes the most recent non-deleted version to become current again","Enable MFA Delete, which automatically reverses all delete markers","Create a new bucket and copy the object from the old bucket"],a:[1],e:"Deleting the delete marker by its version ID restores the most recent non-deleted version."},
{q:"Which two of the following are true about S3 versioning behavior? (Select TWO.)",o:["When an object is overwritten in a versioned bucket, the new data becomes the current version while all previous versions are preserved","A DELETE without a version ID permanently removes the object and all versions","A delete marker makes the object appear deleted via standard GET but previous versions remain accessible by version ID","Versioning can be enabled on a per-object basis rather than per-bucket","Suspended versioning deletes all existing versions from the bucket"],a:[0,2],multi:true,e:"Overwrites create new versions while preserving old ones; delete markers hide objects while versions remain accessible by ID."},
{q:"A company uses S3 versioning as part of their data protection strategy. A junior developer asks whether versioning alone is sufficient to protect against all data loss scenarios. What is the most accurate response?",o:["Yes, versioning protects against every possible data loss scenario including accidental bucket deletion and Region-wide outages","Versioning protects against accidental overwrites and deletes (of individual objects), but does not protect against bucket deletion (bucket must be empty first), and for cross-Region disaster recovery, cross-Region replication should be added","Versioning provides no protection against any form of data loss","Versioning is only useful when combined with S3 Glacier"],a:[1],e:"Versioning protects individual objects from accidental overwrites/deletes but not against bucket deletion or Region-level disasters."},
{q:"What is the versioning state of a newly created S3 bucket by default?",o:["Enabled","Suspended","Unversioned","MFA Delete required"],a:[2],e:"New buckets start in the unversioned state by default."},
{q:"A company wants the simplest possible encryption configuration for their S3 bucket, requiring zero setup or key management. All objects should be encrypted at rest automatically. Which server-side encryption method is the default and simplest option?",o:["SSE-KMS with a customer-managed key","SSE-S3 (AES-256, managed entirely by AWS, default for all new objects since 2023)","SSE-C","Client-side encryption"],a:[1],e:"SSE-S3 is the default encryption (since 2023), requiring zero setup or key management."},
{q:"A financial services company needs an audit trail in CloudTrail for every time an S3 object is encrypted or decrypted, and wants the ability to control which IAM principals can decrypt the data through a key policy, independent of the S3 bucket policy. Which encryption method provides these capabilities?",o:["SSE-S3","SSE-KMS with a customer-managed key (CMK)","SSE-C","No S3 encryption method supports CloudTrail auditing of key usage"],a:[1],e:"SSE-KMS with a CMK provides CloudTrail audit logs per-key and custom key policies for access control."},
{q:"A company's security policy requires that the encryption key never be stored by AWS in any form — the application must provide the key with every PUT and GET request, and AWS discards it immediately after use. Which encryption method meets this requirement?",o:["SSE-S3","SSE-KMS","SSE-C, where the customer supplies the encryption key per request and AWS never stores it","Client-side encryption"],a:[2],e:"SSE-C requires the customer to supply the key per request; AWS never stores it."},
{q:"A healthcare company's compliance mandate states that sensitive documents must never exist as plaintext anywhere on AWS infrastructure, even transiently during a server-side encryption operation. Which encryption approach is the only option that satisfies this requirement?",o:["SSE-S3","SSE-KMS with an AWS-managed key","SSE-C","Client-side encryption, where the application encrypts data before uploading to S3, ensuring AWS only ever receives ciphertext"],a:[3],e:"Client-side encryption ensures AWS only receives ciphertext, never handling plaintext even transiently."},
{q:"A high-throughput application using SSE-KMS experiences intermittent throttling errors on S3 PUT and GET operations. The team discovers that each operation generates a separate call to AWS KMS, hitting the KMS request-per-second quota. Which S3 feature reduces the number of KMS API calls without switching away from SSE-KMS?",o:["S3 Transfer Acceleration","S3 Bucket Keys, which cache a time-limited bucket-level key derived from the CMK, reducing direct KMS calls","S3 Intelligent-Tiering","Enabling versioning"],a:[1],e:"S3 Bucket Keys cache a derived key, reducing the number of direct KMS API calls."},
{q:"What is the key distinction between an AWS-managed KMS key (aws/s3) and a customer-managed KMS key when used with SSE-KMS?",o:["There is no functional difference between the two","An AWS-managed key is fully controlled by AWS with automatic yearly rotation, no custom key policy, and cannot be disabled or deleted; a customer-managed key gives you full control over the key policy, rotation schedule, and the ability to disable or delete the key","Customer-managed keys cannot be used with S3","AWS-managed keys provide stronger encryption than customer-managed keys"],a:[1],e:"AWS-managed keys offer zero setup but no custom control; CMKs offer full key policy, rotation, and disable/delete control."},
{q:"A developer wants to ensure that no object can be uploaded to a bucket without server-side encryption. Which mechanism enforces this requirement?",o:["Enable versioning","A bucket policy with a condition denying PutObject requests that lack the required encryption header (s3:x-amz-server-side-encryption)","A lifecycle rule","S3 Block Public Access"],a:[1],e:"A bucket policy condition on s3:x-amz-server-side-encryption denies unencrypted uploads."},
{q:"Which two of the following are accurate statements about S3 encryption? (Select TWO.)",o:["SSE-S3, SSE-KMS, and SSE-C are all server-side encryption methods where S3 performs the encryption operation","Client-side encryption means the application encrypts data before uploading, ensuring AWS never sees plaintext","SSE-C stores the customer-provided key alongside the encrypted object for future retrieval","SSE-KMS does not support CloudTrail auditing of key usage","SSE-S3 requires the customer to provide an encryption key with every request"],a:[0,1],multi:true,e:"SSE-S3/KMS/C are all server-side; client-side encryption keeps plaintext off AWS entirely."},
{q:"A company wants to force all traffic to their S3 bucket to use HTTPS (TLS) and reject any HTTP requests. Which mechanism accomplishes this?",o:["Enable SSE-S3 encryption","A bucket policy with a Deny for s3:* when aws:SecureTransport is false","Enable S3 Transfer Acceleration","Configure a lifecycle rule requiring HTTPS"],a:[1],e:"A bucket policy denying requests where aws:SecureTransport is false enforces HTTPS."},
{q:"A team uses SSE-KMS with a customer-managed key to encrypt objects in a shared bucket. They want to ensure that only a specific IAM role can decrypt these objects, even if other roles have s3:GetObject permission on the bucket. How can they enforce this restriction?",o:["This is not possible — any role with s3:GetObject can always decrypt SSE-KMS objects","Configure the customer-managed KMS key's key policy to allow kms:Decrypt only for the specific IAM role, thereby preventing other roles from decrypting even if they have S3-level read access","Use SSE-S3 instead, which provides per-role decryption control","Use a lifecycle rule to restrict decryption"],a:[1],e:"The CMK's key policy can restrict kms:Decrypt to a specific role, independent of S3 bucket permissions."},
{q:"A developer using SSE-C accidentally loses the encryption key used to encrypt a specific object. Can the object be recovered?",o:["Yes, AWS retains a backup copy of all SSE-C keys","No, SSE-C keys are never stored by AWS; if the customer loses the key, the encrypted object is permanently unrecoverable","Yes, by contacting AWS Support within 30 days","Yes, by using the AWS-managed key as a fallback"],a:[1],e:"SSE-C keys are never stored by AWS; loss means permanent data inaccessibility."},
{q:"Which encryption method requires that all requests (both PUT and GET) be made over HTTPS exclusively, as a protocol requirement rather than just a best practice?",o:["SSE-S3","SSE-KMS","SSE-C, because the customer-supplied key travels with the request and must be protected in transit","All methods equally require HTTPS with no distinction"],a:[2],e:"SSE-C requires HTTPS as a protocol requirement since the key travels with the request."},
{q:"A scenario requires the team to: (1) control exactly which principals can decrypt objects via a key policy, (2) have per-key usage logged in CloudTrail, and (3) be able to instantly revoke all decrypt access to objects by disabling a single resource. Which encryption configuration satisfies all three requirements?",o:["SSE-S3","SSE-KMS with an AWS-managed key","SSE-KMS with a customer-managed key (CMK), whose key policy controls access, whose usage is logged per-key in CloudTrail, and which can be disabled to instantly block all decryption","SSE-C"],a:[2],e:"A CMK provides key policy control, per-key CloudTrail logging, and the ability to disable the key to block all decryption."},
{q:"A company runs a machine learning pipeline that processes millions of S3 objects per second, all encrypted with SSE-KMS using a customer-managed key. After enabling S3 Bucket Keys, KMS throttling errors dropped significantly. Which statement best explains why?",o:["S3 Bucket Keys bypass KMS entirely, using no key material","S3 Bucket Keys cache a time-limited data key derived from the CMK at the S3 layer, so most encrypt/decrypt operations use the cached key instead of calling KMS directly, dramatically reducing KMS API request volume","S3 Bucket Keys increase the KMS request quota","S3 Bucket Keys switch encryption to SSE-S3 transparently"],a:[1],e:"S3 Bucket Keys cache a derived data key at the S3 layer, reducing direct KMS API calls."},
{q:"Which of the following scenarios is the strongest fit for choosing SSE-KMS with a customer-managed key over SSE-S3?",o:["The team wants the simplest possible encryption with zero key management","The team needs to control which principals can decrypt objects through a key policy, wants per-key CloudTrail audit logs, and needs the ability to disable the key to revoke access","The team wants to avoid any interaction with AWS KMS","The team wants the lowest possible request latency with no additional API calls per operation"],a:[1],e:"CMK provides key policy control, per-key audit, and revocation capability that SSE-S3 cannot offer."},
{q:"A developer configures a bucket to use SSE-KMS with an AWS-managed key (aws/s3). A colleague asks whether they can customize the key policy to restrict who can decrypt objects under this key. What is the correct answer?",o:["Yes, the AWS-managed key's policy is fully customizable","No, the AWS-managed key's policy is controlled by AWS and cannot be customized; for custom key policies, they must use a customer-managed key","AWS-managed keys do not actually encrypt anything","The key policy applies only to SSE-C, not SSE-KMS"],a:[1],e:"AWS-managed key policies are controlled by AWS and not customizable; CMKs provide custom key policies."},
{q:"Which two statements about encryption in transit for S3 are accurate? (Select TWO.)",o:["S3 endpoints support HTTPS, and a bucket policy condition can deny non-HTTPS requests","Encryption in transit (HTTPS) and encryption at rest (SSE) are independent — enabling one does not automatically enable the other","SSE-S3 automatically enforces HTTPS for all requests","Encryption in transit is not supported for S3 in any Region","A lifecycle rule can enforce HTTPS requirements"],a:[0,1],multi:true,e:"HTTPS is supported and enforceable via bucket policy; encryption in transit and at rest are independent mechanisms."},
{q:"A team wants to encrypt objects using keys they manage entirely outside of AWS, using the AWS Encryption SDK in their application, so that S3 only ever stores ciphertext. Which approach does this describe?",o:["SSE-S3","SSE-KMS","SSE-C","Client-side encryption using the AWS Encryption SDK"],a:[3],e:"Client-side encryption with the AWS Encryption SDK encrypts data before upload; S3 only stores ciphertext."},
{q:"A mobile application allows users to upload profile pictures directly to S3 without the mobile device needing any AWS credentials. The backend server generates a short-lived URL that the mobile client uses for the upload. What is this mechanism called?",o:["S3 Transfer Acceleration","A presigned URL","A bucket policy","An S3 event notification"],a:[1],e:"A presigned URL grants temporary, credential-less access to a specific object."},
{q:"A developer generates a presigned PUT URL for a mobile client to upload a video file. The URL expires after 5 minutes. If the upload starts within the 5-minute window but takes 10 minutes to complete, what happens?",o:["The upload fails because the URL expired before the upload finished","The upload succeeds because S3 validates the signature only at the start of the request, not during data transfer","The upload is automatically paused and resumed when a new URL is generated","S3 permanently blocks the client's IP address"],a:[1],e:"S3 validates the presigned URL's signature at request initiation, not during data transfer."},
{q:"A presigned URL is generated by an IAM user who has s3:PutObject permission on a specific bucket. Later, an administrator removes the user's s3:PutObject permission, but a previously issued presigned URL has not yet expired. Can a client still use that URL successfully?",o:["Yes, the URL's signature is immutable and always works until expiration regardless of permission changes","No, because the presigned URL inherits the generating principal's permissions at the time of use, not at the time of generation; revoking the principal's permission causes the URL to fail even before expiration","Only if the bucket has versioning enabled","Only if the bucket policy explicitly allows presigned URL usage"],a:[1],e:"Presigned URLs inherit the generating principal's permissions at the time of use; revoking permissions causes the URL to fail."},
{q:"Which statement correctly describes what a presigned URL is NOT suitable for?",o:["Allowing temporary, credential-less access to upload or download a specific object","Replacing the need for IAM policies and bucket policies as the primary, permanent access control mechanism for a bucket","Enabling a frontend application to bypass the backend server for large file uploads","Granting time-limited access to a private object to an external party"],a:[1],e:"Presigned URLs are a temporary delegation mechanism, not a replacement for permanent IAM/bucket policies."},
{q:"A team generates presigned URLs for downloading confidential reports. A security auditor asks what controls limit the risk of URL sharing. Which two properties of presigned URLs address this? (Select TWO.)",o:["A presigned URL expires after a configured time limit, after which it is no longer valid","A presigned URL is scoped to a specific object key and HTTP method (GET or PUT), limiting what operations it can perform","A presigned URL automatically rotates the underlying IAM credentials after every use","A presigned URL requires the recipient to have their own IAM role","A presigned URL is valid indefinitely until manually revoked"],a:[0,1],multi:true,e:"Presigned URLs expire after a configured time and are scoped to a specific object and HTTP method."},
{q:"A developer wants to generate a presigned URL using the AWS CLI. Which command generates a URL that allows downloading an object for the next 300 seconds?",o:["aws s3 cp s3://bucket/key --presign 300","aws s3 presign s3://bucket/key --expires-in 300","aws s3api generate-url --bucket bucket --key key --ttl 300","aws s3 share s3://bucket/key --duration 300"],a:[1],e:"aws s3 presign s3://bucket/key --expires-in 300 generates a presigned URL valid for 300 seconds."},
{q:"A company wants end users to upload large files (up to 200 MB) directly to S3 from a browser, bypassing the application servers entirely. The application backend authenticates the user and generates a presigned PUT URL. What additional S3 feature should the client use for resilience during these large uploads?",o:["S3 versioning","Multipart upload, potentially with per-part presigned URLs, for resilient parallel uploading of large files","S3 Block Public Access","S3 lifecycle policies"],a:[1],e:"Multipart upload with presigned URLs enables resilient parallel uploading of large files directly to S3."},
{q:"What is the maximum expiration time a presigned URL can be configured with when generated using temporary credentials from an IAM role (e.g., via STS AssumeRole)?",o:["7 days","The URL's maximum validity is bounded by the temporary credentials' session duration, typically up to 12 hours for role-assumed sessions, not the URL's own expiration parameter","There is no maximum; presigned URLs can be valid indefinitely","1 hour, with no exceptions"],a:[1],e:"When generated with STS temporary credentials, the URL's validity is bounded by the session duration."},
{q:"A company generates presigned GET URLs to allow authenticated users to download private files from S3. A developer asks whether CORS headers need to be configured on the bucket for browser-based downloads using these URLs. What is the correct answer?",o:["No, presigned URLs bypass CORS entirely","Yes, if the browser-based JavaScript code makes the request cross-origin, the bucket must return appropriate CORS headers regardless of whether the URL is presigned","CORS only applies to public buckets","CORS is never relevant for S3"],a:[1],e:"Browser-based cross-origin requests require CORS headers on the bucket regardless of presigned URL usage."},
{q:"Which of the following is the primary security advantage of using presigned URLs for direct-to-S3 uploads from mobile clients, compared to embedding IAM access keys in the mobile application?",o:["Presigned URLs provide permanent access to the bucket","Presigned URLs are short-lived, scoped to a specific object and method, and never expose the generating principal's actual AWS credentials to the client","Presigned URLs encrypt the uploaded data automatically","Presigned URLs are faster than using IAM credentials"],a:[1],e:"Presigned URLs are short-lived, narrowly scoped, and never expose real AWS credentials to the client."},
{q:"A developer needs to upload a 7 GB file to S3. Which upload mechanism is required for this file size?",o:["A single PUT request, since S3 supports objects up to 10 GB in a single upload","Multipart upload, because S3's single PUT maximum is 5 GB, and objects larger than that require multipart upload","S3 Transfer Acceleration, which replaces the need for multipart upload","A presigned URL, which automatically splits the upload"],a:[1],e:"Multipart upload is required for objects over 5 GB (S3's single-PUT maximum)."},
{q:"At what file size does AWS recommend starting to use multipart upload for improved throughput and resilience, even though it's not strictly required?",o:["1 MB","100 MB","1 GB","5 GB"],a:[1],e:"AWS recommends multipart upload starting around 100 MB for improved throughput and resilience."},
{q:"A developer starts a multipart upload, uploads 10 of 20 parts, then the upload process crashes. The 10 uploaded parts remain in S3. What is the operational risk if no cleanup action is taken?",o:["The uploaded parts are automatically deleted after 1 hour","The incomplete parts continue consuming storage and incurring charges until the upload is explicitly completed, aborted, or cleaned up by a lifecycle rule","The incomplete parts do not consume any storage","S3 automatically completes the upload using the available parts"],a:[1],e:"Incomplete parts consume storage and incur charges until completed, aborted, or cleaned up by a lifecycle rule."},
{q:"Which two benefits does multipart upload provide compared to a single PUT for a 500 MB file? (Select TWO.)",o:["Parts can be uploaded in parallel, improving throughput","A failed individual part can be retried without restarting the entire upload","Multipart upload bypasses the need for S3 permissions","Multipart upload automatically encrypts each part with a different key","Multipart upload reduces storage costs compared to a single PUT"],a:[0,1],multi:true,e:"Parallel part uploads improve throughput; individual failed parts can be retried without restarting the entire upload."},
{q:"What is the recommended lifecycle rule action to prevent abandoned multipart uploads from accumulating storage costs?",o:["NoncurrentVersionExpiration","AbortIncompleteMultipartUpload","Transition to Glacier","Enable S3 Intelligent-Tiering"],a:[1],e:"AbortIncompleteMultipartUpload is the lifecycle action that cleans up abandoned multipart uploads."},
{q:"A company uploads files ranging from 50 MB to 4 GB to S3. The uploads frequently fail due to network instability. The team wants the ability to resume a failed upload from the last successfully uploaded chunk rather than starting from the beginning. Which S3 feature enables this?",o:["S3 versioning","Multipart upload, which allows individual parts to be retried independently","S3 Transfer Acceleration","S3 event notifications"],a:[1],e:"Multipart upload allows resuming from the last successful part rather than restarting the entire upload."},
{q:"What is the size range for individual parts in a multipart upload (excluding the last part)?",o:["1 KB to 1 MB","5 MB to 5 GB","100 MB to 5 GB","Any size with no constraints"],a:[1],e:"Individual parts must be between 5 MB and 5 GB (the last part can be smaller)."},
{q:"A developer initiates a multipart upload, uploads all parts, but forgets to call the CompleteMultipartUpload API. What is the state of the object?",o:["The object is fully visible and accessible in the bucket","The object is not assembled or visible; the uploaded parts remain as incomplete upload fragments consuming storage until explicitly completed or aborted","S3 automatically completes the upload after 24 hours","The parts are automatically deleted after the upload times out"],a:[1],e:"Without CompleteMultipartUpload, the object is not assembled; parts remain as fragments consuming storage."},
{q:"A company wants to automatically generate a thumbnail every time an image is uploaded to their S3 bucket. Which S3 feature triggers the thumbnail generation?",o:["S3 lifecycle policies","S3 event notifications, configured to invoke a Lambda function on object-created events","S3 versioning","S3 Transfer Acceleration"],a:[1],e:"S3 event notifications invoke a Lambda function when a new object is created."},
{q:"A developer configures an S3 event notification to send object-created events to an SQS queue. A worker fleet of EC2 instances pulls messages from the queue to process uploaded files. What is the primary benefit of using SQS as the notification destination compared to invoking Lambda directly?",o:["SQS is faster than Lambda for processing events","SQS provides durable, decoupled queueing with natural backpressure — the worker fleet processes events at its own pace, and messages are retained if workers are temporarily unavailable","SQS is the only valid destination for S3 event notifications","SQS automatically processes the files without any worker code"],a:[1],e:"SQS provides durable, decoupled queueing with natural backpressure for asynchronous processing."},
{q:"A team needs to fan out S3 object-created events to three independent processing pipelines simultaneously (a thumbnail generator, a metadata indexer, and a notification sender). Which notification destination enables this fan-out pattern most naturally?",o:["Lambda (a single function handling all three)","SNS, which can fan out to multiple independent subscribers (Lambda functions, SQS queues, or other targets) from a single topic","SQS, which processes events sequentially in one queue","S3 Transfer Acceleration"],a:[1],e:"SNS fans out events to multiple independent subscribers from a single notification."},
{q:"A company's existing S3 event notification configuration sends events to a Lambda function filtered by the prefix \"uploads/\" and suffix \".jpg\". The team now needs additional events routed to a different Lambda function based on object metadata tags, plus events sent to an EventBridge rule for cross-account processing. What is the recommended approach?",o:["Configure multiple overlapping S3 event notifications on the bucket, each with different tag-based filters","Enable EventBridge notifications on the bucket, which supports richer filtering (beyond prefix/suffix) and routing to many targets/rules without per-destination bucket configuration","Replace S3 with EFS for event support","Disable all notifications and use manual polling instead"],a:[1],e:"EventBridge offers richer filtering and flexible multi-target routing beyond S3's native prefix/suffix filtering."},
{q:"Which two of the following are valid S3 event notification destinations? (Select TWO.)",o:["AWS Lambda","Amazon SQS","Amazon DynamoDB","Amazon EC2 directly","AWS CodePipeline directly"],a:[0,1],multi:true,e:"Lambda and SQS are valid S3 event notification destinations (SNS and EventBridge are also valid)."},
{q:"A developer configures an S3 event notification but notices that the target Lambda function is not being invoked. The function exists and works when invoked manually. What is the most likely cause?",o:["S3 event notifications do not support Lambda as a destination","The Lambda function's resource-based policy does not grant s3.amazonaws.com permission to invoke it","The S3 bucket must be in the same Availability Zone as the Lambda function","Event notifications only work with versioned buckets"],a:[1],e:"The Lambda function's resource-based policy must grant s3.amazonaws.com permission to invoke it."},
{q:"Which S3 event notification event type would trigger when an object is permanently removed from a bucket?",o:["s3:ObjectCreated:*","s3:ObjectRemoved:*","s3:Replication:*","s3:ReducedRedundancyLostObject"],a:[1],e:"s3:ObjectRemoved:* events fire when an object is permanently deleted."},
{q:"A team wants to trigger a CodePipeline execution whenever a new application artifact is uploaded to a specific S3 bucket prefix. Which approach enables this?",o:["Configure a direct S3 event notification to CodePipeline","Enable EventBridge notifications on the bucket and create an EventBridge rule that matches the upload event and targets CodePipeline","Use a lifecycle rule to trigger CodePipeline","Configure S3 Transfer Acceleration to notify CodePipeline"],a:[1],e:"EventBridge rules can match S3 events and target CodePipeline (S3 cannot notify CodePipeline directly)."},
{q:"A company processes uploaded files using both a real-time Lambda function (for immediate processing) and an SQS-backed worker fleet (for batch processing). They need both to receive the same S3 event. Which architecture supports this?",o:["Configure two separate S3 event notifications pointing to Lambda and SQS respectively for the same event type","Configure the S3 event notification to publish to SNS, which then fans out to both the Lambda function and the SQS queue as subscribers","Configure S3 to call Lambda, which then writes to SQS manually — no fan-out option exists","S3 can only send events to one destination per event type"],a:[1],e:"SNS fans out the same event to both Lambda and SQS as independent subscribers."},
{q:"Classic S3 event notifications (configured directly on the bucket) support filtering by which criteria?",o:["Object key prefix and suffix only","Object metadata tags, size, and encryption type","The IAM principal who uploaded the object","The storage class of the object"],a:[0],e:"Classic S3 event notifications filter by key prefix and suffix only; richer filtering requires EventBridge."},
{q:"A developer needs to grant a Lambda function in a different AWS account read access to objects in an S3 bucket. Which combination of mechanisms enables cross-account access? (Select TWO.)",o:["A bucket policy on the S3 bucket granting s3:GetObject to the other account's IAM role","An IAM policy attached to the Lambda function's execution role granting s3:GetObject on the bucket's ARN","S3 Block Public Access configured to allow all public access","A lifecycle rule granting cross-account permissions","S3 versioning with MFA Delete"],a:[0,1],multi:true,e:"Cross-account S3 access requires both a bucket policy granting the external role and an IAM policy on that role."},
{q:"A company wants to guarantee that an S3 bucket can never be made publicly accessible, even if someone accidentally attaches a bucket policy with Principal: \"*\". Which S3 feature provides this safeguard?",o:["S3 versioning","S3 Block Public Access","SSE-KMS encryption","S3 Transfer Acceleration"],a:[1],e:"S3 Block Public Access prevents public access regardless of bucket policy or ACL configuration."},
{q:"Which statement correctly describes the relationship between IAM policies and S3 bucket policies in determining access to an object?",o:["Only the IAM policy matters; bucket policies are ignored","Access is determined by the union of what both policies allow, minus any explicit Deny from either — an explicit Deny anywhere overrides any Allow","Only the bucket policy matters; IAM policies are ignored","IAM policies and bucket policies cannot be used simultaneously on the same bucket"],a:[1],e:"Access is the union of IAM and bucket policy Allows, minus any explicit Deny from either."},
{q:"AWS now recommends disabling ACLs on S3 buckets in favor of using policies exclusively. Which Object Ownership setting achieves this?",o:["Object writer","Bucket owner enforced","Bucket owner preferred","ACL required"],a:[1],e:"\"Bucket owner enforced\" disables ACLs, making policies the sole access control mechanism."},
{q:"A developer creates a bucket policy that grants s3:GetObject to Principal: \"*\" for all objects in the bucket. However, the bucket's S3 Block Public Access settings include \"Block public access through any newly created public bucket policies.\" What is the effective result?",o:["The bucket is publicly accessible because the bucket policy overrides Block Public Access","The bucket is NOT publicly accessible because Block Public Access acts as a hard override, blocking the bucket policy's public grant","Block Public Access only applies to ACLs, not bucket policies","The bucket policy is automatically deleted"],a:[1],e:"Block Public Access overrides the bucket policy's public grant, keeping the bucket private."},
{q:"Which of the following is NOT a capability of S3 Block Public Access?",o:["Blocking public access granted through ACLs","Blocking public access granted through bucket policies","Encrypting objects at rest","Being applied at the account level to affect all buckets"],a:[2],e:"Block Public Access controls public access; it does not encrypt objects."},
{q:"A company has a bucket policy that denies s3:PutObject unless the request includes a specific encryption header. A developer with full s3:* permissions in their IAM policy tries to upload an unencrypted object. What happens?",o:["The upload succeeds because the IAM policy's Allow overrides the bucket policy's Deny","The upload is denied because an explicit Deny in the bucket policy overrides any Allow from the IAM policy","The IAM policy and bucket policy cancel each other out, resulting in no action","The bucket policy is ignored for users with full s3:* permissions"],a:[1],e:"An explicit Deny in a bucket policy overrides any Allow from IAM policies."},
{q:"A company stores sensitive financial data in S3 and wants only a specific IAM role (used by their auditing application) to access the data. All other principals, including administrators, should be denied access. Which mechanism most directly achieves this?",o:["S3 Block Public Access","A bucket policy with an explicit Deny for all principals except the specific IAM role","S3 versioning","S3 Intelligent-Tiering"],a:[1],e:"A bucket policy with an explicit Deny for all except the specific role enforces exclusive access."},
{q:"Which two statements about S3 ACLs are accurate? (Select TWO.)",o:["ACLs are a legacy access control mechanism that AWS recommends replacing with bucket and IAM policies","ACLs provide fine-grained, condition-based access control equivalent to bucket policies","ACLs can grant predefined permissions like \"public-read\" at the bucket or object level","ACLs are the only way to grant cross-account access to S3 objects","ACLs automatically encrypt objects they apply to"],a:[0,2],multi:true,e:"ACLs are legacy and provide coarse-grained predefined grants; AWS recommends policies instead."},
{q:"A team configures S3 Block Public Access at the AWS account level with all four settings enabled. A developer in the same account creates a new bucket and tries to attach a bucket policy with Principal: \"*\". What is the outcome?",o:["The bucket policy is successfully attached and the bucket becomes public","The bucket policy is prevented from granting public access because the account-level Block Public Access settings override it","Account-level Block Public Access settings do not affect individual buckets","The developer's IAM permissions are automatically revoked"],a:[1],e:"Account-level Block Public Access prevents any bucket in the account from being made public."},
{q:"A bucket policy uses the condition key aws:SecureTransport to deny non-HTTPS requests. A request arrives over HTTP. What happens?",o:["The request succeeds because aws:SecureTransport is not a valid condition key","The request is denied because the bucket policy explicitly denies requests where aws:SecureTransport is false (i.e., non-HTTPS)","The request is automatically redirected to HTTPS","The condition key only applies to GET requests, not PUT requests"],a:[1],e:"The condition denies requests where aws:SecureTransport is false (HTTP requests)."},
{q:"A developer wants to restrict S3 access so that objects can only be accessed from within a specific VPC, not from the public internet. Which mechanism supports this?",o:["A lifecycle rule restricting access by VPC ID","A bucket policy with a condition restricting access to a specific VPC endpoint (aws:sourceVpce) or VPC ID (aws:sourceVpc)","S3 Block Public Access alone, with no additional configuration","S3 Transfer Acceleration, which inherently restricts access to VPC traffic"],a:[1],e:"A bucket policy with aws:sourceVpce or aws:sourceVpc conditions restricts access to VPC-originated requests."},
{q:"A company hosts a static website (HTML, CSS, JavaScript, images) on S3. Users report that the site loads over HTTP but not HTTPS. What explains this limitation?",o:["S3 static website endpoints do not support HTTPS natively; HTTPS with a custom domain requires placing CloudFront in front of the S3 bucket","S3 static websites always support HTTPS by default","The bucket policy is blocking HTTPS requests","S3 does not support hosting static files"],a:[0],e:"S3 static website endpoints are HTTP-only; HTTPS requires CloudFront in front."},
{q:"A developer enables static website hosting on an S3 bucket but users receive 403 Forbidden errors when trying to access the site. What is the most likely cause?",o:["The bucket does not have versioning enabled","The bucket does not have a bucket policy granting s3:GetObject to Principal: \"*\", and/or S3 Block Public Access settings are blocking the required public access","Static website hosting requires SSE-KMS encryption","The bucket is in the wrong AWS Region"],a:[1],e:"Static website hosting requires a bucket policy granting public GetObject access, and Block Public Access must not block it."},
{q:"A company wants to host a static website at www.example.com with HTTPS, a custom domain, and global caching. Which architecture is the standard solution?",o:["S3 static website hosting alone, which supports all of these","S3 for storage with CloudFront as the CDN providing HTTPS (via ACM certificate), custom domain (via Route 53 alias), and global edge caching","EC2 instances serving the static files","API Gateway with a Lambda backend rendering the HTML"],a:[1],e:"S3 + CloudFront (with ACM for HTTPS, Route 53 for the domain, and edge caching) is the standard architecture."},
{q:"Which two files are typically configured when enabling S3 static website hosting? (Select TWO.)",o:["An index document (e.g., index.html) specifying the default page","An error document (e.g., error.html) specifying the page shown for 4xx errors","A Lambda function handler for server-side rendering","A database connection string for dynamic content","A CodePipeline configuration file"],a:[0,1],multi:true,e:"An index document and an optional error document are configured when enabling static website hosting."},
{q:"A single-page application (SPA) hosted on S3 behind CloudFront uses client-side routing (e.g., React Router). Users navigating to deep links like /dashboard/settings receive a 403 error because no S3 object exists at that path. What is the standard fix?",o:["Create an S3 object for every possible client-side route","Configure CloudFront to return the index.html page for 403/404 errors (custom error responses), allowing the client-side router to handle the path","Disable client-side routing in the application","Switch from S3 to EC2 for hosting"],a:[1],e:"CloudFront custom error responses returning index.html for 403/404 errors let the SPA's client-side router handle deep links."},
{q:"A company is serving a static website from S3 with CloudFront in front. They want to prevent users from bypassing CloudFront and accessing the S3 bucket's website endpoint directly. Which CloudFront feature restricts access to the S3 origin?",o:["S3 Block Public Access alone","CloudFront Origin Access Control (OAC), which restricts the S3 bucket to accept requests only from CloudFront","A lifecycle rule","S3 Transfer Acceleration"],a:[1],e:"CloudFront Origin Access Control (OAC) restricts the S3 bucket to accept requests only from CloudFront."},
{q:"A global user base uploads video files to an S3 bucket in us-east-1. Users in Asia and Europe experience slow upload speeds due to the geographic distance. Which S3 feature uses CloudFront's global edge network to speed up these uploads?",o:["S3 event notifications","S3 Transfer Acceleration","S3 Intelligent-Tiering","S3 versioning"],a:[1],e:"S3 Transfer Acceleration uses edge locations to speed up uploads from geographically distant clients."},
{q:"Which endpoint format does a client use when uploading via S3 Transfer Acceleration?",o:["bucket-name.s3.amazonaws.com","bucket-name.s3-accelerate.amazonaws.com","bucket-name.s3-website.amazonaws.com","bucket-name.s3-edge.amazonaws.com"],a:[1],e:"bucket-name.s3-accelerate.amazonaws.com is the Transfer Acceleration endpoint."},
{q:"A developer stores a 10 GB CSV file in S3 and needs to retrieve only the rows where the status column equals \"FAILED\". Downloading the entire file and filtering client-side would be slow and expensive. Which S3 feature allows filtering the data server-side before transfer?",o:["S3 Transfer Acceleration","S3 Select, which runs a SQL-like query on CSV, JSON, or Parquet objects and returns only the matching subset","S3 Intelligent-Tiering","S3 versioning"],a:[1],e:"S3 Select runs SQL-like queries on the object server-side, returning only matching data."},
{q:"S3 Select supports which data formats for server-side querying?",o:["Only CSV","CSV, JSON, and Parquet","Only Parquet and Avro","Any binary format"],a:[1],e:"S3 Select supports CSV, JSON, and Parquet formats."},
{q:"A company regularly queries a 50 GB JSON file stored in S3 to extract a small subset of records. Using S3 Select instead of downloading the full file would reduce which two cost/performance factors? (Select TWO.)",o:["Data transfer costs and bandwidth consumption","Client-side parsing and processing time","S3 storage costs for the file itself","The number of AZs the file is replicated across","The object's encryption key rotation schedule"],a:[0,1],multi:true,e:"S3 Select reduces data transfer costs and client-side processing by filtering server-side."},
{q:"Which of the following correctly describes S3 Transfer Acceleration's pricing model?",o:["Transfer Acceleration is included at no additional cost with every S3 bucket","Transfer Acceleration has an additional per-GB fee for accelerated transfers, and AWS provides a speed comparison tool to verify that a given source location would benefit before enabling it","Transfer Acceleration is free for uploads but charges for downloads","Transfer Acceleration charges a flat monthly fee regardless of usage"],a:[1],e:"Transfer Acceleration charges a per-GB fee and offers a speed comparison tool to verify benefit."},
{q:"A developer wants to query archived data stored in Glacier without performing a full restore. Which AWS feature supports this?",o:["S3 lifecycle policies","Glacier Select, which allows running SQL-like queries on Glacier data without a full restore","S3 Transfer Acceleration","S3 versioning"],a:[1],e:"Glacier Select queries archived data without a full restore."},
{q:"When would S3 Transfer Acceleration NOT provide a meaningful speed improvement?",o:["When uploading from a location geographically close to the bucket's Region","When uploading from a location far from the bucket's Region","When uploading large files","When uploading from multiple geographic locations simultaneously"],a:[0],e:"Transfer Acceleration provides minimal benefit when the source is already close to the bucket's Region."},
{q:"A company needs to store application logs that are accessed via HTTP API calls from multiple microservices across different AWS Regions, with no capacity planning required. Which storage service is the best fit?",o:["Amazon EBS","Amazon S3","Amazon EFS","Instance store"],a:[1],e:"S3 is HTTP-addressable, globally accessible, requires no capacity planning, ideal for log storage."},
{q:"A relational database running on EC2 requires a persistent block storage volume with consistent low-latency IOPS, attached to a single instance. Which storage service fits?",o:["Amazon S3","Amazon EBS","Amazon EFS","Instance store"],a:[1],e:"EBS provides persistent, low-latency block storage attached to a single EC2 instance."},
{q:"A container-based application running on multiple EC2 instances across two Availability Zones needs a shared POSIX-compliant filesystem for reading and writing configuration files concurrently. Which storage service fits?",o:["Amazon S3","Amazon EBS","Amazon EFS","Instance store"],a:[2],e:"EFS provides a shared POSIX filesystem mountable concurrently by multiple instances across AZs."},
{q:"A high-performance computing application needs the fastest possible local disk I/O for temporary scratch data used during computation. The data can be regenerated if lost. Which storage option fits?",o:["Amazon S3","Amazon EBS","Amazon EFS","Instance store"],a:[3],e:"Instance store offers the fastest local I/O for temporary, loss-tolerant data."},
{q:"Which two statements correctly distinguish S3 from EBS? (Select TWO.)",o:["S3 is object storage accessed via HTTP API; EBS is block storage attached to EC2 instances","S3 requires capacity provisioning; EBS does not","EBS volumes are scoped to a single Availability Zone; S3 objects are durably stored across multiple AZs within a Region","S3 can serve as a boot volume for EC2 instances","EBS provides higher durability (more nines) than S3"],a:[0,2],multi:true,e:"S3 is HTTP-based object storage; EBS is AZ-scoped block storage. S3 is multi-AZ durable."},
{q:"A developer needs to choose between S3 and EFS for storing user-uploaded documents that will be processed by a fleet of EC2 instances. The instances need to read and write the documents using standard filesystem operations (open, read, write, close). Which storage service supports this requirement?",o:["S3, since it supports standard filesystem operations natively","EFS, since it provides a POSIX-compliant filesystem mountable by multiple instances","Instance store, since it provides the fastest filesystem access","EBS, since it can be attached to multiple instances simultaneously"],a:[1],e:"EFS provides POSIX filesystem semantics (open/read/write/close) mountable by multiple instances."},
{q:"A Lambda function needs to read a configuration file at startup. The file is updated weekly by a separate deployment process. Which storage service is the most practical choice for this use case?",o:["Instance store","EBS","S3","EFS"],a:[2],e:"S3 is the practical choice for a file read by Lambda at startup, updated weekly."},
{q:"Which of the following one-line decision rules for AWS storage services is accurate?",o:["Need a traditional attached disk for one instance → S3; need HTTP-addressable object storage → EBS","Need HTTP-addressable object storage at any scale with no capacity planning → S3; need a block volume for one instance → EBS; need shared POSIX filesystem across instances → EFS; need fastest local disk tolerant of data loss → instance store","EFS is the default choice for all storage needs","Instance store provides the highest durability of any AWS storage option"],a:[1],e:"This accurately maps each storage service to its ideal use case."},
{q:"A company stores user-uploaded documents in S3 with the following requirements: (1) documents must be encrypted with a key the company controls via a key policy, (2) access patterns are unpredictable — some documents are accessed daily while others are never accessed again, (3) the company wants AWS to handle tier optimization automatically, and (4) all uploads must go directly from the client browser to S3 without passing through the application server. Which combination of S3 features addresses all four requirements?",o:["SSE-S3 encryption, S3 Standard storage class, a bucket policy granting public write access","SSE-KMS with a customer-managed key, S3 Intelligent-Tiering, presigned PUT URLs for direct browser uploads","Client-side encryption, S3 Glacier Deep Archive, S3 Transfer Acceleration","SSE-C encryption, S3 Standard-IA, a hardcoded IAM access key in the browser JavaScript"],a:[1],e:"CMK for key policy control, Intelligent-Tiering for automatic optimization, presigned URLs for direct browser uploads."},
{q:"A media company's workflow is as follows: a photographer uploads a 500 MB RAW image from a remote location to S3, which triggers a Lambda function to generate a compressed web-ready version. The photographer is in Australia and the bucket is in us-east-1, resulting in slow uploads. The team also discovers that several abandoned multipart uploads from failed upload attempts are accumulating storage charges. Which combination of changes addresses both the slow uploads and the orphaned parts?",o:["Enable S3 Transfer Acceleration for faster uploads from distant locations, and add a lifecycle rule with AbortIncompleteMultipartUpload to clean up failed uploads automatically","Switch from S3 to EBS for faster uploads","Enable versioning to speed up uploads","Move the bucket to the Australia Region and disable event notifications"],a:[0],e:"Transfer Acceleration speeds distant uploads; AbortIncompleteMultipartUpload cleans up failed uploads."},
{q:"A company's security review of an S3 bucket finds the following issues: (1) objects are encrypted with SSE-S3, but the security team requires per-key CloudTrail audit logs and the ability to revoke decrypt access through a key policy, (2) the bucket has no Block Public Access configured, and a junior developer recently attached a bucket policy granting Principal: \"*\", and (3) incomplete multipart uploads are consuming significant storage. Which combination of changes addresses all three findings?",o:["Switch to SSE-KMS with a customer-managed key for audit/revocation control, enable S3 Block Public Access to prevent public bucket policies, and add a lifecycle rule to abort incomplete multipart uploads","Switch to SSE-C for audit logs, disable versioning, and delete the bucket","Keep SSE-S3 and add a lifecycle rule only","Enable S3 Transfer Acceleration to address all three issues"],a:[0],e:"CMK for audit/revocation, Block Public Access for safety, lifecycle rule for multipart cleanup."},
{q:"A startup is building a content management system. User-uploaded images are accessed millions of times in the first week, then rarely accessed for the next year, and must be retained for 3 years with instant retrieval always available. The images are served globally via CloudFront. When an image is accidentally deleted or overwritten, the content team needs to recover the previous version. Finally, all images must be encrypted with a key the company can audit per-key in CloudTrail. Which combination of S3 features builds this system?",o:["Versioning for recovery, a lifecycle rule (Standard → Standard-IA at 30 days → Glacier Instant Retrieval at 365 days, expire at 3 years), SSE-KMS with a customer-managed key, and CloudFront with OAC for global delivery","No versioning, S3 Glacier Deep Archive from day one, SSE-S3, and S3 Transfer Acceleration","Versioning, Standard-IA from day one, client-side encryption, and direct S3 website hosting","No versioning, S3 Standard only, SSE-C, and a bucket policy granting public access"],a:[0],e:"Versioning for recovery, tiered lifecycle for cost optimization, CMK for auditable encryption, CloudFront with OAC for global HTTPS delivery."},
{q:"A company migrating from on-premises to AWS needs a storage solution for three distinct workloads: (1) a public-facing static website with HTTPS and a custom domain, (2) a relational database requiring low-latency attached block storage, and (3) a shared configuration directory mounted concurrently by 50 EC2 instances across multiple AZs. Which AWS storage services correctly match each workload, in order?",o:["EBS for the website, S3 for the database, instance store for the shared directory","S3 (with CloudFront for HTTPS/custom domain) for the website, EBS for the database, EFS for the shared directory","EFS for all three workloads","Instance store for the website, EFS for the database, S3 for the shared directory"],a:[1],e:"S3+CloudFront for static website, EBS for database block storage, EFS for shared concurrent filesystem."}

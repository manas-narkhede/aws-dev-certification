{q:"A team deploying a new API version wants to: minimize duplicated resources across dev/test/prod, avoid breaking existing mobile clients during rollout, and test a small percentage of production traffic against the new version before full cutover. Which combination of API Gateway features addresses all three goals?",o:["Stage variables (to point each environment's stage at the right Lambda alias) combined with a canary release deployment on the prod stage (to gradually shift traffic to the new version)","A single stage with no variables and no canary support","Three entirely separate APIs with no shared configuration","A resource policy alone, with no stages or canary settings"],a:[0],e:"Stage variables handle per-environment Lambda alias targeting, while canary deployment handles gradual, monitored traffic shifting."},
{q:"A company migrating from a REST API to an HTTP API for cost savings discovers their existing API relies on usage plans with per-partner API keys and JSON Schema request validation. What should they conclude?",o:["HTTP APIs fully support both features, so the migration can proceed with no changes","These two specific features (usage plans/API keys and full request validation) are not supported by HTTP APIs, so the team must either keep those endpoints on REST API or re-architect around HTTP API's more limited feature set","They must delete the usage plans and accept unlimited access from all partners","HTTP APIs will automatically convert usage plans to a different mechanism transparently"],a:[1],e:"Usage plans/API keys and full request validation are unsupported on HTTP APIs, forcing a choice between keeping REST API or re-architecting."},
{q:"A GraphQL API built on AppSync needs to support: public unauthenticated read access to product listings, authenticated Cognito-based access for placing orders, and secure backend-to-backend calls from an internal Lambda pipeline using AWS credentials. Which AppSync configuration satisfies all three needs simultaneously?",o:["A single authorization mode cannot satisfy this, so multiple auth modes must be configured: API key for public reads, Cognito User Pools for authenticated mutations, and IAM for internal backend calls","Only IAM can be configured, and all three use cases must share IAM credentials","AppSync requires a separate API per authorization mode","API key alone satisfies all three requirements"],a:[0],e:"Multiple AppSync auth modes (API key, Cognito, IAM) together satisfy the three distinct caller types described."},
{q:"A developer is debugging a REST API where the Lambda proxy integration intermittently returns 502 errors under specific inputs, while other inputs succeed normally. Investigation shows the failing inputs trigger a code path where the Lambda handler returns a bare Python dictionary without the required envelope. Which fix directly resolves the intermittent 502s?",o:["Ensure every code path in the handler returns the '{statusCode, headers, body}' structure consistently, including error-handling branches","Increase the API's throttle limit","Add a stage variable","Switch to a Mock integration for all methods"],a:[0],e:"Ensuring every code path (including error branches) returns the proper response envelope eliminates the intermittent 502s."},
{q:"A company's Lambda authorizer occasionally denies legitimate users immediately after a permissions change is made in their identity provider, because the previous Allow decision is still cached. What adjustment most directly reduces this staleness window while still retaining some caching benefit?",o:["Reduce the authorizer's cache TTL to a shorter duration that better balances staleness risk against invocation overhead","Disable IAM entirely","Switch the method to a Mock integration","Add a usage plan quota"],a:[0],e:"Lowering the authorizer cache TTL reduces the staleness window after a permissions change while retaining some caching benefit."},
{q:"Reflecting on this module as a whole, which single statement best captures the recurring theme across stage variables, resource policies, request validation, and AppSync's multi-mode authorization?",o:["API Gateway and AppSync configuration is rigid and offers no environment- or caller-specific flexibility","Both services are built around flexibly separating \"one API/schema definition\" from \"who can call it, how much they can call it, and which backend/environment it targets\" — stages/stage variables handle environment targeting, resource policies/authorizers handle callers, and usage plans/request validation handle traffic quality and volume","Only IAM matters for either service; all other mechanisms are decorative","AppSync and API Gateway are functionally identical in every respect"],a:[1],e:"The recurring theme is cleanly separating \"what the API/schema is\" from \"who may call it, how much, and which backend/environment it targets.\""}
];

let idx = 0, score = 0, answered = new Array(QUESTIONS.length).fill(false), correctFlags = new Array(QUESTIONS.length).fill(false), missed = [];
const STORAGE_KEY = "aws-dva-quiz-05";

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({idx, score, answered, correctFlags}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.answered) && d.answered.length === QUESTIONS.length){
      idx = d.idx; score = d.score; answered = d.answered; correctFlags = d.correctFlags;
      return true;
    }
  }catch(e){}
  return false;
}

const quizArea = document.getElementById("quizArea");
const posNum = document.getElementById("posNum");
const scoreNum = document.getElementById("scoreNum");
const progressFill = document.getElementById("progressFill");

function updateTop(){
  posNum.textContent = (idx+1) + " / " + QUESTIONS.length;
  scoreNum.textContent = score;
  const answeredCount = answered.filter(Boolean).length;
  progressFill.style.width = (answeredCount / QUESTIONS.length * 100) + "%";
}

function renderQuestion(){
  const item = QUESTIONS[idx];
  const isMulti = !!item.multi;
  const done = answered[idx];
  let html = "";
  html += '<div class="card">';
  html += '<div class="qnum">Question ' + (idx+1) + '</div>';
  if(isMulti) html += '<div class="multi-hint">Select all that apply</div><br>';
  html += '<div class="qtext">' + escapeHtml(item.q) + '</div>';
  item.o.forEach((optText, i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = "opt";
    if(done){
      if(item.a.includes(i)) cls += " correct";
      else if(item.picked && item.picked.includes(i)) cls += " incorrect";
    } else if(item.picked && item.picked.includes(i)){
      cls += " selected";
    }
    html += '<button class="' + cls + '" data-i="' + i + '" ' + (done?'disabled':'') + '>' +
      '<span class="mark">' + letter + '</span><span>' + escapeHtml(optText) + '</span></button>';
  });
  if(done){
    html += '<div class="explain"><b>' + (correctFlags[idx] ? "Correct. " : "Not quite. ") + '</b>' + escapeHtml(item.e) + '</div>';
  }
  html += '<div class="actions">';
  if(isMulti && !done){
    html += '<button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>';
  }
  if(done){
    if(idx < QUESTIONS.length - 1){
      html += '<button class="btn btn-primary" id="nextBtn">Next question</button>';
    } else {
      html += '<button class="btn btn-primary" id="finishBtn">See results</button>';
    }
  }
  html += '<button class="btn btn-ghost" id="resetBtn">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  updateTop();
  wireOptions(item, isMulti, done);
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function wireOptions(item, isMulti, done){
  const opts = quizArea.querySelectorAll(".opt");
  opts.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(done) return;
      const i = parseInt(btn.dataset.i, 10);
      if(isMulti){
        item.picked = item.picked || [];
        const pos = item.picked.indexOf(i);
        if(pos >= 0) item.picked.splice(pos,1); else item.picked.push(i);
        renderQuestion();
        const submitBtn = document.getElementById("submitBtn");
        if(submitBtn) submitBtn.disabled = !(item.picked && item.picked.length > 0);
      } else {
        item.picked = [i];
        commitAnswer(item);
      }
    });
  });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn){
    submitBtn.disabled = !(item.picked && item.picked.length > 0);
    submitBtn.addEventListener("click", ()=> commitAnswer(item));
  }
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ idx++; save(); renderQuestion(); });
  const finishBtn = document.getElementById("finishBtn");
  if(finishBtn) finishBtn.addEventListener("click", renderSummary);
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", resetAll);
}

function commitAnswer(item){
  if(answered[idx]) return;
  answered[idx] = true;
  const correct = item.picked.length === item.a.length && item.picked.every(p => item.a.includes(p));
  correctFlags[idx] = correct;
  if(correct) score++; else missed.push(idx);
  save();
  renderQuestion();
}

function renderSummary(){
  const pct = Math.round(score / QUESTIONS.length * 100);
  const passed = pct >= 72;
  let html = '<div class="card summary">';
  html += '<div class="eyebrow">Results</div>';
  html += '<div class="score-big">' + score + ' / ' + QUESTIONS.length + '</div>';
  html += '<div class="score-pct ' + (passed?'pass':'fail') + '">' + pct + '% — ' + (passed ? "Solid, above the ~72% pass bar" : "Below the ~72% pass bar — revisit the notes") + '</div>';
  const missedList = answered.map((_,i)=>i).filter(i => !correctFlags[i]);
  if(missedList.length){
    html += '<div class="miss-list"><h3>Review these questions</h3>';
    missedList.forEach(i=>{
      html += '<div class="miss-item"><b>Q' + (i+1) + '.</b> ' + escapeHtml(QUESTIONS[i].q) + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="actions" style="justify-content:center; margin-top:22px;">';
  html += '<button class="btn btn-primary" id="restartBtn">Restart quiz</button>';
  html += '<button class="btn btn-ghost" id="resetBtn2">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  document.getElementById("restartBtn").addEventListener("click", resetAll);
  document.getElementById("resetBtn2").addEventListener("click", resetAll);
}

function resetAll(){
  idx = 0; score = 0; missed = [];
  answered = new Array(QUESTIONS.length).fill(false);
  correctFlags = new Array(QUESTIONS.length).fill(false);
  QUESTIONS.forEach(q => { delete q.picked; });
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderQuestion();
}

document.addEventListener("keydown", (e)=>{
  const map = {"1":0,"2":1,"3":2,"4":3,"5":4,"a":0,"b":1,"c":2,"d":3,"e":4,"A":0,"B":1,"C":2,"D":3,"E":4};
  if(e.key in map){
    const opts = quizArea.querySelectorAll(".opt:not(:disabled)");
    const i = map[e.key];
    if(opts[i]) opts[i].click();
  } else if(e.key === "Enter"){
    const nb = document.getElementById("nextBtn") || document.getElementById("finishBtn") || document.getElementById("submitBtn");
    if(nb && !nb.disabled) nb.click();
  }
});

if(load()){
  if(answered.every(Boolean)) renderSummary(); else renderQuestion();
} else {
  renderQuestion();
}
</script>

<style>
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eceeec; --ink:#141a1f; --muted:#5c6670;
  --border:#dde1de; --accent:#0d7377; --accent-ink:#ffffff; --accent-soft:#e3f1f0;
  --success:#1f8a44; --success-bg:#e5f6ea; --success-border:#a9dfb8;
  --danger:#c8402f; --danger-bg:#fbe9e6; --danger-border:#f0b8ac;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151a; --surface:#171e25; --surface-2:#1d252c; --ink:#edf1f3; --muted:#93a3ac;
    --border:#2b343c; --accent:#37c9c2; --accent-ink:#08211f; --accent-soft:#173430;
    --success:#5fd489; --success-bg:#123321; --success-border:#256b45;
    --danger:#f38672; --danger-bg:#3a1c17; --danger-border:#7a3226;
  }
}
:root[data-theme="dark"]{
  --bg:#10151a; --surface:#171e25; --surface-2:#1d252c; --ink:#edf1f3; --muted:#93a3ac;
  --border:#2b343c; --accent:#37c9c2; --accent-ink:#08211f; --accent-soft:#173430;
  --success:#5fd489; --success-bg:#123321; --success-border:#256b45;
  --danger:#f38672; --danger-bg:#3a1c17; --danger-border:#7a3226;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:"Public Sans",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 80px;}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600;}
h1{font-size:22px; font-weight:800; margin:4px 0 18px; text-wrap:balance; letter-spacing:-.01em;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap;}
.stat{display:flex; flex-direction:column; align-items:flex-end;}
.stat .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:18px; font-weight:600;}
.stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
.progress-track{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin:14px 0 28px; border:1px solid var(--border);}
.progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .35s ease;}
@media (prefers-reduced-motion: reduce){ .progress-fill{transition:none;} }

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.qnum{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:10px;}
.qtext{font-size:16.5px; font-weight:600; line-height:1.55; margin-bottom:20px; text-wrap:balance;}
.multi-hint{display:inline-block; font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 10px; margin-bottom:14px;}

.opt{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:13px 14px; margin-bottom:10px; cursor:pointer; font:inherit; color:var(--ink); font-size:14.5px; line-height:1.5; transition:border-color .15s, background .15s;}
.opt:hover{border-color:var(--accent);}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.opt .mark{flex:0 0 22px; height:22px; border-radius:6px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; color:var(--muted); margin-top:1px;}
.opt.selected{border-color:var(--accent); background:var(--accent-soft);}
.opt.selected .mark{border-color:var(--accent); color:var(--accent);}
.opt.correct{border-color:var(--success-border); background:var(--success-bg);}
.opt.correct .mark{border-color:var(--success); color:var(--success); background:var(--success-bg);}
.opt.incorrect{border-color:var(--danger-border); background:var(--danger-bg);}
.opt.incorrect .mark{border-color:var(--danger); color:var(--danger); background:var(--danger-bg);}
.opt:disabled{cursor:default;}
.opt:disabled:hover{border-color:var(--border);}
.opt.correct:hover, .opt.incorrect:hover{border-color:inherit;}

.actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
button.btn{font:inherit; font-weight:700; font-size:14px; border-radius:9px; padding:11px 18px; cursor:pointer; border:1.5px solid transparent;}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--accent);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.explain{margin-top:16px; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.55; border:1px solid var(--border); background:var(--surface-2);}
.explain b{color:var(--accent);}

.summary{text-align:center; padding:10px 0 20px;}
.score-big{font-family:"IBM Plex Mono",monospace; font-size:52px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.score-pct{color:var(--muted); font-size:15px; margin-top:2px;}
.pass{color:var(--success);} .fail{color:var(--danger);}
.miss-list{text-align:left; margin-top:22px; border-top:1px solid var(--border); padding-top:18px;}
.miss-list h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;}
.miss-item{font-size:14px; padding:8px 0; border-bottom:1px dashed var(--border);}
.miss-item b{font-family:"IBM Plex Mono",monospace;}

.footer-note{text-align:center; color:var(--muted); font-size:12px; margin-top:22px;}
</style>

<script>
const QUESTIONS = [
{q:"A startup is building a new public API backed entirely by Lambda proxy integrations, with no need for usage plans, API keys, request-body validation, or a private VPC-only endpoint. The team's top priorities are the lowest possible latency and the lowest possible cost per request. Which API Gateway API type should they choose?",o:["REST API","HTTP API","WebSocket API","A private REST API with a VPC endpoint"],a:[1],e:"Lowest latency/cost with only basic Lambda-proxy needs, no advanced features, is the classic HTTP API fit."},
{q:"A financial services company needs to expose an API that enforces per-partner request quotas using API keys, applies JSON Schema request validation before invoking the backend, and caches GET responses per stage to reduce backend load. Which API Gateway API type supports all of these requirements?",o:["HTTP API","REST API","WebSocket API","None of API Gateway's types support response caching"],a:[1],e:"Usage plans, request validation, and response caching are REST API features not available on HTTP APIs."},
{q:"Which of the following is a capability available on REST APIs but NOT available on HTTP APIs in API Gateway?",o:["Lambda proxy integration","Usage plans and API keys","Custom domain names","IAM authorization"],a:[1],e:"Usage plans and API keys are supported on REST APIs but not on HTTP APIs."},
{q:"A company needs an API that is reachable only from within its VPC via a VPC endpoint, with no public internet exposure whatsoever. Which API Gateway API type supports this private endpoint configuration?",o:["HTTP API","REST API","WebSocket API","AppSync"],a:[1],e:"Private (VPC-endpoint-only) APIs are a REST API feature."},
{q:"A team migrating a simple Lambda-backed microservice from REST API to HTTP API is evaluating the tradeoffs. Which statement accurately describes what they gain and lose in this migration?",o:["They gain usage plans and lose Lambda proxy integration support","They gain lower latency and lower cost, but lose usage plans, API keys, request validation, and response caching","They gain response caching but lose the ability to use Lambda at all","There is no functional difference between REST APIs and HTTP APIs"],a:[1],e:"Migrating to HTTP API gains latency/cost benefits but loses usage plans, API keys, validation, and caching."},
{q:"Which authorizer capability is built natively into HTTP APIs without requiring a custom Lambda authorizer?",o:["A native JWT (OIDC/OAuth2) authorizer","A native SAML authorizer","A native API key validator","A native mutual TLS certificate authority"],a:[0],e:"HTTP APIs include a native JWT (OIDC/OAuth2) authorizer with no custom Lambda code required."},
{q:"A company wants to implement a canary deployment on their API, shifting a small percentage of traffic to a newly deployed version of the API configuration before promoting it fully to all traffic. Which API Gateway API type supports canary deployments?",o:["HTTP API","REST API","Both support canary deployments identically","Neither supports canary deployments"],a:[1],e:"Canary release deployments are a REST API stage feature, not available on HTTP APIs."},
{q:"A developer is deciding between REST API and HTTP API for a new internal microservice that only needs simple Lambda proxy integration, IAM authorization, and does not need usage plans, request validation, or caching. Which choice minimizes cost while still meeting all stated requirements?",o:["REST API, since it is the only option supporting IAM authorization","HTTP API, since it supports Lambda proxy integration and IAM authorization at lower cost and latency than REST API","WebSocket API, since it is always the cheapest option","Neither type supports IAM authorization"],a:[1],e:"HTTP API meets all stated needs (proxy integration, IAM auth) at lower cost/latency than REST API."},
{q:"Which statement correctly compares response caching support between REST APIs and HTTP APIs?",o:["Both support per-stage response caching identically","Only REST APIs support built-in per-stage response caching; HTTP APIs do not offer this feature","Only HTTP APIs support response caching","Neither API type supports any form of caching"],a:[1],e:"Only REST APIs offer built-in per-stage response caching."},
{q:"A company needs to attach a resource policy to their API restricting invocation to requests originating from a specific VPC endpoint, in addition to IAM authorization. Which API Gateway API type must they use?",o:["HTTP API, since resource policies are a universal feature","REST API, since resource policies are supported there but not on HTTP APIs","WebSocket API exclusively","Resource policies are not supported by any API Gateway type"],a:[1],e:"Resource policies are supported on REST APIs, not HTTP APIs."},
{q:"Which two of the following are true when comparing REST APIs to HTTP APIs in Amazon API Gateway?",o:["REST APIs support usage plans and API keys; HTTP APIs do not","HTTP APIs generally offer lower latency and lower cost for comparable Lambda-proxy-backed traffic","HTTP APIs support private VPC-endpoint-only access while REST APIs do not","REST APIs cannot use Lambda as a backend integration","HTTP APIs and REST APIs have completely identical feature sets"],a:[0,1],multi:true,e:"REST APIs uniquely support usage plans/API keys, and HTTP APIs generally offer lower latency/cost."},
{q:"A team's scenario requirements state: \"the API must support request body validation against a JSON Schema model before invoking the backend, to reject malformed payloads early.\" Which API type should the team select?",o:["HTTP API, because JSON Schema validation is its primary built-in feature","REST API, because full request validation against JSON Schema models is a REST API feature not available on HTTP APIs","WebSocket API, because validation only applies to persistent connections","Any API type, because validation is unrelated to API Gateway type"],a:[1],e:"Full JSON Schema model request validation is a REST API capability not available on HTTP APIs."},
{q:"A developer configures a method's integration so that the entire raw HTTP request — headers, query string, path parameters, and body — is passed to a Lambda function as a single structured event, and the function's return value must match a specific '{statusCode, headers, body}' shape. Which integration type is being used?",o:["Lambda custom (non-proxy) integration","Lambda proxy integration","Mock integration","AWS service integration"],a:[1],e:"Passing the raw request as a single event with a fixed response envelope defines Lambda proxy integration."},
{q:"A Lambda function behind a proxy integration returns the following from its handler: '{\"orderId\": \"42\", \"status\": \"created\"}'. What will the client actually receive from API Gateway?",o:["A 200 response with that exact JSON body","A 502 error, because the response does not match the required '{statusCode, headers, body}' envelope shape","A 403 error, because the response is missing an IAM signature","A 401 error, because the response is missing an Authorization header"],a:[1],e:"A response missing the required envelope shape causes API Gateway to return a 502."},
{q:"Which integration type allows API Gateway to write directly to a DynamoDB table using a mapping template, without invoking any Lambda function?",o:["Lambda proxy integration","Mock integration","AWS service integration","WebSocket integration"],a:[2],e:"AWS service integration lets API Gateway call DynamoDB (or other AWS APIs) directly via mapping templates."},
{q:"A frontend team needs to begin testing against an API's request/response shape, but the backend Lambda function has not been implemented yet. Which integration type lets API Gateway return a static, predefined response without invoking any backend?",o:["Lambda proxy integration","Mock integration","HTTP proxy integration","AWS service integration"],a:[1],e:"Mock integration returns a static response without invoking any backend."},
{q:"In a Lambda proxy integration, which of the following fields must the client-facing HTTP response body be encoded as, within the object Lambda returns?",o:["A raw JSON object, not a string","A JSON-stringified string assigned to the \"body\" key","A base64-encoded binary blob only, regardless of content type","An XML document, regardless of the Accept header"],a:[1],e:"The proxy integration response's \"body\" must be a JSON-stringified string."},
{q:"A developer wants fine-grained control to transform an incoming request into a completely different shape (renaming fields, restructuring nested objects) before it reaches a Lambda function, and also wants to reshape the Lambda function's raw output before it reaches the client. Which integration type supports this level of control via mapping templates?",o:["Lambda proxy integration","Lambda custom (non-proxy) integration","Mock integration","HTTP proxy integration"],a:[1],e:"Lambda custom (non-proxy) integration uses mapping templates for full request/response reshaping."},
{q:"Which of the following is a legitimate backend target for an API Gateway HTTP integration (as opposed to Lambda or AWS service integrations)?",o:["An on-premises system or another HTTP API reachable directly or via a VPC Link","Only Lambda functions","Only DynamoDB tables","Only Amazon S3 buckets"],a:[0],e:"HTTP integrations can target external/on-prem systems or other APIs, often via a VPC Link for private targets."},
{q:"A REST API method is configured with a Mock integration returning a static 200 response with sample JSON. What is the primary tradeoff of this configuration compared to a real backend integration?",o:["It costs significantly more per request than a Lambda integration","It always returns the identical static response regardless of the request, since no backend logic actually runs","It cannot be used for testing CORS preflight OPTIONS requests","It requires a Cognito User Pool authorizer to function"],a:[1],e:"A Mock integration always returns the same static response since no backend logic executes."},
{q:"A company's API method uses a Lambda custom (non-proxy) integration. The client sends a request, but the Lambda function receives a payload that doesn't resemble the raw HTTP request at all — instead, it's a reshaped object with renamed and restructured fields. What explains this behavior?",o:["This indicates a misconfiguration; non-proxy integrations should always pass the raw request","This is expected: a request mapping template written in VTL transformed the raw request into this custom shape before invoking Lambda","This means the method is actually using a Mock integration","This means IAM authorization failed silently"],a:[1],e:"A VTL request mapping template reshaped the raw request before it reached Lambda, as expected in non-proxy integration."},
{q:"Which of the following correctly distinguishes Lambda proxy integration from Lambda custom (non-proxy) integration in terms of configuration effort?",o:["Proxy integration requires mapping templates for every request and response; non-proxy does not","Proxy integration passes the request/response through with a fixed envelope shape and requires no mapping templates, while non-proxy integration requires explicit request/response mapping templates for full control","Both require identical mapping template configuration","Non-proxy integration cannot invoke Lambda functions at all"],a:[1],e:"Proxy integration needs no mapping templates; non-proxy requires explicit request/response templates for control."},
{q:"A team wants to implement 'OPTIONS' preflight handling for CORS on a REST API resource without incurring any Lambda invocation cost. Which integration type is best suited for the 'OPTIONS' method?",o:["Lambda proxy integration","Mock integration returning the appropriate CORS headers","AWS service integration targeting IAM","HTTP proxy integration to an external CORS validation service"],a:[1],e:"A Mock integration is the standard, cost-free way to handle OPTIONS preflight responses."},
{q:"Which of the following is NOT one of API Gateway's supported integration types?",o:["Lambda proxy integration","AWS service integration","Mock integration","Direct database connection pooling integration"],a:[3],e:"\"Direct database connection pooling integration\" is not a real API Gateway integration type."},
{q:"A developer troubleshooting a 502 error on a Lambda-proxy-backed API method discovers the Lambda function's handler returns a plain string instead of the required JSON object with 'statusCode', 'headers', and 'body' keys. What is the most direct fix?",o:["Switch the method to use IAM authorization instead","Modify the Lambda handler to return the properly structured '{statusCode, headers, body}' object","Increase the Lambda function's memory allocation","Add a usage plan to the method"],a:[1],e:"The Lambda handler must return the structured '{statusCode, headers, body}' object to avoid a 502."},
{q:"A REST API resource uses an AWS service integration to publish directly to an SQS queue when a POST request is received, with no Lambda function involved. What must be configured to make this work correctly?",o:["A Cognito User Pool must be attached to the SQS queue","A request mapping template transforming the incoming body into the shape SQS's SendMessage API expects, along with an IAM role granting API Gateway permission to call SQS","A WebSocket route selection expression","A usage plan with an API key requirement"],a:[1],e:"A mapping template shaping the SQS request body plus an IAM role permitting API Gateway to call SQS are both required."},
{q:"Which of the following scenarios is the strongest fit for choosing a Lambda proxy integration over a Lambda custom (non-proxy) integration?",o:["The team wants API Gateway to handle all request/response reshaping via VTL so the Lambda function never sees raw HTTP details","The team wants minimal API Gateway configuration overhead and is comfortable parsing the full raw request (headers, query params, body) inside the Lambda function itself","The team has no Lambda function and wants to call DynamoDB directly","The team needs the response to bypass API Gateway entirely"],a:[1],e:"Proxy integration minimizes API Gateway configuration at the cost of the Lambda function handling raw request parsing itself."},
{q:"A developer configures an HTTP integration pointing to an internal Application Load Balancer that is only reachable from within a VPC. What API Gateway feature is required to allow the API to reach that private ALB?",o:["A Lambda authorizer","A VPC Link","A usage plan","A stage variable"],a:[1],e:"A VPC Link is required to let API Gateway reach a private, VPC-only backend like an internal ALB."},
{q:"Which of the following correctly describes what happens when a Lambda proxy integration's function throws an unhandled exception rather than returning normally?",o:["API Gateway silently returns a 200 with an empty body","API Gateway typically returns a 502 Internal Server Error to the client, since no valid response envelope was produced","API Gateway automatically retries the request up to five times","The client receives the raw Lambda stack trace unmodified with a 200 status"],a:[1],e:"An unhandled Lambda exception in a proxy integration typically results in a 502 to the client."},
{q:"A team wants to build an API resource that returns different static JSON payloads for different HTTP status code test cases (200, 400, 500) purely for contract testing, without any backend code existing yet for any of the three cases. Which integration type most directly supports this?",o:["Lambda proxy integration","Mock integration, using configured response templates per status code","AWS service integration","HTTP proxy integration"],a:[1],e:"A Mock integration with per-status-code response templates supports exactly this contract-testing use case."},
{q:"A team maintains one REST API definition and wants 'dev', 'test', and 'prod' environments to each invoke a different Lambda function alias, without duplicating the API's resources and methods three times. Which API Gateway feature enables this?",o:["Separate API Gateway accounts per environment","Stage variables referenced inside the integration's target ARN, set to a different value per stage","A single hardcoded Lambda ARN shared across all stages","Usage plans scoped per environment"],a:[1],e:"Stage variables referenced in the integration ARN let one API definition target different Lambda aliases per stage."},
{q:"What does a \"deployment\" represent in API Gateway, as distinct from a \"stage\"?",o:["A deployment is a snapshot of the API's configuration at a point in time; a stage is a named, addressable reference to a specific deployment","A deployment and a stage are the exact same resource under different names","A deployment is a billing construct with no relation to API configuration","A stage is a snapshot of configuration, while a deployment is the addressable URL"],a:[0],e:"A deployment is a configuration snapshot; a stage is a named, addressable reference to a specific deployment."},
{q:"A company wants their 'dev' stage to run with verbose logging and no response caching, while their 'prod' stage runs with minimal logging and caching enabled, using the same underlying API definition. Which API Gateway feature makes this possible?",o:["Each stage carries its own independent settings (logging, caching, throttling) even though they reference the same API","This requires two entirely separate API Gateway APIs","Stage-level settings are global across all stages of an API and cannot differ","This can only be achieved using AppSync, not API Gateway"],a:[0],e:"Each stage independently carries its own logging, caching, and throttling settings."},
{q:"Which of the following is the correct syntax for referencing a stage variable named 'lambdaAlias' inside an integration's target ARN?",o:["'#{stageVariables.lambdaAlias}'","'${stageVariables.lambdaAlias}'","'{{stageVariables:lambdaAlias}}'","'%stageVariables.lambdaAlias%'"],a:[1],e:"'${stageVariables.lambdaAlias}' is the correct syntax for referencing a stage variable in an integration ARN."},
{q:"A team wants a small percentage of production traffic to be routed to a newly deployed API configuration for validation, with the ability to roll back instantly if errors increase, before shifting 100% of traffic. Which capability supports this on a REST API?",o:["Stage variables","Canary release deployment on a stage","A Lambda custom integration","A usage plan quota"],a:[1],e:"Canary release deployment settings on a stage support gradual, percentage-based traffic shifting with rollback."},
{q:"Besides pointing to a different Lambda alias, which of the following is also a valid use of a stage variable?",o:["Selecting a different backend HTTP endpoint (e.g., a different ALB DNS name) per stage","Encrypting the entire API payload","Replacing the need for an authorizer entirely","Defining the account-level throttle limit"],a:[0],e:"Stage variables can also select different backend HTTP endpoints per stage, not just Lambda aliases."},
{q:"A developer publishes a new version of their Lambda function and updates the 'prod' alias to point to it, without touching the API Gateway configuration at all. What effect does this have on the API's 'prod' stage, assuming the integration ARN references '${stageVariables.lambdaAlias}' and the 'prod' stage variable is set to 'prod'?",o:["No effect; API Gateway configuration must also be redeployed for any change to take effect","The 'prod' stage automatically invokes the new Lambda version the alias now points to, with no API Gateway redeployment needed","The API automatically reverts to a Mock integration","The stage variable must be manually changed to a new alias name every time"],a:[1],e:"Because the alias itself moved to point at the new version, the stage automatically invokes the new version with no API Gateway redeployment needed."},
{q:"Which statement best explains why using stage variables to select a Lambda alias is preferable to hardcoding a specific Lambda function version ARN directly in the integration?",o:["Hardcoded version ARNs are more secure than aliases","Stage variables decouple the API's stage from a specific Lambda code version, letting the alias's target version change (via Lambda's own deployment process) without any API Gateway redeployment","Hardcoded version ARNs automatically update themselves","Aliases cannot be used in API Gateway integrations at all"],a:[1],e:"Stage variables decouple the stage from a specific Lambda version, letting alias updates apply without redeploying the API."},
{q:"A team accidentally deploys a breaking change to their 'prod' stage. Which of the following most directly limits the blast radius of a bad deployment before it's discovered?",o:["Using a canary release on the stage so only a small percentage of traffic hits the new deployment initially","Deleting the stage entirely","Disabling all authorizers","Switching to a WebSocket API"],a:[0],e:"A canary release limits the blast radius by exposing the new deployment to only a percentage of traffic initially."},
{q:"What is the relationship between an API's invoke URL and its stage?",o:["Each stage has its own distinct invoke URL path segment (e.g., '/dev', '/prod') appended to the API's base URL","All stages share one single URL with no way to distinguish them","Stages have no effect on the invoke URL","The invoke URL changes only when a custom domain is configured, never based on stage"],a:[0],e:"Each stage has its own path segment appended to the API's base invoke URL."},
{q:"A company wants to test a new version of an API's configuration against 5% of live production traffic, then increase that to 25%, then 100%, monitoring error rates at each step. Which API Gateway REST API feature is designed exactly for this staged rollout?",o:["Usage plans","Canary deployment stage settings, adjusting the canary traffic percentage over time","CORS configuration","A Lambda authorizer"],a:[1],e:"Canary deployment settings allow exactly this kind of staged percentage rollout with monitoring at each step."},
{q:"Which of the following statements about API Gateway stages is accurate?",o:["A stage can have its own throttle settings distinct from another stage's throttle settings on the same API","All stages on an API must share identical throttle settings","Stages cannot have distinct stage variables from one another","A REST API can have at most one stage at any time"],a:[0],e:"Stages can have independent throttle settings from one another on the same API."},
{q:"A developer wants to avoid maintaining three near-identical copies of the same API (one per environment) purely to point at three different backend Lambda aliases. Which combination of features minimizes duplication?",o:["Three separate APIs, each fully duplicated per environment","One API definition with three stages, each carrying a different stage variable value referenced in the integration ARN","One API with no stages at all","A single stage shared by all three environments with manual toggling"],a:[1],e:"One API with per-stage stage variables referencing the integration ARN avoids duplicating resources across environments."},
{q:"True or False: deploying changes to an API automatically updates every stage simultaneously.",o:["True — all stages always reflect the latest deployment automatically","False — a deployment must be explicitly associated with (deployed to) a specific stage; other stages continue serving their own last-deployed snapshot until separately redeployed","True, but only for HTTP APIs","False, because stages cannot be redeployed once created"],a:[1],e:"A deployment must be explicitly deployed to a given stage; other stages are unaffected until separately redeployed."},
{q:"A company wants API consumers to call their API at 'api.example.com' instead of the default 'execute-api' generated URL. Which API Gateway feature enables this?",o:["A usage plan","A custom domain name, backed by an ACM certificate","A stage variable","A Lambda authorizer"],a:[1],e:"A custom domain name backed by an ACM certificate provides a friendly, branded API URL."},
{q:"For an edge-optimized custom domain name on API Gateway, in which AWS Region must the associated ACM certificate be provisioned?",o:["The same Region as the API itself, always","us-east-1, regardless of the API's actual Region, because the domain is served via CloudFront","Any Region; edge-optimized domains have no certificate Region requirement","eu-west-1 specifically"],a:[1],e:"Edge-optimized domains are served via CloudFront, which requires the ACM certificate to be in us-east-1."},
{q:"For a regional custom domain name on API Gateway, in which Region must the ACM certificate be provisioned?",o:["Always us-east-1","The same Region as the API itself","Any Region, since regional domains do not use certificates","A Region chosen at random by AWS"],a:[1],e:"Regional domains require the ACM certificate to be in the same Region as the API."},
{q:"A company wants 'api.example.com/v1' to route to one API's 'prod' stage and 'api.example.com/v2' to route to a completely different API's 'prod' stage, both under the same custom domain. Which feature accomplishes this?",o:["Two separate custom domain names, since one domain cannot serve multiple paths","Base path mapping, mapping each path segment under the shared custom domain to a specific API and stage","A single stage variable shared across both APIs","A Lambda authorizer configured to route by path"],a:[1],e:"Base path mapping associates a path segment under a shared custom domain with a specific API and stage."},
{q:"Which of the following is required before a custom domain name for a REST API can be used with HTTPS?",o:["A TLS certificate issued or imported via AWS Certificate Manager","A Lambda authorizer","A usage plan with an associated API key","A WebSocket route selection expression"],a:[0],e:"An ACM-issued or imported TLS certificate is required for HTTPS on a custom domain."},
{q:"A team configures a regional custom domain but mistakenly requests the ACM certificate in us-east-1 while their API and domain are both intended to be regional in eu-west-1. What is the most likely outcome?",o:["It works fine; regional domains accept certificates from any Region","The domain mapping will fail or be unusable, because a regional custom domain's certificate must be provisioned in the same Region as the API","API Gateway automatically relocates the certificate to the correct Region","This only affects WebSocket APIs, not REST APIs"],a:[1],e:"A regional domain's certificate must match the API's own Region; a mismatched Region breaks the mapping."},
{q:"What is the primary functional difference between an edge-optimized and a regional API Gateway custom domain?",o:["Edge-optimized domains are served through CloudFront's global edge network for reduced latency to geographically distributed clients, while regional domains are served directly from the API's Region","Regional domains do not support HTTPS","Edge-optimized domains cannot use base path mapping","There is no functional difference between the two"],a:[0],e:"Edge-optimized domains route through CloudFront's edge network; regional domains serve directly from the API's Region."},
{q:"Which of the following statements about base path mappings is accurate?",o:["A base path mapping can only ever point to the same API it was originally created for","A base path mapping associates a path under a custom domain with a specific combination of an API and one of its stages","Base path mappings eliminate the need for stages entirely","Base path mappings are exclusive to WebSocket APIs"],a:[1],e:"A base path mapping ties a custom domain path to a specific API and one of its stages."},
{q:"A company wants to allow only specific IAM users and roles — including some belonging to a separate, trusted AWS account — to invoke their REST API, with each caller cryptographically signing their requests using their own AWS credentials. Which authorization mechanism fits this requirement?",o:["API key authorization","IAM authorization (SigV4), combined with a resource policy allowing the trusted account's principals","CORS configuration","A stage variable restricting access"],a:[1],e:"IAM authorization (SigV4) combined with a resource policy allowing the trusted account's principals is the correct mechanism."},
{q:"A mobile app authenticates end users via a Cognito User Pool and wants API Gateway to validate the resulting JWT on every API call without writing any custom authorization Lambda code. Which authorizer type should be configured on the API's methods?",o:["A Lambda (custom) authorizer","A Cognito User Pool authorizer","IAM authorization","A resource policy alone, with no authorizer"],a:[1],e:"A Cognito User Pool authorizer natively validates the JWT with no custom Lambda code required."},
{q:"A company needs custom authorization logic validating a third-party-issued JWT with proprietary claims that neither IAM nor Cognito authorizers natively understand. Which authorizer type is designed for this kind of bespoke logic?",o:["A Lambda (custom) authorizer","A Cognito User Pool authorizer","A resource policy","A usage plan"],a:[0],e:"A Lambda (custom) authorizer is designed for bespoke logic like validating a proprietary third-party JWT."},
{q:"Which of the following best distinguishes a TOKEN-type Lambda authorizer from a REQUEST-type Lambda authorizer?",o:["TOKEN-type receives only a bearer token from a specified header; REQUEST-type receives the full request context, including headers, query string parameters, path parameters, and source IP","TOKEN-type receives the full request; REQUEST-type receives only a token","TOKEN-type cannot return an IAM policy document; only REQUEST-type can","There is no functional difference between the two types"],a:[0],e:"TOKEN type gets only the bearer token; REQUEST type gets the full request context."},
{q:"A Lambda authorizer's authorization decision needs to depend on both a bearer token AND a custom header plus the caller's source IP address. Which Lambda authorizer type should be used?",o:["TOKEN type, since it can access all request data by default","REQUEST type, since it receives the full request context needed for this decision","Neither type can access source IP under any circumstance","A Cognito User Pool authorizer, since only it can inspect source IP"],a:[1],e:"REQUEST type is needed since the decision depends on more than just the token (custom header, source IP)."},
{q:"What must a Lambda authorizer function return to allow or deny a request?",o:["A plain HTTP status code only","An IAM policy document (Allow/Deny) for the requested resource, optionally with additional context passed to the backend","A JWT token that API Gateway re-validates","Nothing; Lambda authorizers only log requests and cannot deny them"],a:[1],e:"A Lambda authorizer must return an IAM policy document (Allow/Deny), optionally with extra context."},
{q:"A company notices their Lambda authorizer is being invoked on every single API request, adding latency and cost, even though most callers reuse the same token repeatedly within a short window. Which built-in feature reduces this overhead?",o:["Authorizer result caching, keyed by the identity source, with a configurable TTL","Switching to a Mock integration","Removing the authorizer entirely","Enabling response caching for GET methods"],a:[0],e:"Authorizer result caching (keyed by identity source, with a TTL) avoids invoking the authorizer on every request."},
{q:"What is the maximum commonly configurable authorizer cache TTL for a Lambda authorizer's decision, and what does exceeding real-world token validity risk?",o:["There is no cache available for Lambda authorizers under any configuration","Up to 3600 seconds (1 hour), configurable; setting it too high risks continuing to authorize a request after the underlying token/permissions should have expired or been revoked","Exactly 24 hours with no configurability","The cache only applies to Cognito User Pool authorizers, never Lambda authorizers"],a:[1],e:"The cache TTL is configurable up to 3600 seconds; setting it too high risks stale authorization decisions outliving real permission changes."},
{q:"A company's official use case (drawn from AWS's own published sample question) is to allow only IAM principals from a separate AWS account to invoke specific methods on their REST API. Which two actions, taken together, correctly satisfy this requirement?",o:["Attach a resource policy to the API allowing the external account's IAM principal to call execute-api:Invoke on the relevant resource","Attach an IAM permission policy to the calling IAM users/roles in the external account, granting execute-api:Invoke, and sign requests with SigV4","Configure a Cognito User Pool in the external account only","Configure CORS to allow the external account's domain","Purchase an API key for the external account"],a:[0,1],multi:true,e:"A resource policy allowing the external principal, plus a permission policy and SigV4 signing on the caller's side, together satisfy cross-account IAM access — mirroring AWS's own official sample question."},
{q:"Why is a resource policy alone, without any permission policy on the calling IAM identity, insufficient to grant a caller access to an IAM-authorized API?",o:["Resource policies are purely cosmetic and have no actual effect","IAM authorization is evaluated using both the resource policy (on the API) and the caller's own identity-based permission policy; both must independently allow the action for cross-account access to succeed","Resource policies can only be attached to S3 buckets, never to APIs","A resource policy automatically grants full access regardless of the caller's own IAM policy"],a:[1],e:"Both the resource policy and the caller's identity-based policy must independently allow the action for cross-account IAM authorization to succeed."},
{q:"A company wants to restrict API invocation so that only requests originating from a specific VPC endpoint are allowed, regardless of the caller's IAM identity. Which API Gateway feature supports this kind of network-origin-based restriction?",o:["A resource policy with a condition restricting the source VPC endpoint","A usage plan","CORS configuration","A stage variable"],a:[0],e:"A resource policy with a source VPC endpoint condition restricts invocation by network origin regardless of IAM identity."},
{q:"Which of the following is an accurate statement about API keys and their role in API Gateway security?",o:["API keys authenticate the caller's identity and should be used as the primary authorization mechanism for sensitive operations","API keys identify a caller for usage plan throttling/quota and metering purposes only; they are not an authentication or authorization mechanism","API keys are cryptographically signed using SigV4, just like IAM credentials","API keys replace the need for HTTPS"],a:[1],e:"API keys identify a caller for usage plan metering/throttling only, not authentication or authorization."},
{q:"A company mistakenly believes that requiring an API key on a method is sufficient to secure it against unauthorized access. What is the flaw in this approach?",o:["There is no flaw; API keys are a complete security solution","API keys only identify the caller for metering/throttling; anyone possessing a valid key can call the method, and API keys provide no cryptographic proof of identity the way IAM SigV4 signing or a validated JWT does","API keys automatically expire after every single request, making them inherently secure","API keys cannot be used alongside any other authorization mechanism"],a:[1],e:"An API key provides no cryptographic identity proof; anyone holding the key can call the method, unlike SigV4 or a validated JWT."},
{q:"Which authorizer type would be the best fit for a scenario requiring zero custom code, where end users already authenticate through a fully AWS-managed user directory and receive a token to present on each API call?",o:["A Cognito User Pool authorizer","A Lambda TOKEN authorizer written from scratch","A resource policy alone","A usage plan"],a:[0],e:"A Cognito User Pool authorizer requires no custom code when using AWS's own managed user directory."},
{q:"A REST API method requires IAM authorization. A developer testing the API with a valid Cognito User Pool JWT in the Authorization header receives a 403 Forbidden. What is the most likely explanation?",o:["The method expects a SigV4-signed request using IAM credentials, not a Cognito JWT — a JWT is not valid for IAM-authorized methods","The Lambda function is misconfigured","The API key is missing","The custom domain is misconfigured"],a:[0],e:"IAM-authorized methods require SigV4-signed requests, not a Cognito-issued JWT, causing a 403 when a JWT is presented instead."},
{q:"Which two of the following statements about Lambda authorizers are accurate?",o:["A Lambda authorizer can return additional context values that are passed through to the backend integration","A Lambda authorizer's decision can be cached to avoid invoking it on every request","Lambda authorizers can only be used with HTTP APIs, never REST APIs","Lambda authorizers cannot access query string parameters under any configuration","A Lambda authorizer always bypasses IAM policy evaluation entirely"],a:[0,1],multi:true,e:"Lambda authorizers can pass extra context to the backend and support caching their decision."},
{q:"A company's REST API needs to support two different classes of caller on the same set of endpoints: internal services calling with IAM-signed requests, and end users calling with Cognito-issued JWTs. Which approach is generally required in API Gateway to support both authorization schemes?",o:["API Gateway allows only a single authorizer per method, so the team typically configures separate methods/resources per auth type, or uses a Lambda authorizer implementing custom logic to branch on the credential type presented","This is impossible with any AWS service","IAM authorization automatically also validates Cognito JWTs","A single resource policy handles both cases with no additional configuration"],a:[0],e:"API Gateway ties one authorizer per method, so mixed auth schemes typically require separate methods/resources or custom Lambda authorizer branching logic."},
{q:"What does the \"identity source\" configuration on a Lambda authorizer define?",o:["The IAM role the Lambda function assumes","The specific request element (e.g., a header, or a combination of parameters) API Gateway extracts and uses both to invoke the authorizer and as the cache key","The Region the authorizer Lambda function runs in","The DynamoDB table storing authorization decisions"],a:[1],e:"The identity source defines which request element is extracted for invoking the authorizer and used as the cache key."},
{q:"Which statement correctly describes how a resource policy and an identity-based (permission) policy interact for an IAM-authorized API call?",o:["Only the resource policy needs to allow the action; the identity-based policy is irrelevant","Only the identity-based policy needs to allow the action; the resource policy is irrelevant","Both the resource policy (attached to the API) and the identity-based policy (attached to the caller) must permit the action for the request to succeed","Neither policy has any bearing on IAM-authorized API calls"],a:[2],e:"Both the resource policy and the caller's identity-based policy must permit the action for an IAM-authorized call to succeed."},
{q:"A Lambda REQUEST-type authorizer needs to make its authorization decision based on a custom header called 'x-tenant-id' as well as the request's query string. Which authorizer type correctly supports reading both of these?",o:["TOKEN type only","REQUEST type, since it receives the full request context including headers and query string parameters","Neither type can read custom headers","Only a Cognito User Pool authorizer can read custom headers"],a:[1],e:"REQUEST-type authorizers receive the full request context, including custom headers and query string parameters."},
{q:"Why might a company choose IAM authorization with a resource policy over a Lambda authorizer for controlling access to internal, service-to-service API calls within their own AWS environment?",o:["IAM authorization leverages existing AWS credentials and policies without requiring any custom authorization code to write, test, or maintain","IAM authorization is the only mechanism capable of using SigV4 signing","Lambda authorizers cannot be used for service-to-service calls under any circumstance","IAM authorization is always faster than a cached Lambda authorizer decision"],a:[0],e:"IAM authorization reuses existing AWS credentials/policies, avoiding custom authorization code entirely."},
{q:"A team configures a Lambda TOKEN authorizer but the client sends the bearer token in a custom header named 'x-auth-token' rather than the standard 'Authorization' header. What must be configured for the authorizer to correctly locate the token?",o:["Nothing; TOKEN authorizers always default to reading only the 'Authorization' header with no override","The authorizer's identity source must be configured to point at the 'x-auth-token' header instead of the default","The client must switch to a REQUEST-type flow automatically","This configuration is not possible under any circumstance"],a:[1],e:"The authorizer's identity source must be reconfigured to point at the custom header instead of the default Authorization header."},
{q:"What language is used to write API Gateway mapping templates for non-proxy integrations?",o:["Python","VTL (Velocity Template Language)","YAML","GraphQL SDL"],a:[1],e:"VTL (Velocity Template Language) is used for API Gateway's non-proxy mapping templates."},
{q:"A REST API method needs to reject any incoming request missing a required 'orderId' query string parameter, before the request reaches the backend at all. Which API Gateway feature accomplishes this?",o:["A mapping template alone, with no other configuration","Request validation, configured to require specific request parameters","A usage plan quota","A stage variable"],a:[1],e:"Request validation configured to require specific parameters rejects requests missing them before the backend is invoked."},
{q:"In addition to validating required parameters, what else can API Gateway's request validation check against a defined model?",o:["Whether the request body conforms to a JSON Schema model","Whether the caller's AWS account has sufficient billing credit","Whether the Lambda function's code has any syntax errors","Whether the response will be cached"],a:[0],e:"Request validation can also check the request body against a defined JSON Schema model."},
{q:"What is a key operational benefit of rejecting malformed requests via request validation before they reach a Lambda-backed integration?",o:["It removes the need for any authorizer","It avoids unnecessary Lambda invocations (and their associated cost and latency) for requests that would fail anyway","It automatically fixes the malformed request and forwards a corrected version","It disables logging for invalid requests"],a:[1],e:"Rejecting malformed requests early avoids unnecessary Lambda invocation cost and latency."},
{q:"A response mapping template is used in a non-proxy integration to transform a DynamoDB 'GetItem' response (which includes DynamoDB's native attribute-value type wrappers like '{\"S\": \"value\"}') into a clean, simplified JSON object for the client. What is this process an example of?",o:["Request validation","Response transformation via a mapping template","A resource policy","A usage plan"],a:[1],e:"Reshaping a backend's raw response into a client-friendly format via a mapping template is response transformation."},
{q:"Which of the following is true about request validation support across API Gateway API types?",o:["REST APIs support full request validation against models; HTTP APIs have limited or no equivalent support","HTTP APIs have more advanced request validation than REST APIs","Neither API type supports any form of request validation","Request validation is exclusive to WebSocket APIs"],a:[0],e:"REST APIs support full model-based request validation; HTTP APIs have limited or no equivalent."},
{q:"A mapping template references '$input.path('$.item')' to extract a specific field from an incoming JSON request body. What is this syntax part of?",o:["A Cognito User Pool schema","VTL mapping template syntax used to access parts of the incoming request within API Gateway","A Lambda proxy integration's automatic parsing (no template needed)","A CORS configuration directive"],a:[1],e:"'$input.path(...)' is VTL mapping template syntax for extracting values from the incoming request."},
{q:"Which of the following integration types typically do NOT use VTL mapping templates at all?",o:["AWS service integration","Lambda custom (non-proxy) integration","Lambda proxy integration","HTTP non-proxy integration"],a:[2],e:"Lambda proxy integration passes the request/response through directly and does not use VTL mapping templates."},
{q:"A team wants API Gateway to transform an incoming client request body's field names (e.g., renaming 'customer_name' to 'customerName') before forwarding to a Lambda function using a non-proxy integration. Which mechanism accomplishes this transformation?",o:["A request mapping template written in VTL","A usage plan","A resource policy","A stage variable"],a:[0],e:"A request mapping template written in VTL can rename/restructure fields before forwarding to the backend."},
{q:"What happens to a request that fails API Gateway's configured request validation (e.g., missing a required parameter)?",o:["It is forwarded to the backend anyway, with a warning logged","API Gateway rejects the request immediately with an error response, without invoking the backend integration","It is queued and retried indefinitely","It is silently dropped with no response sent to the client"],a:[1],e:"A request failing validation is rejected immediately by API Gateway without invoking the backend."},
{q:"Which of the following correctly describes the two-part structure typically used for transforming data in a non-proxy integration?",o:["A request mapping template shapes what the backend receives; a response mapping template shapes what the client receives back","Only a single combined mapping template exists, shaping both directions simultaneously with no distinction","Mapping templates only apply to the request direction; responses are always passed through unmodified","Mapping templates are exclusively used for authorization decisions"],a:[0],e:"A request mapping template shapes the backend-bound data; a response mapping template shapes the client-bound data."},
{q:"A company's Lambda proxy integration receives malformed input because there is no request validation configured, resulting in unnecessary Lambda invocations for garbage requests. Which change most directly reduces this waste, keeping the proxy integration but reducing invalid invocations?",o:["Switching to a WebSocket API","Enabling API Gateway request validation (required parameters and/or a body model) so invalid requests are rejected before Lambda is invoked","Removing the Lambda function entirely","Adding a resource policy allowing all traffic"],a:[1],e:"Enabling request validation filters out malformed requests before they trigger unnecessary Lambda invocations."},
{q:"A company wants to give a specific partner a maximum of 1,000 requests per day against their API, with a burst limit of 50 requests per second, tracked separately from other callers. Which API Gateway feature combination achieves this?",o:["A resource policy alone","A usage plan with a quota (1,000/day) and throttle limits (burst 50 rps), associated with an API key issued to that partner","A Cognito User Pool with a custom attribute","A stage variable set to the partner's identifier"],a:[1],e:"A usage plan with a defined quota and throttle limits, tied to an API key, enforces exactly this per-partner limit."},
{q:"What is the purpose of requiring an API key on a specific method, separate from any authorizer configured on that same method?",o:["The API key replaces the need for any authorization entirely","The API key associates the request with a specific usage plan for throttling/quota enforcement and usage metering, while authorization (if configured) is handled independently by an authorizer","The API key encrypts the request body","The API key is only relevant for WebSocket APIs"],a:[1],e:"The API key associates the request with a usage plan for throttling/quota/metering, separate from any authorizer's authentication role."},
{q:"Which of the following throttle limit levels can be configured within API Gateway?",o:["Only a single Region-wide default; no finer-grained control exists","Account-level default limits, with the ability to override at the stage or individual method level","Only per-API-key limits, with no stage or method-level control","Throttling can only be configured through a separate AWS WAF rule, never natively"],a:[1],e:"Throttle limits can be set at the account-level default and overridden at the stage or method level."},
{q:"A request arrives with a missing or invalid API key on a method configured to require one, associated with a usage plan. What is the expected result?",o:["The request succeeds normally since usage plans are advisory only","The request is rejected, since a valid API key tied to an active usage plan is required for that method","The request is automatically retried with a temporary key","The request bypasses throttling entirely"],a:[1],e:"A missing/invalid required API key causes the request to be rejected under a method requiring one."},
{q:"Which two of the following statements about usage plans and API keys are accurate?",o:["A usage plan can be associated with multiple API keys, each representing a different caller","API keys alone, without an associated usage plan, are the primary authentication mechanism recommended for production APIs","A usage plan can define both a request quota (e.g., per day/month) and throttle limits (steady-state rate and burst)","Usage plans automatically provide encryption at rest for the API's data","API keys cryptographically sign each request using the caller's private key"],a:[0,2],multi:true,e:"A usage plan can have multiple associated API keys, and it can define both quota and throttle limits."},
{q:"A team wants different throttle limits for their 'GET /orders' method versus their 'POST /orders' method on the same API stage. Is this level of granularity supported?",o:["No, all methods on a stage must share identical throttle settings","Yes, API Gateway supports throttle limit overrides at the individual method level, in addition to stage-level and account-level defaults","Only if each method is on a separate API entirely","Only for HTTP APIs, never REST APIs"],a:[1],e:"API Gateway supports throttle overrides at the individual method level beyond stage/account defaults."},
{q:"Why would a company use a usage plan and API keys even though the API also uses a Cognito User Pool authorizer for authentication?",o:["Usage plans and authorizers are mutually exclusive; only one can be configured","Authorizers handle who is allowed to call the API, while usage plans/API keys separately handle metering and throttling per caller tier (e.g., free tier vs. paid tier) — the two serve complementary purposes","Usage plans replace the need for the Cognito authorizer entirely","API keys automatically become the JWT used by the Cognito authorizer"],a:[1],e:"Authorizers control who may call the API; usage plans/API keys separately control metering and throttling tiers — complementary, not redundant."},
{q:"A burst of traffic exceeds the account-level default steady-state throttle limit for a Region. What is the typical behavior?",o:["API Gateway silently processes all requests regardless of the limit","API Gateway begins returning 429 Too Many Requests responses for requests exceeding the throttle limit","API Gateway automatically and permanently raises the account limit","API Gateway shuts down the API entirely until the next billing cycle"],a:[1],e:"Exceeding the throttle limit results in 429 Too Many Requests responses for the excess requests."},
{q:"Which of the following is the correct association order/model for enforcing per-partner API usage limits?",o:["API key → associated with a usage plan → usage plan associated with specific API stages","Usage plan → associated with a resource policy → resource policy associated with a Lambda function","Stage variable → associated with an IAM role → IAM role associated with a Cognito pool","Mapping template → associated with a WebSocket route"],a:[0],e:"The correct model is API key → usage plan → usage plan applied to specific API stages."},
{q:"A developer wants to track and limit usage per external customer without requiring those customers to have AWS IAM credentials or Cognito accounts. Which mechanism best fits this need?",o:["IAM authorization with a resource policy per customer","API keys, each issued per customer, tied to individual usage plans","A Cognito User Pool per customer","A Lambda authorizer requiring AWS SigV4"],a:[1],e:"API keys tied to individual usage plans let you track/limit usage per external customer without requiring IAM or Cognito identities for them."},
{q:"A single-page web application hosted at 'https://app.example.com' calls an API hosted at 'https://api.example.com' directly from browser JavaScript, and the request fails in the browser console with a CORS-related error even though the server-side logs show the request was processed successfully. What does this indicate?",o:["The backend logic failed silently","The browser blocked the response from being used by the page's JavaScript because the API's response did not include the required CORS headers, even though the request itself was actually processed","The API key was invalid","The custom domain's certificate expired"],a:[1],e:"CORS is a browser-side restriction; the request may have succeeded server-side while the browser still blocks the response from JS."},
{q:"Which HTTP method does a browser typically send first, as a \"preflight\" check, before making a cross-origin request with custom headers or certain content types?",o:["GET","OPTIONS","PATCH","TRACE"],a:[1],e:"Browsers send an OPTIONS preflight request before certain cross-origin requests."},
{q:"On a REST API, which integration type is commonly used to handle the CORS preflight 'OPTIONS' request without invoking any backend logic?",o:["Lambda proxy integration","Mock integration, configured to return the appropriate Access-Control-Allow-* headers","AWS service integration","HTTP proxy integration"],a:[1],e:"A Mock integration is the standard way to answer OPTIONS preflight requests with the needed CORS headers."},
{q:"A REST API method uses a Lambda proxy integration. The team enables \"CORS\" via the API Gateway console wizard, but browser calls to this specific method still fail with a CORS error, even though the 'OPTIONS' preflight now succeeds. What is the most likely cause?",o:["The console wizard does not modify what the actual Lambda function returns; the Lambda function's own response must also include the CORS headers, since proxy integration passes the function's response straight through","The wrong AWS Region was selected","CORS cannot be resolved for proxy integrations under any configuration","The custom domain must be removed"],a:[0],e:"In proxy integration, the Lambda function's own response must include CORS headers; the console wizard alone doesn't inject them into the function's output."},
{q:"Which of the following headers is essential in a CORS response to indicate which origins are permitted to access the resource?",o:["X-Amz-Date","Access-Control-Allow-Origin","Content-Type","X-Forwarded-For"],a:[1],e:"Access-Control-Allow-Origin specifies which origins are permitted to access the response."},
{q:"How does CORS configuration differ between REST APIs and HTTP APIs in API Gateway?",o:["REST APIs require manually creating/configuring an OPTIONS method and headers (or using the console wizard); HTTP APIs offer a simpler, built-in CORS configuration block on the API itself","HTTP APIs do not support CORS at all","REST APIs automatically handle CORS with zero configuration","There is no difference; both are configured identically"],a:[0],e:"REST APIs require manual/wizard-based OPTIONS + header configuration; HTTP APIs offer a simpler built-in CORS block."},
{q:"Is CORS a server-side security control that prevents unauthorized backend access, or a browser-enforced restriction?",o:["It is a server-side authorization control equivalent to IAM","It is a browser-enforced restriction on cross-origin JavaScript access to responses; it does not prevent a request from reaching or being processed by the backend","It is enforced exclusively by API Gateway's authorizers","It has no relationship to browsers at all and applies only to server-to-server calls"],a:[1],e:"CORS is enforced by browsers to restrict cross-origin JS access to responses; it doesn't block the backend from processing the request."},
{q:"Which two of the following statements about CORS in API Gateway are accurate?",o:["A Lambda proxy integration's response must itself include CORS headers, since API Gateway does not inject them automatically into the function's output","CORS preflight requests are commonly satisfied using a Mock integration on the OPTIONS method","CORS is enforced by API Gateway's authorizer layer, not by browsers","Enabling CORS automatically disables all authorizers on the resource","CORS has no bearing on browser-based JavaScript API calls"],a:[0,1],multi:true,e:"Proxy integration responses must include their own CORS headers, and Mock integrations commonly satisfy OPTIONS preflight requests."},
{q:"A company is building a real-time multiplayer game backend requiring persistent, full-duplex connections where the server can push state updates to clients at any time without the client polling. Which API Gateway API type is designed for this?",o:["REST API","HTTP API","WebSocket API","A REST API with long-polling configured"],a:[2],e:"WebSocket APIs support persistent, full-duplex, server-push-capable connections."},
{q:"In a WebSocket API, which special route fires when a client first establishes a connection, commonly used to authorize the connection and store its connection ID?",o:["$default","$connect","$disconnect","$init"],a:[1],e:"The $connect route fires when a client establishes a new WebSocket connection."},
{q:"Which special WebSocket API route handles incoming messages that do not match any other defined route?",o:["$connect","$disconnect","$default","$catch-all"],a:[2],e:"The $default route handles messages that don't match any other defined route."},
{q:"What determines which backend integration handles an incoming WebSocket message, when the message body can represent different types of actions?",o:["The client's IP address exclusively","The route selection expression, which extracts a value (e.g., from a field in the message body) to select the matching route","The stage variable of the API automatically","WebSocket APIs cannot route different message types differently"],a:[1],e:"The route selection expression extracts a value from the message to determine which route/integration handles it."},
{q:"A backend Lambda function needs to push a message to a specific, already-connected WebSocket client from outside the normal request/response flow (e.g., in response to a database change). Which mechanism does it use to deliver that message?",o:["A standard HTTP GET request to the client's IP address","The API Gateway Management API's PostToConnection action, referencing the stored connection ID","A Lambda authorizer","A stage variable update"],a:[1],e:"PostToConnection on the API Gateway Management API delivers a message to a specific stored connection ID."},
{q:"Why do WebSocket API implementations commonly store active connection IDs in a persistent store such as DynamoDB?",o:["DynamoDB is required by AWS for all WebSocket APIs with no alternative","Connection IDs must be tracked somewhere so a backend process can later target specific connected clients for server-initiated pushes, since the WebSocket connection itself is stateful and ephemeral per Lambda invocation","DynamoDB automatically becomes the WebSocket transport layer","This step is unnecessary; API Gateway retains this mapping without any application-level storage"],a:[1],e:"Connection IDs must be persisted somewhere (e.g., DynamoDB) so a separate backend process can target specific clients later."},
{q:"Which route fires when a WebSocket client's connection is closed, commonly used to clean up stored connection state?",o:["$connect","$disconnect","$default","$close"],a:[1],e:"The $disconnect route fires when a connection closes, commonly used for cleanup."},
{q:"A team is deciding between a raw WebSocket API and AWS AppSync for a real-time feature. Which factor would most directly favor choosing AppSync instead of hand-building a WebSocket API?",o:["The data and events are naturally GraphQL-shaped, and the team wants connection tracking and subscription fan-out managed automatically rather than building a DynamoDB connections table and PostToConnection logic themselves","The team needs a completely custom, non-GraphQL binary protocol with no schema","AppSync does not support any form of real-time push","WebSocket APIs are always cheaper and simpler than AppSync in every scenario"],a:[0],e:"GraphQL-shaped data plus a desire to avoid building connection tracking/fan-out favors AppSync over a raw WebSocket API."},
{q:"What fundamental difference distinguishes a GraphQL API (such as AppSync) from a typical REST API in terms of client data fetching?",o:["GraphQL clients specify exactly which fields they want in a single query, avoiding the over-fetching and under-fetching common with fixed-shape REST endpoints","GraphQL APIs can only return XML, never JSON","GraphQL APIs require a separate endpoint for every possible field combination, just like REST","There is no meaningful difference between GraphQL and REST for client data fetching"],a:[0],e:"GraphQL clients request exactly the fields they need, avoiding REST's over-fetching/under-fetching."},
{q:"In an AppSync GraphQL schema, which type defines the operations used to read data?",o:["Mutation","Query","Subscription","Directive"],a:[1],e:"Query defines read operations in a GraphQL schema."},
{q:"Which AppSync schema type defines operations used to write or modify data?",o:["Query","Mutation","Subscription","Interface"],a:[1],e:"Mutation defines write/modify operations in a GraphQL schema."},
{q:"Which AppSync schema type defines real-time, push-based operations that notify subscribed clients when specified events occur?",o:["Query","Mutation","Subscription","Fragment"],a:[2],e:"Subscription defines real-time, push-based operations for subscribed clients."},
{q:"What is the role of an AppSync resolver?",o:["It defines how a specific schema field is fulfilled by connecting the GraphQL operation to a configured data source","It exclusively handles user authentication with no relation to data fetching","It replaces the schema entirely","It is only used for real-time subscriptions, never for queries or mutations"],a:[0],e:"A resolver connects a schema field to a data source, defining how that field's data is fetched or written."},
{q:"Which of the following is a valid AppSync data source type?",o:["DynamoDB","Lambda","An HTTP endpoint","All of the above are valid AppSync data source types"],a:[3],e:"DynamoDB, Lambda, and HTTP endpoints are all valid AppSync data source types (along with relational databases and OpenSearch)."},
{q:"What are the two primary implementation styles available for writing AppSync resolvers?",o:["Python and Node.js runtime resolvers","VTL (Velocity Template Language) mapping templates and JavaScript (APPSYNC_JS) resolvers","YAML-based and XML-based resolvers","SQL and NoSQL resolvers"],a:[1],e:"VTL mapping templates and JavaScript (APPSYNC_JS) are the two resolver implementation styles."},
{q:"In a JavaScript (APPSYNC_JS) resolver, which two functions are typically exported to define the resolver's behavior?",o:["init() and destroy()","request() and response()","query() and mutate()","connect() and disconnect()"],a:[1],e:"request() and response() are the two functions exported by a JavaScript AppSync resolver."},
{q:"A resolver needs to perform several sequential operations for a single GraphQL field — first validating input, then writing to DynamoDB, then triggering a notification. Which AppSync resolver capability supports chaining multiple functions together for one field?",o:["A pipeline resolver","A Mock integration","A stage variable","A base path mapping"],a:[0],e:"A pipeline resolver chains multiple functions together to fulfill a single GraphQL field."},
{q:"Which AppSync data source would be most appropriate for querying an Aurora Serverless relational database from a GraphQL field?",o:["The DynamoDB data source","The relational database data source, using the RDS Data API","The HTTP data source only","The None (local) data source"],a:[1],e:"The relational database data source, using the RDS Data API, is designed for querying Aurora Serverless."},
{q:"How does an AppSync subscription typically notify a connected client when a relevant mutation occurs?",o:["The client must poll the API repeatedly to check for changes","AppSync automatically pushes the update to subscribed clients over a WebSocket connection it manages, without the client needing to poll","The client must manually open a separate REST API connection","Subscriptions require the client to re-authenticate before every notification"],a:[1],e:"AppSync manages the WebSocket transport and automatically pushes updates to subscribed clients without client polling."},
{q:"Which schema directive commonly links a Subscription field to the Mutation(s) that should trigger it in AppSync?",o:["@aws_subscribe","@connect","@aws_auth","@mock"],a:[0],e:"The @aws_subscribe directive links a Subscription field to the Mutation(s) that trigger it."},
{q:"What operational burden does AppSync remove, compared to implementing equivalent real-time functionality on a raw WebSocket API?",o:["AppSync removes the need for any backend data source whatsoever","AppSync manages the underlying WebSocket transport, connection tracking, and fan-out to subscribed clients automatically, rather than requiring the team to build a connections table and manual push logic","AppSync removes the need for a schema","AppSync removes the need for any authorization configuration"],a:[1],e:"AppSync manages connection tracking and fan-out automatically, unlike a hand-built WebSocket API."},
{q:"Which AWS Amplify feature works alongside AppSync to support offline-first mobile/web applications that read and write data locally without connectivity, syncing later?",o:["Amplify DataStore","Amplify Console only","AWS CodeArtifact","AWS Cloud9"],a:[0],e:"AWS Amplify DataStore supports offline-first local reads/writes that sync with AppSync later."},
{q:"In AppSync's conflict resolution for offline sync, which strategy uses a version field (e.g., '_version') to reject writes based on stale data?",o:["Auto Merge","Optimistic Concurrency","Lambda-based custom resolution","Eventual Consistency Override"],a:[1],e:"Optimistic Concurrency uses a version field (e.g., _version) to reject stale writes."},
{q:"Which AppSync conflict resolution strategy allows a custom Lambda function to implement business-specific logic for resolving conflicting offline/online writes?",o:["Auto Merge","Optimistic Concurrency only","Lambda-based custom resolution","None; Lambda cannot be used for conflict resolution"],a:[2],e:"Lambda-based custom resolution allows arbitrary business logic for handling conflicts."},
{q:"Which of the following authorization modes can be configured for an AppSync API?",o:["API key","IAM","Amazon Cognito User Pools and OpenID Connect (OIDC)","All of the above are valid AppSync authorization modes"],a:[3],e:"API key, IAM, Cognito User Pools, and OIDC are all valid AppSync authorization modes."},
{q:"Can an AppSync API be configured with more than one authorization mode simultaneously (e.g., API key for public reads and Cognito for authenticated mutations)?",o:["No, only a single authorization mode may ever be configured per API","Yes, AppSync supports a primary authorization mode plus additional authorization modes, with schema directives controlling which fields/types use which mode","Only if the API has no schema defined","Only for Lambda data sources"],a:[1],e:"AppSync supports a primary auth mode plus additional auth modes, controlled via schema directives."},
{q:"A public marketing website needs read-only, unauthenticated access to a subset of AppSync data with no user sign-in required, while authenticated mutations require a logged-in user. Which authorization mode is best suited for the public read-only portion?",o:["IAM","API key","OIDC exclusively","Cognito User Pools exclusively, with no anonymous access option"],a:[1],e:"API key access is well suited for simple, unauthenticated public read access with no user sign-in."},
{q:"Which two of the following are accurate statements about AWS AppSync?",o:["AppSync resolvers can be implemented using either VTL mapping templates or JavaScript (APPSYNC_JS)","AppSync only supports a single hardcoded data source type: DynamoDB","AppSync subscriptions require clients to manually manage WebSocket connection IDs, identical to a raw WebSocket API","A pipeline resolver can chain multiple functions together to fulfill a single GraphQL field","AppSync cannot be combined with Cognito User Pools for authorization"],a:[0,3],multi:true,e:"Resolvers can be VTL or JS-based, and pipeline resolvers chain multiple functions for one field."},
{q:"A company wants a Lambda data source in AppSync to implement complex business logic that spans multiple backend calls (e.g., checking inventory, then charging a payment provider, then writing an order) for a single 'Mutation.placeOrder' field. Why is a Lambda data source well suited here compared to a direct DynamoDB data source?",o:["Lambda data sources cannot be used for mutations, only queries","A Lambda data source allows arbitrary custom code and multiple downstream calls within a single resolver invocation, versus a direct DynamoDB resolver limited to a single table operation","DynamoDB data sources are always faster for this exact use case","Lambda data sources bypass the schema entirely"],a:[1],e:"A Lambda data source supports arbitrary custom code and multiple downstream calls in one resolver, unlike a single-table DynamoDB resolver."},
{q:"Which of the following is the most accurate summary comparison between choosing AppSync versus API Gateway (REST/HTTP) for a new API?",o:["AppSync is strictly superior in every scenario and should always be chosen over API Gateway","AppSync fits naturally when clients need flexible, field-level queries and/or built-in real-time subscriptions over a GraphQL schema; API Gateway fits naturally for traditional REST-style request/response APIs, especially when usage plans, resource policies, or private VPC access are required","API Gateway cannot integrate with Lambda, unlike AppSync","AppSync cannot use IAM authorization, unlike API Gateway"],a:[1],e:"AppSync suits flexible field-level GraphQL queries and built-in subscriptions; API Gateway suits traditional REST needs like usage plans, resource policies, and private access."},
{q:"A company's security review of their REST API finds: IMDSv1-style long-lived credentials are not applicable here, but the API currently has no resource policy restricting callers, uses only an API key (no authorizer) on a sensitive 'DELETE /accounts/{id}' method, and has CORS wide open to '*' including credentials. Which combination of fixes most directly addresses the actual security gaps?",o:["Add an IAM or Cognito authorizer to the sensitive method (since an API key alone isn't authentication), add a resource policy scoping allowed callers, and tighten the CORS origin configuration instead of allowing '*' with credentials","Only fix the CORS configuration; the other two findings are not real risks","Remove the API key entirely and add nothing else","Add a stage variable to encrypt the request"],a:[0],e:"Adding a real authorizer, a resource policy, and tightening CORS together address the three actual gaps described."},
{q:"A retail company needs three things from their API layer: (1) a public REST API with usage plans limiting free-tier partners to 100 requests/day, (2) internal service-to-service calls authorized via IAM/SigV4 with a resource policy scoping which internal accounts can call it, and (3) a real-time order-status feed pushed to the customer's mobile app the instant status changes. Which combination of AWS services/features satisfies all three needs?",o:["A single WebSocket API handling all three requirements identically","A REST API with a usage plan/API keys for partners and IAM authorization plus a resource policy for internal calls, combined with AppSync (or a WebSocket API) for the real-time order-status subscription feed","AppSync alone, since it can enforce usage plans identically to API Gateway","A Lambda function with no API Gateway or AppSync involved at all"],a:[1],e:"REST API with usage plans/API keys and IAM+resource policy for internal calls, plus AppSync or a WebSocket API for real-time push, covers all three needs."},

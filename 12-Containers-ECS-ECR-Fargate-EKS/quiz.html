{q:"A platform team runs one steady-state, high-density service and one highly bursty, unpredictable service on the same ECS cluster, and wants each to use the most cost-appropriate capacity model without operating two separate clusters. Which two approaches correctly achieve this within a single ECS cluster? (Select TWO)",o:["Configure the cluster with both an EC2 Auto Scaling group capacity provider (for the steady-state, bin-packed service) and a Fargate capacity provider (for the bursty service), assigning each service the appropriate one","Run the steady-state service on the EC2 launch type and the bursty service on Fargate, both within the same cluster","Require every service in a cluster to use the exact same launch type","Migrate the bursty service to a separate AWS account to use Fargate","Disable Application Auto Scaling entirely to simplify capacity planning"],a:[0,1],multi:true,e:"Capacity providers (or simply running each service under its appropriate launch type) let one cluster mix EC2- and Fargate-backed services."},
{q:"Consistent with the DVA-C02 exam guide's general emphasis on implementing against existing designs rather than architecting from scratch, which of the following is most likely OUT of scope for this exam regarding EKS?",o:["Recognizing what EKS is and when a team would choose it over ECS","Designing detailed Kubernetes cluster networking topology and custom controller architecture from scratch","Knowing that EKS runs the open-source Kubernetes API","Knowing that EKS supports a Fargate compute option"],a:[1],e:"Deep Kubernetes networking/controller design from scratch is out of scope; recognizing what EKS is and when to use it is in scope."},
{q:"Which two statements accurately describe how a CodeBuild project authenticates and pushes a newly built image to a private ECR repository as part of a pipeline? (Select TWO)",o:["The CodeBuild service role must have ECR push permissions, and privileged mode must typically be enabled to run the Docker daemon during the build","The build script obtains a temporary registry authentication token via aws ecr get-login-password and pipes it into docker login before pushing","ECR authentication requires a permanent, manually rotated username and password stored in the buildspec file","CodeBuild cannot interact with ECR under any configuration","The pushed image is automatically scanned by CodePipeline itself rather than ECR"],a:[0,1],multi:true,e:"The CodeBuild role needs ECR push permissions (and typically privileged mode for the Docker daemon), authenticating via get-login-password piped into docker login."},
{q:"Per the DVA-C02 exam guide's deployment domain, which two practices together represent a sound \"approved-version environment\" pattern when deploying containerized applications? (Select TWO)",o:["Deploying a specific, versioned container image tag (ideally pinned to an immutable digest or commit SHA) that has been validated and promoted through environments","Referencing that specific image tag explicitly in the task definition revision the service is updated to use, rather than relying on a mutable tag like latest","Always deploying whichever image was most recently pushed to the registry, regardless of tag","Manually editing files inside a running container to apply a fix in place","Deleting the task definition after every deployment to avoid version drift"],a:[0,1],multi:true,e:"A specific, promoted, immutable-style image tag referenced explicitly by the task definition revision is the approved-version deployment pattern."},
{q:"A company evaluating its container strategy wants: (1) the simplest possible path for a brand-new, AWS-only service with no host management, (2) continuous vulnerability rescanning for all pushed images, and (3) a path to bring an existing, portable Kubernetes-based workload from another cloud with minimal rework. Which three choices correctly satisfy these three needs, respectively? (Select THREE)",o:["ECS Fargate for the new, AWS-only, no-host-management service","ECR enhanced scanning (powered by Amazon Inspector) for continuous vulnerability rescanning","Amazon EKS for the portable, existing Kubernetes workload","The ECS EC2 launch type for the new, no-host-management service","ECR basic scanning for continuous rescanning without re-pushing images"],a:[0,1,2],multi:true,e:"Fargate fits the no-host-management new service, ECR enhanced scanning provides continuous rescanning, and EKS fits the portable existing Kubernetes workload."}
];

let idx = 0, score = 0, answered = new Array(QUESTIONS.length).fill(false), correctFlags = new Array(QUESTIONS.length).fill(false), missed = [];
const STORAGE_KEY = "aws-dva-quiz-12";

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({idx, score, answered, correctFlags}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.answered) && d.answered.length === QUESTIONS.length){
      idx = d.idx; score = d.score; answered = d.answered; correctFlags = d.correctFlags;
      return true;
    }
  }catch(e){}
  return false;
}

const quizArea = document.getElementById("quizArea");
const posNum = document.getElementById("posNum");
const scoreNum = document.getElementById("scoreNum");
const progressFill = document.getElementById("progressFill");

function updateTop(){
  posNum.textContent = (idx+1) + " / " + QUESTIONS.length;
  scoreNum.textContent = score;
  const answeredCount = answered.filter(Boolean).length;
  progressFill.style.width = (answeredCount / QUESTIONS.length * 100) + "%";
}

function renderQuestion(){
  const item = QUESTIONS[idx];
  const isMulti = !!item.multi;
  const done = answered[idx];
  let html = "";
  html += '<div class="card">';
  html += '<div class="qnum">Question ' + (idx+1) + '</div>';
  if(isMulti) html += '<div class="multi-hint">Select all that apply</div><br>';
  html += '<div class="qtext">' + escapeHtml(item.q) + '</div>';
  item.o.forEach((optText, i)=>{
    const letter = String.fromCharCode(65+i);
    let cls = "opt";
    if(done){
      if(item.a.includes(i)) cls += " correct";
      else if(item.picked && item.picked.includes(i)) cls += " incorrect";
    } else if(item.picked && item.picked.includes(i)){
      cls += " selected";
    }
    html += '<button class="' + cls + '" data-i="' + i + '" ' + (done?'disabled':'') + '>' +
      '<span class="mark">' + letter + '</span><span>' + escapeHtml(optText) + '</span></button>';
  });
  if(done){
    html += '<div class="explain"><b>' + (correctFlags[idx] ? "Correct. " : "Not quite. ") + '</b>' + escapeHtml(item.e) + '</div>';
  }
  html += '<div class="actions">';
  if(isMulti && !done){
    html += '<button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>';
  }
  if(done){
    if(idx < QUESTIONS.length - 1){
      html += '<button class="btn btn-primary" id="nextBtn">Next question</button>';
    } else {
      html += '<button class="btn btn-primary" id="finishBtn">See results</button>';
    }
  }
  html += '<button class="btn btn-ghost" id="resetBtn">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  updateTop();
  wireOptions(item, isMulti, done);
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function wireOptions(item, isMulti, done){
  const opts = quizArea.querySelectorAll(".opt");
  opts.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(done) return;
      const i = parseInt(btn.dataset.i, 10);
      if(isMulti){
        item.picked = item.picked || [];
        const pos = item.picked.indexOf(i);
        if(pos >= 0) item.picked.splice(pos,1); else item.picked.push(i);
        renderQuestion();
        const submitBtn = document.getElementById("submitBtn");
        if(submitBtn) submitBtn.disabled = !(item.picked && item.picked.length > 0);
      } else {
        item.picked = [i];
        commitAnswer(item);
      }
    });
  });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn){
    submitBtn.disabled = !(item.picked && item.picked.length > 0);
    submitBtn.addEventListener("click", ()=> commitAnswer(item));
  }
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ idx++; save(); renderQuestion(); });
  const finishBtn = document.getElementById("finishBtn");
  if(finishBtn) finishBtn.addEventListener("click", renderSummary);
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", resetAll);
}

function commitAnswer(item){
  if(answered[idx]) return;
  answered[idx] = true;
  const correct = item.picked.length === item.a.length && item.picked.every(p => item.a.includes(p));
  correctFlags[idx] = correct;
  if(correct) score++; else missed.push(idx);
  save();
  renderQuestion();
}

function renderSummary(){
  const pct = Math.round(score / QUESTIONS.length * 100);
  const passed = pct >= 72;
  let html = '<div class="card summary">';
  html += '<div class="eyebrow">Results</div>';
  html += '<div class="score-big">' + score + ' / ' + QUESTIONS.length + '</div>';
  html += '<div class="score-pct ' + (passed?'pass':'fail') + '">' + pct + '% — ' + (passed ? "Solid, above the ~72% pass bar" : "Below the ~72% pass bar — revisit the notes") + '</div>';
  const missedList = answered.map((_,i)=>i).filter(i => !correctFlags[i]);
  if(missedList.length){
    html += '<div class="miss-list"><h3>Review these questions</h3>';
    missedList.forEach(i=>{
      html += '<div class="miss-item"><b>Q' + (i+1) + '.</b> ' + escapeHtml(QUESTIONS[i].q) + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="actions" style="justify-content:center; margin-top:22px;">';
  html += '<button class="btn btn-primary" id="restartBtn">Restart quiz</button>';
  html += '<button class="btn btn-ghost" id="resetBtn2">Reset progress</button>';
  html += '</div></div>';
  quizArea.innerHTML = html;
  document.getElementById("restartBtn").addEventListener("click", resetAll);
  document.getElementById("resetBtn2").addEventListener("click", resetAll);
}

function resetAll(){
  idx = 0; score = 0; missed = [];
  answered = new Array(QUESTIONS.length).fill(false);
  correctFlags = new Array(QUESTIONS.length).fill(false);
  QUESTIONS.forEach(q => { delete q.picked; });
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderQuestion();
}

document.addEventListener("keydown", (e)=>{
  const map = {"1":0,"2":1,"3":2,"4":3,"5":4,"a":0,"b":1,"c":2,"d":3,"e":4,"A":0,"B":1,"C":2,"D":3,"E":4};
  if(e.key in map){
    const opts = quizArea.querySelectorAll(".opt:not(:disabled)");
    const i = map[e.key];
    if(opts[i]) opts[i].click();
  } else if(e.key === "Enter"){
    const nb = document.getElementById("nextBtn") || document.getElementById("finishBtn") || document.getElementById("submitBtn");
    if(nb && !nb.disabled) nb.click();
  }
});

if(load()){
  if(answered.every(Boolean)) renderSummary(); else renderQuestion();
} else {
  renderQuestion();
}
</script>

<script>
const QUESTIONS = [
{q:"A platform engineer explains to a team migrating from EC2-based deployments to containers that unlike a virtual machine, a container does not include its own copy of the operating system kernel. What isolation mechanism allows multiple containers to run safely on a single host while sharing that host's kernel?",o:["A hypervisor virtualizing separate kernels for each container","OS-level namespaces and cgroups that isolate each container's processes, filesystem, and resource usage","A dedicated physical CPU core assigned to each container","Each container running its own nested virtual machine"],a:[1],e:"Namespaces and cgroups provide process, filesystem, and resource isolation while every container shares the host's single kernel."},
{q:"A developer is new to containers and asks a colleague to explain the relationship between a Docker image and a container. Which statement correctly describes that relationship?",o:["An image and a container are the same thing, just different names","A container is a running instance of an image; the image itself is a read-only, portable template","An image is generated only after a container is deleted","A container contains multiple images, but an image never runs directly"],a:[1],e:"An image is the read-only template; a container is a running instance created from it."},
{q:"A developer opens a project's Dockerfile for the first time and sees a line reading 'FROM node:20-alpine' as the very first instruction. What does this instruction do?",o:["It publishes port 20 on the Alpine operating system","It selects the base image the new image will be built on top of, in this case a minimal Alpine Linux image with Node.js 20 preinstalled","It permanently deletes any existing Node.js installation before starting","It configures the container's IAM role"],a:[1],e:"FROM selects the base image (Alpine + Node 20 here) that subsequent instructions build on top of."},
{q:"A team's Docker build for a Node.js application takes several minutes on every single code change, even when only application source files (not dependencies) have changed, because their Dockerfile copies the entire project directory and runs the dependency install step immediately afterward, in a single combined step. Which change to the Dockerfile's instruction order would most directly speed up rebuilds after a source-only change?",o:["Copy only the dependency manifest (e.g., package.json) and run the dependency install before copying the rest of the application source, so the cached dependency layer is reused when only source files change","Remove the FROM instruction entirely","Combine every instruction into a single RUN command","Switch the base image to a larger, general-purpose Linux distribution"],a:[0],e:"Copying the dependency manifest and installing dependencies before the rest of the source lets Docker reuse the cached dependency layer when only source changes."},
{q:"Which statement accurately describes how Docker image layers work?",o:["Each Dockerfile instruction produces a new image layer that is cached, and unchanged layers are reused on subsequent builds, speeding up rebuilds and reducing what needs to be pulled from a registry","An image consists of exactly one layer regardless of how many instructions the Dockerfile contains","Layers are only relevant when pushing an image to Amazon EFS, not to a container registry","Every layer is always rebuilt from scratch on every build, with no caching behavior available"],a:[0],e:"Every instruction produces a cached layer, and unchanged layers are reused on rebuild and not re-downloaded on pull."},
{q:"A team compares startup times between launching a new EC2 instance from an AMI and starting a new container from an existing image on a host that is already running Docker. Why does the container typically start in a fraction of a second, while the EC2 instance takes over a minute?",o:["Containers use faster network cards than EC2 instances","The container does not need to boot a full operating system kernel; it starts a process that shares the host's already-running kernel, whereas the EC2 instance must fully boot a guest operating system","EC2 instances always use larger AMIs than container images","Containers do not require any image to be pulled beforehand"],a:[1],e:"A container shares the host's already-running kernel and starts a process, while an EC2 instance must boot a full guest OS."},
{q:"In a Dockerfile, which instruction specifies the command that actually runs when a container is started from the built image, as opposed to a command that runs only once at image build time?",o:["RUN","COPY","CMD","FROM"],a:[2],e:"CMD defines the command that runs when a container starts; RUN executes only at build time."},
{q:"Which two of the following statements accurately describe containers as compared to traditional virtual machines? (Select TWO)",o:["Containers share the host operating system's kernel rather than including their own","Containers generally start in a fraction of the time a full virtual machine takes to boot","Containers require a dedicated hypervisor for every individual container","Containers always require more disk space than an equivalent virtual machine image","Containers cannot be isolated from one another on the same host"],a:[0,1],multi:true,e:"Containers share the host kernel (no hypervisor-per-container) and start dramatically faster than a full VM boot."},
{q:"A CI/CD pipeline builds a container image and tags it 'my-app:2.1.7' before pushing it to a registry, rather than only ever pushing to a mutable tag like 'latest'. What is the primary benefit of tagging with a specific, immutable-style version like this for deployment purposes?",o:["It reduces the image's file size on disk","It creates a versioned, identifiable deployment artifact that can be promoted through environments and rolled back to precisely, unlike a mutable tag whose underlying image content can silently change","It automatically encrypts the image at rest","It is required before Docker will allow the image to be built at all"],a:[1],e:"A specific, versioned tag is a stable, traceable deployment artifact, unlike a mutable tag whose content can change silently."},
{q:"A Dockerfile includes the line 'EXPOSE 3000'. What does this instruction actually do?",o:["It documents which port the containerized application listens on and enables that port for inter-container linking, but does not by itself publish or map the port to the host — that mapping is a separate runtime configuration","It permanently opens port 3000 on the internet with no further configuration needed","It disables all other ports on the container","It configures a load balancer listener automatically"],a:[0],e:"EXPOSE documents/enables the listening port for container linking but does not itself publish the port to the host."},
{q:"A developer writing a Dockerfile for a Python application needs to decide the order of two steps: copying the application's 'requirements.txt' and running the dependency installer, versus copying the rest of the application source code. To maximize Docker's build-layer caching on future rebuilds where only source code changes, which order is correct?",o:["Copy all application source code first, then copy requirements.txt and install dependencies last, every time","Copy requirements.txt and install dependencies first, then copy the remaining application source code afterward","The order makes no difference to build caching behavior","Install dependencies without ever copying a requirements file"],a:[1],e:"Installing dependencies before copying source maximizes layer-cache reuse on source-only rebuilds."},
{q:"A team new to containerization is evaluating whether to package their application as a Docker image for deployment. Which two of the following are accurate characteristics of a well-built container image? (Select TWO)",o:["It packages the application code together with its runtime and dependencies so it behaves consistently across environments","It is composed of a series of cached, reusable layers built from Dockerfile instructions","It must always include a complete guest operating system kernel of its own","It can only ever be run on the exact same physical machine where it was built","It requires a Kubernetes cluster to build, even before ever being deployed"],a:[0,1],multi:true,e:"A container image bundles code with its runtime/dependencies and is composed of cached, reusable Dockerfile-instruction layers."},
{q:"A company maintains two categories of container images: proprietary internal microservice images that must never be publicly accessible, and a small open-source CLI tool image the company wants anyone on the internet to be able to pull without AWS credentials. Which Amazon ECR repository types should the company use for each, respectively?",o:["A single ECR private repository for both, controlled entirely through bucket policies","An ECR private repository for the proprietary images, and an ECR public repository for the open-source CLI image","Amazon S3 for both, since ECR does not support public access","An ECR public repository for both, with IAM restricting internal image access"],a:[1],e:"Private repositories keep proprietary images access-controlled; a public repository is designed for anonymous public distribution."},
{q:"A security team wants container images pushed to ECR to be continuously re-evaluated against newly disclosed CVEs after the push, not just scanned once at push time, using Amazon Inspector's deeper OS and language-package vulnerability coverage. Which ECR scanning configuration meets this requirement?",o:["Basic scanning, which uses the open-source Clair scanner and only scans once at push time","Enhanced scanning, powered by Amazon Inspector, which continuously reassesses images as new vulnerabilities are published","Disabling scanning and relying on manual review","A third-party scanner outside of AWS, since ECR has no native scanning capability"],a:[1],e:"Enhanced scanning (Amazon Inspector) continuously reassesses images against newly published CVEs without requiring a re-push."},
{q:"A developer needs to authenticate their local Docker client to push an image to a private ECR repository. Following AWS's recommended approach, which command sequence should they use?",o:["Manually create a static ECR username and password in the console and run docker login with those credentials","Run aws ecr get-login-password to retrieve a temporary authorization token derived from their current IAM credentials, and pipe it into docker login --username AWS --password-stdin","Email AWS Support to request registry credentials","Use their AWS account's root user password directly with docker login"],a:[1],e:"aws ecr get-login-password issues a temporary, IAM-derived token piped into docker login; there is no static registry password."},
{q:"An ECR repository accumulates hundreds of untagged image layers from every CI build, most of which are superseded within days and never referenced again, steadily increasing storage costs. Which ECR feature should the team configure to automatically expire old, untagged images without writing custom cleanup automation?",o:["An ECR lifecycle policy defining expiration rules, such as removing untagged images older than a set number of days","An IAM permissions boundary on the repository","Manually deleting images from the console every week","Enabling S3 Intelligent-Tiering on the repository"],a:[0],e:"A lifecycle policy natively automates expiration of old/untagged images without custom cleanup scripting."},
{q:"A CodeBuild project's build role needs to push newly built images to an ECR repository as the final step of a build. Which category of IAM permissions must be granted to that CodeBuild service role for the push to succeed?",o:["Permissions to invoke Lambda functions only","ECR permissions including obtaining an authorization token and uploading image layers, such as ecr:GetAuthorizationToken, ecr:InitiateLayerUpload, and ecr:PutImage","Permissions to modify Route 53 hosted zones","No IAM permissions are required if the CodeBuild project is in the same account as the ECR repository"],a:[1],e:"Pushing requires ECR permissions like GetAuthorizationToken, InitiateLayerUpload, and PutImage on the CodeBuild service role."},
{q:"A company's shared services account hosts a central ECR repository that a separate application account's ECS tasks need to pull images from. Which mechanism allows the application account's IAM principals to pull images from a repository that lives in a different AWS account?",o:["An ECR repository policy on the shared repository granting pull permissions (e.g., ecr:GetDownloadUrlForLayer, ecr:BatchGetImage) to the application account's principals","Copying the image into the application account's default VPC","Granting root user access to the shared services account","ECR does not support any form of cross-account access"],a:[0],e:"A resource-based ECR repository policy can grant pull permissions to principals in another AWS account."},
{q:"A platform team wants to prevent developers from accidentally overwriting an already-published, versioned image tag (for example, re-pushing a different image under the tag 1.4.2 after it has already been deployed), to preserve traceability between a tag and its exact image content. Which ECR repository setting enforces this?",o:["Enabling image tag immutability on the repository, which rejects any push that attempts to overwrite an existing tag","Enabling ECR lifecycle policies","Disabling image scanning","Setting the repository to public"],a:[0],e:"Image tag immutability rejects pushes that would overwrite an existing tag, preserving tag-to-content traceability."},
{q:"A CodePipeline pipeline includes a CodeBuild stage that builds and pushes a new container image to ECR, followed by a deploy stage that updates an ECS service with the new image. Which artifact does the CodeBuild stage typically produce to tell the ECS deploy action exactly which image URI to deploy?",o:["A CloudFormation change set","An imagedefinitions.json file naming the container and the new image URI","A Dockerfile","An IAM policy document"],a:[1],e:"imagedefinitions.json is the standard hand-off artifact naming the container and new image URI for the ECS deploy action."},
{q:"Which underlying open-source scanning engine powers Amazon ECR's basic image scanning feature?",o:["Amazon Inspector exclusively","Clair","AWS Config","Amazon GuardDuty"],a:[1],e:"ECR basic scanning is powered by the open-source Clair scanner."},
{q:"Compared to ECR basic scanning, what additional capability does ECR enhanced scanning (powered by Amazon Inspector) provide?",o:["It scans images only at push time and never again","Continuous rescanning as new vulnerabilities are disclosed, without requiring the image to be re-pushed, plus deeper OS and programming-language package coverage","It removes the need for a task execution role","It automatically deletes vulnerable images without notifying anyone"],a:[1],e:"Enhanced scanning adds continuous rescanning as new CVEs are published, plus deeper OS/language-package coverage, via Amazon Inspector."},
{q:"Which two of the following are accurate about the authorization token returned by aws ecr get-login-password? (Select TWO)",o:["It is a temporary token derived from the caller's current IAM credentials, not a permanent registry password","It is valid for a limited period (12 hours) before it must be refreshed","It grants full administrative access to every AWS service in the account","It never expires once issued","It can only be used from within the AWS Management Console, never from the CLI"],a:[0,1],multi:true,e:"The token is a temporary, IAM-credential-derived token, valid for up to 12 hours before needing refresh."},
{q:"A team wants to grant a specific cross-account role pull access to just one ECR repository, without granting that account any access to other repositories in the registry. Which approach scopes access most precisely?",o:["Granting AdministratorAccess to the entire account","Attaching a resource-based repository policy to that specific ECR repository, naming the other account's role as principal with only the needed pull actions","Sharing the AWS account's root credentials","Making the entire registry public"],a:[1],e:"A repository-scoped resource policy grants precise cross-account pull access to just that one repository."},
{q:"A developer discovers that a previously pushed container image layer contains a hardcoded API key that was later removed from later layers, but the layer with the secret is still part of the image's history in the registry. What is the most effective remediation?",o:["Simply deleting the latest tag; the older layer with the secret is no longer a concern once untagged","Treat the exposed secret as compromised and rotate it immediately, since any layer with the secret remains retrievable from the registry regardless of later layers removing it from the visible filesystem","Enable image scanning, which automatically removes secrets from existing layers","Nothing further is needed once the file is deleted in a later layer"],a:[1],e:"Once pushed, any layer (including removed-later content) remains retrievable from the registry, so the exposed secret must be rotated."},
{q:"For an ECS task's execution role to successfully pull a private image from ECR when the task starts, which category of permission must that role include?",o:["ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, and ecr:GetAuthorizationToken scoped appropriately, so the ECS agent can authenticate to ECR and download the image layers","s3:GetObject only","No permissions are required for private repositories","lambda:InvokeFunction"],a:[0],e:"The task execution role needs ECR authentication/pull permissions so the ECS agent can retrieve the image on the task's behalf."},
{q:"How is Amazon ECR primarily billed for private repositories, aside from data transfer?",o:["A fixed monthly fee per repository regardless of size","Based on the amount of data stored in the repository, per GB per month","Per image scan only","ECR storage itself is entirely free at any scale"],a:[1],e:"ECR private repository storage is billed per GB stored per month, aside from data transfer charges."},
{q:"A team wants an ECR lifecycle policy that retains only the 5 most recently pushed images whose tags start with release-, expiring all older ones automatically. Which lifecycle policy capability supports this?",o:["A rule based on image count with a tag prefix match, keeping only the specified number of most recent matching images","Manually reviewing images each release","S3 Versioning enabled on the repository","ECR does not support prefix-based rules, only date-based rules"],a:[0],e:"A count-based lifecycle rule with a tag-prefix match keeps only the specified number of most recent matching images."},
{q:"A CodeBuild project that builds a Docker image and pushes it to ECR fails with an error indicating the Docker daemon cannot be started inside the build environment. Which CodeBuild project setting most likely needs to be enabled to resolve this?",o:["Enabling privileged mode, which grants the build environment the elevated access needed to run a Docker daemon during the build","Increasing the CodeBuild compute type only","Switching the build to a different AWS Region","Disabling VPC connectivity for the project"],a:[0],e:"Privileged mode grants the CodeBuild environment the access needed to run a Docker daemon during the build."},
{q:"Which two of the following are native Amazon ECR features that require no additional third-party tooling to use? (Select TWO)",o:["Image vulnerability scanning (basic and enhanced tiers)","Lifecycle policies to automatically expire old images","Automatic conversion of container images into Lambda functions","Built-in Kubernetes cluster provisioning","Automatic generation of Dockerfiles from source code"],a:[0,1],multi:true,e:"Both image scanning and lifecycle policies are native ECR capabilities requiring no external tooling."},
{q:"Does pulling an image from an ECR public repository require the puller to authenticate with AWS credentials?",o:["Yes, every pull from any ECR repository always requires IAM authentication","No, images in an ECR public repository can be pulled anonymously without AWS credentials, since the repository is intended for public distribution","Only Windows containers can pull from public repositories","Only if the puller is in the same AWS Organization"],a:[1],e:"ECR public repositories allow anonymous, credential-free pulls, matching their public-distribution purpose."},
{q:"A platform team wants their ECR setup to (1) automatically flag known vulnerabilities in every pushed image, (2) prevent an already-published version tag from silently being overwritten by a different image, and (3) automatically remove old, untagged images to control storage cost. Which three ECR features together satisfy these three goals, respectively? (Select THREE)",o:["Image scanning (basic or enhanced)","Image tag immutability","A lifecycle policy expiring untagged images","Enabling the repository as public","Disabling authentication entirely"],a:[0,1,2],multi:true,e:"Scanning flags vulnerabilities, tag immutability prevents silent tag overwrites, and a lifecycle policy expires old untagged images."},
{q:"Which statement best describes an Amazon ECS task definition?",o:["A running collection of EC2 instances registered to a cluster","A JSON blueprint specifying one or more containers to run together, including image, CPU/memory, networking, environment variables, and IAM roles","A CloudWatch alarm that triggers container restarts","A load balancer target group"],a:[1],e:"A task definition is the JSON blueprint describing containers, resources, networking, and IAM roles for a task."},
{q:"In an ECS task definition, what is the primary purpose of the task execution role (executionRoleArn)?",o:["Granting the application code inside the container permission to call services like S3 or DynamoDB at runtime","Granting ECS itself the permissions needed to launch the task, such as pulling the container image from ECR, writing logs to CloudWatch, and retrieving injected secrets at startup","Granting IAM users permission to log into the AWS Management Console","Granting the ECS service permission to create new VPCs"],a:[1],e:"The task execution role covers ECS's own startup needs: pulling images, writing logs, and fetching injected secrets."},
{q:"In an ECS task definition, what is the primary purpose of the task role (taskRoleArn)?",o:["Granting the application code running inside the container permission to call other AWS services at runtime, such as reading from an S3 bucket or writing to a DynamoDB table","Granting ECS permission to pull the container image from the registry","Granting the ECS agent permission to write container logs to CloudWatch","Granting the underlying EC2 instance permission to join the cluster"],a:[0],e:"The task role governs what the application code inside the container can call at runtime."},
{q:"An ECS service on Fargate is running normally — the desired count of tasks is healthy, the container image pulled successfully, and logs are streaming to CloudWatch — but the application inside the container throws AccessDenied errors every time it calls s3:GetObject. Which change is most likely to resolve this?",o:["Expand the permissions attached to the task execution role","Expand the permissions attached to the task role to include the needed S3 permissions","Attach an EC2 instance profile to the underlying host","Restart the ECS cluster"],a:[1],e:"Application-level AWS API failures (like S3 AccessDenied) are fixed via the task role, not the execution role, which already did its job by launch time."},
{q:"A newly registered ECS task definition revision fails to start, with the ECS console reporting an error that the task was unable to pull the container image from the private ECR repository. Assuming the image and repository both exist and the network path is correct, which role most likely needs additional permissions?",o:["The task role","The task execution role, since it governs ECS's ability to authenticate to ECR and pull the image on the task's behalf","An IAM user's console login role","A Lambda execution role"],a:[1],e:"Failure to pull the image points to the task execution role, which governs ECS's ECR authentication and pull permissions."},
{q:"An ECS task definition references a database password stored in Secrets Manager as a container-level secrets entry, intending for ECS to inject that value as an environment variable when the container starts. Which role must be granted permission to retrieve that secret for the injection to succeed?",o:["The task role","The task execution role","Neither role; Secrets Manager injection requires no IAM permissions","The EKS cluster role"],a:[1],e:"The task execution role must be able to retrieve the secret value so ECS can inject it as an environment variable at startup."},
{q:"Which two of the following statements correctly distinguish the ECS task role from the task execution role? (Select TWO)",o:["The task role grants permissions the application code inside the container uses at runtime","The task execution role grants permissions ECS itself needs to start the task, such as pulling images and writing logs","The task role and task execution role are always required to be the exact same IAM role","The task execution role is what an application uses to call DynamoDB","The task role is used exclusively to pull container images from ECR"],a:[0,1],multi:true,e:"Task role = application runtime permissions; task execution role = ECS's own startup-time plumbing permissions."},
{q:"In a Fargate-compatible ECS task definition, what does the top-level cpu and memory field combination specify?",o:["The maximum number of tasks the service can run","The total vCPU and memory reserved for the entire task, required for Fargate-compatible task definitions, which containers within the task share","The billing tier for the ECS cluster","The IAM permissions boundary for the task role"],a:[1],e:"Top-level cpu/memory reserves the total resources for the task, required for Fargate and shared across its containers."},
{q:"An ECS service using the awsvpc network mode assigns each task its own elastic network interface and private IP address. What direct benefit does this provide when integrating the service with an Application Load Balancer target group?",o:["It removes the need for a task definition entirely","The ALB can route directly to individual tasks by IP, rather than needing to route through a shared host port on an EC2 instance","It disables all task-level IAM roles","It automatically encrypts all traffic between tasks"],a:[1],e:"With awsvpc, each task gets its own ENI/IP, letting the ALB route directly to individual tasks rather than a shared host port."},
{q:"An ECS service is running task definition revision 14 when a bug is discovered in the container image it references. The team wants to immediately roll back to the previously known-good configuration. What is the fastest way to do this?",o:["Rebuild the container image from scratch and manually recreate the previous task definition by hand","Update the service to use the previous task definition revision (e.g., revision 13), since ECS retains prior revisions and a service can be pointed at any of them instantly","Delete the ECS cluster and recreate it","Manually SSH into each task's underlying host and downgrade the running binary"],a:[1],e:"ECS retains prior task definition revisions, so pointing the service back at revision 13 rolls back instantly."},
{q:"A task definition's container definition includes a logConfiguration block specifying the awslogs log driver along with a log group and stream prefix. What does this configuration accomplish?",o:["It configures the container to automatically scale based on log volume","It streams the container's stdout/stderr output to a specified CloudWatch Logs log group, which requires the task execution role to have permission to write logs","It configures the task role's permissions","It disables container logging entirely"],a:[1],e:"The awslogs driver streams container output to CloudWatch Logs, requiring log-write permissions on the task execution role."},
{q:"A security review of an ECS task definition finds two issues: the task role is attached to the broad AWS-managed AdministratorAccess policy even though the application only ever calls a single DynamoDB table, and the task execution role is missing the permissions needed to write logs to CloudWatch, causing intermittent log delivery failures. Which two remediations correctly address each finding, respectively? (Select TWO)",o:["Replace the task role's AdministratorAccess policy with a narrowly scoped policy granting only the specific DynamoDB actions and table ARN the application needs","Add the CloudWatch Logs permissions (e.g., logs:CreateLogStream, logs:PutLogEvents) to the task execution role","Delete the task role entirely, since ECS tasks do not need one","Grant AdministratorAccess to the task execution role as well, to be safe","Move the DynamoDB permissions to the task execution role instead"],a:[0,1],multi:true,e:"Narrow the task role to only the needed DynamoDB actions/resource, and add CloudWatch Logs write permissions to the execution role."},
{q:"In an ECS task definition, what does the family field represent?",o:["The AWS account family the task belongs to for billing","A name grouping together all revisions of a task definition over time, so a service can reference the family and get the latest (or a specific) revision","The IAM group attached to the task role","The Availability Zone the task must run in"],a:[1],e:"The family groups all revisions of a task definition under one name so a service can reference the latest or a specific revision."},
{q:"A task definition defines two containers within a single task: the main application container and a logging sidecar container that forwards logs to a third-party service. Both containers need to call AWS APIs at runtime. How many task roles does this single task have, and how is it shared between the two containers?",o:["Each container automatically gets its own separate task role","A single task role is defined at the task level, and both containers within that task share the same task role's permissions","Sidecar containers can never be granted IAM permissions","The logging sidecar must use the task execution role instead"],a:[1],e:"A task definition has one task-level role that all containers within that single task share."},
{q:"A task definition does not specify a taskRoleArn at all, but the application inside the container attempts to call the AWS SDK to read from DynamoDB. What is the expected outcome?",o:["The call succeeds automatically using the task execution role's permissions instead","The call fails, because with no task role attached, the application has no AWS credentials available to it via the container's credential provider chain","The call succeeds using the underlying EC2 host's IAM role automatically, regardless of launch type","ECS automatically creates a broad default task role with full access"],a:[1],e:"With no task role attached, the container has no AWS credentials available via its credential provider chain, so the call fails."},
{q:"A container definition can supply configuration to the application either via a plaintext environment entry or via a secrets entry referencing a value in Secrets Manager or Parameter Store. Which type of value should a database password use, and why?",o:["A plaintext environment variable, because it is simpler to configure","A secrets entry, because it avoids storing the sensitive value in plaintext within the task definition itself, and access to the underlying secret is governed by the task execution role","Neither; passwords must be hardcoded into the container image","A plaintext environment variable, because Secrets Manager cannot be referenced from ECS"],a:[1],e:"A secrets entry avoids storing the sensitive value in plaintext in the task definition, retrieved via the task execution role's permissions."},
{q:"Comparing task definitions across ECS launch types, which statement is accurate regarding CPU and memory specification?",o:["Fargate-compatible task definitions require top-level task cpu and memory values, while EC2 launch type task definitions can rely on per-container cpu/memory reservations, offering more flexibility in how resources are packed onto a shared EC2 instance","Only EC2 launch type requires top-level cpu and memory values","Neither launch type ever requires specifying cpu or memory","CPU and memory values are irrelevant to ECS and only apply to Lambda"],a:[0],e:"Fargate requires top-level task cpu/memory; EC2 launch type additionally allows per-container reservations for flexible host bin-packing."},
{q:"A company wants its ECS Fargate tasks to always use the current value of a rotating database password, retrieved securely at container startup, without embedding the value in the task definition or requiring a new task definition revision every time the password rotates. Which configuration achieves this?",o:["Hardcoding the password directly as a plaintext environment variable in the task definition","Referencing the secret via a secrets entry pointing at the Secrets Manager secret's ARN, so the current value is retrieved by ECS (using the task execution role) at task startup, independent of the task definition's own content","Emailing the new password to the development team after every rotation","Storing the password as a comment in the Dockerfile"],a:[1],e:"A secrets reference to the Secrets Manager ARN retrieves the current value at startup via the execution role, independent of the task definition content."},
{q:"Which two of the following statements about Amazon ECS task definitions are accurate? (Select TWO)",o:["A task definition can specify one or more containers that run together as a single deployable unit","Task definitions are revisioned, and a service can be updated to use a specific prior revision","A task definition cannot specify environment variables under any circumstance","Every task definition automatically shares one global IAM role across the entire AWS account","Task definitions can only ever define exactly one container each"],a:[0,1],multi:true,e:"A task definition groups one or more containers as a unit and is revisioned, with services able to reference any prior revision."},
{q:"Which AWS service principal must be trusted in the trust policy of both an ECS task role and a task execution role for ECS to be able to assume them on behalf of a running task?",o:["lambda.amazonaws.com","ecs-tasks.amazonaws.com","ec2.amazonaws.com","eks.amazonaws.com"],a:[1],e:"ecs-tasks.amazonaws.com is the service principal ECS uses to assume both the task role and task execution role."},
{q:"In a container definition's portMappings section, what does the containerPort value specify?",o:["The port on which the containerized application listens inside the container","The IAM port used for authentication","The AWS Region's default networking port","The ECR repository's port"],a:[0],e:"containerPort specifies the port the application listens on inside the container."},
{q:"A team is troubleshooting two separate ECS incidents: Incident 1, where a task fails to launch with an error about being unable to retrieve a secret referenced in the container definition; and Incident 2, where a running, healthy task's application code fails to write an object to S3 with an AccessDenied error. Which two statements correctly identify the role to fix for each incident, respectively? (Select TWO)",o:["Incident 1 is resolved by granting the task execution role permission to retrieve the referenced secret","Incident 2 is resolved by granting the task role permission to call s3:PutObject on the target bucket","Both incidents are resolved by modifying the task role only","Both incidents are resolved by modifying the task execution role only","Incident 1 requires deleting the ECS cluster and recreating it"],a:[0,1],multi:true,e:"Incident 1 (secret retrieval failure) is an execution-role fix; Incident 2 (application S3 AccessDenied) is a task-role fix."},
{q:"What does an Amazon ECS cluster represent?",o:["A single running container","A logical grouping/namespace for the tasks and services that run within it, and for the EC2 capacity (if using the EC2 launch type) registered to it","A single EC2 instance type","A CloudFormation template"],a:[1],e:"A cluster is the logical grouping/namespace for a set of tasks, services, and (for EC2 launch type) registered instance capacity."},
{q:"An ECS service is configured with a desired count of 4. What does ECS do if one of the four running tasks stops unexpectedly (e.g., due to a container crash)?",o:["Nothing; ECS never automatically replaces a stopped task","ECS automatically launches a new task to bring the running count back up to the desired count of 4","ECS reduces the desired count to 3 to match reality","ECS deletes the entire service"],a:[1],e:"A service continuously reconciles running task count against desired count, launching a replacement for any stopped task."},
{q:"An ECS service is configured to register its tasks with an Application Load Balancer target group. As tasks are launched and stopped by the service (e.g., during a deployment or scaling event), what happens to the target group's registered targets?",o:["The target group must be manually updated by an engineer every time","ECS automatically registers new tasks with the target group and deregisters stopped tasks, keeping the target group's membership in sync with the running tasks","The target group is recreated from scratch on every task change","ALB target groups cannot be used with ECS services at all"],a:[1],e:"ECS automatically registers newly launched tasks and deregisters stopped ones from the associated target group."},
{q:"A team wants an ECS service to automatically increase or decrease its number of running tasks to keep average CPU utilization across the service near 60%, without manually defining step thresholds. Which Application Auto Scaling policy type, directly analogous to the EC2 Auto Scaling target tracking policy from module 01, should they configure for the service?",o:["Scheduled scaling only","Target tracking scaling","Step scaling exclusively","Manual scaling performed by an engineer"],a:[1],e:"Target tracking automatically maintains a target metric value (like CPU) without manually defined step thresholds, mirroring ASG target tracking."},
{q:"On the ECS EC2 launch type, who is responsible for patching the operating system of the underlying EC2 instances that run the tasks?",o:["AWS fully manages and patches the underlying EC2 instances automatically","The customer is responsible for patching and maintaining the underlying EC2 instances registered to the cluster","Patching is not necessary for EC2 instances running containers","Amazon ECR patches the instances during image pulls"],a:[1],e:"On the EC2 launch type, the customer owns patching and maintaining the underlying registered EC2 instances."},
{q:"Compared to the ECS EC2 launch type, what is the defining operational characteristic of the Fargate launch type?",o:["Fargate requires manually provisioning and patching EC2 instances, just like the EC2 launch type","Fargate requires no EC2 instances to be provisioned, patched, or scaled by the customer at all — AWS runs the task without a customer-visible underlying host","Fargate only supports Windows containers","Fargate requires a separate EKS cluster to function"],a:[1],e:"Fargate removes all customer-visible host provisioning, patching, and scaling — there is no EC2 fleet to manage."},
{q:"A machine learning team runs GPU-accelerated inference containers at large, steady-state scale and wants to tightly bin-pack multiple tasks per GPU-equipped EC2 instance to maximize utilization and minimize cost, while also applying Reserved Instance discounts at the instance level. Which two considerations correctly support choosing the ECS EC2 launch type over Fargate for this workload? (Select TWO)",o:["The EC2 launch type exposes GPU-equipped instance types that Fargate does not support","The EC2 launch type allows Reserved Instance / Savings Plan discounts to apply at the instance level, and supports custom task placement strategies for dense bin-packing","Fargate always provides denser bin-packing than the EC2 launch type","Fargate is required for any GPU workload","The EC2 launch type eliminates the need for a task definition"],a:[0,1],multi:true,e:"EC2 launch type exposes GPU instance types and instance-level RI/Savings Plan discounts plus custom placement for dense bin-packing."},
{q:"A startup runs a customer-facing API with highly variable, unpredictable traffic throughout the day and wants to minimize the operational overhead of managing container infrastructure, with no interest in provisioning or patching EC2 instances themselves. Which ECS launch type best fits these priorities?",o:["The EC2 launch type, for maximum control","The Fargate launch type, which eliminates host provisioning, patching, and capacity planning","Dedicated Hosts","A self-managed on-premises Kubernetes cluster"],a:[1],e:"Fargate eliminates host provisioning/patching/capacity planning, matching a \"least operational overhead\" priority for spiky traffic."},
{q:"An ECS service performing a rolling deployment is configured with a minimum healthy percent of 100 and a maximum percent of 200. What does this configuration achieve during a deployment?",o:["It causes the deployment to take down all existing tasks before starting any new ones","It ensures the service never drops below its full desired capacity while new tasks are launched alongside old ones (up to double capacity temporarily) before old tasks are drained and stopped","It disables health checks during the deployment","It has no effect on how the deployment proceeds"],a:[1],e:"Minimum 100%/maximum 200% keeps full capacity available throughout the deployment while new and old tasks briefly coexist."},
{q:"A team wants ECS service deployments to shift all production traffic from an old task set to a new task set behind the same Application Load Balancer only after automated validation checks pass, with the ability to instantly roll back by shifting traffic back if something goes wrong. Which ECS deployment approach supports this?",o:["A standard ECS rolling update with no traffic-shifting controls","A blue/green deployment integrated with AWS CodeDeploy, which manages traffic shifting between the old and new task sets","Manually replacing tasks one at a time via the console with no validation","Deleting and recreating the entire cluster for every deployment"],a:[1],e:"A CodeDeploy-integrated blue/green deployment manages controlled traffic shifting (and rollback) between old and new task sets."},
{q:"What is the purpose of an ECS capacity provider?",o:["It defines the scaling behavior and infrastructure (EC2 Auto Scaling group or Fargate/Fargate Spot) that a cluster uses to run tasks, and can be associated with a cluster to manage how capacity is provisioned for tasks","It is a billing construct with no effect on where tasks run","It replaces the need for a task definition","It is exclusively used for EKS clusters, not ECS"],a:[0],e:"A capacity provider defines and associates the underlying infrastructure (ASG or Fargate/Fargate Spot) a cluster uses to place tasks."},
{q:"Which two of the following correctly distinguish an ECS service from simply running a standalone ECS task directly? (Select TWO)",o:["A service maintains a specified desired count of tasks over time, automatically replacing any that stop","A service can integrate with a load balancer target group and Application Auto Scaling, while a manually run standalone task does neither on its own","A standalone task automatically restarts itself if it stops, exactly like a service does","Services cannot be used with the Fargate launch type","A standalone task run outside of a service also receives automatic Application Auto Scaling"],a:[0,1],multi:true,e:"A service maintains desired count automatically and can integrate with a load balancer and Application Auto Scaling; a standalone task does neither."},
{q:"A team runs a batch-style ECS workload on Fargate that can tolerate interruption and wants to reduce Fargate compute costs for this specific, interruption-tolerant workload. Which Fargate capacity option is analogous to EC2 Spot Instances and offers a discount in exchange for potential interruption?",o:["Fargate Spot","Fargate Reserved Capacity","Fargate Dedicated","There is no Spot-equivalent option for Fargate"],a:[0],e:"Fargate Spot offers a discount for interruption-tolerant workloads, directly analogous to EC2 Spot Instances."},
{q:"Can a single ECS cluster contain some services running on the EC2 launch type and other services running on the Fargate launch type simultaneously?",o:["No, a cluster must use exactly one launch type for every service within it","Yes, an ECS cluster can run a mix of services using different launch types (EC2 and Fargate) as needed","Only if the cluster is also registered with EKS","Only during a migration window, after which one launch type must be fully removed"],a:[1],e:"A single ECS cluster can mix services across both the EC2 and Fargate launch types simultaneously."},
{q:"Which two of the following are examples of ECS task placement strategies or constraints available on the EC2 launch type for controlling how tasks are distributed across a cluster's EC2 instances? (Select TWO)",o:["binpack — placing tasks on the fewest possible instances to maximize resource utilization","spread — distributing tasks evenly across a specified field such as Availability Zone, for resilience","A lifecycle policy expiring old container images","An ECR repository policy","A task execution role permissions boundary"],a:[0,1],multi:true,e:"binpack and spread are ECS task placement strategies controlling task distribution across a cluster's EC2 instances."},
{q:"An ECS service is updated to reference a new task definition revision. What does ECS do by default?",o:["Nothing changes until an administrator manually restarts each task","ECS initiates a new deployment, incrementally replacing running tasks based on the old task definition with new tasks based on the updated revision, according to the configured deployment settings","The service is deleted and must be recreated from scratch","The change only takes effect after the next scheduled maintenance window"],a:[1],e:"Updating a service's task definition triggers a new deployment that incrementally replaces tasks per the deployment configuration."},
{q:"When Application Auto Scaling is enabled on an ECS service, what do the configured minimum and maximum task counts define?",o:["The exact number of tasks that will always run regardless of load","The boundaries within which the service's desired count is automatically adjusted in response to the configured scaling policy (e.g., target tracking)","The number of Availability Zones the cluster spans","The maximum number of clusters in the account"],a:[1],e:"Min/max task counts bound the range within which the service's desired count is automatically adjusted by its scaling policy."},
{q:"During a rolling ECS deployment, an old task is being stopped and replaced by a new one. Which ALB target group setting helps ensure in-flight requests to that old task are allowed to complete before it is fully deregistered and terminated?",o:["Target group deregistration delay (connection draining)","ECR lifecycle policy","Task execution role permissions","Cluster capacity provider strategy"],a:[0],e:"Target group deregistration delay lets in-flight requests complete before a deregistering task is fully removed."},
{q:"Which two of the following accurately describe tradeoffs between the ECS EC2 launch type and the Fargate launch type? (Select TWO)",o:["The EC2 launch type gives the team control over instance type selection (including GPU instances) that Fargate does not expose","The Fargate launch type removes the operational burden of patching and scaling underlying EC2 instances","The EC2 launch type has no operational overhead whatsoever","Fargate always costs less per vCPU-hour than an equivalent EC2 instance","Both launch types require the customer to manage a Kubernetes control plane"],a:[0,1],multi:true,e:"EC2 launch type exposes host/instance-type control (including GPU); Fargate removes host patching/scaling burden."},
{q:"A team running multiple ECS services that need to discover and call each other by a stable DNS name, without hardcoding IP addresses that change as tasks are replaced, wants a built-in AWS service discovery mechanism integrated with ECS. Which capability provides this?",o:["AWS Cloud Map integration with ECS service discovery, which registers each task's IP under a DNS name automatically as tasks start and stop","ECR lifecycle policies","Task execution roles","EC2 instance metadata"],a:[0],e:"AWS Cloud Map integration provides automatic DNS-based service discovery tracking task IPs as they start and stop."},
{q:"An ECS service using the EC2 launch type reports that new tasks are stuck in a PENDING state and never transition to RUNNING, while CloudWatch shows the cluster's registered EC2 instances are already near full CPU and memory reservation from existing tasks. What is the most likely cause?",o:["The task execution role is misconfigured","There is insufficient unreserved CPU/memory capacity across the cluster's registered EC2 instances to place the new task, requiring either scaling out the underlying Auto Scaling group or switching to Fargate to avoid this class of problem entirely","The ECR repository is unreachable","The VPC has run out of available Regions"],a:[1],e:"Tasks stay PENDING when the cluster's registered EC2 instances lack sufficient unreserved CPU/memory to place them; scale the ASG or use Fargate."},
{q:"Referring to the PENDING-task capacity scenario above, why does the Fargate launch type structurally avoid this specific class of failure?",o:["Fargate tasks share the same underlying capacity-planning model as the EC2 launch type","Fargate has no customer-managed underlying EC2 fleet to run out of reservable CPU/memory on — AWS provisions the exact capacity each task needs behind the scenes","Fargate tasks never require any CPU or memory to be specified","Fargate is simply a rebranding of the EC2 launch type with no functional difference"],a:[1],e:"Fargate has no customer-managed host fleet to exhaust capacity on — AWS provisions exactly the capacity each task needs."},
{q:"What does AWS ECS Exec allow a developer to do?",o:["Automatically scale a service based on custom metrics","Open an interactive shell or run a one-off command inside a running container within a running ECS task, for debugging purposes","Permanently modify a container image in place","Create a new ECR repository"],a:[1],e:"ECS Exec opens an interactive shell or runs a command inside a running container for live debugging."},
{q:"Which EC2-focused AWS Systems Manager capability from module 01 is ECS Exec most directly analogous to, in terms of the access pattern it provides?",o:["Systems Manager Parameter Store","Systems Manager Session Manager, providing IAM-governed shell access without opening inbound ports or requiring SSH","Systems Manager Patch Manager","Systems Manager Inventory"],a:[1],e:"ECS Exec parallels Session Manager: IAM-governed access with no inbound ports or SSH required."},
{q:"Which two conditions must be true for ECS Exec to work against a running ECS task? (Select TWO)",o:["The task definition/service must have been launched with execute command enabled (enableExecuteCommand)","The task role must include the SSM messaging permissions required for the ECS Exec session channel","The task must be using the EC2 launch type exclusively; ECS Exec does not work with Fargate","The container's Dockerfile must expose port 22","The cluster must be running Kubernetes"],a:[0,1],multi:true,e:"ECS Exec requires enableExecuteCommand on the task/service and SSM messaging permissions on the task role."},
{q:"A developer needs to inspect environment variables and check running processes inside a live, misbehaving container running on Fargate, without redeploying it or opening any inbound network port to reach it. Which AWS capability directly supports this?",o:["SSH directly into the Fargate task's underlying host","ECS Exec, which opens an interactive session into the running container via IAM-governed, SSM-based tooling with no inbound ports required","Rebuilding and repushing the image with debug logging enabled, then redeploying","Fargate does not support any form of live debugging"],a:[1],e:"ECS Exec provides IAM/SSM-based interactive access into a running Fargate container with no inbound ports needed."},
{q:"Is AWS ECS Exec supported for tasks running on the Fargate launch type, in addition to the EC2 launch type?",o:["No, ECS Exec only works with the EC2 launch type","Yes, ECS Exec is supported on both the EC2 and Fargate launch types, provided the task meets the required platform version and configuration","ECS Exec is exclusive to EKS","ECS Exec requires disabling the task execution role"],a:[1],e:"ECS Exec works on both EC2 and Fargate launch types, subject to platform version/configuration requirements."},
{q:"A compliance requirement mandates that every interactive debugging session opened into a production container be logged for audit purposes. Which ECS Exec capability supports this requirement?",o:["ECS Exec sessions cannot be logged under any configuration","ECS Exec session activity can be configured to log to CloudWatch Logs or S3, similar to Session Manager session logging","Only console-based access can ever be logged","Logging requires a third-party agent installed inside every container"],a:[1],e:"ECS Exec session activity can be logged to CloudWatch Logs or S3 for audit, mirroring Session Manager logging."},
{q:"A developer with appropriate IAM permissions attempts to start an ECS Exec session into a running task but the session fails to start, even though enableExecuteCommand was set when the service was created. What is a likely root cause to check first?",o:["The ECR repository has been deleted","The task role is missing the SSM messaging permissions required to establish the ECS Exec channel","The task execution role has too many permissions","The container's CPU allocation is too high"],a:[1],e:"A missing SSM messaging permission on the task role is a common reason an enabled ECS Exec session still fails to start."},
{q:"Why is ECS Exec generally preferred over baking an SSH server directly into a container image for debugging access?",o:["It avoids the extra attack surface, image bloat, and key-management burden of running an SSH server in every container, while still centralizing access control through IAM","SSH servers are required for containers to start at all","ECS Exec is slower than SSH in every scenario","Baking in an SSH server is the AWS-recommended default"],a:[0],e:"ECS Exec avoids the attack surface, image bloat, and key management of embedding SSH servers, while centralizing access via IAM."},
{q:"How is AWS Fargate primarily billed?",o:["A flat monthly fee per cluster, regardless of usage","Per task, based on the vCPU and memory provisioned for that task, billed per second (with a minimum billing duration)","Per EC2 instance-hour, identical to the EC2 launch type","Fargate has no cost; it is included free with any AWS account"],a:[1],e:"Fargate bills per task based on provisioned vCPU/memory, per second, with a minimum billing duration."},
{q:"Which of the following does a team using the Fargate launch type NOT need to do, unlike a team using the ECS EC2 launch type?",o:["Define a task definition","Provision, patch, and scale the underlying EC2 instances that run the tasks","Attach a task role for application permissions","Specify container images to run"],a:[1],e:"Fargate removes the need to provision, patch, or scale underlying EC2 instances, unlike the EC2 launch type."},
{q:"Which phrase, when it appears in a DVA-C02 scenario about container compute, most strongly signals that Fargate is favored over the ECS EC2 launch type?",o:["\"Full control over the underlying host operating system is required\"","\"Least operational overhead\" or \"no interest in managing the underlying servers\"","\"Requires GPU-accelerated instances\"","\"Requires custom AMIs with specialized kernel modules\""],a:[1],e:"\"Least operational overhead\" / no interest in host management signals Fargate over the EC2 launch type."},
{q:"Which requirement would most strongly point away from Fargate and toward the ECS EC2 launch type instead?",o:["Unpredictable, bursty traffic with no desire to manage host capacity","A need for GPU-accelerated instance types or very high-density bin-packing to minimize cost at large steady-state scale, both of which require host-level control Fargate does not expose","A desire to eliminate all EC2 patching responsibilities","A small team with no dedicated infrastructure staff"],a:[1],e:"GPU instance needs and deep bin-packing for cost at scale require host-level control that Fargate does not expose."},
{q:"Is AWS Fargate exclusively an ECS feature, or can it also be used with Amazon EKS?",o:["Fargate is exclusive to ECS and cannot be used with EKS","Fargate can also run Kubernetes pods for EKS clusters via Fargate profiles, avoiding the need to manage EC2 worker nodes for matching pods","Fargate can only be used with AWS Lambda","Fargate requires a Kubernetes cluster to function under ECS"],a:[1],e:"Fargate profiles let EKS run Kubernetes pods on Fargate without customer-managed EC2 worker nodes."},
{q:"A finance team compares the raw per-vCPU-hour cost of Fargate against an equivalent EC2 instance type running the same container workload and finds Fargate's rate is higher. Which two statements correctly explain this tradeoff? (Select TWO)",o:["Fargate's higher per-unit rate reflects the elimination of EC2 host provisioning, patching, and capacity-planning overhead","Choosing between Fargate and the EC2 launch type should weigh operational overhead savings against raw per-unit compute cost, not compute cost alone","Fargate provides no operational benefit in exchange for its higher rate","The EC2 launch type always has zero operational overhead, making it strictly superior","Fargate's higher rate means it is never the correct exam answer"],a:[0,1],multi:true,e:"The higher per-unit rate reflects eliminated host management overhead, so the choice should weigh overhead savings against raw cost."},
{q:"What does a Fargate platform version control?",o:["The version of Kubernetes running the cluster","The specific runtime environment and feature set (such as ECS Exec support) available to Fargate tasks, which AWS periodically updates","The IAM policy version attached to the task role","The version of the ECR repository"],a:[1],e:"A Fargate platform version controls the runtime/feature set (including capabilities like ECS Exec) available to tasks."},
{q:"Which two of the following are accurate characteristics of AWS Fargate? (Select TWO)",o:["It eliminates the need to provision or patch underlying EC2 instances for running containers","It bills based on the vCPU and memory resources a task actually reserves, per second","It requires the customer to manually install and patch a hypervisor","It is only compatible with the EC2 launch type, never used as a launch type itself","It guarantees a lower total bill than the EC2 launch type in every scenario, regardless of workload shape"],a:[0,1],multi:true,e:"Fargate removes EC2 provisioning/patching and bills per task based on actual vCPU/memory reserved, per second."},
{q:"A Fargate task is being OOM-killed (terminated for exceeding its memory allocation) under normal load. What is the appropriate fix?",o:["SSH into the underlying host and manually add more RAM","Update the task definition to increase the task's provisioned memory value to an amount sufficient for the workload, then redeploy the service with the updated task definition revision","Nothing can be done; Fargate memory limits cannot be changed","Switch the AWS Region"],a:[1],e:"Increasing the task definition's provisioned memory and redeploying is the correct fix for a Fargate task being OOM-killed."},
{q:"A company runs two distinct ECS workloads: Workload X has stable, predictable, 24/7 resource needs at large scale, where the team is willing to invest engineering time to bin-pack tasks tightly onto Reserved Instances for maximum cost efficiency. Workload Y has highly unpredictable, spiky traffic and the team wants to avoid any host-capacity planning. Which launch type pairing best fits Workload X and Workload Y, respectively?",o:["Fargate for X, EC2 launch type for Y","EC2 launch type for X, Fargate for Y","Fargate for both","EC2 launch type for both"],a:[1],e:"Steady-state, bin-packable Workload X fits the EC2 launch type's RI/density advantages; bursty Workload Y fits Fargate's no-capacity-planning model."},
{q:"A workload requires running containers in privileged mode with direct access to host-level device drivers not exposed through the standard container runtime. Which ECS launch type is appropriate given this requirement?",o:["Fargate, since it always supports every container configuration","The EC2 launch type, since it provides the underlying host access that certain privileged or device-driver-dependent configurations require, unlike Fargate's more restricted environment","Neither launch type can ever run privileged containers","AWS Lambda"],a:[1],e:"The EC2 launch type provides underlying host access needed for privileged or device-driver-dependent container configurations."},
{q:"A team runs two ECS workloads on Fargate: a customer-facing checkout API that must never be abruptly interrupted, and an internal nightly report-generation batch job that can tolerate being interrupted and simply retried. Which Fargate capacity choice fits each workload, respectively?",o:["Standard Fargate for the checkout API, and Fargate Spot for the batch job","Fargate Spot for both workloads, to minimize cost uniformly","Standard Fargate for both workloads, since Fargate Spot cannot run batch jobs","The EC2 launch type is required for any interruption-tolerant workload"],a:[0],e:"Standard Fargate suits an interruption-intolerant workload; Fargate Spot suits the interruption-tolerant batch job, minimizing its cost."},
{q:"What does Amazon EKS (Elastic Kubernetes Service) provide?",o:["A fully managed, AWS-proprietary container orchestration API with no relation to Kubernetes","A managed Kubernetes control plane, run and patched by AWS across multiple Availability Zones, on which customers run standard, open-source Kubernetes workloads","A tool exclusively for building container images","A replacement for IAM"],a:[1],e:"EKS is a managed, multi-AZ Kubernetes control plane on which customers run standard open-source Kubernetes workloads."},
{q:"What is the fundamental architectural difference between Amazon ECS and Amazon EKS?",o:["ECS uses AWS's own proprietary container orchestration API and concepts, while EKS runs the open-source Kubernetes API, which is portable across other Kubernetes-conformant platforms","ECS and EKS are simply two different names for the exact same underlying service","EKS does not support container images, only virtual machines","ECS requires Kubernetes knowledge, while EKS does not"],a:[0],e:"ECS uses an AWS-proprietary orchestration API; EKS runs the portable, open-source Kubernetes API."},
{q:"A company has an established on-premises Kubernetes footprint, existing Helm charts, custom Kubernetes operators, and a stated goal of maintaining the ability to run the same workload on another cloud provider in the future. Which AWS container orchestration service best aligns with these constraints?",o:["Amazon ECS, because it is simpler to learn","Amazon EKS, because it preserves compatibility with the company's existing Kubernetes tooling and the portability of the open-source Kubernetes API across providers","AWS Lambda","Amazon EC2 with no orchestrator at all"],a:[1],e:"Existing Kubernetes tooling and a multi-cloud portability goal both point to EKS's open-source Kubernetes API foundation."},
{q:"A small team building a new application from scratch on AWS, with no prior Kubernetes experience and no multi-cloud requirement, wants to run containers with the simplest possible AWS-native orchestration setup. Which service best fits, absent any other constraints?",o:["Amazon EKS, for its larger open-source ecosystem","Amazon ECS, since it avoids the added complexity of learning Kubernetes concepts when there is no existing Kubernetes investment or portability requirement","AWS Batch exclusively","A self-managed Kubernetes cluster on raw EC2"],a:[1],e:"With no existing Kubernetes investment or portability need, ECS's simpler AWS-native model is the more direct fit."},
{q:"A company adopts Amazon EKS for Kubernetes-API portability but does not want to provision or manage EC2 worker nodes for a specific set of stateless microservices. Which EKS capability lets specific pods run without customer-managed EC2 worker nodes?",o:["EKS does not support any serverless compute option; worker nodes are always required","EKS with Fargate, using a Fargate profile to match specific namespaces/labels so those pods run on Fargate instead of self-managed EC2 worker nodes","AWS Lambda functions replacing the pods entirely","ECS Exec"],a:[1],e:"An EKS Fargate profile matches namespaces/labels so those pods run on Fargate without customer-managed worker nodes."},
{q:"For an EKS cluster using self-managed (non-Fargate) EC2 worker nodes, which two statements accurately describe operational responsibility for those nodes? (Select TWO)",o:["The customer is ultimately responsible for the worker nodes as EC2 resources, including OS-level patching","AWS-managed node groups can automate much of the worker node lifecycle (such as provisioning and updates) while the underlying instances remain customer-owned EC2 resources","AWS fully and automatically patches every self-managed worker node with no customer involvement","Worker nodes never require patching once launched","Worker node management is identical to Fargate's fully serverless model"],a:[0,1],multi:true,e:"The customer ultimately owns self-managed worker nodes as EC2 resources, though AWS-managed node groups can automate much of that lifecycle."},
{q:"What does AWS manage on behalf of the customer for an Amazon EKS cluster's control plane?",o:["Nothing; the customer manages every control plane component themselves","The Kubernetes control plane components (such as the API server and etcd), which AWS runs highly available across multiple Availability Zones and patches","Only the container images stored in the customer's repositories","The customer's on-premises data center"],a:[1],e:"AWS runs and patches the Kubernetes control plane components (API server, etcd) across multiple AZs on the customer's behalf."},
{q:"Which EKS mechanism most closely parallels the ECS task role, allowing individual Kubernetes pods (rather than an entire node) to be granted scoped IAM permissions for calling AWS services?",o:["IAM Roles for Service Accounts (IRSA), which maps a Kubernetes service account to an IAM role","The EKS cluster IAM role","The task execution role","EKS does not support per-pod IAM scoping; all pods share the worker node's role"],a:[0],e:"IAM Roles for Service Accounts (IRSA) map a Kubernetes service account to an IAM role, scoping permissions per pod, paralleling the ECS task role."},
{q:"Approximately how deep does the DVA-C02 exam go into Kubernetes-specific architecture (such as detailed pod scheduling internals or custom resource definitions) when testing knowledge of Amazon EKS?",o:["Extremely deep — candidates must be able to design multi-cluster Kubernetes networking topologies","Developer-level awareness only — knowing what EKS is, how it differs from ECS, and when a team would choose it, without deep Kubernetes architecture (that is out of scope for this associate-level developer exam)","The exam requires writing custom Kubernetes controllers from memory","EKS is not mentioned on the exam at all"],a:[1],e:"DVA-C02 expects developer-level EKS awareness (what it is, how it differs from ECS, when to choose it), not deep Kubernetes architecture."},
{q:"Which two of the following statements accurately distinguish Amazon ECS from Amazon EKS? (Select TWO)",o:["EKS runs the open-source Kubernetes API, making workloads more portable to other Kubernetes-conformant platforms than ECS's proprietary model","ECS generally has a simpler learning curve for teams with no existing Kubernetes investment","ECS is built on top of Kubernetes internally, with a different name","EKS cannot be used with Fargate under any configuration","ECS and EKS charge identical hourly control-plane fees"],a:[0,1],multi:true,e:"EKS's open API is more portable; ECS has a simpler learning curve absent existing Kubernetes investment."},
{q:"Regarding cost structure, which statement accurately compares Amazon ECS and Amazon EKS?",o:["Both charge an identical hourly control-plane fee","Amazon EKS charges an hourly fee for the managed Kubernetes control plane (in addition to the cost of worker nodes or Fargate tasks), whereas ECS does not charge a separate fee for the ECS control plane itself — customers pay only for the underlying compute (EC2 or Fargate) their tasks consume","ECS charges more than EKS in every scenario","Neither service has any associated cost beyond data transfer"],a:[1],e:"EKS charges an hourly control-plane fee on top of worker node/Fargate costs; ECS has no separate control-plane fee."},
{q:"A startup building an entirely new application on AWS has no existing Kubernetes experience today, but explicitly states a long-term strategic goal of avoiding vendor lock-in and wanting the option to run the same workload on a different cloud provider in the future if business needs change. Despite the added learning curve, which orchestration choice best supports this stated strategic goal?",o:["Amazon ECS, since it is simpler to start with","Amazon EKS, since its Kubernetes API foundation is the AWS option most aligned with cross-cloud portability, even though it requires learning Kubernetes concepts the team doesn't have today","AWS Lambda, since serverless functions are inherently more portable than any container orchestrator","Elastic Beanstalk"],a:[1],e:"Despite the learning curve, EKS's Kubernetes API foundation is the AWS option best aligned with future cross-cloud portability."},
{q:"How does an EKS Fargate profile determine which pods run on Fargate instead of on self-managed EC2 worker nodes?",o:["By randomly assigning pods to Fargate or EC2 worker nodes","By matching pods based on configured Kubernetes namespace and/or label selectors defined in the Fargate profile","By the size of the container image alone","EKS Fargate profiles apply to the entire cluster uniformly with no selective matching"],a:[1],e:"A Fargate profile selects pods by Kubernetes namespace and/or label selectors to route them onto Fargate."},
{q:"Does the Amazon EKS control plane run across multiple Availability Zones for resilience, without the customer having to configure this themselves?",o:["No, the customer must manually deploy and manage redundant control plane instances across AZs","Yes, AWS runs the managed EKS control plane across multiple Availability Zones automatically as part of the managed service","The control plane always runs in a single AZ with no redundancy","EKS has no concept of Availability Zones"],a:[1],e:"AWS runs the managed EKS control plane across multiple Availability Zones automatically, with no customer configuration needed."},
{q:"An EKS cluster uses self-managed EC2 worker nodes. A specific pod's application code needs permission to read from an S3 bucket, but the team does not want to grant that broad permission to every pod running on the same worker node via the node's shared IAM role. Which mechanism achieves pod-scoped, rather than node-wide, permissions?",o:["Broadening the worker node's IAM role, accepting that every pod on that node gains the same access","IAM Roles for Service Accounts (IRSA), mapping the specific pod's Kubernetes service account to a narrowly scoped IAM role","Attaching an ECS task role to the pod","There is no way to scope permissions below the node level in EKS"],a:[1],e:"IRSA maps a specific pod's Kubernetes service account to a narrowly scoped IAM role, avoiding node-wide permission sharing."},
{q:"A team is choosing among ECS EC2 launch type, ECS Fargate, and Amazon EKS for a brand-new containerized workload with no existing Kubernetes investment and a strong preference for minimal infrastructure management. Which option best fits, absent other constraints?",o:["ECS EC2 launch type, for maximum control","ECS Fargate, since it combines AWS-native simplicity with no host management, and there's no stated need for Kubernetes portability","Amazon EKS with self-managed worker nodes","A self-managed Kubernetes cluster on raw EC2 instances"],a:[1],e:"With no Kubernetes investment and a preference for minimal management, Fargate's no-host-management, AWS-native model fits best."},
{q:"A CI/CD pipeline builds a container image, pushes it to ECR tagged with the Git commit SHA, and updates an ECS service to deploy that exact image tag. Which two statements correctly describe why this pattern satisfies the exam's expectations for a controlled, traceable container deployment? (Select TWO)",o:["Tagging the image with the immutable commit SHA (rather than only a mutable tag like latest) creates a precise, traceable, versioned deployment artifact","Updating the ECS service to a new task definition revision referencing that specific tag is the mechanism that actually promotes the new version into the running environment","The Git commit SHA tag is only cosmetic and has no bearing on deployment traceability","ECS always deploys the latest image automatically regardless of which tag the task definition references","Container image tags are irrelevant to the exam's Deployment domain"],a:[0,1],multi:true,e:"An immutable commit-SHA tag creates a traceable artifact, and updating the service to a new revision referencing it is what actually promotes it."},
{q:"Following a bad deployment where an ECS service was updated to a new, buggy image tag via a new task definition revision, what is the fastest, most direct way to roll back?",o:["Rebuild the previous image from source and manually re-push it under a brand-new tag","Update the ECS service to reference the previous, known-good task definition revision, which still points at the previous image tag","Delete the ECS cluster and recreate it from a backup","Manually SSH into the underlying hosts and downgrade the running binary"],a:[1],e:"Pointing the service back at the previous task definition revision (and thus the previous image tag) is the fastest rollback."},
{q:"A security review of a company's container pipeline finds: (1) ECR image scanning is disabled, allowing known-vulnerable images to be deployed unnoticed, and (2) the ECS task role for a customer-facing service is attached to a broad, unscoped policy far beyond what the application actually calls. Which two remediations correctly address these two findings, respectively? (Select TWO)",o:["Enable ECR image scanning (basic or enhanced) and gate the pipeline on its findings","Replace the task role's broad policy with a narrowly scoped policy limited to the specific AWS actions and resources the application actually needs","Disable the task execution role entirely, since it is unrelated to application permissions","Make the ECR repository public to simplify scanning","Grant the task role AdministratorAccess to eliminate future permission errors"],a:[0,1],multi:true,e:"Enabling ECR scanning addresses the vulnerability-detection gap; narrowing the task role addresses the over-permissioned application role."},
{q:"A company migrating an existing on-premises Kubernetes workload to AWS wants to preserve its Helm-based deployment tooling and avoid provisioning or patching any EC2 worker nodes for the migrated service. Which two AWS capabilities together satisfy both requirements? (Select TWO)",o:["Amazon EKS, preserving Kubernetes API compatibility (and thus Helm compatibility)","An EKS Fargate profile matching the migrated service's namespace, avoiding EC2 worker node management for those pods","Amazon ECS with the EC2 launch type","AWS Lambda container image support","ECS Fargate, since it also runs the Kubernetes API"],a:[0,1],multi:true,e:"EKS preserves Kubernetes/Helm compatibility, and a Fargate profile avoids managing EC2 worker nodes for the migrated service."},
{q:"Summarizing the module's most heavily tested distinction, which two statements correctly capture the difference between an ECS task role and a task execution role? (Select TWO)",o:["The task execution role is used by ECS/the container agent to pull images, write logs, and retrieve injected secrets before and during task startup","The task role is used by the application code running inside the container to call AWS services at runtime, such as S3 or DynamoDB","Both roles are always identical and interchangeable in every task definition","The task role is responsible for pulling the container image from ECR","The task execution role is what an application uses to read from a DynamoDB table"],a:[0,1],multi:true,e:"The execution role handles ECS's own startup plumbing (pulling images, logging, secrets); the task role handles the application's runtime AWS calls."},
{q:"Which statement correctly compares the pricing models of the ECS EC2 launch type and the ECS Fargate launch type?",o:["Both are billed identically, per vCPU-second, with no distinction","The EC2 launch type bills for the provisioned EC2 instances themselves (On-Demand, Reserved, or Spot), regardless of per-task utilization, while Fargate bills per task based on the vCPU/memory actually reserved, per second","Fargate is billed as a flat monthly subscription unrelated to usage","The EC2 launch type has no cost at all; only Fargate incurs charges"],a:[1],e:"EC2 launch type bills for provisioned instances regardless of per-task utilization; Fargate bills per task for actual vCPU/memory reserved, per second."},
